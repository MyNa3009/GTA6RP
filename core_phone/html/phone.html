<!DOCTYPE html>
<!--
  UI: Handy
  CONTRACT_VERSION: 1

  Smartphone unten rechts: Telefon, Kontakte, Nachrichten, Bank, Notruf, Einstellungen. Die UI zeigt nur an:
  Jede Zahl und jeder Stand kommt vom Server. Ist das Handy zu, zeigt eine kleine Leiste Anrufe und neue Nachrichten.
  Toene (Klingeln, Freizeichen, Nachricht) erzeugt die UI selbst, lautlos schaltet sie ab.

  EINGEHEND (Lua -> UI)
  phone_open   { colors: { base?, ink?, accent?, mark?, signal? }, key: string, Home }
  phone_push   { type: "message", number, name?, kind, text, silent }
               { type: "call", call?: Call, ended?: { reason, seconds } }
               { type: "missed", number, name?, silent }
  phone_close  {}

  AUSGEHEND (UI -> Lua), Antwort immer { ok, data?, error? }
  ui_ready       { ui: "phone", version: 1 }          -> { colors, key, volume }
  phone_close    {}
  phone_waypoint { x, y }                             // Standort aus einer Nachricht als Wegpunkt
  phone_call     { name, data }                       // Anfrage an den Server
    phone_home           {}                           -> Home
    phone_settings       { silent?, airplane? }       -> { silent, airplane }
    phone_contact_save   { id?, name, number }        -> { contacts }
    phone_contact_delete { id }                       -> { contacts }
    phone_thread         { number, before? }          -> { number, messages: [Message], more, unread }
    phone_message_send   { number, text } | { number, location: true }   -> { number, message }
    phone_thread_delete  { number }                   -> { threads, unread }
    phone_call_start     { number }                   -> { call }
    phone_call_answer    {}                           -> { call }
    phone_call_end       {}
    phone_calls_seen     {}                           -> { missed }
    phone_bank           {}                           -> { overview: Bank }
    phone_bank_lookup    { number }                   -> { name, number }
    phone_bank_transfer  { number, amount, purpose }  -> { to, overview }
    phone_bank_debts     {}                           -> { debts: [Debt] }
    phone_bank_pay       { id, amount? }              -> { debt, paid, debts, overview }
    phone_dispatch       {}                           -> { services: [{ key, label, units }], default, textMin, textMax }
    phone_dispatch_send  { service, text }            -> { number, service, units }

  Home    { number, name, characterId, silent, airplane, contacts: [{ id, name, number }], threads: [Thread], unread,
            calls: [{ id, number, direction, status, seconds, at }], missed, call?: Call, apps: { bank, dispatch },
            admin?: true, limits: { number, name, message, contacts }, volume }
  Thread  { number, text, kind, direction: "in" | "out", at, unread, hidden? }
  Message { id, direction, kind: "text" | "location", text, at, x?, y?, hidden? }
  Call    { id, state: "dialing" | "incoming" | "active", number, name?, silent?, seconds? }
  Bank    { name, number, balance, recent: [{ kind, amount, text, other?, at }], debts: { count, total, overdue }, recipients: [{ name, number }] }
  Debt    { id, kindLabel, creditorLabel, title, amount, fee, paid, rest, overdue, due }
  Zeiten als "JJJJ-MM-TT hh:mm". Eine "number" aus Buchstaben ist ein Dienst (z. B. "Bank"), darauf antwortet man nicht.

  FEHLERCODES: no_phone, is_dead, read_only, busy, invalid_name, invalid_number, invalid_text, invalid_amount, own_number,
    unknown_number, contact_exists, contacts_full, not_found, too_fast, airplane, in_call, no_call, unreachable, line_busy,
    no_bank, unknown_account, same_account, not_enough_money, debt_closed, no_dispatch, text_too_short, cooldown,
    too_many_open, blocked, invalid_service, server_error, timeout
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Command (schnell anrufen, schreiben, bezahlen) mit Inspect (Chat, Konto). Dichte 7, Bewegung 2.
  Richtung
    Zweck: Das eigene Handy fuer Anrufe, Nachrichten, Bank und Notruf.
    Charakter: handlich, ruhig, eindeutig.
    Welt: ein dunkles Smartphone mit eSIM, wie man es in der Hand haelt.
    Highlight: der Startbildschirm mit Uhr und App-Raster vor einem leisen Schein in den Farben des Servers.
    Signatur: Nummern stehen immer in Dreiergruppen, ungelesenes traegt einen Akzentpunkt.
  Flaeche: Geraet unten rechts, die Spielsicht bleibt frei. Alle Masse in em, das Geraet waechst mit der Bildhoehe.
  Bauteile (Etiketten, Listenzeilen, heller Hauptbutton, Eingaben) wie in den Fenstern des Servers.
*/
:root {
  --rgb-base:   16 17 20;
  --rgb-ink:    255 245 236;
  --rgb-accent: 231 62 192;
  --rgb-mark:   244 154 102;
  --rgb-signal: 244 67 54;

  --c-screen:      rgb(var(--rgb-base));
  --c-surface:     rgb(var(--rgb-ink) / 0.06);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.11);
  --c-border:      rgb(var(--rgb-ink) / 0.09);
  --c-text:        rgb(var(--rgb-ink) / 0.95);
  --c-text-2:      rgb(var(--rgb-ink) / 0.74);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.16);
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-soft: rgb(var(--rgb-signal) / 0.14);
  --c-on-accent:   rgb(var(--rgb-base));
  --wallpaper:
    radial-gradient(120% 70% at 0% 0%, rgb(var(--rgb-accent) / 0.26), transparent 62%),
    radial-gradient(100% 60% at 100% 100%, rgb(var(--rgb-mark) / 0.18), transparent 62%);
  --shadow: 0 1.2em 3em rgb(var(--rgb-base) / 0.6);
  --text-shade: 0 0 2px rgb(var(--rgb-base)), 0 1px 3px rgb(var(--rgb-base) / 0.95), 0 0 12px rgb(var(--rgb-base) / 0.7);

  /* Geraet: Hoehe folgt dem Bild, alles andere haengt in em daran */
  --phone-h: clamp(540px, 80vh, 880px);
  --phone-ratio: 0.485;
  --edge: clamp(16px, 2.2vw, 44px);

  --fs-xs: max(10px, 0.72em);
  --fs-sm: max(11px, 0.84em);
  --fs-md: 1em;
  --fs-lg: 1.2em;
  --fs-xl: 1.6em;
  --fs-clock: 3.6em;

  --dur-fast: 120ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-phone: 10;
  --z-peek: 20;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; height: 100%; background: transparent; overflow: hidden;
  font-family: 'Montserrat', sans-serif; color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button, input, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 1.25em; height: 1.25em; flex: none; }
:focus-visible { outline: 2px solid rgb(var(--rgb-accent) / 0.6); outline-offset: 2px; }

/* ---------- Geraet ---------- */
.phone {
  position: fixed; right: var(--edge); bottom: var(--edge); z-index: var(--z-phone);
  height: var(--phone-h); width: calc(var(--phone-h) * var(--phone-ratio));
  font-size: calc(var(--phone-h) / 46);
  padding: 0.55em; border-radius: 2.6em;
  background: rgb(var(--rgb-base)); border: 1px solid rgb(var(--rgb-ink) / 0.16);
  box-shadow: var(--shadow), inset 0 0 0 0.12em rgb(var(--rgb-ink) / 0.05);
}
.screen {
  position: relative; height: 100%; border-radius: 2.1em; overflow: hidden;
  display: grid; grid-template-rows: auto auto 1fr auto;
  background: var(--c-screen); border: 1px solid var(--c-border);
}
.screen[data-home="true"] { background: var(--wallpaper), var(--c-screen); }

.status { display: flex; align-items: center; gap: 0.5em; padding: 0.8em 1.3em 0.3em; font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-2); }
.status__icons { margin-left: auto; display: flex; align-items: center; gap: 0.5em; }
.status .icon { width: 1.15em; height: 1.15em; }
.banner { margin: 0.2em 0.8em 0; padding: 0.5em 0.8em; border-radius: 0.6em; font-size: var(--fs-xs); font-weight: 600; }
.banner--admin { background: var(--c-accent-soft); border: 1px dashed rgb(var(--rgb-accent) / 0.5); }
.banner--call { display: flex; align-items: center; gap: 0.6em; width: calc(100% - 1.6em); border: 0; background: var(--c-accent); color: var(--c-on-accent); cursor: pointer; text-align: left; }
.banner--call .num { margin-left: auto; }

.view { min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; }
.view::-webkit-scrollbar { width: 0; }
.homebar { display: grid; place-items: center; padding: 0.5em 0 0.7em; }
.homebar button { width: 34%; height: 0.36em; padding: 0; border: 0; border-radius: 1em; background: rgb(var(--rgb-ink) / 0.4); cursor: pointer; }
.homebar button:hover { background: rgb(var(--rgb-ink) / 0.7); }

/* ---------- Kopf einer App ---------- */
.head { display: flex; align-items: center; gap: 0.4em; padding: 0.5em 0.7em 0.5em 0.5em; min-height: 3em; }
.head__title { flex: 1; min-width: 0; margin: 0; font-size: var(--fs-lg); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.head__sub { display: block; font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-muted); }
.iconbtn { display: inline-grid; place-items: center; width: 2.4em; height: 2.4em; flex: none; border: 0; border-radius: 0.6em; background: transparent; color: var(--c-text-2); cursor: pointer; }
.iconbtn:hover { background: var(--c-surface); color: var(--c-text); }
.iconbtn--danger { color: var(--c-signal); }
.pad { padding: 0.4em 1em 1em; display: grid; gap: 0.9em; align-content: start; }
.grow { flex: 1; min-height: 0; }
.label { font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
.none { padding: 2em 1.2em; text-align: center; color: var(--c-text-muted); font-size: var(--fs-sm); line-height: 1.5; }
.none strong { display: block; margin-bottom: 0.3em; color: var(--c-text); font-size: var(--fs-md); font-weight: 600; }

/* ---------- Start ---------- */
.clock { padding: 2.2em 1.4em 1.6em; }
.clock__time { font-size: var(--fs-clock); font-weight: 700; line-height: 1; }
.clock__date { margin-top: 0.5em; font-size: var(--fs-sm); font-weight: 500; color: var(--c-text-2); }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.3em 0.4em; padding: 0.6em 1em; margin-top: auto; margin-bottom: 1.4em; }
.app { position: relative; display: grid; justify-items: center; gap: 0.45em; padding: 0.2em 0; border: 0; background: transparent; cursor: pointer; font-size: inherit; }
.app__tile {
  display: grid; place-items: center; width: 3.7em; height: 3.7em; border-radius: 1.05em;
  background: rgb(var(--rgb-base) / 0.72); border: 1px solid rgb(var(--rgb-ink) / 0.12);
  transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.app__tile .icon { width: 1.7em; height: 1.7em; }
.app:hover .app__tile { background: rgb(var(--rgb-base) / 0.92); }
.app:active .app__tile { transform: scale(0.95); }
.app__name { font-size: var(--fs-xs); font-weight: 600; text-shadow: 0 1px 3px rgb(var(--rgb-base) / 0.8); }
.badge { display: inline-grid; place-items: center; min-width: 1.6em; height: 1.6em; padding: 0 0.4em; border-radius: 1em; background: var(--c-accent); color: var(--c-on-accent); font-size: var(--fs-xs); font-weight: 700; }
.app .badge { position: absolute; top: -0.3em; right: calc(50% - 2.7em); }

/* ---------- Listen ---------- */
.list { list-style: none; margin: 0; padding: 0 0.5em 0.8em; display: grid; gap: 2px; }
.row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 0.15em 0.75em; width: 100%;
  padding: 0.65em 0.6em; border: 0; border-radius: 0.6em; background: transparent; text-align: left; cursor: pointer;
}
.row:hover { background: var(--c-surface); }
.row__mark { grid-row: span 2; display: grid; place-items: center; width: 2.5em; height: 2.5em; border-radius: 50%; background: var(--c-surface-hi); font-size: var(--fs-sm); font-weight: 700; color: var(--c-text-2); }
.row__mark .icon { width: 1.2em; height: 1.2em; }
.row__mark--alert { background: var(--c-signal-soft); color: var(--c-signal); }
.row__title { font-size: var(--fs-md); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__side { font-size: var(--fs-xs); color: var(--c-text-muted); white-space: nowrap; }
.row__text { grid-column: 2; font-size: var(--fs-sm); color: var(--c-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__dot { justify-self: end; }
.row[data-unread="true"] .row__title { font-weight: 700; }
.row[data-unread="true"] .row__text { color: var(--c-text-2); }
.row[data-alert="true"] .row__title { color: var(--c-signal); }
.tag { font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-muted); }

/* ---------- Formulare und Buttons ---------- */
.field { display: grid; gap: 0.4em; }
.input, .textarea {
  width: 100%; padding: 0.7em 0.8em; border: 1px solid var(--c-border); border-radius: 0.6em;
  background: rgb(var(--rgb-ink) / 0.05); font-size: var(--fs-md); outline: none;
}
.textarea { min-height: 7em; resize: none; line-height: 1.4; }
.input:focus, .textarea:focus { border-color: rgb(var(--rgb-accent) / 0.5); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.5em; width: 100%; min-height: 2.9em; padding: 0 1em;
  border: 0; border-radius: 0.6em; background: rgb(var(--rgb-ink) / 0.92); color: var(--c-on-accent);
  font-size: var(--fs-md); font-weight: 600; cursor: pointer; transition: transform var(--dur-fast) var(--ease-out);
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn--ghost { background: transparent; color: var(--c-text); border: 1px solid var(--c-border); }
.btn--ghost:hover:not(:disabled) { background: var(--c-surface); }
.btn--danger { background: transparent; color: var(--c-signal); border: 1px solid rgb(var(--rgb-signal) / 0.45); }
.btn--danger:hover:not(:disabled) { background: var(--c-signal-soft); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6em; }
.error { margin: 0; color: var(--c-signal); font-size: var(--fs-sm); font-weight: 500; }
.hint { margin: 0; color: var(--c-text-muted); font-size: var(--fs-sm); line-height: 1.5; }

.tabs { display: flex; gap: 0.3em; padding: 0 1em; border-bottom: 1px solid var(--c-border); }
.tab { padding: 0.7em 0.6em; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--c-text-muted); font-size: var(--fs-sm); font-weight: 600; cursor: pointer; }
.tab[aria-selected="true"] { color: var(--c-text); border-bottom-color: var(--c-accent); }

/* Der wichtigste Stand als Karte */
.card { display: grid; grid-template-columns: auto 1fr; gap: 0.2em 0.9em; align-items: center; padding: 0.9em 1em; border-radius: 0.8em; border: 1px solid var(--c-border); background: var(--c-surface); text-align: left; width: 100%; }
.card__mark { grid-row: span 2; width: 0.75em; height: 0.75em; border-radius: 50%; background: var(--c-accent); box-shadow: 0 0 0 0.28em var(--c-accent-soft); }
.card__title { font-size: var(--fs-xl); font-weight: 700; }
.card__sub { font-size: var(--fs-sm); color: var(--c-text-muted); }
.card--sm .card__title { font-size: var(--fs-md); }
.card--alert { border-color: rgb(var(--rgb-signal) / 0.4); background: var(--c-signal-soft); }
.card--alert .card__mark { background: var(--c-signal); box-shadow: 0 0 0 0.28em rgb(var(--rgb-signal) / 0.2); }
button.card { cursor: pointer; font-size: inherit; }
button.card:hover { background: var(--c-surface-hi); }

/* ---------- Telefon ---------- */
.dial { display: grid; gap: 1em; padding: 0.6em 1.4em 1em; margin-top: auto; }
.dial__number { min-height: 1.6em; text-align: center; font-size: var(--fs-xl); font-weight: 700; letter-spacing: 0.04em; }
.dial__name { min-height: 1.3em; text-align: center; font-size: var(--fs-sm); color: var(--c-text-muted); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6em; }
.key { height: 3.3em; border: 1px solid var(--c-border); border-radius: 0.8em; background: var(--c-surface); font-size: var(--fs-lg); font-weight: 600; cursor: pointer; display: grid; place-items: center; }
.key:hover { background: var(--c-surface-hi); }
.key:active { transform: scale(0.97); }
.key--plain { background: transparent; border-color: transparent; color: var(--c-text-2); }

/* ---------- Chat ---------- */
.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 0.4em 0.8em 0.6em; display: flex; flex-direction: column; gap: 0.35em; }
.chat::-webkit-scrollbar { width: 0; }
.chat > :first-child { margin-top: auto; }
.phone:focus { outline: none; }
.bubble { max-width: 82%; padding: 0.55em 0.8em; border-radius: 1em; background: var(--c-surface-hi); font-size: var(--fs-sm); line-height: 1.4; overflow-wrap: anywhere; align-self: flex-start; border-bottom-left-radius: 0.3em; }
.bubble[data-dir="out"] { align-self: flex-end; background: var(--c-accent-soft); border-bottom-left-radius: 1em; border-bottom-right-radius: 0.3em; }
.bubble[data-hidden="true"] { opacity: 0.6; border: 1px dashed var(--c-border); }
.bubble time { display: block; margin-top: 0.2em; font-size: var(--fs-xs); color: var(--c-text-muted); }
.bubble__loc { display: flex; align-items: center; gap: 0.5em; font-weight: 600; }
.bubble .btn { margin-top: 0.5em; min-height: 2.3em; font-size: var(--fs-sm); }
.more { align-self: center; padding: 0.4em 0.9em; border: 1px solid var(--c-border); border-radius: 1em; background: transparent; color: var(--c-text-2); font-size: var(--fs-xs); font-weight: 600; cursor: pointer; }
.composer { display: flex; align-items: center; gap: 0.3em; padding: 0.5em 0.6em 0.3em; border-top: 1px solid var(--c-border); }
.composer .input { border-radius: 1.4em; padding: 0.6em 0.9em; font-size: var(--fs-sm); }
.composer .send { background: rgb(var(--rgb-ink) / 0.92); color: var(--c-on-accent); border-radius: 50%; }
.composer .send:hover { background: rgb(var(--rgb-ink)); color: var(--c-on-accent); }

/* ---------- Gespraech ---------- */
.callscreen { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-rows: 1fr auto; justify-items: center; padding: 3.2em 1.4em 2.4em; background: var(--wallpaper), var(--c-screen); text-align: center; }
.callscreen__state { font-size: var(--fs-sm); font-weight: 600; color: var(--c-text-2); }
.callscreen__name { margin: 0.5em 0 0.2em; font-size: var(--fs-xl); font-weight: 700; overflow-wrap: anywhere; }
.callscreen__number { font-size: var(--fs-sm); color: var(--c-text-muted); }
.callscreen__time { margin-top: 1.2em; font-size: var(--fs-clock); font-weight: 700; line-height: 1; }
.callscreen__actions { display: flex; justify-content: center; gap: 2.4em; width: 100%; }
.round { display: grid; justify-items: center; gap: 0.5em; border: 0; background: transparent; cursor: pointer; font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-2); }
.round__disc { display: grid; place-items: center; width: 4.2em; height: 4.2em; border-radius: 50%; background: var(--c-surface-hi); color: var(--c-text); font-size: 1.15em; transition: transform var(--dur-fast) var(--ease-out); }
.round:active .round__disc { transform: scale(0.95); }
.round--accept .round__disc { background: var(--c-accent); color: var(--c-on-accent); }
.round--end .round__disc { background: var(--c-signal); color: rgb(var(--rgb-base)); }
.round .icon { width: 1.6em; height: 1.6em; }

/* ---------- Schalter ---------- */
.switch { display: flex; align-items: center; gap: 0.8em; width: 100%; padding: 0.8em 0.9em; border: 1px solid var(--c-border); border-radius: 0.8em; background: var(--c-surface); cursor: pointer; text-align: left; font-size: inherit; }
.switch__text { flex: 1; }
.switch__title { display: block; font-size: var(--fs-md); font-weight: 600; }
.switch__sub { display: block; font-size: var(--fs-xs); color: var(--c-text-muted); margin-top: 0.15em; }
.switch__knob { position: relative; width: 2.6em; height: 1.5em; border-radius: 1em; background: rgb(var(--rgb-ink) / 0.18); flex: none; transition: background-color var(--dur-fast) var(--ease-out); }
.switch__knob::after { content: ""; position: absolute; top: 0.2em; left: 0.2em; width: 1.1em; height: 1.1em; border-radius: 50%; background: rgb(var(--rgb-ink)); transition: transform var(--dur-fast) var(--ease-out); }
.switch[aria-checked="true"] .switch__knob { background: var(--c-accent); }
.switch[aria-checked="true"] .switch__knob::after { transform: translateX(1.1em); }

.toast { position: absolute; left: 0.8em; right: 0.8em; top: 2.6em; z-index: 3; padding: 0.7em 0.9em; border-radius: 0.8em; background: rgb(var(--rgb-ink)); color: var(--c-on-accent); font-size: var(--fs-sm); font-weight: 600; box-shadow: 0 0.6em 1.6em rgb(var(--rgb-base) / 0.5); }
.toast--error { background: var(--c-signal); color: rgb(var(--rgb-base)); }

/* ---------- Handy zu: Leiste fuer Anruf und neue Nachricht, frei im Bild ---------- */
.peek {
  position: fixed; right: var(--edge); bottom: var(--edge); z-index: var(--z-peek);
  max-width: min(46vw, 520px); display: flex; align-items: center; gap: 0.7em; justify-content: flex-end;
  font-size: clamp(15px, 0.95vw, 21px); font-weight: 600; text-shadow: var(--text-shade); text-align: right; pointer-events: none;
}

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';
  function on(event, fn) { (handlers[event] ||= []).push(fn); }
  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }
  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });
  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }
  return { on, send, emit, platform };
})();

// Testdaten fuer den Browser. ?screen=phone|contacts|messages|thread|bank|dispatch|settings, ?admin, ?leer,
// ?anruf=incoming|dialing|active, ?zu (Handy zu, mit ?anruf oder ?nachricht fuer die Leiste)
const Mock = (() => {
  const params = new URLSearchParams(location.search);
  const EMPTY = params.has('leer');
  const NOW = '2026-11-16 14:20';
  const OWN = '482103';
  const people = { '555014': 'Lena Hoffmann', '731820': 'Paul Krüger', '690244': 'Mira Schulz', '118306': 'Tom Becker' };
  let nextId = 900;
  let settings = { silent: false, airplane: false };
  let contacts = EMPTY ? [] : [
    { id: 1, name: 'Lena Hoffmann', number: '555014' }, { id: 2, name: 'Mira (EMS)', number: '690244' }, { id: 3, name: 'Paul Werkstatt', number: '731820' },
  ];
  const chats = EMPTY ? {} : {
    '555014': [
      { id: 1, direction: 'in', kind: 'text', text: 'Bist du heute Abend am Pier?', at: '2026-11-16 13:02' },
      { id: 2, direction: 'out', kind: 'text', text: 'Ja, ab acht. Bringst du die Papiere für den Sultan mit?', at: '2026-11-16 13:05' },
      { id: 3, direction: 'in', kind: 'location', text: 'Standort', x: -1602.4, y: -1048.1, at: '2026-11-16 13:06' },
      { id: 4, direction: 'in', kind: 'text', text: 'Hier treffen wir uns. Papiere hab ich dabei.', at: '2026-11-16 13:06', unread: true },
    ],
    '731820': [{ id: 5, direction: 'out', kind: 'text', text: 'Wann ist die Stoßstange fertig?', at: '2026-11-15 18:40' }],
    '204417': [{ id: 6, direction: 'in', kind: 'text', text: 'Hey, hier ist Jonas vom Parkplatz. Meld dich wegen dem Kratzer.', at: '2026-11-14 21:15', unread: true }],
    Bank: [{ id: 7, direction: 'in', kind: 'text', text: 'Frist abgelaufen: Rotlicht überfahren. Offen sind jetzt 660 $.', at: '2026-11-13 10:15' }],
  };
  let calls = EMPTY ? [] : [
    { id: 1, number: '690244', direction: 'in', status: 'missed', seconds: 0, at: '2026-11-16 12:48' },
    { id: 2, number: '555014', direction: 'out', status: 'answered', seconds: 187, at: '2026-11-16 11:30' },
    { id: 3, number: '731820', direction: 'in', status: 'answered', seconds: 42, at: '2026-11-15 18:22' },
    { id: 4, number: '204417', direction: 'out', status: 'unreachable', seconds: 0, at: '2026-11-14 21:20' },
    { id: 5, number: '118306', direction: 'in', status: 'declined', seconds: 0, at: '2026-11-14 09:03' },
  ];
  let missed = EMPTY ? 0 : 1;
  let call = null;
  let balance = 48210;
  const debts = EMPTY ? [] : [
    { id: 31, kindLabel: 'Strafe', creditorLabel: 'Staat San Andreas', title: 'Rotlicht überfahren, Kreuzung Vespucci Boulevard', amount: 600, fee: 60, paid: 0, rest: 660, overdue: true, due: '2026-11-13 10:15' },
    { id: 34, kindLabel: 'Rechnung', creditorLabel: 'Emergency Medical Service', title: 'Behandlung Bluthochdruck, 2 von 4', amount: 250, fee: 0, paid: 100, rest: 150, overdue: false, due: '2026-11-18 17:10' },
  ];
  const recent = EMPTY ? [] : [
    { kind: 'transfer_in', amount: 1850, text: 'Gehalt November', other: 'Emergency Medical Service', at: '2026-11-14 12:00' },
    { kind: 'withdraw', amount: -500, text: 'Auszahlung am Bankautomaten', at: '2026-11-13 22:14' },
    { kind: 'transfer_out', amount: -750, text: 'Miete November', other: 'Lena Hoffmann', at: '2026-11-13 18:02' },
  ];
  const accounts = { '12035567': 'Lena Hoffmann', '77410932': 'Mira Schulz' };
  const threads = () => Object.entries(chats).map(([number, list]) => {
    const last = list[list.length - 1];
    return { number, text: last.text, kind: last.kind, direction: last.direction, at: last.at, unread: list.filter((m) => m.unread).length, last: last.id };
  }).sort((a, b) => b.last - a.last);
  const unread = () => threads().reduce((sum, t) => sum + t.unread, 0);
  const bankOverview = () => ({ name: 'Fabian Nandes', number: '48210375', balance, recent,
    debts: { count: debts.length, total: debts.reduce((s, d) => s + d.rest, 0), overdue: debts.filter((d) => d.overdue).length },
    recipients: EMPTY ? [] : [{ name: 'Lena Hoffmann', number: '12035567' }] });
  const home = () => ({ number: OWN, name: 'Fabian Nandes', characterId: 256, ...settings, contacts, threads: threads(), unread: unread(), calls, missed, call,
    apps: { bank: !params.has('admin'), dispatch: !params.has('admin') }, admin: params.has('admin') || undefined,
    limits: { number: 6, name: 32, message: 300, contacts: 100 }, volume: 0.25 });
  const digits = (v) => String(v ?? '').replace(/\D/g, '');
  const api = {
    phone_home: () => ({ ok: true, data: home() }),
    phone_settings: (d) => { settings = { ...settings, ...d }; return { ok: true, data: settings }; },
    phone_contact_save: (d) => {
      const number = digits(d.number);
      const name = String(d.name || '').trim();
      if (!name) return { ok: false, error: 'invalid_name' };
      if (number.length !== 6) return { ok: false, error: 'invalid_number' };
      if (contacts.some((c) => c.number === number && c.id !== d.id)) return { ok: false, error: 'contact_exists' };
      if (d.id) contacts = contacts.map((c) => (c.id === d.id ? { ...c, name, number } : c));
      else contacts = [...contacts, { id: nextId++, name, number }];
      contacts.sort((a, b) => a.name.localeCompare(b.name));
      return { ok: true, data: { contacts } };
    },
    phone_contact_delete: (d) => { contacts = contacts.filter((c) => c.id !== d.id); return { ok: true, data: { contacts } }; },
    phone_thread: (d) => {
      const list = chats[d.number] || [];
      list.forEach((m) => { delete m.unread; });
      return { ok: true, data: { number: d.number, messages: list.map((m) => ({ ...m })), more: false, unread: unread() } };
    },
    phone_message_send: (d) => {
      const number = digits(d.number);
      if (number.length !== 6) return { ok: false, error: 'invalid_number' };
      if (number === OWN) return { ok: false, error: 'own_number' };
      if (settings.airplane) return { ok: false, error: 'airplane' };
      if (!d.location && !String(d.text || '').trim()) return { ok: false, error: 'invalid_text' };
      const message = d.location ? { id: nextId++, direction: 'out', kind: 'location', text: 'Standort', x: 215.5, y: -810.2, at: NOW }
        : { id: nextId++, direction: 'out', kind: 'text', text: String(d.text).trim(), at: NOW };
      (chats[number] ||= []).push(message);
      return { ok: true, data: { number, message } };
    },
    phone_thread_delete: (d) => { delete chats[d.number]; return { ok: true, data: { threads: threads(), unread: unread() } }; },
    phone_call_start: (d) => {
      const number = digits(d.number);
      if (number.length !== 6) return { ok: false, error: 'invalid_number' };
      if (number === OWN) return { ok: false, error: 'own_number' };
      if (!people[number]) { calls = [{ id: nextId++, number, direction: 'out', status: 'unreachable', seconds: 0, at: NOW }, ...calls]; return { ok: false, error: 'unreachable' }; }
      call = { id: nextId++, state: 'dialing', number };
      setTimeout(() => { if (call && call.state === 'dialing') { call = { ...call, state: 'active', seconds: 0 }; Mock.push('phone_push', { type: 'call', call }); } }, 1800);

    },
    phone_call_answer: () => { if (!call) return { ok: false, error: 'no_call' }; call = { ...call, state: 'active', seconds: 0 }; return { ok: true, data: { call } }; },
    phone_call_end: () => {
      if (!call) return { ok: false, error: 'no_call' };
      calls = [{ id: nextId++, number: call.number, direction: call.state === 'incoming' ? 'in' : 'out', status: call.state === 'active' ? 'answered' : 'declined', seconds: 12, at: NOW }, ...calls];
      call = null;
      setTimeout(() => Mock.push('phone_push', { type: 'call', ended: { reason: 'ended', seconds: 12 } }), 30);
      return { ok: true };
    },
    phone_calls_seen: () => { missed = 0; return { ok: true, data: { missed } }; },
    phone_bank: () => ({ ok: true, data: { overview: bankOverview() } }),
    phone_bank_lookup: (d) => {
      const number = digits(d.number);
      if (number === '48210375') return { ok: false, error: 'same_account' };
      return accounts[number] ? { ok: true, data: { name: accounts[number], number } } : { ok: false, error: 'unknown_account' };
    },
    phone_bank_transfer: (d) => {
      const found = api.phone_bank_lookup(d);
      if (!found.ok) return found;
      if (!Number.isInteger(d.amount) || d.amount < 1) return { ok: false, error: 'invalid_amount' };
      if (d.amount > balance) return { ok: false, error: 'not_enough_money' };

    phone_bank_debts: () => ({ ok: true, data: { debts } }),
    phone_bank_pay: (d) => {
      const index = debts.findIndex((x) => x.id === d.id);
      if (index < 0) return { ok: false, error: 'not_found' };
      const debt = debts[index];
      const amount = d.amount === undefined ? debt.rest : d.amount;
      if (!Number.isInteger(amount) || amount < 1 || amount > debt.rest) return { ok: false, error: 'invalid_amount' };
      if (amount > balance) return { ok: false, error: 'not_enough_money' };
      balance -= amount; debt.rest -= amount; debt.paid += amount;
      const done = debt.rest === 0;
      if (done) debts.splice(index, 1);
      return { ok: true, data: { debt: { ...debt, status: done ? 'paid' : 'open' }, paid: amount, debts, overview: bankOverview() } };
    },

    phone_dispatch_send: (d) => (String(d.text || '').trim().length < 5 ? { ok: false, error: 'text_too_short' }

  };
  return {
    delay: 90,
    home,
    setCall(value) { call = value; },
    async handle(event, data) {
      await new Promise((r) => setTimeout(r, this.delay));
      console.info(`[mock] ${event}`, data);

      return { ok: true };
    },
    push(event, data) { Bridge.emit(event, data); },
  };
})();

/* ---------- Helfer ---------- */
function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function icon(id) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#${id}`);
  svg.append(use);
  return svg;
}
function button(className, action, label, data = {}) {
  const b = make('button', className, label);
  b.type = 'button';
  b.dataset.action = action;
  Object.entries(data).forEach(([k, v]) => { b.dataset[k] = v; });
  return b;
}
function iconButton(iconId, action, label, extra = '', data = {}) {
  const b = button(`iconbtn ${extra}`.trim(), action, undefined, data);
  b.setAttribute('aria-label', label);
  b.title = label;
  b.append(icon(iconId));
  return b;
}
function lock(node) { node.dataset.lock = '1'; return node; }
function input(id, options = {}) {
  const node = make(options.area ? 'textarea' : 'input', options.area ? 'textarea' : 'input');
  node.id = id;
  if (!options.area) node.type = 'text';
  node.autocomplete = 'off';
  if (options.numeric) node.inputMode = 'numeric';
  if (options.maxLength) node.maxLength = options.maxLength;
  if (options.placeholder) node.placeholder = options.placeholder;
  if (options.value !== undefined) node.value = options.value;
  if (options.label) node.setAttribute('aria-label', options.label);
  return node;
}
function field(labelText, control) {
  const wrap = make('div', 'field');
  const label = make('label', 'label', labelText);
  label.htmlFor = control.id;
  wrap.append(label, control);
  return wrap;
}
const list = (value) => (Array.isArray(value) ? value : []);   // Lua schickt leere Listen als {}
const isNumber = (value) => /^\d+$/.test(String(value ?? ''));
const digits = (value) => String(value ?? '').replace(/\D/g, '');
// Nummern in Dreiergruppen: 482103 -> "482 103"
const formatNumber = (value) => (isNumber(value) ? String(value).replace(/(\d{3})(?=\d)/g, '$1 ') : String(value ?? ''));
const formatAccount = (value) => (isNumber(value) && String(value).length === 8 ? `${String(value).slice(0, 4)} ${String(value).slice(4)}` : String(value ?? ''));
const money = (value) => `${MONEY.format(Number(value) || 0)} $`;
const signed = (value) => `${value > 0 ? '+' : value < 0 ? '−' : ''}${MONEY.format(Math.abs(Number(value) || 0))} $`;
function contactOf(number) { return state.home ? list(state.home.contacts).find((c) => c.number === number) : undefined; }
function nameOf(number, fallback) { const c = contactOf(number); return c ? c.name : (fallback || formatNumber(number)); }
// "2026-11-16 14:20": heute nur die Uhrzeit, sonst das Datum
function when(text, full = false) {
  const m = typeof text === 'string' && text.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  if (!m) return text || '';
  const now = new Date();
  const today = Number(m[1]) === now.getFullYear() && Number(m[2]) === now.getMonth() + 1 && Number(m[3]) === now.getDate();
  if (full) return `${m[3]}.${m[2]}.${m[1]}, ${m[4]}`;
  return today ? m[4] : `${m[3]}.${m[2]}.`;
}
function duration(seconds) {
  const s = Math.max(0, Math.floor(Number(seconds) || 0));
  return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
function parseAmount(value) {
  const text = String(value ?? '').trim().replace(/[.\s$]/g, '');
  return /^\d+$/.test(text) ? Number(text) : NaN;
}
function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  const root = document.documentElement.style;
  for (const [key, cssVar] of Object.entries(COLOR_VARS)) {
    const value = typeof colors[key] === 'string' ? colors[key].trim() : '';
    const valid = COLOR_PATTERN.test(value) && value.split(' ').every((n) => Number(n) <= RGB_MAX);
    if (valid) root.setProperty(cssVar, value);
    else root.removeProperty(cssVar);
  }
}
const errorText = (code) => TEXT.errors[code] || TEXT.errors.default;
let toastTimer = null;
function toast(text, error = false) {
  el.toast.textContent = text;
  el.toast.classList.toggle('toast--error', error);
  el.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.hidden = true; }, TOAST_MS);
}

/* ---------- Toene: erzeugt die UI selbst, damit keine Spiel-Sounds noetig sind ---------- */
const Sound = (() => {
  let ctx = null;
  let loop = null;
  let loopName = null;
  function context() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function play(name) {
    const audio = context();
    const tone = TONES[name];
    if (!audio || !tone || !(state.volume > 0)) return;
    tone.notes.forEach(([frequency, start, length]) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const from = audio.currentTime + start / SECOND_MS;
      const to = from + length / SECOND_MS;
      osc.type = 'sine';
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(0, from);
      gain.gain.linearRampToValueAtTime(state.volume, from + 0.015);
      gain.gain.linearRampToValueAtTime(0, to);
      osc.connect(gain).connect(audio.destination);
      osc.start(from);
      osc.stop(to + 0.02);
    });
  }
  function stop() { clearInterval(loop); loop = null; loopName = null; }
  function start(name) {
    if (loopName === name) return;
    stop();
    loopName = name;
    play(name);
    loop = setInterval(() => play(name), TONES[name].every);
  }
  return { play, start, stop };
})();

// Klingeln und Freizeichen folgen dem Stand des Gespraechs
function updateSound() {
  const call = state.call;
  if (call && call.state === 'incoming' && !call.silent) Sound.start('ring');
  else if (call && call.state === 'dialing') Sound.start('ringback');
  else Sound.stop();
}

/* ---------- Server ---------- */
async function request(name, data = {}, options = {}) {
  if (state.busy && !options.force) return null;
  setBusy(true);
  const res = await Bridge.send('phone_call', { name, data });
  setBusy(false);
  if (!res || !res.ok) {
    const code = (res && res.error) || 'default';
    if (!options.silent) toast(errorText(code), true);
    return options.raw ? { error: code } : null;
  }
  return res.data || {};
}
function setBusy(busy) {
  state.busy = busy;
  el.phone.querySelectorAll('[data-lock]').forEach((b) => { b.disabled = busy; });
}
async function reloadHome() {
  const data = await request('phone_home', {}, { silent: true, force: true });
  if (!data) return;
  const call = state.call;
  state.home = data;
  // Den Stand des Gespraechs fuehrt die UI ueber die Push-Nachrichten, hier nur uebernehmen, wenn keiner da ist
  if (!call && data.call) setCall(data.call);
}

  state.confirm = null;

function renderChrome() {

const callSeconds = () => (state.call && state.call.state === 'active' ? (Date.now() - state.callSince) / SECOND_MS : 0);
let callTimer = null;
function tickCall() {
  const time = document.getElementById('call-time');
  if (time) time.textContent = duration(callSeconds());
  const bar = document.querySelector('#callbar .num');
  if (bar) bar.textContent = duration(callSeconds());
}
function renderCall() {
  const call = state.call;
  clearInterval(callTimer);
  callTimer = null;
  const visible = Boolean(call) && state.open && !state.callHidden;
  el.callscreen.hidden = !visible;
  if (call && call.state === 'active' && state.open) callTimer = setInterval(tickCall, SECOND_MS);
  if (!visible) return;
  const top = make('div');
  const known = contactOf(call.number) || call.name;
  top.append(make('div', 'callscreen__state', TEXT.call[call.state]), make('h2', 'callscreen__name', nameOf(call.number, call.name)));
  if (known) top.append(make('div', 'callscreen__number num', formatNumber(call.number)));
  if (call.state === 'active') { const time = make('div', 'callscreen__time num', duration(callSeconds())); time.id = 'call-time'; top.append(time); }
  const actions = make('div', 'callscreen__actions');
  const round = (variant, action, iconId, label) => {
    const b = button(`round ${variant}`, action);
    const disc = make('span', 'round__disc');
    disc.append(icon(iconId));
    b.append(disc, make('span', '', label));
    return b;
  };
  if (call.state === 'incoming') actions.append(round('round--end', 'call-end', 'i-hangup', TEXT.call.decline), round('round--accept', 'call-answer', 'i-phone', TEXT.call.accept));
  else {
    if (call.state === 'active') actions.append(round('', 'call-hide', 'i-back', TEXT.call.hide));
    actions.append(round('round--end', 'call-end', 'i-hangup', TEXT.call.end));
  }
  el.callscreen.replaceChildren(top, actions);
}

function setCall(call) {
  const before = state.call;
  state.call = call || null;
  if (!call) state.callHidden = false;
  else if (call.state === 'active' && (!before || before.state !== 'active')) state.callSince = Date.now() - (Number(call.seconds) || 0) * SECOND_MS;
  if (call && (!before || before.state !== call.state) && call.state !== 'active') state.callHidden = false;
  updateSound();
  renderChrome();
  renderCall();
  renderPeek();
}

function renderPhone() {
  const home = state.home;
  const tabs = make('div', 'tabs');
  tabs.setAttribute('role', 'tablist');
  Object.entries(TEXT.phone.tabs).forEach(([key, label]) => {

  const nodes = [head(TEXT.apps.phone), tabs];
  if (state.phoneTab === 'log') {

async function startCall(number) {

function fillContacts() {
  const ul = document.getElementById('contact-list');
  if (!ul) return;
  const all = list(state.home.contacts);
  const query = state.contactSearch.trim().toLowerCase();

  else if (!Number.isInteger(amount) || amount < 1) t.error = TEXT.errors.invalid_amount;

async function openApp(app) {
  if (app === 'phone') {
    go('phone');
    if (state.home.missed > 0 && !state.home.admin) { const data = await request('phone_calls_seen', {}, { silent: true, force: true }); if (data) state.home.missed = 0; }
  } else if (app === 'bank') await openBank();
  else if (app === 'dispatch') await openDispatch();
  else if (SCREENS[app]) go(app);
}

let clockTimer = null;
function tickClock() {
  el.statusTime.textContent = TIME.format(new Date());
  const time = document.getElementById('clock-time');
  if (time) time.textContent = TIME.format(new Date());
}
function show(visible) {
  state.open = visible;
  el.phone.hidden = !visible;
  el.toast.hidden = true;
  clearInterval(clockTimer);
  clockTimer = visible ? setInterval(tickClock, CLOCK_MS) : null;
  if (!visible) { clearInterval(callTimer); callTimer = null; }
  renderPeek();
}
function close() {
  if (!state.open) return;
  show(false);
  Bridge.send('phone_close', {});
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click', async (event) => {
  const t = event.target.closest('[data-action]');
  if (!t || !state.open) return;
  const a = t.dataset.action;
  const d = t.dataset;
  if (a === 'home') { if (current().name === 'home') close(); else goHome(); return; }
  if (a === 'back') { back(); return; }
  if (a === 'call-end') { const data = await request('phone_call_end', {}, { force: true, raw: true }); if (data && data.error === 'no_call') setCall(null); return; }
  if (a === 'call-answer') { const data = await request('phone_call_answer', {}, { force: true }); if (data) setCall(data.call); return; }
  if (a === 'call-hide') { state.callHidden = true; renderChrome(); renderCall(); return; }
  if (a === 'call-show') { state.callHidden = false; renderChrome(); renderCall(); return; }
  if (state.busy) return;
  if (a === 'app') await openApp(d.app);
  if (a === 'confirm') { state.confirm = d.what; render(); }
  if (a === 'phone-tab') { state.phoneTab = d.tab; render(); }
  if (a === 'dial' && state.dial.length < state.home.limits.number) { state.dial += d.digit; render(); }
  if (a === 'dial-erase') { state.dial = state.dial.slice(0, -1); render(); }
  if (a === 'dial-call') await startCall(state.dial);
  if (a === 'call-number') await startCall(d.number);
  if (a === 'contact') go('contact', { id: Number(d.id) });
  if (a === 'contact-new') go('contact-form', { number: d.number || '' });
  if (a === 'contact-edit') go('contact-form', { id: Number(d.id) });
  if (a === 'contact-delete') {
    const data = await request('phone_contact_delete', { id: Number(d.id) });
    if (data) { state.home.contacts = list(data.contacts); toast(TEXT.contacts.removed); back(); }
  }
  if (a === 'message-new') go('message-new');
  if (a === 'thread') await openThread(d.number, d.replace === '1');
  if (a === 'thread-older') await loadOlder();
  if (a === 'thread-delete') {
    const data = await request('phone_thread_delete', { number: d.number });
    if (data) { state.home.threads = list(data.threads); state.home.unread = Number(data.unread) || 0; state.thread = null; toast(TEXT.messages.removed); back(); }
  }
  if (a === 'send-location') await sendMessage(true);
  if (a === 'waypoint') { const res = await Bridge.send('phone_waypoint', { x: Number(d.x), y: Number(d.y) }); if (res && res.ok) toast(TEXT.messages.waypointSet); }
  if (a === 'bank-transfer') { state.transfer = { number: '', amount: '', purpose: '', checked: null, error: '' }; go('transfer'); }
  if (a === 'bank-debts') await openDebts();
  if (a === 'transfer-pick') { readTransfer(); Object.assign(state.transfer, { number: d.number, error: '' }); render(); document.getElementById('transfer-amount')?.focus(); }
  if (a === 'transfer-send') await sendTransfer();
  if (a === 'transfer-change') { state.transfer.checked = null; render(); }
  if (a === 'debt') go('debt', { id: Number(d.id) });
  if (a === 'dispatch-service') { const text = document.getElementById('dispatch-text').value; state.dispatchService = d.key; render(); document.getElementById('dispatch-text').value = text; }
  if (a === 'dispatch-again') { state.dispatchSent = null; render(); }
  if (a === 'setting') {
    const data = await request('phone_settings', { [d.key]: !state.home[d.key] });
    if (data) { state.home.silent = data.silent === true; state.home.airplane = data.airplane === true; render(); }
  }
});

document.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (!state.open || state.busy) return;
  const id = event.target.id;
  if (id === 'contact-form') await saveContact();
  if (id === 'composer') await sendMessage(false);
  if (id === 'new-message-form') {
    const number = digits(document.getElementById('new-number').value);
    if (number.length !== state.home.limits.number) { toast(TEXT.errors.invalid_number, true); return; }
    if (number === state.home.number) { toast(TEXT.errors.own_number, true); return; }
    await openThread(number, true);
  }
  if (id === 'transfer-form') await checkTransfer();
  if (id === 'pay-form') await payDebt();
  if (id === 'dispatch-form') await sendDispatch();
});

document.addEventListener('input', (event) => {
  const t = event.target;
  if (t.id === 'contact-search') { state.contactSearch = t.value; fillContacts(); }
  if (t.id === 'contact-number' || t.id === 'new-number') t.value = formatNumber(digits(t.value).slice(0, state.home.limits.number));
  if (t.id === 'transfer-number') t.value = formatAccount(digits(t.value).slice(0, 8));
});

document.addEventListener('keydown', (event) => {
  if (!state.open) return;
  const typing = event.target.matches('input, textarea');
  if (event.key === 'Escape') {
    event.preventDefault();
    if (state.confirm) { state.confirm = null; render(); return; }
    if (current().name === 'transfer' && state.transfer.checked) { state.transfer.checked = null; render(); return; }
    if (!back()) close();
    return;
  }
  // Ziffern direkt tippen, solange die Wahltastatur offen ist
  if (!typing && current().name === 'phone' && state.phoneTab === 'keys' && !state.call) {
    if (/^\d$/.test(event.key) && state.dial.length < state.home.limits.number) { event.preventDefault(); state.dial += event.key; render(); return; }
    if (event.key === 'Backspace') { event.preventDefault(); state.dial = state.dial.slice(0, -1); render(); return; }
    if (event.key === 'Enter' && !state.busy) { event.preventDefault(); startCall(state.dial); return; }
  }
  if (!typing && (event.key === 'ArrowDown' || event.key === 'ArrowUp' || event.key === 'ArrowLeft' || event.key === 'ArrowRight')) {
    const items = [...el.view.querySelectorAll('button:not(:disabled)')];
    if (!items.length) return;
    event.preventDefault();
    const index = items.indexOf(document.activeElement);
    const step = event.key === 'ArrowDown' || event.key === 'ArrowRight' ? 1 : -1;
    items[Math.max(0, Math.min(items.length - 1, index + step))].focus();
  }
});

Bridge.on('phone_open', (data) => {
  applyColors(data.colors);
  if (typeof data.key === 'string') state.key = data.key;
  if (Number.isFinite(data.volume)) state.volume = data.volume;
  Object.assign(state, {
    busy: false, home: data, stack: [{ name: 'home' }], dial: '', phoneTab: 'log', contactSearch: '', confirm: null, thread: null,
    bank: null, debts: null, dispatch: null, dispatchSent: null, peekToast: null,
  });
  show(true);
  if (data.admin) setCall(null); else if (data.call || state.call) setCall(data.call || null);
  render();
  el.phone.focus();
});

Bridge.on('phone_close', () => { show(false); });

Bridge.on('phone_push', async (data) => {
  if (data.type === 'call') {
    const before = state.call;
    if (!data.call && before && data.ended) {
      Sound.stop();
      if (before.state !== 'incoming' || data.ended.reason !== 'declined') Sound.play('end');
      if (state.open) toast(TEXT.call.ended[data.ended.reason] || TEXT.call.ended.ended);
    }
    setCall(data.call || null);
    if (state.open && !data.call) { await reloadHome(); render(); }
    return;
  }
  const silent = data.silent === true;
  const who = nameOf(data.number, data.name);
  if (data.type === 'message') {
    if (!silent) Sound.play('message');
    const text = data.kind === 'location' ? TEXT.locationPreview : String(data.text || '').slice(0, PREVIEW_LENGTH);
    const inThread = state.open && current().name === 'thread' && current().number === data.number;
    if (!state.open) showPeekToast({ type: 'message', who, text });
    else if (inThread) {
      const fresh = await request('phone_thread', { number: data.number }, { silent: true, force: true });
      if (fresh && state.thread) { state.thread.messages = list(fresh.messages); state.thread.more = fresh.more === true; }
    } else toast(`${TEXT.peek.message} ${who}: ${text}`);
  }
  if (data.type === 'missed') {
    if (!silent) Sound.play('message');
    if (!state.open) showPeekToast({ type: 'missed', who });
    else toast(`${TEXT.peek.missed} ${who}`);
  }
  if (state.open) { await reloadHome(); render(); }
});

el.homebutton.setAttribute('aria-label', TEXT.home);

(async () => {
  const res = await Bridge.send('ui_ready', { ui: 'phone', version: CONTRACT_VERSION });
  if (res && res.ok && res.data) {
    applyColors(res.data.colors);
    if (typeof res.data.key === 'string') state.key = res.data.key;
    if (Number.isFinite(res.data.volume)) state.volume = res.data.volume;
  }
  if (Bridge.platform === 'mock') {
    const params = new URLSearchParams(location.search);
    const anruf = params.get('anruf');
    if (anruf) Mock.setCall({ id: 1, state: anruf, number: '555014', seconds: anruf === 'active' ? 73 : undefined });
    if (params.has('zu')) {
      if (anruf) Mock.push('phone_push', { type: 'call', call: Mock.home().call });
      if (params.has('nachricht')) Mock.push('phone_push', { type: 'message', number: '555014', name: 'Lena Hoffmann', kind: 'text', text: 'Hier treffen wir uns. Papiere hab ich dabei.', silent: false });
      return;
    }
    Mock.push('phone_open', { ...Mock.home(), key: 'F1' });
    const screen = params.get('screen');
    if (screen === 'thread') await openThread('555014');
    else if (screen === 'keys') { state.phoneTab = 'keys'; state.dial = '555014'; go('phone'); }
    else if (screen === 'transfer') { await openBank(); state.transfer = { number: '', amount: '', purpose: '', checked: null, error: '' }; go('transfer'); }
    else if (screen === 'debts') { await openBank(); await openDebts(); }
    else if (screen) await openApp(screen);
  }
})();
</script>
