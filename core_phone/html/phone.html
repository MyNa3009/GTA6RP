<!DOCTYPE html>
<!--
  UI: Handy
  CONTRACT_VERSION: 1

  Smartphone unten rechts: Telefon, Nachrichten, Kontakte, Bank, Notruf, Einstellungen. Die UI zeigt nur an:
  Jede Zahl und jeder Stand kommt vom Server. Ist das Handy zu, zeigt eine kleine Zeile Anrufe und neue Nachrichten.
  Toene (Klingeln, Freizeichen, Nachricht) erzeugt die UI selbst, lautlos schaltet sie ab.
  Die Hintergruende zwischen WALLPAPERS:START und WALLPAPERS:END erzeugt tools/wallpapers.py, nicht von Hand aendern.

  EINGEHEND (Lua -> UI)
  phone_open   { colors: { base?, ink?, accent?, mark?, signal? }, key: string, Home }
  phone_push   { type: "message", number, name?, kind, text, silent }
               { type: "call", call?: Call, ended?: { reason, seconds } }
               { type: "missed", number, name?, silent }
  phone_close  {}

  AUSGEHEND (UI -> Lua), Antwort immer { ok, data?, error? }
  ui_ready       { ui: "phone", version: 1 }          -> { colors, key, volume }
  phone_close    {}
  phone_waypoint { x, y }                             // Standort aus einer Nachricht als Wegpunkt
  phone_call     { name, data }                       // Anfrage an den Server
    phone_home           {}                           -> Home
    phone_settings       { silent?, airplane?, wallpaper? }   -> { silent, airplane, wallpaper }
    phone_contact_save   { id?, name, number }        -> { contacts }
    phone_contact_delete { id }                       -> { contacts }
    phone_thread         { number, before? }          -> { number, messages: [Message], more, unread }
    phone_message_send   { number, text } | { number, location: true }   -> { number, message }
    phone_thread_delete  { number }                   -> { threads, unread }
    phone_call_start     { number }                   -> { call }
    phone_call_answer    {}                           -> { call }
    phone_call_end       {}
    phone_calls_seen     {}                           -> { missed }
    phone_bank           {}                           -> { overview: Bank }
    phone_bank_lookup    { number }                   -> { name, number }
    phone_bank_transfer  { number, amount, purpose }  -> { to, overview }
    phone_bank_debts     {}                           -> { debts: [Debt] }
    phone_bank_pay       { id, amount? }              -> { debt, paid, debts, overview }
    phone_dispatch       {}                           -> { services: [{ key, label, units }], default, textMin, textMax }
    phone_dispatch_send  { service, text }            -> { number, service, units }

  Home    { number, name, characterId, silent, airplane, wallpaper, wallpapers: [string],
            contacts: [{ id, name, number }], threads: [Thread], unread,
            calls: [{ id, number, direction, status, seconds, at }], missed, call?: Call, apps: { bank, dispatch },
            admin?: true, limits: { number, name, message, contacts }, volume }
  Thread  { number, text, kind, direction: "in" | "out", at, unread, hidden? }
  Message { id, direction, kind: "text" | "location", text, at, x?, y?, hidden? }
  Call    { id, state: "dialing" | "incoming" | "active", number, name?, silent?, seconds? }
  Bank    { name, number, balance, recent: [{ kind, amount, text, other?, at }], debts: { count, total, overdue }, recipients: [{ name, number }] }
  Debt    { id, kindLabel, creditorLabel, title, amount, fee, paid, rest, overdue, due }
  Zeiten als "JJJJ-MM-TT hh:mm". Eine "number" aus Buchstaben ist ein Dienst (z. B. "Bank"), darauf antwortet man nicht.

  FEHLERCODES: no_phone, is_dead, read_only, busy, invalid_name, invalid_number, invalid_text, invalid_amount, invalid_wallpaper,
    own_number, unknown_number, contact_exists, contacts_full, not_found, too_fast, airplane, in_call, no_call, unreachable,
    line_busy, no_bank, unknown_account, same_account, not_enough_money, debt_closed, no_dispatch, text_too_short, cooldown,
    too_many_open, blocked, invalid_service, server_error, timeout
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Command (schnell anrufen, schreiben, bezahlen) mit Inspect (Chat, Konto). Dichte 6, Bewegung 4.
  Richtung
    Zweck: Das eigene Handy fuer Anrufe, Nachrichten, Bank und Notruf.
    Charakter: handlich, ruhig, echt.
    Welt: ein Smartphone mit Metallrahmen, Seitentasten und Kamera-Insel, wie man es in der Hand haelt.
    Highlight: der Startbildschirm mit grosser Uhr vor dem gewaehlten Hintergrund aus Kugeln mit Lichtkante.
    Signatur: Nummern stehen in Dreiergruppen, Ungelesenes traegt einen Akzentpunkt.
    Form: rund. Buehne: der Hintergrund, nur auf dem Startbildschirm.
  Flaeche: Geraet unten rechts, die Spielsicht bleibt frei. Alle Masse in rem, rem folgt der Bildhoehe.
*/
:root {
  /* Standard des Servers, wird ueber colors ersetzt */
  --rgb-base:   16 17 20;
  --rgb-ink:    255 245 236;
  --rgb-accent: 231 62 192;
  --rgb-mark:   244 154 102;
  --rgb-signal: 244 67 54;

  /* Abgeleitete Stufen, nur ueber Alpha */
  --c-surface:     rgb(var(--rgb-ink) / 0.06);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.10);
  --c-surface-top: rgb(var(--rgb-ink) / 0.15);
  --c-border:      rgb(var(--rgb-ink) / 0.10);
  --c-border-hi:   rgb(var(--rgb-ink) / 0.18);
  --c-text:        rgb(var(--rgb-ink) / 0.95);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.62);
  --c-text-faint:  rgb(var(--rgb-ink) / 0.42);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.16);
  --c-on-accent:   rgb(var(--rgb-base));
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-soft: rgb(var(--rgb-signal) / 0.14);
  --c-scrim:       rgb(var(--rgb-base) / 0.62);
  --shadow-phone:  0 1.5rem 3.5rem rgb(var(--rgb-base) / 0.55);
  --shadow-float:  0 0.75rem 2rem rgb(var(--rgb-base) / 0.5);
  --text-shade:    0 0 2px rgb(var(--rgb-base)), 0 1px 3px rgb(var(--rgb-base) / 0.95), 0 0 12px rgb(var(--rgb-base) / 0.7);

  /* Abstaende (rem skaliert mit der Bildhoehe) */
  --space-1: 0.25rem; --space-2: 0.5rem;  --space-3: 0.75rem;
  --space-4: 1rem;    --space-5: 1.5rem;  --space-6: 2rem; --space-7: 3rem;

  --radius-sm: 0.375rem; --radius-md: 0.625rem; --radius-lg: 0.875rem;
  --radius-xl: 1.25rem;  --radius-full: 999px;

  /* Geraet */
  --phone-w: 22rem;
  --phone-h: 46rem;
  --frame: 0.3rem;
  --bezel: 0.42rem;
  --radius-phone: 3.1rem;
  --radius-bezel: calc(var(--radius-phone) - var(--frame));
  --radius-screen: calc(var(--radius-bezel) - var(--bezel));
  --key-w: 0.24rem;
  --key-out: calc(var(--key-w) * -0.75);
  --island-w: 5.75rem;
  --island-h: 1.7rem;
  --island-top: 0.55rem;
  /* Abstand vom rechten und unteren Bildrand */
  --hud-x: clamp(16px, 2.4vw, 56px);
  --hud-y: clamp(16px, 2.4vw, 56px);
  --status-h: 2.75rem;
  --app-icon: 3.5rem;
  --radius-icon: 1rem;
  --dock-pad: 0.75rem;
  --radius-dock: calc(var(--radius-icon) + var(--dock-pad));
  --control-h: 2.875rem;
  --key-h: 3.6rem;

  --font: 'Montserrat', sans-serif;
  --fs-xs: 0.6875rem;
  --fs-sm: 0.78rem;
  --fs-md: 0.875rem;
  --fs-lg: 1rem;
  --fs-xl: 1.25rem;
  --fs-2xl: 1.625rem;
  --fs-3xl: 2.25rem;
  --fs-clock: 4.5rem;

  --icon-xs: 1rem; --icon-sm: 1.15rem; --icon-md: 1.35rem; --icon-lg: 1.7rem; --icon-xl: 1.9rem;

  --dur-fast: 120ms; --dur-base: 180ms; --dur-panel: 240ms; --dur-pulse: 900ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  --z-base: 1; --z-overlay: 10; --z-dialog: 20; --z-call: 25; --z-toast: 30; --z-hardware: 40; --z-peek: 50;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; }
html { font-size: clamp(12px, 1.55vh, 26px); }
body {
  font-family: var(--font);
  font-size: var(--fs-md);
  line-height: 1.45;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
input, textarea { user-select: text; }
h2, h3, p, dl, dd, ul, fieldset { margin: 0; }
ul { padding: 0; list-style: none; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.ico { font-size: var(--icon-md); width: 1em; height: 1em; flex: none; }
.btn .ico { font-size: var(--icon-sm); }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
[tabindex="-1"]:focus-visible { outline: none; }

/* ---------- Geraet ---------- */
.phone {
  position: fixed; right: var(--hud-x); bottom: var(--hud-y); z-index: var(--z-base);
  width: var(--phone-w); height: var(--phone-h);
  padding: var(--frame);
  border-radius: var(--radius-phone);
  /* Metallrahmen: Lichtkante oben links, matte Flanke, Reflex unten rechts */
  background:
    linear-gradient(152deg,
      rgb(var(--rgb-ink) / 0.42) 0%, rgb(var(--rgb-ink) / 0.14) 14%, rgb(var(--rgb-ink) / 0.07) 42%,
      rgb(var(--rgb-ink) / 0.22) 68%, rgb(var(--rgb-ink) / 0.06) 86%, rgb(var(--rgb-ink) / 0.18) 100%),
    rgb(var(--rgb-base));
  box-shadow:
    inset 0 0 0 1px rgb(var(--rgb-ink) / 0.14), inset 0 1px 1px rgb(var(--rgb-ink) / 0.4), inset 0 -1px 1px rgb(var(--rgb-base) / 0.8),
    0 1px 2px rgb(var(--rgb-base) / 0.6), 0 0.6rem 1.2rem rgb(var(--rgb-base) / 0.35), var(--shadow-phone);
  transform-origin: 80% 100%;
  animation: phone-in var(--dur-panel) var(--ease-out);
}
.phone.is-closing { animation: phone-out var(--dur-base) var(--ease-out) forwards; }
@keyframes phone-in  { from { opacity: 0; transform: translateY(2rem) scale(0.98); } }
@keyframes phone-out { to   { opacity: 0; transform: translateY(2rem) scale(0.98); } }
.phone__bezel {
  height: 100%; padding: var(--bezel);
  border-radius: var(--radius-bezel);
  background: rgb(var(--rgb-base));
  box-shadow: 0 0 0 1px rgb(var(--rgb-base) / 0.9), inset 0 0 0 1px rgb(var(--rgb-ink) / 0.04);
}
.phone__key {
  position: absolute; width: var(--key-w); border-radius: var(--radius-sm);
  background: linear-gradient(90deg, rgb(var(--rgb-ink) / 0.10), rgb(var(--rgb-ink) / 0.36) 45%, rgb(var(--rgb-ink) / 0.12)), rgb(var(--rgb-base));
  box-shadow: 0 0 0 1px rgb(var(--rgb-base) / 0.55);
}
.phone__key--action { left: var(--key-out); top: 7.2rem;  height: 1.7rem; }
.phone__key--up     { left: var(--key-out); top: 10.2rem; height: 3.1rem; }
.phone__key--down   { left: var(--key-out); top: 13.9rem; height: 3.1rem; }
.phone__key--power  { right: var(--key-out); top: 11rem;  height: 4.8rem; }
.phone__band { position: absolute; background: rgb(var(--rgb-base) / 0.75); }
.phone__band--top    { top: 0; left: 4.4rem; width: 0.32rem; height: var(--frame); }
.phone__band--bottom { bottom: 0; right: 4.4rem; width: 0.32rem; height: var(--frame); }
.phone__band--left   { left: 0; top: 4.6rem; width: var(--frame); height: 0.32rem; }
.phone__band--right  { right: 0; bottom: 4.6rem; width: var(--frame); height: 0.32rem; }
.island {
  position: absolute; top: var(--island-top); left: 50%; z-index: var(--z-hardware);
  width: var(--island-w); height: var(--island-h);
  transform: translateX(-50%);
  border-radius: var(--radius-full);
  background: rgb(var(--rgb-base));
  box-shadow: 0 0 0 1px rgb(var(--rgb-ink) / 0.035);
  pointer-events: none;
}
.island::after {
  content: ''; position: absolute; top: 50%; right: 0.5rem;
  width: 0.72rem; height: 0.72rem; transform: translateY(-50%); border-radius: 50%;
  background: radial-gradient(circle at 34% 32%, rgb(var(--rgb-accent) / 0.45) 0 12%, rgb(var(--rgb-ink) / 0.10) 13% 30%, rgb(var(--rgb-base)) 62%);
  box-shadow: 0 0 0 1.5px rgb(var(--rgb-ink) / 0.07);
}
.screen {
  position: relative; height: 100%; overflow: hidden; isolation: isolate;
  border-radius: var(--radius-screen);
  background: rgb(var(--rgb-base));
}
/* Glaskante ueber dem Display */
.screen::after {
  content: ''; position: absolute; inset: 0; z-index: var(--z-hardware);
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgb(var(--rgb-ink) / 0.06), inset 0 1px 0 rgb(var(--rgb-ink) / 0.05);
  pointer-events: none;
}
.wallpaper-layer { position: absolute; inset: 0; z-index: 0; display: block; width: 100%; height: 100%; pointer-events: none; contain: strict; }

.statusbar {
  position: absolute; inset: 0 0 auto 0; z-index: var(--z-toast);
  height: calc(var(--island-top) * 2 + var(--island-h));
  padding: 0 1.7rem;
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--fs-sm); font-weight: 600;
  pointer-events: none;
}
.statusbar__icons { display: flex; align-items: center; gap: var(--space-2); }
.statusbar__icons .ico { font-size: var(--icon-xs); }
.battery { position: relative; width: 1.45rem; height: 0.72rem; padding: 0.12rem; border: 1.5px solid rgb(var(--rgb-ink) / 0.7); border-radius: 0.25rem; }
.battery::before { content: ''; display: block; width: 100%; height: 100%; border-radius: 0.1rem; background: var(--c-text); }

/* ---------- Ansichten ---------- */
.view {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  padding: calc(var(--status-h) + var(--space-3)) var(--space-5) var(--space-6);
}
.view--solid, .view--app { background: rgb(var(--rgb-base)); }
.view--app { padding-inline: var(--space-4); padding-bottom: var(--space-5); }
.view--home { padding-bottom: var(--space-5); background: linear-gradient(rgb(var(--rgb-base) / 0.35), transparent 30%, transparent 70%, rgb(var(--rgb-base) / 0.45)); }
.view.enter-fwd  { animation: view-fwd  var(--dur-panel) var(--ease-out); }
.view.enter-back { animation: view-back var(--dur-panel) var(--ease-out); }
.view.enter-app  { animation: view-app  var(--dur-panel) var(--ease-out); }
.view.enter-fade { animation: view-fade var(--dur-panel) var(--ease-out); }
@keyframes view-fwd  { from { opacity: 0; transform: translateX(1.5rem); } }
@keyframes view-back { from { opacity: 0; transform: translateX(-1.5rem); } }
@keyframes view-app  { from { opacity: 0; transform: scale(0.92); } }
@keyframes view-fade { from { opacity: 0; } }

.scroll {
  flex: 1; min-height: 0;
  overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none;
  margin-inline: calc(var(--space-1) * -1); padding-inline: var(--space-1);
}
.scroll::-webkit-scrollbar { display: none; }

/* Typografie */
.title-lg { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.15; letter-spacing: -0.015em; overflow-wrap: anywhere; }
.title-app { font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.01em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.title-sec { font-size: var(--fs-sm); font-weight: 600; color: var(--c-text-muted); margin: var(--space-5) 0 var(--space-2); }
.title-sec:first-child { margin-top: 0; }
.meta { font-size: var(--fs-sm); color: var(--c-text-muted); }
.meta strong { color: var(--c-text); font-weight: 600; }
.hint { font-size: var(--fs-xs); color: var(--c-text-muted); }

/* Hinweise ueber dem Inhalt: Admin-Ansicht, laufendes Gespraech */
.banner {
  display: flex; align-items: center; gap: var(--space-2); width: 100%; flex: none;
  margin-bottom: var(--space-3); padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md); font-size: var(--fs-xs); font-weight: 600; text-align: left;
}
.banner .ico { font-size: var(--icon-xs); }
.banner--admin { background: linear-gradient(var(--c-accent-soft), var(--c-accent-soft)), rgb(var(--rgb-base) / 0.9); border: 1px dashed rgb(var(--rgb-accent) / 0.5); }
.banner--call { border: 0; background: var(--c-accent); color: var(--c-on-accent); }
.banner--call .num { margin-left: auto; }

/* ---------- Buttons ---------- */
.btn {
  min-height: var(--control-h); padding: 0 var(--space-4);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: 1px solid transparent; border-radius: var(--radius-md);
  font-size: var(--fs-md); font-weight: 600; white-space: nowrap;
  background: var(--c-surface-hi);
  transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out);
}
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn--block { width: 100%; }
.btn--primary { background: var(--c-accent); color: var(--c-on-accent); }
.btn--primary:hover:not(:disabled) { background: rgb(var(--rgb-accent) / 0.88); }
.btn--secondary:hover:not(:disabled) { background: var(--c-surface-top); }
.btn--ghost { background: transparent; color: var(--c-text-muted); }
.btn--ghost:hover:not(:disabled) { color: var(--c-text); background: var(--c-surface); }
.btn--danger { background: var(--c-signal-soft); color: var(--c-signal); }
.btn--danger:hover:not(:disabled) { background: rgb(var(--rgb-signal) / 0.22); }
.btn--sm { min-height: 2.25rem; font-size: var(--fs-sm); padding: 0 var(--space-3); }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); flex: none; }

.icon-btn {
  width: 2.5rem; height: 2.5rem; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: var(--radius-md);
  background: transparent; color: var(--c-text);
  transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.icon-btn:hover:not(:disabled) { background: var(--c-surface); }
.icon-btn:active:not(:disabled) { transform: scale(0.94); }
.icon-btn:disabled, .call-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.icon-btn--filled { background: var(--c-accent); color: var(--c-on-accent); }
.icon-btn--filled:hover:not(:disabled) { background: rgb(var(--rgb-accent) / 0.88); }
.icon-btn--danger { color: var(--c-signal); }

/* ---------- Formulare ---------- */
.form { display: flex; flex-direction: column; gap: var(--space-4); }
.field { display: flex; flex-direction: column; gap: var(--space-1); }
.field__label { font-size: var(--fs-sm); font-weight: 600; color: rgb(var(--rgb-ink) / 0.78); }
.input, .textarea, .input-group {
  border: 1px solid var(--c-border); border-radius: var(--radius-md);
  background: var(--c-surface);
  transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.input, .input-group { height: var(--control-h); }
.input, .textarea { width: 100%; padding: 0 var(--space-3); font-size: var(--fs-md); }
.textarea { min-height: 6.5rem; padding-block: var(--space-3); resize: none; line-height: 1.45; }
.input::placeholder, .textarea::placeholder { color: var(--c-text-faint); }
.input:focus-visible, .textarea:focus-visible, .input-group:focus-within { outline: none; border-color: var(--c-accent); background: var(--c-surface-hi); box-shadow: 0 0 0 3px var(--c-accent-soft); }
.input-group { display: flex; align-items: center; min-width: 0; flex: none; margin-bottom: var(--space-2); }
.input-group .input { border: 0; background: transparent; height: 100%; min-width: 0; flex: 1; box-shadow: none; }
.input-group > .ico { margin-left: var(--space-3); color: var(--c-text-muted); font-size: var(--icon-sm); }
input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
.field.has-error .input, .field.has-error .textarea { border-color: var(--c-signal); }
.field__error { font-size: var(--fs-xs); font-weight: 500; color: var(--c-signal); }
.alert { padding: var(--space-3); border-radius: var(--radius-md); background: var(--c-signal-soft); border: 1px solid rgb(var(--rgb-signal) / 0.35); font-size: var(--fs-sm); }
button.alert { display: flex; align-items: center; gap: var(--space-3); width: 100%; flex: none; text-align: left; margin-bottom: var(--space-3); }
button.alert:hover { background: rgb(var(--rgb-signal) / 0.2); }
.alert strong { display: block; font-weight: 600; }
.alert .ico { color: var(--c-signal); }
.facts { display: grid; gap: var(--space-3); padding: var(--space-4) 0; border-top: 1px solid var(--c-border); border-bottom: 1px solid var(--c-border); }
.facts div { display: flex; justify-content: space-between; gap: var(--space-3); }
.facts dt { color: var(--c-text-muted); flex: none; }
.facts dd { font-weight: 600; min-width: 0; text-align: right; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); }
.chip { padding: 0.35rem 0.7rem; border: 1px solid var(--c-border-hi); border-radius: var(--radius-full); background: transparent; font-size: var(--fs-xs); font-weight: 600; }
.chip:hover { background: var(--c-surface); }

/* ---------- Startbildschirm ---------- */
.home__time { margin-top: var(--space-5); font-size: var(--fs-clock); font-weight: 600; line-height: 1; letter-spacing: -0.03em; text-shadow: 0 2px 12px rgb(var(--rgb-base) / 0.5); }
.home__date { margin-top: var(--space-2); font-size: var(--fs-lg); font-weight: 500; color: rgb(var(--rgb-ink) / 0.82); text-shadow: 0 1px 6px rgb(var(--rgb-base) / 0.6); }
.apps { margin-top: var(--space-6); display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-5) var(--space-2); }
.app { width: 100%; padding: 0; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: var(--space-2); }
.app__icon {
  position: relative; width: var(--app-icon); height: var(--app-icon);
  display: grid; place-items: center;
  border-radius: var(--radius-icon);
  background: rgb(var(--rgb-base) / 0.9); border: 1px solid var(--c-border-hi);
  transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.app__icon .ico { font-size: var(--icon-lg); }
.app:hover .app__icon { background: rgb(var(--rgb-base) / 0.7); }
.app:active .app__icon { transform: scale(0.94); }
.app:focus-visible { outline: none; }
.app:focus-visible .app__icon { outline: 2px solid var(--c-accent); outline-offset: 3px; }
.app__label { max-width: 100%; font-size: var(--fs-xs); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 3px rgb(var(--rgb-base) / 0.8); }
.badge {
  position: absolute; top: -0.35rem; right: -0.35rem;
  min-width: 1.25rem; height: 1.25rem; padding: 0 0.3rem;
  display: grid; place-items: center;
  border-radius: var(--radius-full); border: 2px solid rgb(var(--rgb-base));
  background: var(--c-accent); color: var(--c-on-accent);
  font-size: 0.65rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.dock {
  margin-top: auto; padding: var(--dock-pad);
  display: grid; grid-template-columns: repeat(var(--dock-count, 4), 1fr); gap: var(--space-2);
  border-radius: var(--radius-dock);
  background: rgb(var(--rgb-base) / 0.72); border: 1px solid var(--c-border);
}
.dock .app__label { display: none; }
.dock .app__icon { background: var(--c-surface-hi); border-color: transparent; }
.dock .app:hover .app__icon { background: var(--c-surface-top); }
.homebar {
  position: absolute; bottom: 0; left: 50%; z-index: var(--z-overlay);
  width: 8rem; height: 1.4rem; padding: 0; transform: translateX(-50%);
  display: grid; place-items: center; border: 0; background: none;
}
.homebar::before { content: ''; width: 6.5rem; height: 0.3rem; border-radius: var(--radius-full); background: rgb(var(--rgb-ink) / 0.7); transition: background-color var(--dur-fast) var(--ease-out); }
.homebar:hover::before { background: rgb(var(--rgb-ink)); }

/* ---------- App-Geruest und Listen ---------- */
.appbar { display: flex; align-items: center; gap: var(--space-1); min-height: 2.75rem; flex: none; margin: 0 calc(var(--space-2) * -1) var(--space-3); }
.appbar .title-app { flex: 1; }
.list > li + li { border-top: 1px solid var(--c-border); }
.row {
  width: 100%; display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-1);
  border: 0; background: none; text-align: left; border-radius: var(--radius-sm);
  transition: background-color var(--dur-fast) var(--ease-out);
}
button.row:hover { background: var(--c-surface); }
button.row[aria-pressed="true"] { background: var(--c-surface-hi); }
.row__check { color: var(--c-accent); visibility: hidden; }
.row[aria-pressed="true"] .row__check { visibility: visible; }
.row__main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row__title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__title.is-missed { color: var(--c-signal); }
.row__sub { font-size: var(--fs-sm); color: var(--c-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row__end { display: flex; flex-direction: column; align-items: flex-end; gap: var(--space-1); flex: none; }
.row__meta { font-size: var(--fs-xs); color: var(--c-text-muted); font-variant-numeric: tabular-nums; flex: none; }
.row__amount { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
.row__amount.is-plus { color: var(--c-accent); }
.row > .ico { color: var(--c-text-muted); }
.unread { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--c-accent); }
.avatar { width: 2.5rem; height: 2.5rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--c-surface-hi); font-size: var(--fs-sm); font-weight: 600; }
.avatar--lg { width: 3.5rem; height: 3.5rem; font-size: var(--fs-lg); }
.empty { display: flex; flex-direction: column; align-items: flex-start; gap: var(--space-3); padding: var(--space-5) var(--space-1); color: var(--c-text-muted); font-size: var(--fs-sm); max-width: 28ch; }
.tx-icon { width: 2.1rem; height: 2.1rem; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--c-surface-hi); color: var(--c-text); }
.tx-icon .ico { font-size: var(--icon-sm); }
.tx-icon.is-plus { background: var(--c-accent-soft); color: var(--c-accent); }
.tx-icon.is-alert { background: var(--c-signal-soft); color: var(--c-signal); }

/* ---------- Telefon ---------- */
.segmented { display: grid; grid-template-columns: 1fr 1fr; flex: none; padding: var(--space-1); border-radius: var(--radius-md); background: var(--c-surface); margin-bottom: var(--space-3); }
.segmented button {
  height: 2.1rem; border: 0; background: none;
  border-radius: calc(var(--radius-md) - var(--space-1));
  font-size: var(--fs-sm); font-weight: 500; color: var(--c-text-muted);
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.segmented button[aria-selected="true"] { background: var(--c-surface-top); color: var(--c-text); font-weight: 600; }
.dial { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.dial__display { min-height: 4.5rem; display: flex; flex-direction: column; justify-content: center; padding: 0 var(--space-1); }
.dial__number { font-size: var(--fs-2xl); font-weight: 600; letter-spacing: 0.02em; min-height: 1.3em; }
.dial__match { font-size: var(--fs-sm); color: var(--c-accent); min-height: 1.6em; font-weight: 500; }
.dial__match button { padding: 0; border: 0; background: none; color: inherit; font-weight: 600; text-decoration: underline; text-underline-offset: 0.2em; }
.dial .keypad { margin-top: auto; }
.dial__actions { display: flex; justify-content: center; margin-top: var(--space-4); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2) var(--space-3); }
.key {
  height: var(--key-h); display: grid; place-items: center;
  border: 0; border-radius: var(--radius-lg); background: var(--c-surface);
  font-size: var(--fs-xl); font-weight: 500; font-variant-numeric: tabular-nums;
  transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.key:hover { background: var(--c-surface-hi); }
.key:active { transform: scale(0.96); background: var(--c-surface-top); }
.key--plain { background: transparent; }
.key--plain:hover { background: var(--c-surface); }
.key .ico { font-size: var(--icon-lg); }
.call-btn {
  width: 4rem; height: 4rem; border: 0; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--c-accent); color: var(--c-on-accent);
  transition: transform var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.call-btn:hover:not(:disabled) { background: rgb(var(--rgb-accent) / 0.88); }
.call-btn:active:not(:disabled) { transform: scale(0.95); }
.call-btn .ico { font-size: var(--icon-xl); }
.call-btn--end { background: var(--c-signal); color: rgb(var(--rgb-base)); }
.call-btn--end:hover:not(:disabled) { background: rgb(var(--rgb-signal) / 0.88); }

/* ---------- Gespraech ---------- */
.callscreen { z-index: var(--z-call); }
.call__status { font-size: var(--fs-sm); font-weight: 600; color: var(--c-text-muted); margin-top: var(--space-6); }
.call__status.is-live { color: var(--c-accent); }
.call__name { font-size: var(--fs-3xl); font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; margin-top: var(--space-2); overflow-wrap: anywhere; }
.call__number { margin-top: var(--space-1); color: var(--c-text-muted); }
.call__controls { margin-top: auto; display: grid; grid-template-columns: 1fr; gap: var(--space-3); }
.toggle-btn {
  height: 4.25rem; border: 1px solid var(--c-border); border-radius: var(--radius-lg); background: var(--c-surface);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-1);
  font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-muted);
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.toggle-btn:hover { background: var(--c-surface-hi); color: var(--c-text); }
.toggle-btn:active { transform: scale(0.97); }
.call__end { display: flex; justify-content: center; gap: var(--space-7); margin-top: var(--space-5); }
.call__opt { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-muted); }

/* ---------- Nachrichten ---------- */
.thread { min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: var(--space-2); padding-bottom: var(--space-3); }
.bubble { max-width: 80%; display: flex; flex-direction: column; gap: 0.15rem; }
.bubble__text { padding: 0.55rem 0.8rem; border-radius: var(--radius-lg); background: var(--c-surface-hi); overflow-wrap: anywhere; user-select: text; }
.bubble__time { font-size: var(--fs-xs); color: var(--c-text-faint); font-variant-numeric: tabular-nums; padding: 0 0.3rem; }
.bubble--me { align-self: flex-end; align-items: flex-end; }
.bubble--me .bubble__text { background: var(--c-accent); color: var(--c-on-accent); border-bottom-right-radius: var(--radius-sm); }

.bubble--them .bubble__text { border-bottom-left-radius: var(--radius-sm); }
/* Standort: immer neutral, damit der Knopf darin lesbar bleibt */
.bubble--loc .bubble__text { display: flex; flex-direction: column; gap: var(--space-2); background: var(--c-surface-hi); color: var(--c-text); border: 1px solid var(--c-border-hi); }
.bubble__loc { display: flex; align-items: center; gap: var(--space-2); font-weight: 600; }
.bubble__loc .ico { color: var(--c-accent); font-size: var(--icon-sm); }
.bubble.is-hidden { opacity: 0.6; }
.thread__day { align-self: center; font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-faint); padding: var(--space-2) 0; text-align: center; }
.thread .btn--ghost { align-self: center; }
.compose { display: flex; gap: var(--space-2); align-items: center; flex: none; }
.compose .input { border-radius: var(--radius-full); padding: 0 var(--space-4); }
.compose .icon-btn { width: var(--control-h); height: var(--control-h); border-radius: 50%; }

/* ---------- Bank ---------- */
.balance { padding: var(--space-2) var(--space-1) var(--space-4); flex: none; }
.balance__label { font-size: var(--fs-sm); color: var(--c-text-muted); font-weight: 500; }
.balance__value { font-size: var(--fs-3xl); font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: var(--space-1); }
.balance__iban { font-size: var(--fs-xs); color: var(--c-text-muted); margin-top: var(--space-1); font-variant-numeric: tabular-nums; user-select: text; }
.skeleton, .balance__value.is-loading, .balance__iban.is-loading {
  display: block; border-radius: var(--radius-sm); background: var(--c-surface-hi);
  animation: skeleton-pulse var(--dur-pulse) var(--ease-in-out) infinite alternate;
}
.skeleton--line { height: 0.8rem; width: 72%; }
.skeleton--short { width: 38%; margin-top: var(--space-2); }
.balance__value.is-loading { width: 11rem; height: 2.4rem; margin-top: var(--space-2); }
.balance__iban.is-loading { width: 8rem; height: 0.7rem; margin-top: var(--space-2); }
@keyframes skeleton-pulse { from { opacity: 1; } to { opacity: 0.45; } }

/* ---------- Einstellungen ---------- */
.profile { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-1) var(--space-4); border-bottom: 1px solid var(--c-border); }
.profile__name { font-size: var(--fs-lg); font-weight: 700; }
.setting { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-1); }
.setting + .setting { border-top: 1px solid var(--c-border); }
.setting__icon { width: 2.1rem; height: 2.1rem; flex: none; display: grid; place-items: center; border-radius: var(--radius-md); background: var(--c-surface-hi); }
.setting__icon .ico { font-size: var(--icon-sm); }
.setting__text { flex: 1; min-width: 0; }
.setting__label { font-weight: 500; }
.setting__hint { font-size: var(--fs-xs); color: var(--c-text-muted); }
.switch {
  position: relative; flex: none; width: 2.75rem; height: 1.625rem;
  border: 0; border-radius: var(--radius-full); background: rgb(var(--rgb-ink) / 0.2);
  transition: background-color var(--dur-base) var(--ease-out);
}
.switch::after {
  content: ''; position: absolute; top: 0.1875rem; left: 0.1875rem;
  width: 1.25rem; height: 1.25rem; border-radius: 50%;
  background: rgb(var(--rgb-ink)); box-shadow: 0 1px 3px rgb(var(--rgb-base) / 0.4);
  transition: transform var(--dur-base) var(--ease-out);
}
.switch[aria-checked="true"] { background: var(--c-accent); }
.switch[aria-checked="true"]::after { transform: translateX(1.125rem); }
.switch:disabled { opacity: 0.5; cursor: not-allowed; }
.wallpapers { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-3); border: 0; padding: 0 var(--space-1) var(--space-4); min-width: 0; }
.wallpapers:disabled { opacity: 0.6; }
.wallpaper { display: flex; flex-direction: column; gap: var(--space-2); cursor: pointer; }
.wallpaper input { position: absolute; opacity: 0; pointer-events: none; }
.wallpaper__swatch { aspect-ratio: 9 / 16; overflow: hidden; border-radius: var(--radius-md); border: 1px solid var(--c-border-hi); background: rgb(var(--rgb-base)); transition: box-shadow var(--dur-fast) var(--ease-out); }

.wallpaper input:focus-visible + .wallpaper__swatch { outline: 2px solid var(--c-accent); outline-offset: 5px; }
.wallpaper__art { display: block; width: 100%; height: 100%; }
.wallpaper__name { font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-muted); }
.wallpaper input:checked ~ .wallpaper__name { color: var(--c-text); font-weight: 600; }

/* ---------- Ebenen: Sheet, Dialog, Mitteilung ---------- */
.layer { position: absolute; inset: 0; z-index: var(--z-dialog); display: flex; align-items: flex-end; background: var(--c-scrim); animation: view-fade var(--dur-base) var(--ease-out); }
.layer--center { align-items: center; padding: var(--space-5); }
.sheet, .dialog { width: 100%; background: linear-gradient(var(--c-surface-hi), var(--c-surface-hi)), rgb(var(--rgb-base)); border: 1px solid var(--c-border-hi); box-shadow: var(--shadow-float); }
.sheet {
  max-height: 88%; overflow-y: auto; scrollbar-width: none;
  padding: var(--space-3) var(--space-5) var(--space-6);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0; border-bottom: 0;
  display: flex; flex-direction: column; gap: var(--space-4);
  animation: sheet-in var(--dur-panel) var(--ease-out);
}
.sheet::-webkit-scrollbar { display: none; }
.sheet::before { content: ''; align-self: center; flex: none; width: 2.5rem; height: 0.25rem; border-radius: var(--radius-full); background: rgb(var(--rgb-ink) / 0.25); }
@keyframes sheet-in { from { transform: translateY(1.5rem); opacity: 0; } }
.sheet__head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-right: calc(var(--space-2) * -1); }
.sheet__actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.dialog { padding: var(--space-5); border-radius: var(--radius-xl); display: flex; flex-direction: column; gap: var(--space-2); animation: dialog-in var(--dur-base) var(--ease-out); }
@keyframes dialog-in { from { transform: scale(0.96); opacity: 0; } }
.dialog__title { font-size: var(--fs-lg); font-weight: 700; }
.dialog__text { font-size: var(--fs-sm); color: var(--c-text-muted); }
.dialog__actions { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-3); }
.toast {
  position: absolute; left: var(--space-3); right: var(--space-3); top: calc(var(--status-h) + var(--space-1)); z-index: var(--z-toast);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-lg);
  background: rgb(var(--rgb-base) / 0.97); border: 1px solid var(--c-border-hi); box-shadow: var(--shadow-float);
  opacity: 0; transform: translateY(-1rem); cursor: pointer;
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-panel) var(--ease-out);
}
.toast.is-visible { opacity: 1; transform: none; }
.toast--error { border-color: rgb(var(--rgb-signal) / 0.55); }
.toast__app { display: flex; align-items: center; gap: var(--space-1); font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-muted); }
.toast__app .ico { font-size: var(--icon-xs); }
.toast--error .toast__app { color: var(--c-signal); }
.toast__title { font-weight: 600; font-size: var(--fs-sm); margin-top: 0.1rem; }
.toast__text { font-size: var(--fs-sm); color: rgb(var(--rgb-ink) / 0.8); overflow-wrap: anywhere; }

/* ---------- Handy zu: Zeile fuer Anruf und neue Nachricht, frei im Bild ---------- */
.peek {
  position: fixed; right: var(--hud-x); bottom: var(--hud-y); z-index: var(--z-peek);
  max-width: min(46vw, 520px); display: flex; align-items: center; gap: 0.7em; justify-content: flex-end;
  font-size: clamp(15px, 0.95vw, 21px); font-weight: 600; text-shadow: var(--text-shade); text-align: right; pointer-events: none;
}
.peek .ico { font-size: 1.25em; color: var(--c-accent); filter: drop-shadow(0 1px 2px rgb(var(--rgb-base))); }
.peek__text { overflow-wrap: anywhere; }
.peek__kind { color: var(--c-accent); font-weight: 700; margin-right: 0.4em; }
.keycap { display: inline-block; padding: 0.1em 0.5em; border-radius: 0.3em; background: rgb(var(--rgb-base) / 0.85); border: 1px solid rgb(var(--rgb-ink) / 0.25); font-size: 0.85em; font-weight: 700; text-shadow: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';
  function on(event, fn) { (handlers[event] ||= []).push(fn); }
  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }
  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });
  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }
  return { on, send, emit, platform };
})();

      if (number.length !== 6) return { ok: false, error: 'invalid_number' };

      contacts.sort((a, b) => a.name.localeCompare(b.name));

    },
    phone_contact_delete: (d) => { contacts = contacts.filter((c) => c.id !== d.id); return { ok: true, data: { contacts } }; },
    phone_thread: (d) => {
      const list = chats[d.number] || [];
      list.forEach((m) => { delete m.unread; });

      if (number.length !== 6) return { ok: false, error: 'invalid_number' };

  return {

})();

const list = (value) => (Array.isArray(value) ? value : []);   // Lua schickt leere Listen als {}

function initials(name) {
  // Nur Woerter, die mit einem Buchstaben beginnen: "Mira (EMS)" -> "ME"
  const parts = String(name).trim().split(/\s+/).map((part) => part.replace(/^[^\p{L}\d]+/u, '')).filter(Boolean);
  if (!parts.length || /^\d/.test(parts[0])) return '#';

// "2026-11-16 14:20": heute nur die Uhrzeit, sonst das Datum
function when(text, full = false) {
  const m = typeof text === 'string' && text.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  if (!m) return text || '';
  const now = new Date();
  const today = Number(m[1]) === now.getFullYear() && Number(m[2]) === now.getMonth() + 1 && Number(m[3]) === now.getDate();
  if (full) return `${m[3]}.${m[2]}.${m[1]}, ${m[4]}`;
  return today ? m[4] : `${m[3]}.${m[2]}.`;
}
function duration(seconds, lead = true) {
  const s = Math.max(0, Math.floor(Number(seconds) || 0));
  const minutes = Math.floor(s / SECONDS_PER_MINUTE);
  return `${lead ? String(minutes).padStart(2, '0') : minutes}:${String(s % SECONDS_PER_MINUTE).padStart(2, '0')}`;
}
function parseAmount(value) {
  const text = String(value ?? '').trim().replace(/[.\s$]/g, '');
  return /^\d+$/.test(text) ? Number(text) : NaN;
}
function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  const root = document.documentElement.style;
  for (const [key, cssVar] of Object.entries(COLOR_VARS)) {
    const value = typeof colors[key] === 'string' ? colors[key].trim() : '';
    const valid = COLOR_PATTERN.test(value) && value.split(' ').every((n) => Number(n) <= RGB_MAX);
    if (valid) root.setProperty(cssVar, value);

}

/* ---------- Toene: erzeugt die UI selbst, damit keine Spiel-Sounds noetig sind ---------- */
const Sound = (() => {
  let ctx = null;
  let loop = null;
  let loopName = null;
  function context() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (err) { ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }
  function play(name) {
    const audio = context();
    const tone = TONES[name];
    if (!audio || !tone || !(state.volume > 0)) return;
    tone.notes.forEach(([frequency, start, length]) => {
      const osc = audio.createOscillator();
      const gain = audio.createGain();
      const from = audio.currentTime + start / SECOND_MS;
      const to = from + length / SECOND_MS;
      osc.type = 'sine';
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(0, from);
      gain.gain.linearRampToValueAtTime(state.volume, from + TONE_ATTACK_S);
      gain.gain.linearRampToValueAtTime(0, to);
      osc.connect(gain).connect(audio.destination);
      osc.start(from);
      osc.stop(to + TONE_TAIL_S);
    });
  }
  function stop() { clearInterval(loop); loop = null; loopName = null; }
  function start(name) {
    if (loopName === name) return;
    stop();
    loopName = name;
    play(name);
    loop = setInterval(() => play(name), TONES[name].every);
  }
  return { play, start, stop };
})();

// Klingeln und Freizeichen folgen dem Stand des Gespraechs
function updateSound() {
  const call = state.call;
  if (call && call.state === 'incoming' && !call.silent) Sound.start('ring');
  else if (call && call.state === 'dialing') Sound.start('ringback');
  else Sound.stop();
}

/* ---------- Server ---------- */
// options: force (auch waehrend einer anderen Anfrage), silent (keine Mitteilung), raw (Fehler als { error } zurueck)
async function request(name, data = {}, options = {}) {
  if (state.busy && !options.force) return null;
  setBusy(true);
  const res = await Bridge.send('phone_call', { name, data });
  setBusy(false);
  if (!res || !res.ok) {
    const code = (res && res.error) || 'default';
    if (!options.silent) toast(errorText(code), { error: true });
    return options.raw ? { error: code } : null;
  }
  return res.data || {};
}
function setBusy(busy) {
  state.busy = busy;
  el.phone.querySelectorAll('[data-lock]').forEach((b) => { b.disabled = busy || b.dataset.off === '1'; });
}
async function reloadHome() {
  const data = await request('phone_home', {}, { silent: true, force: true });
  if (!data) return;
  const call = state.call;
  state.home = data;
  // Den Stand des Gespraechs fuehrt die UI ueber die Push-Nachrichten, hier nur uebernehmen, wenn keiner da ist

function keepInputs(draw) {
  const saved = [...el.view.querySelectorAll('input[id], textarea[id]')].map((node) => [node.id, node.value]);
  const focused = document.activeElement && el.view.contains(document.activeElement) ? document.activeElement.id : '';
  draw();

async function openApp(app, trigger) {
  const tile = trigger && trigger.querySelector('.app__icon');
  if (tile) {
    const r = tile.getBoundingClientRect();
    const s = el.screen.getBoundingClientRect();
    state.animOrigin = `${r.left - s.left + r.width / 2}px ${r.top - s.top + r.height / 2}px`;
  }
  const anim = tile ? 'app' : 'fwd';
  if (app === 'phone') {
    state.phoneTab = state.home.missed > 0 || state.home.admin ? 'log' : 'keys';
    go('phone', {}, anim);
    if (state.home.missed > 0 && !state.home.admin) { const data = await request('phone_calls_seen', {}, { silent: true, force: true }); if (data) state.home.missed = 0; }
  } else if (app === 'bank') await openBank(anim);
  else if (app === 'dispatch') await openDispatch(anim);
  else if (app === 'contacts') { state.contactSearch = ''; go('contacts', {}, anim); }
  else if (SCREENS[app]) go(app, {}, anim);
}

let closeTimer = null;
function tickClock() {
  el.statusTime.textContent = TIME.format(new Date());
  const time = $('clock-time');
  if (time) time.textContent = TIME.format(new Date());
}
function show(visible) {
  state.open = visible;
  clearTimeout(closeTimer);
  clearInterval(clockTimer);
  clockTimer = null;
  if (visible) {
    el.phone.classList.remove('is-closing');
    el.phone.hidden = false;
    clockTimer = setInterval(tickClock, CLOCK_MS);
  } else {
    closeLayers();
    hideToast();
    clearInterval(callTimer);
    callTimer = null;
    if (!el.phone.hidden) {
      el.phone.classList.add('is-closing');
      closeTimer = setTimeout(() => { el.phone.hidden = true; el.phone.classList.remove('is-closing'); }, CLOSE_MS);
    }
  }
  renderPeek();
}
function close() {
  if (!state.open) return;
  show(false);
  Bridge.send('phone_close', {});
}

/* ---------- Aktionen (Event Delegation) ---------- */
// Diese gehen auch, waehrend eine Anfrage laeuft
const ALWAYS = {
  home: () => goHome(),
  back: () => { back(); },
  'toast-dismiss': () => hideToast(),
  'sheet-close': () => closeLayers(),
  'sheet-backdrop': (t, event) => { if (event.target === el.sheetLayer) closeLayers(); },
  'dialog-cancel': () => closeDialog(),
  'call-end': async () => { const data = await request('phone_call_end', {}, { force: true, raw: true }); if (data && data.error === 'no_call') setCall(null); },
  'call-answer': async () => { const data = await request('phone_call_answer', {}, { force: true }); if (data) setCall(data.call); },
  'call-hide': () => { state.callHidden = true; render(); },
  'call-show': () => { state.callHidden = false; closeLayers(); render(); },
};
const ACTIONS = {
  app: (t) => openApp(t.dataset.app, t),
  'phone-tab': (t) => { state.phoneTab = t.dataset.tab; render(); },
  dial: (t) => { if (state.dial.length < state.home.limits.number) { state.dial += t.dataset.digit; updateDial(); } },
  'dial-erase': () => { state.dial = state.dial.slice(0, -1); updateDial(); },
  'dial-call': () => startCall(state.dial),
  'call-number': (t) => startCall(t.dataset.number),
  contact: (t) => openSheet({ type: 'contact', id: Number(t.dataset.id) }),
  'contact-new': (t) => openSheet({ type: 'contact-form', number: t.dataset.number || '' }),
  'contact-edit': (t) => openSheet({ type: 'contact-form', id: Number(t.dataset.id) }),
  'contact-remove': (t) => {
    const c = list(state.home.contacts).find((x) => x.id === Number(t.dataset.id));
    if (!c) return;
    ask({ title: TEXT.contacts.removeTitle, text: TEXT.contacts.removeText(c.name), confirm: TEXT.contacts.remove, run: async () => {
      const data = await request('phone_contact_delete', { id: c.id });
      if (!data) return;
      state.home.contacts = list(data.contacts);
      closeLayers();
      render();
      toast(TEXT.contacts.removed, { app: 'contacts' });
    } });
  },
  'message-new': () => go('message-new'),
  thread: (t) => openThread(t.dataset.number, t.dataset.replace === '1'),
  'thread-older': () => loadOlder(),
  'thread-remove': (t) => {
    const number = t.dataset.number;
    ask({ title: TEXT.messages.removeTitle, text: TEXT.messages.removeText(nameOf(number)), confirm: TEXT.contacts.remove, run: async () => {
      const data = await request('phone_thread_delete', { number });
      if (!data) return;
      Object.assign(state.home, { threads: list(data.threads), unread: Number(data.unread) || 0 });
      state.thread = null;
      back();
      toast(TEXT.messages.removed, { app: 'messages' });
    } });
  },
  'send-location': () => sendMessage(true),
  waypoint: async (t) => { const res = await Bridge.send('phone_waypoint', { x: Number(t.dataset.x), y: Number(t.dataset.y) }); if (res && res.ok) toast(TEXT.messages.waypointSet, { app: 'messages' }); },
  'bank-transfer': () => openSheet({ type: 'transfer', number: '', amount: '', purpose: '', checked: null }),
  'bank-debts': () => openDebts(),
  'transfer-pick': (t) => { readTransfer(); state.sheet.number = t.dataset.number; renderSheet(); $('transfer-amount')?.focus(); },
  'transfer-send': () => sendTransfer(),
  'transfer-change': () => { state.sheet.checked = null; renderSheet(); },
  debt: (t) => openSheet({ type: 'debt', id: Number(t.dataset.id) }),
  'dispatch-service': (t) => {
    state.dispatchService = t.dataset.key;
    el.view.querySelectorAll('[data-action="dispatch-service"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.key === state.dispatchService)));
  },
  'dispatch-again': () => { state.dispatchSent = null; render(); },
  setting: (t) => saveSettings({ [t.dataset.key]: !state.home[t.dataset.key] }),
  'dialog-confirm': async () => { const dialog = state.dialog; if (!dialog) return; await dialog.run(); closeDialog(); },
};
document.addEventListener('click', (event) => {
  const t = event.target.closest('[data-action]');
  if (!t || !state.open) return;
  const always = ALWAYS[t.dataset.action];
  if (always) { always(t, event); return; }
  if (state.busy || !ACTIONS[t.dataset.action]) return;
  Promise.resolve(ACTIONS[t.dataset.action](t, event)).catch((err) => console.error('[phone] action', err));
});

const SUBMITS = {
  'contact-form': saveContact,
  composer: () => sendMessage(false),
  'new-message-form': async () => {
    const box = $('new-number');
    const number = digits(box.value);
    setFieldError(box, '');
    if (number.length !== state.home.limits.number) { showError('invalid_number', { invalid_number: 'new-number' }); return; }
    if (number === state.home.number) { showError('own_number', { own_number: 'new-number' }); return; }
    await openThread(number, true);
  },
  'transfer-form': checkTransfer,
  'pay-form': payDebt,
  'dispatch-form': sendDispatch,
};
document.addEventListener('submit', (event) => {
  event.preventDefault();   // Die UI navigiert nie per Formular
  if (!state.open || state.busy || !SUBMITS[event.target.id]) return;
  Promise.resolve(SUBMITS[event.target.id]()).catch((err) => console.error('[phone] submit', err));
});

document.addEventListener('input', (event) => {
  const t = event.target;
  if (t.id === 'contact-search') { state.contactSearch = t.value; fillContacts(); return; }
  if (t.id === 'contact-number' || t.id === 'new-number') t.value = formatNumber(digits(t.value).slice(0, state.home.limits.number));
  if (t.id === 'transfer-number') t.value = formatAccount(digits(t.value).slice(0, ACCOUNT_DIGITS));
  if (t.getAttribute('aria-invalid') === 'true') setFieldError(t, '');
});

document.addEventListener('change', (event) => {
  const t = event.target;
  if (t.name !== 'wallpaper' || !state.open) return;
  if (state.busy || state.home.admin) { render(); return; }
  saveSettings({ wallpaper: t.value });
});

/* ---------- Tastatur und Controller: Pfeile = Steuerkreuz, Enter = Bestaetigen, Escape = Zurueck ---------- */
const NAV_SELECTOR = 'button, input, textarea';
const ARROWS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
const isTextInput = (node) => Boolean(node && node.matches && node.matches('input:not([type="radio"]), textarea'));
function navRoot() {
  if (state.dialog) return el.dialogLayer;
  if (state.sheet) return el.sheet;
  if (callVisible()) return el.callscreen;
  return el.screen;
}
const navRect = (node) => (node.type === 'radio' ? node.closest('label') || node : node).getBoundingClientRect();
// Naechstes Bedienelement in Pfeilrichtung nach seiner Lage auf dem Bildschirm
function moveFocus(dir) {
  const root = navRoot();
  const items = [...root.querySelectorAll(NAV_SELECTOR)].filter((node) => !node.disabled && !node.closest('[hidden]') && navRect(node).width > 0);
  if (!items.length) return;
  const cur = document.activeElement;
  if (!items.includes(cur)) { (items.find((node) => node.dataset.autofocus) || items[0]).focus(); return; }
  const a = navRect(cur);
  const ax = a.left + a.width / 2;
  const ay = a.top + a.height / 2;
  let best = null;
  let bestScore = Infinity;
  items.forEach((node) => {
    if (node === cur) return;
    const b = navRect(node);
    const dx = b.left + b.width / 2 - ax;
    const dy = b.top + b.height / 2 - ay;
    const main = { right: dx, left: -dx, down: dy, up: -dy }[dir];
    const cross = dir === 'left' || dir === 'right' ? Math.abs(dy) : Math.abs(dx);
    if (main <= NAV_MIN_DISTANCE_PX) return;
    const score = main + cross * NAV_CROSS_WEIGHT;
    if (score < bestScore) { bestScore = score; best = node; }
  });
  if (!best) return;
  best.focus({ preventScroll: true });
  best.scrollIntoView({ block: 'nearest' });
}

document.addEventListener('keydown', (event) => {
  if (!state.open || event.ctrlKey || event.altKey || event.metaKey) return;
  const target = event.target;
  // Die Taste zum Oeffnen schliesst auch, sonst kaeme sie bei offenem Handy nie im Spiel an
  if (event.key.toLowerCase() === state.key.toLowerCase() && !isTextInput(target)) { event.preventDefault(); close(); return; }
  if (event.key === 'Escape') {
    event.preventDefault();
    if (state.dialog) closeDialog();
    else if (state.sheet) closeLayers();
    else if (!back()) close();
    return;
  }
  const dir = ARROWS[event.key];
  if (dir) {
    // In Textfeldern bleiben links und rechts beim Cursor
    if (isTextInput(target) && (dir === 'left' || dir === 'right')) return;
    event.preventDefault();
    moveFocus(dir);
    return;
  }
  if (event.key === 'Enter' && target.type === 'radio' && !target.checked) {
    event.preventDefault();
    target.checked = true;
    target.dispatchEvent(new Event('change', { bubbles: true }));
    return;
  }
  if (isTextInput(target) || layerOpen() || callVisible()) return;
  // Ziffern direkt tippen, solange das Tastenfeld offen ist
  if (current().name === 'phone' && state.phoneTab === 'keys' && !state.home.admin) {
    if (/^\d$/.test(event.key)) { event.preventDefault(); ACTIONS.dial({ dataset: { digit: event.key } }); return; }
    if (event.key === 'Backspace') { event.preventDefault(); ACTIONS['dial-erase'](); return; }
    if (event.key === 'Enter' && !state.busy && !target.closest('button')) { event.preventDefault(); startCall(state.dial); return; }
  }
  if (event.key === 'Backspace') { event.preventDefault(); back(); }
});

/* ---------- Ereignisse vom Client ---------- */
Bridge.on('phone_open', (data) => {
  applyColors(data.colors);
  if (typeof data.key === 'string') state.key = data.key;
  if (Number.isFinite(data.volume)) state.volume = data.volume;
  closeLayers();
  Object.assign(state, {
    busy: false, home: data, stack: [{ name: 'home' }], anim: null, dial: '', phoneTab: 'keys', contactSearch: '', thread: null,
    bank: null, debts: null, dispatch: null, dispatchSent: null, peekToast: null,
  });
  show(true);
  if (data.admin) setCall(null); else if (data.call || state.call) setCall(data.call || null);
  render();
  el.phone.focus({ preventScroll: true });
});

Bridge.on('phone_close', () => { show(false); });

Bridge.on('phone_push', async (data) => {
  if (data.type === 'call') {
    const before = state.call;
    if (!data.call && before && data.ended) {
      Sound.stop();
      if (before.state !== 'incoming' || data.ended.reason !== 'declined') Sound.play('end');
    }
    setCall(data.call || null);
    if (!data.call && before && data.ended) toast(TEXT.call.ended[data.ended.reason] || TEXT.call.ended.ended, { app: 'phone', title: nameOf(before.number, before.name) });
    if (state.open && !data.call) { await reloadHome(); keepInputs(render); }
    return;
  }
  const silent = data.silent === true;
  const who = nameOf(data.number, data.name);
  if (data.type === 'message') {
    if (!silent) Sound.play('message');
    const text = data.kind === 'location' ? TEXT.messages.locationLabel : String(data.text || '').slice(0, PREVIEW_LENGTH);
    const inThread = state.open && current().name === 'thread' && current().number === data.number;
    if (!state.open) showPeekToast({ type: 'message', who, text });
    else if (inThread) {
      const fresh = await request('phone_thread', { number: data.number }, { silent: true, force: true });
      if (fresh && state.thread) { state.thread.messages = list(fresh.messages); state.thread.more = fresh.more === true; }
    } else toast(text, { app: 'messages', title: who });
  }
  if (data.type === 'missed') {
    if (!silent) Sound.play('message');
    if (!state.open) showPeekToast({ type: 'missed', who });
    else toast(TEXT.peek.missed, { app: 'phone', title: who });
  }
  if (state.open) { await reloadHome(); keepInputs(render); }
});

el.homebar.setAttribute('aria-label', TEXT.common.home);
el.toast.title = TEXT.common.dismiss;

(async () => {
  const res = await Bridge.send('ui_ready', { ui: 'phone', version: CONTRACT_VERSION });
  if (res && res.ok && res.data) {
    applyColors(res.data.colors);
    if (typeof res.data.key === 'string') state.key = res.data.key;
    if (Number.isFinite(res.data.volume)) state.volume = res.data.volume;
  }
  if (Bridge.platform === 'mock') {
    const params = new URLSearchParams(location.search);
    const anruf = params.get('anruf');
    if (anruf) Mock.setCall({ id: 1, state: anruf, number: '555014', seconds: anruf === 'active' ? 73 : undefined });
    if (params.has('zu')) {
      if (anruf) Mock.push('phone_push', { type: 'call', call: Mock.home().call });
      if (params.has('nachricht')) Mock.push('phone_push', { type: 'message', number: '555014', name: 'Lena Hoffmann', kind: 'text', text: 'Hier treffen wir uns. Papiere hab ich dabei.', silent: false });
      return;
    }
    Mock.push('phone_open', { ...Mock.home(), key: 'F1' });
    const screen = params.get('screen');
    if (screen === 'thread') await openThread('555014');
    else if (screen === 'log') { await openApp('phone'); state.phoneTab = 'log'; render(); }
    else if (screen === 'debts') { await openBank(); await openDebts(); }
    else if (screen) await openApp(screen);
  }
})();
</script>
