<!DOCTYPE html>
<!--
  UI: Menue (G-Menue und Kontextmenues der core_lib)
  CONTRACT_VERSION: 2
  G-Menue: Kategorien im Kreis, rechts daneben die Liste der gewaehlten Kategorie mit Unterkategorien.
  Kontextmenue: nur die Liste in der Bildmitte.

  EINGEHEND (Lua -> UI)
  menu_open {
    mode: "interact" | "context",
    title: string,
    subtitle?: string,                  // z. B. "Nächste Person: ID 17 · 1,2 m"
    tabs?: Tab[],                       // nur interact: die Kategorien im Kreis
    items?: Node[],                     // nur context
    players?: { serverId: number, label: string }[]   // fuer "Wen meinst du?"
  }
  menu_update  wie menu_open, die UI bleibt an derselben Stelle (Kategorie, Unterkategorie, Auswahl)
  menu_close   {}

  Tab  { id: string, label: string, icon?: string, locked?: boolean, items: Node[] }
  Node {
    id: string, label: string, description?: string, icon?: string,
    badge?: string,                     // kurzer Zustand rechts, z. B. "an", "offen"
    title?: string, children?: Node[],  // Unterkategorie
    target?: "player",                  // braucht eine Person
    locked?: boolean,                   // sichtbar mit Schloss, nicht waehlbar
    disabled?: boolean, readOnly?: boolean,
    progress?: number,                  // 0 bis 100
    metadata?: { label: string, value: string }[]
  }

  AUSGEHEND (UI -> Lua), Antwort immer { ok, data?, error? }
  ui_ready     { ui: "menu", version: 2 }        -> data.colors { base, ink, accent, mark }
  menu_select  { id: string, player?: number }   -> data { choose?: true, close?: boolean }
  menu_close   {}
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Command. Dichte 7, Bewegung 1, Varianz 3.
  Kreis in der Bildmitte fuer die Kategorien, Liste rechts daneben. Kommt oft, darum keine Animation beim Oeffnen.
  Highlight: die gewaehlte Kategorie, voll in der Akzentfarbe. Signatur: Nummern 1 bis 9 an Kreis und Liste.
  Farben: base und ink aus der Core, accent (Kreis) und mark (Liste, Icons, Fehler) aus Config.Lib.Menu.Colors.
*/
:root {
  --rgb-base:   14 15 18;
  --rgb-ink:    232 234 237;
  --rgb-accent: 45 212 191;
  --rgb-mark:   236 88 140;

  --c-dim-in:      rgb(var(--rgb-base) / 0.55);
  --c-dim-out:     rgb(var(--rgb-base) / 0.82);
  --c-orb:         rgb(var(--rgb-base) / 0.96);
  --c-row:         rgb(var(--rgb-base) / 0.88);
  --c-surface:     rgb(var(--rgb-ink) / 0.04);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.09);
  --c-border:      rgb(var(--rgb-ink) / 0.07);
  --c-border-hi:   rgb(var(--rgb-ink) / 0.18);
  --c-ring:        rgb(var(--rgb-ink) / 0.10);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-2:      rgb(var(--rgb-ink) / 0.72);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-line: rgb(var(--rgb-accent) / 0.55);
  --c-mark:        rgb(var(--rgb-mark));
  --c-on-accent:   rgb(var(--rgb-base));
  --shadow:        0 8px 24px rgb(var(--rgb-base) / 0.5);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --radius-xs: 4px; --radius-sm: 6px; --radius-md: 8px;

  --fs-2xs: clamp(10px, 0.5vw, 12px);
  --fs-xs: clamp(11px, 0.58vw, 13px);
  --fs-sm: clamp(12px, 0.68vw, 15px);

  /* Kreis */
  --ring-r: clamp(150px, 10.25vw, 270px);
  --orb: clamp(60px, 4.1vw, 104px);
  --orb-icon: calc(var(--orb) * 0.38);
  --lock-badge: clamp(18px, 1.05vw, 26px);
  --center-dot: 4px;

  /* Liste */
  --panel-gap: clamp(24px, 2.4vw, 60px);
  --panel-w: clamp(300px, 17.5vw, 440px);
  --row-min-h: clamp(36px, 2vw, 48px);
  --row-num: clamp(18px, 1.05vw, 24px);
  --row-icon: clamp(14px, 0.85vw, 18px);
  --bar-h: 4px;

  --edge: clamp(16px, 1.2vw, 32px);
  --dur-fast: 120ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --z-dim: 1;
  --z-ring: 2;
  --z-panel: 3;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* Abdunkeln: Mitte etwas heller, damit der Kreis im Fokus steht */
.dim {
  position: fixed;
  inset: 0;
  z-index: var(--z-dim);
  background: radial-gradient(circle at 50% 50%, var(--c-dim-in) 0, var(--c-dim-out) 75%);
}

/* ---------- Kreis ---------- */
.ring {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: var(--z-ring);
  width: calc(var(--ring-r) * 2);
  height: calc(var(--ring-r) * 2);
  transform: translate(-50%, -50%);
  border: 1px solid var(--c-ring);
  border-radius: 50%;
}

.center {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: var(--space-2);
  max-width: calc(var(--ring-r) * 1.1);
  text-align: center;
  pointer-events: none;
}
.center .dot {
  width: var(--center-dot);
  height: var(--center-dot);
  border-radius: 50%;
  background: var(--c-text-muted);
}
.center .who { display: grid; gap: 2px; }
.center .who-label { font-size: var(--fs-2xs); color: var(--c-text-muted); }
.center .who-value { font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-2); font-variant-numeric: tabular-nums; }

.orb {
  position: absolute;
  left: calc(50% + var(--fx) * var(--ring-r) - var(--orb) / 2);
  top: calc(50% + var(--fy) * var(--ring-r) - var(--orb) / 2);
  width: var(--orb);
  height: var(--orb);
  padding: 0;
  border: 1px solid var(--c-border);
  border-radius: 50%;
  background: var(--c-orb);
  box-shadow: var(--shadow);
  color: var(--c-text);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.orb > svg { width: var(--orb-icon); height: var(--orb-icon); }
.orb:hover { border-color: var(--c-border-hi); background: rgb(var(--rgb-base)); }
.orb:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: 4px; }
.orb:active { transform: scale(0.97); }
.orb[aria-pressed="true"] { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-on-accent); }
.ring.is-ring-level .orb[aria-pressed="true"] { box-shadow: var(--shadow), 0 0 0 4px rgb(var(--rgb-accent) / 0.22); }

.orb-label {
  position: absolute;
  left: 50%;
  top: calc(100% + var(--space-2));
  transform: translateX(-50%);
  display: inline-flex;
  align-items: baseline;
  gap: var(--space-1);
  white-space: nowrap;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text);
  pointer-events: none;
}
.orb-label .n { font-size: var(--fs-2xs); font-weight: 500; color: var(--c-text-muted); font-variant-numeric: tabular-nums; }
.orb[aria-pressed="true"] .orb-label { color: var(--c-accent); }

.lock-badge {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: var(--lock-badge);
  height: var(--lock-badge);
  display: grid;
  place-items: center;
  border: 1px solid var(--c-border-hi);
  border-radius: 50%;
  background: rgb(var(--rgb-base));
  color: var(--c-text-2);
}
.lock-badge svg { width: 55%; height: 55%; }

/* ---------- Liste ---------- */
.panel {
  position: fixed;
  z-index: var(--z-panel);
  left: calc(50% + var(--ring-r) + var(--orb) / 2 + var(--panel-gap));
  top: calc(50% - var(--ring-r) - var(--space-4));
  width: var(--panel-w);
  max-height: calc(var(--ring-r) * 2 + var(--orb));
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}
.panel.is-context {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-height: min(70dvh, 760px);
}

.head {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 28px;
}
.back {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  color: var(--c-text-muted);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.back:hover { color: var(--c-text); background: var(--c-surface); }
.back:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: 2px; }
.back svg { width: 16px; height: 16px; }
.title {
  margin: 0;
  min-width: 0;
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--c-mark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.list {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  align-content: start;
  gap: var(--space-2);
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--c-surface-hi) transparent;
}
.list:focus-visible { outline: none; }

.row {
  width: 100%;
  min-height: var(--row-min-h);
  display: grid;
  grid-template-columns: var(--row-num) var(--row-icon) minmax(0, 1fr) auto;
  align-items: center;
  column-gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-row);
  text-align: left;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.row.is-active { background: rgb(var(--rgb-base)); border-color: var(--c-accent-line); }
.row:active { transform: scale(0.99); }
.row.is-locked { cursor: not-allowed; }
.row.is-locked .num, .row.is-locked .icon, .row.is-locked .text { opacity: 0.45; }
.row[aria-disabled="true"]:not(.is-locked) { cursor: default; color: var(--c-text-muted); }
.row[aria-disabled="true"]:active { transform: none; }

.num {
  display: grid;
  place-items: center;
  width: var(--row-num);
  height: var(--row-num);
  border-radius: 50%;
  background: var(--c-surface-hi);
  color: var(--c-text-2);
  font-size: var(--fs-2xs);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.num:empty { background: none; }
.row.is-active .num:not(:empty) { background: var(--c-accent); color: var(--c-on-accent); }

.icon { width: var(--row-icon); height: var(--row-icon); color: var(--c-mark); }

.text { min-width: 0; display: grid; gap: 2px; }
.label {
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 1.3;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.desc {
  font-size: var(--fs-2xs);
  color: var(--c-text-muted);
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.meter { height: var(--bar-h); margin-top: var(--space-1); border-radius: var(--radius-xs); background: var(--c-surface-hi); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--c-text-2); border-radius: var(--radius-xs); }

.side {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--c-text-2);
  font-size: var(--fs-2xs);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.side svg { width: 14px; height: 14px; color: var(--c-text-muted); }

.empty {
  padding: var(--space-4) var(--space-3);
  border: 1px dashed var(--c-border-hi);
  border-radius: var(--radius-md);
  color: var(--c-text-muted);
  font-size: var(--fs-xs);
}

.details {
  margin: 0;
  padding: var(--space-3);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-row);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--space-1) var(--space-4);
  font-size: var(--fs-2xs);
}
.details dt { color: var(--c-text-muted); }
.details dd { margin: 0; color: var(--c-text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

.status { margin: 0; font-size: var(--fs-xs); font-weight: 600; color: var(--c-mark); }
.status:empty { display: none; }
.panel[aria-busy="true"] .list { opacity: 0.6; pointer-events: none; }

/* ---------- Tasten unten links ---------- */
.keys {
  position: fixed;
  left: var(--edge);
  bottom: var(--edge);
  z-index: var(--z-panel);
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: var(--space-2);
  font-size: var(--fs-2xs);
  color: var(--c-text-muted);
}
.keys li { display: flex; align-items: center; gap: var(--space-2); }
.keys kbd {
  min-width: 28px;
  padding: 2px var(--space-1);
  border: 1px solid var(--c-border-hi);
  border-radius: var(--radius-xs);
  background: var(--c-surface);
  color: var(--c-text-2);
  font-family: inherit;
  font-size: 9px;
  font-weight: 700;
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<script id="bridge">
const CONTRACT_VERSION = 2;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const Mock = {
  delay: 120,
  responses: {
    menu_select: (data) => {
      if (data.id === 'e:person_search' && data.player === undefined) return { ok: true, data: { choose: true } };
      if (data.id === 'e:vehicle_engine') return { ok: true, data: { close: false } };
      return { ok: true, data: { close: true } };
    },
  },
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    console.info(`[mock] ${event}`, data);
    const fn = this.responses[event];
    return fn ? fn(data) : { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  back: 'Zurück',
  close: 'Schließen',
  choose: 'Wen meinst du?',
  noItems: 'Hier gibt es gerade nichts zu tun.',
  locked: 'Gesperrt',
  keys: [
    ['ESC', 'Menü verlassen'],
    ['RMB', 'Zurück / verlassen'],
    ['1-9', 'Schnellauswahl'],
  ],
  errors: {
    locked: 'Dafür fehlt dir die Berechtigung.',
    not_found: 'Das geht gerade nicht mehr. Menü neu öffnen.',
    player_gone: 'Die Person ist nicht mehr in der Nähe.',
    not_open: 'Das Menü ist schon zu.',
    bridge_error: 'Keine Verbindung zum Spiel.',
    client_error: 'Das hat nicht geklappt.',
  },
  errorFallback: 'Das hat nicht geklappt.',
};

const MAX_HOTKEYS = 9;
const CLOSE_KEY = 'g';
const PLAYER_PREFIX = 'p:';
const FULL_TURN = 2 * Math.PI;
const SUBTITLE_SPLIT = ': ';   // "Nächste Person: ID 17 · 1,2 m" -> zwei Zeilen in der Mitte des Kreises

const state = {
  open: false,
  mode: 'interact',
  title: '',
  subtitle: '',
  tabs: [],
  items: [],
  players: [],
  tabIndex: 0,
  level: 'ring',      // 'ring': Tasten steuern den Kreis, 'list': die Liste
  stack: [],          // geoeffnete Unterkategorien
  choosing: null,     // { id, label } bei "Wen meinst du?"
  cursor: 0,
  busy: false,
  error: '',
};

const el = {
  dim: document.getElementById('dim'),
  ring: document.getElementById('ring'),
  who: document.getElementById('who'),
  whoLabel: document.getElementById('who-label'),
  whoValue: document.getElementById('who-value'),
  panel: document.getElementById('panel'),
  back: document.getElementById('back'),
  title: document.getElementById('title'),
  list: document.getElementById('list'),
  details: document.getElementById('details'),
  status: document.getElementById('status'),
  keys: document.getElementById('keys'),
};
el.back.setAttribute('aria-label', TEXT.back);

function svgIcon(name, className) {
  if (!name || !document.getElementById(`i-${name}`)) return null;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  if (className) svg.setAttribute('class', className);
  const use = document.createElementNS(ns, 'use');
  use.setAttribute('href', `#i-${name}`);
  svg.appendChild(use);
  return svg;
}

function applyColors(colors) {
  if (!colors) return;
  const root = document.documentElement.style;
  ['base', 'ink', 'accent', 'mark'].forEach((key) => {
    if (typeof colors[key] === 'string') root.setProperty(`--rgb-${key}`, colors[key]);
  });
}

/* ---------- Was gerade angezeigt wird ---------- */

const isInteract = () => state.mode === 'interact';
const currentTab = () => state.tabs[state.tabIndex];

function rootItems() {
  return isInteract() ? currentTab()?.items || [] : state.items;
}

function currentItems() {
  if (state.choosing) {
    return state.players.map((player) => ({ id: PLAYER_PREFIX + player.serverId, label: player.label, icon: 'user', player: player.serverId }));
  }
  const top = state.stack[state.stack.length - 1];
  return top ? top.children || [] : rootItems();
}

function currentTitle() {
  if (state.choosing) return TEXT.choose;
  const top = state.stack[state.stack.length - 1];
  if (top) return top.title || top.label;
  return isInteract() ? currentTab()?.label || '' : state.title;
}

const isSelectable = (node) => node && !node.locked && !node.disabled && !node.readOnly;

/* ---------- Kreis ---------- */

function renderRing() {
  const show = isInteract() && state.tabs.length > 0;
  el.ring.hidden = !show;
  if (!show) return;
  el.ring.classList.toggle('is-ring-level', state.level === 'ring');

  // Mitte: naechste Person
  const [label, value] = state.subtitle.includes(SUBTITLE_SPLIT) ? state.subtitle.split(SUBTITLE_SPLIT) : ['', state.subtitle];
  el.who.hidden = !state.subtitle;
  el.whoLabel.textContent = label;
  el.whoValue.textContent = value;

  const count = state.tabs.length;
  const existing = el.ring.querySelectorAll('.orb');
  if (existing.length !== count || [...existing].some((orb, i) => orb.dataset.id !== state.tabs[i].id)) {
    existing.forEach((orb) => orb.remove());
    const fragment = document.createDocumentFragment();
    state.tabs.forEach((tab, index) => {
      // Im Uhrzeigersinn ab oben
      const angle = (index / count) * FULL_TURN - Math.PI / 2;
      const orb = document.createElement('button');
      orb.type = 'button';
      orb.className = 'orb';
      orb.dataset.action = 'tab';
      orb.dataset.index = String(index);
      orb.dataset.id = tab.id;
      orb.style.setProperty('--fx', Math.cos(angle).toFixed(4));
      orb.style.setProperty('--fy', Math.sin(angle).toFixed(4));
      const icon = svgIcon(tab.icon || 'list');
      if (icon) orb.appendChild(icon);
      const caption = document.createElement('span');
      caption.className = 'orb-label';
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = index < MAX_HOTKEYS ? String(index + 1) : '';
      caption.append(n, document.createTextNode(tab.label));
      orb.appendChild(caption);
      fragment.appendChild(orb);
    });
    el.ring.appendChild(fragment);
  }
  el.ring.querySelectorAll('.orb').forEach((orb, index) => {
    const tab = state.tabs[index];
    orb.setAttribute('aria-pressed', String(index === state.tabIndex));
    orb.setAttribute('aria-label', tab.locked ? `${tab.label}, ${TEXT.locked}` : tab.label);
    let badge = orb.querySelector('.lock-badge');
    if (tab.locked && !badge) {
      badge = document.createElement('span');
      badge.className = 'lock-badge';
      badge.appendChild(svgIcon('lock'));
      orb.appendChild(badge);
    } else if (!tab.locked && badge) {
      badge.remove();
    }
  });
}

/* ---------- Liste ---------- */

function rowFor(node, index) {
  const li = document.createElement('li');
  li.setAttribute('role', 'none');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'row';
  button.id = `row-${index}`;
  button.tabIndex = -1;
  button.setAttribute('role', 'menuitem');
  button.dataset.action = 'select';
  button.dataset.index = String(index);
  if (node.locked) button.classList.add('is-locked');
  if (!isSelectable(node) && !(node.children && !node.locked)) button.setAttribute('aria-disabled', 'true');
  if (node.children) button.setAttribute('aria-haspopup', 'menu');

  const num = document.createElement('span');
  num.className = 'num';
  num.setAttribute('aria-hidden', 'true');
  if (index < MAX_HOTKEYS) num.textContent = String(index + 1);
  button.appendChild(num);

  button.appendChild(svgIcon(node.icon, 'icon') || document.createElement('span'));

  const text = document.createElement('span');
  text.className = 'text';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = node.label;
  text.appendChild(label);
  if (node.description) {
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = node.description;
    text.appendChild(desc);
  }
  if (typeof node.progress === 'number') {
    const meter = document.createElement('span');
    meter.className = 'meter';
    meter.setAttribute('role', 'progressbar');
    meter.setAttribute('aria-valuemin', '0');
    meter.setAttribute('aria-valuemax', '100');
    meter.setAttribute('aria-valuenow', String(Math.round(node.progress)));
    const fill = document.createElement('span');
    fill.style.width = `${Math.max(0, Math.min(100, node.progress))}%`;
    meter.appendChild(fill);
    text.appendChild(meter);
  }
  button.appendChild(text);

  const side = document.createElement('span');
  side.className = 'side';
  if (node.locked) {
    side.appendChild(svgIcon('lock'));
  } else {
    if (node.badge) side.appendChild(document.createTextNode(node.badge));
    if (node.children) side.appendChild(svgIcon('chevron-right'));
  }
  button.appendChild(side);
  li.appendChild(button);
  return li;
}

function renderList() {
  el.panel.hidden = false;
  el.panel.classList.toggle('is-context', !isInteract());
  el.title.textContent = currentTitle();
  // Zurueck: Unterkategorie, Liste zum Kreis, auf oberster Ebene schliessen

  const items = currentItems();
  if (state.cursor >= items.length) state.cursor = Math.max(0, items.length - 1);
  const fragment = document.createDocumentFragment();
  items.forEach((node, index) => fragment.appendChild(rowFor(node, index)));
  if (items.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = TEXT.noItems;
    fragment.appendChild(li);
  }
  el.list.replaceChildren(fragment);
  renderCursor();
}

function renderCursor() {
  el.list.querySelectorAll('.row.is-active').forEach((row) => row.classList.remove('is-active'));
  const row = state.level === 'list' ? document.getElementById(`row-${state.cursor}`) : null;
  if (row) {
    row.classList.add('is-active');
    el.list.setAttribute('aria-activedescendant', row.id);
    row.scrollIntoView({ block: 'nearest' });
  } else {
    el.list.removeAttribute('aria-activedescendant');
  }
  renderDetails(state.level === 'list' ? currentItems()[state.cursor] : null);
  el.ring.classList.toggle('is-ring-level', state.level === 'ring');
}

function renderDetails(node) {
  const list = node && Array.isArray(node.metadata) ? node.metadata : [];
  el.details.hidden = list.length === 0;
  if (list.length === 0) return;
  const fragment = document.createDocumentFragment();
  list.forEach((entry) => {
    const dt = document.createElement('dt');
    dt.textContent = entry.label;
    const dd = document.createElement('dd');
    dd.textContent = entry.value;
    fragment.append(dt, dd);
  });
  el.details.replaceChildren(fragment);
}

function renderKeys() {
  if (el.keys.childElementCount > 0) return;
  const fragment = document.createDocumentFragment();
  TEXT.keys.forEach(([key, label]) => {
    const li = document.createElement('li');
    const kbd = document.createElement('kbd');
    kbd.textContent = key;
    li.append(kbd, document.createTextNode(label));
    fragment.appendChild(li);
  });
  el.keys.replaceChildren(fragment);
}

function renderStatus() {
  if (el.status.textContent !== state.error) el.status.textContent = state.error;
  el.panel.setAttribute('aria-busy', String(state.busy));
}

function render() {
  el.dim.hidden = false;
  el.keys.hidden = false;
  renderKeys();
  renderRing();
  renderList();
  renderStatus();
}

/* ---------- Aktionen ---------- */

function close(notify) {
  if (!state.open) return;
  state.open = false;
  el.dim.hidden = true;
  el.ring.hidden = true;
  el.panel.hidden = true;
  el.keys.hidden = true;
  if (notify) Bridge.send('menu_close', {});
}

function setError(code) {
  state.error = code ? (TEXT.errors[code] || TEXT.errorFallback) : '';
  renderStatus();
}

function selectTab(index, enter) {
  if (!isInteract() || state.tabs.length === 0) return;
  const next = (index + state.tabs.length) % state.tabs.length;
  if (next !== state.tabIndex) {
    state.tabIndex = next;
    state.stack = [];
    state.choosing = null;
    state.cursor = 0;
  }
  state.level = enter ? 'list' : 'ring';
  setError('');
  renderRing();
  renderList();
  if (enter) el.list.focus();
}

// Eine Ebene zurueck: Personenwahl, Unterkategorie, Liste, dann schliessen
function back() {
  setError('');
  if (state.choosing) {
    state.choosing = null;
  } else if (state.stack.length > 0) {
    state.stack.pop();
  } else if (isInteract() && state.level === 'list') {
    state.level = 'ring';
  } else {
    close(true);
    return;
  }
  state.cursor = 0;
  renderList();
}

async function choose(index) {
  const node = currentItems()[index];
  if (!node || state.busy) return;
  state.level = 'list';
  state.cursor = index;
  if (node.locked) {
    renderCursor();
    setError('locked');
    return;
  }
  if (node.children) {
    state.stack.push(node);
    state.cursor = 0;
    setError('');
    renderList();
    el.list.focus();
    return;
  }
  if (!isSelectable(node)) return;

  const payload = state.choosing ? { id: state.choosing.id, player: node.player } : { id: node.id };
  state.busy = true;
  setError('');
  renderCursor();
  const result = await Bridge.send('menu_select', payload);
  state.busy = false;
  if (!state.open) return;
  if (!result || !result.ok) {
    setError(result?.error || 'client_error');
    return;
  }
  if (result.data?.choose) {
    state.choosing = { id: node.id, label: node.label };
    state.cursor = 0;
    renderList();
    return;
  }
  if (result.data?.close) {
    close(false);
    return;
  }
  state.choosing = null;
  renderStatus();
}

function moveCursor(step) {
  const count = currentItems().length;
  if (count === 0) return;
  state.cursor = (state.cursor + step + count) % count;
  renderCursor();
}

/* ---------- Daten aus Lua ---------- */

function readPayload(data) {
  state.mode = data.mode === 'context' ? 'context' : 'interact';
  state.title = typeof data.title === 'string' ? data.title : '';
  state.subtitle = typeof data.subtitle === 'string' ? data.subtitle : '';
  state.tabs = Array.isArray(data.tabs) ? data.tabs : [];
  state.items = Array.isArray(data.items) ? data.items : [];
  state.players = Array.isArray(data.players) ? data.players : [];
}

// Nach einem Neuaufbau dieselbe Stelle wiederfinden (gleiche IDs)
function restorePath(tabId, stackIds) {
  if (isInteract()) {
    const index = state.tabs.findIndex((tab) => tab.id === tabId);
    state.tabIndex = index >= 0 ? index : 0;
  }
  state.stack = [];
  let nodes = rootItems();
  for (const id of stackIds) {
    const node = nodes.find((entry) => entry.id === id && entry.children);
    if (!node) break;
    state.stack.push(node);
    nodes = node.children;
  }
}

Bridge.on('menu_open', (data) => {
  readPayload(data);
  state.tabIndex = 0;
  state.stack = [];
  state.choosing = null;
  state.cursor = 0;
  state.level = isInteract() ? 'ring' : 'list';
  state.busy = false;
  state.error = '';
  state.open = true;
  render();
  if (isInteract()) el.ring.querySelector('.orb[aria-pressed="true"]')?.focus();
  else el.list.focus();
});

Bridge.on('menu_update', (data) => {
  if (!state.open) return;
  const tabId = currentTab()?.id;
  const stackIds = state.stack.map((node) => node.id);
  const cursor = state.cursor;
  readPayload(data);
  restorePath(tabId, stackIds);
  state.cursor = cursor;
  renderRing();
  renderList();
});

Bridge.on('menu_close', () => close(false));

/* ---------- Eingabe ---------- */

document.addEventListener('click', (e) => {
  if (!state.open) return;
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (action === 'tab') selectTab(Number(target.dataset.index), true);
  if (action === 'back') back();
  if (action === 'select') choose(Number(target.dataset.index));
});

// Rechte Maustaste: zurueck, auf oberster Ebene schliessen
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (state.open && !state.busy) back();
});

el.list.addEventListener('mousemove', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const index = Number(row.dataset.index);
  if (index !== state.cursor || state.level !== 'list') {
    state.level = 'list';
    state.cursor = index;
    renderCursor();
  }
});

document.addEventListener('keydown', (e) => {
  if (!state.open) return;
  const key = e.key;
  if (/^[1-9]$/.test(key)) {
    e.preventDefault();
    const index = Number(key) - 1;
    if (isInteract() && state.level === 'ring') {
      if (index < state.tabs.length) selectTab(index, true);
    } else {
      choose(index);
    }
    return;
  }
  if (key.toLowerCase() === CLOSE_KEY && isInteract()) {
    e.preventDefault();
    close(true);
    return;
  }
  if (isInteract() && state.level === 'ring') {
    switch (key) {
      case 'ArrowDown':
      case 'ArrowLeft':
      case 'Tab':
        e.preventDefault();
        selectTab(state.tabIndex + (key === 'ArrowLeft' || (key === 'Tab' && e.shiftKey) ? -1 : 1), false);
        el.ring.querySelector('.orb[aria-pressed="true"]')?.focus();
        break;
      case 'ArrowUp':
        e.preventDefault();
        selectTab(state.tabIndex - 1, false);
        el.ring.querySelector('.orb[aria-pressed="true"]')?.focus();
        break;
      case 'ArrowRight':
      case 'Enter':
      case ' ':
        e.preventDefault();
        selectTab(state.tabIndex, true);
        break;
      case 'Escape':
      case 'Backspace':
        e.preventDefault();
        close(true);
        break;
      default:
    }
    return;
  }
  switch (key) {
    case 'ArrowDown': e.preventDefault(); moveCursor(1); break;
    case 'ArrowUp': e.preventDefault(); moveCursor(-1); break;
    case 'ArrowRight':
    case 'Enter':
    case ' ':
      e.preventDefault(); choose(state.cursor); break;
    case 'Escape':
      // Esc verlaesst das Menue, wie unten links angezeigt
      e.preventDefault(); close(true); break;
    case 'ArrowLeft':
    case 'Backspace':
      e.preventDefault(); back(); break;
    default:
  }
});
