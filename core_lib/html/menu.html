<!DOCTYPE html>
<!--
  UI: Menue (G-Menue und Kontextmenues der core_lib)
  CONTRACT_VERSION: 1
  Links angedockt, mit Maus, Pfeiltasten, Zahlen 1 bis 9 und Suche bedienbar.
  Im G-Menue sind die obersten Kategorien Reiter, alles darunter sind Unterkategorien (Organisation > Leader > Entlassen).

  EINGEHEND (Lua -> UI)
  menu_open {
    mode: "interact" | "context",
    title: string,
    subtitle?: string,                  // z. B. "Nächste Person: ID 17 · 1,2 m"
    tabs?: Tab[],                       // nur interact
    items?: Node[],                     // nur context
    players?: { serverId: number, label: string }[]   // fuer "Wen meinst du?"
  }
  menu_update  wie menu_open, die UI bleibt an derselben Stelle (Reiter, Unterkategorie, Auswahl)
  menu_close   {}

  Tab  { id: string, label: string, icon?: string, items: Node[] }
  Node {
    id: string, label: string, description?: string, icon?: string,
    badge?: string,                     // kurzer Zustand rechts, z. B. "an", "offen"
    title?: string, children?: Node[],  // Unterkategorie
    target?: "player",                  // braucht eine Person
    disabled?: boolean, readOnly?: boolean,
    progress?: number,                  // 0 bis 100
    metadata?: { label: string, value: string }[]
  }

  AUSGEHEND (UI -> Lua), Antwort immer { ok, data?, error? }
  ui_ready     { ui: "menu", version: 1 }        -> data.colors { base, ink, accent, signal }
  menu_select  { id: string, player?: number }   -> data { choose?: true, close?: boolean }
  menu_close   {}
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interaktion</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Command. Dichte 7, Bewegung 1, Varianz 2.
  Angedockt links ueber der Minimap, die Bildmitte bleibt frei. Keine Animation beim Oeffnen, das Menue kommt oft.
  Highlight: Ziel-Chip mit der naechsten Person. Signatur: Keycaps 1 bis 9 vor den Zeilen.
*/
:root {
  --rgb-base:   14 15 18;
  --rgb-ink:    232 234 237;
  --rgb-accent: 214 164 72;
  --rgb-signal: 220 82 72;

  --c-bg:          rgb(var(--rgb-base) / 0.94);
  --c-surface:     rgb(var(--rgb-ink) / 0.05);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.10);
  --c-border:      rgb(var(--rgb-ink) / 0.08);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-2:      rgb(var(--rgb-ink) / 0.72);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.14);
  --c-accent-line: rgb(var(--rgb-accent) / 0.45);
  --c-signal:      rgb(var(--rgb-signal));
  --c-on-accent:   rgb(var(--rgb-base));
  --edge-light:    inset 0 1px 0 rgb(var(--rgb-ink) / 0.10);
  --shadow:        0 8px 24px rgb(var(--rgb-base) / 0.5);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px;
  --radius-xs: 4px; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-sm: clamp(12px, 0.65vw, 14px);
  --fs-md: clamp(14px, 0.75vw, 16px);
  --fs-lg: clamp(17px, 0.95vw, 20px);

  --row-h: 44px;
  --tab-h: 36px;
  --input-h: 36px;
  --keycap: 22px;
  --icon: 18px;
  --bar-h: 4px;

  --panel-left: clamp(16px, 2vw, 40px);
  --panel-top: clamp(80px, 16vh, 220px);
  --panel-w: clamp(320px, 22vw, 440px);
  --panel-max-h: min(60dvh, 760px);

  --dur-fast: 120ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --z-panel: 10;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; }

.panel {
  position: fixed;
  left: var(--panel-left);
  top: var(--panel-top);
  z-index: var(--z-panel);
  width: var(--panel-w);
  max-height: var(--panel-max-h);
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.panel[hidden] { display: none; }

/* Kopf */
.head {
  padding: var(--space-4) var(--space-4) var(--space-3);
  display: grid;
  gap: var(--space-2);
}
.title {
  margin: 0;
  font-size: var(--fs-lg);
  font-weight: 600;
  text-wrap: balance;
}
.target {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  justify-self: start;
  max-width: 100%;
  padding: var(--space-1) var(--space-2);
  border-radius: var(--radius-sm);
  background: var(--c-accent-soft);
  color: var(--c-accent);
  font-size: var(--fs-sm);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.target[hidden] { display: none; }
.target svg { flex: none; width: 14px; height: 14px; }

/* Reiter */
.tabs {
  display: flex;
  gap: var(--space-1);
  padding: 0 var(--space-3);
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--c-border);
}
.tabs::-webkit-scrollbar { display: none; }
.tabs[hidden] { display: none; }
.tab {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  height: var(--tab-h);
  padding: 0 var(--space-3);
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--c-text-muted);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.tab:hover { color: var(--c-text-2); }
.tab[aria-selected="true"] { color: var(--c-text); border-bottom-color: var(--c-accent); }
.tab:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: -2px; border-radius: var(--radius-sm); }
.tab svg { width: 16px; height: 16px; }

/* Pfad und Suche */
.bar {
  display: grid;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3) var(--space-2);
}
.crumb {
  display: flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
}
.crumb[hidden] { display: none; }
.back {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: var(--c-surface);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.back:hover { background: var(--c-surface-hi); }
.back:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: 2px; }
.back svg { width: 16px; height: 16px; }
.path {
  min-width: 0;
  font-size: var(--fs-sm);
  color: var(--c-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.path strong { color: var(--c-text); font-weight: 600; }

.search {
  position: relative;
}
.search svg {
  position: absolute;
  left: var(--space-3);
  top: 50%;
  width: 16px;
  height: 16px;
  transform: translateY(-50%);
  color: var(--c-text-muted);
  pointer-events: none;
}
.search input {
  width: 100%;
  height: var(--input-h);
  padding: 0 var(--space-3) 0 36px;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-surface);
  color: var(--c-text);
  font: inherit;
  font-size: var(--fs-sm);
}
.search input::placeholder { color: var(--c-text-muted); }
.search input:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: 0; }

/* Liste */
.list {
  flex: 1 1 auto;
  min-height: 0;
  margin: 0;
  padding: 0 var(--space-2) var(--space-2);
  list-style: none;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--c-surface-hi) transparent;
}
.list:focus-visible { outline: none; }
.list li + li { margin-top: 2px; }

.row {
  width: 100%;
  min-height: var(--row-h);
  display: grid;
  grid-template-columns: var(--keycap) var(--icon) minmax(0, 1fr) auto;
  align-items: center;
  column-gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 0;
  border-radius: var(--radius-md);
  background: none;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.row.is-active { background: var(--c-surface-hi); box-shadow: var(--edge-light); }
.row:active { transform: scale(0.99); }
.row[aria-disabled="true"] { cursor: default; color: var(--c-text-muted); }
.row[aria-disabled="true"]:active { transform: none; }

.key {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--keycap);
  height: var(--keycap);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-xs);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.key:empty { border-color: transparent; }
.row.is-active .key:not(:empty) { background: var(--c-accent); border-color: var(--c-accent); color: var(--c-on-accent); }

.icon { width: var(--icon); height: var(--icon); color: var(--c-text-2); }
.row.is-active .icon { color: var(--c-text); }

.text { min-width: 0; display: grid; gap: 2px; }
.label {
  font-size: var(--fs-md);
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.desc {
  font-size: var(--fs-xs);
  color: var(--c-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.meter {
  height: var(--bar-h);
  margin-top: var(--space-1);
  border-radius: var(--radius-xs);
  background: var(--c-surface-hi);
  overflow: hidden;
}
.meter span { display: block; height: 100%; background: var(--c-text-2); border-radius: var(--radius-xs); }

.side {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.side svg { width: 16px; height: 16px; color: var(--c-text-muted); }

.empty {
  padding: var(--space-5) var(--space-4);
  color: var(--c-text-muted);
  font-size: var(--fs-sm);
  text-align: center;
}

/* Details der aktiven Zeile (Kontextmenues mit metadata) */
.details {
  margin: 0;
  padding: var(--space-3) var(--space-4);
  border-top: 1px solid var(--c-border);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  gap: var(--space-1) var(--space-4);
  font-size: var(--fs-xs);
}
.details[hidden] { display: none; }
.details dt { color: var(--c-text-muted); }
.details dd { margin: 0; color: var(--c-text); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }

/* Fuss */
.foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-3);
  padding: var(--space-2) var(--space-4) var(--space-3);
  border-top: 1px solid var(--c-border);
  color: var(--c-text-muted);
  font-size: var(--fs-xs);
}
.foot .k {
  display: inline-flex;
  align-items: center;
  min-width: 20px;
  height: 20px;
  padding: 0 var(--space-1);
  justify-content: center;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-xs);
  color: var(--c-text-2);
  font-family: inherit;
  font-weight: 600;
}
.foot span { display: inline-flex; align-items: center; gap: var(--space-1); }
.status {
  padding: 0 var(--space-4) var(--space-3);
  color: var(--c-signal);
  font-size: var(--fs-sm);
}
.status:empty { display: none; }

.panel[aria-busy="true"] .list { opacity: 0.6; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>

<section class="panel" id="panel" role="dialog" aria-labelledby="title" hidden>
  <header class="head">
    <h1 class="title" id="title">Interaktion</h1>
    <p class="target" id="target" hidden></p>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Kategorien" hidden></nav>
  <div class="bar">
    <div class="crumb" id="crumb" hidden>
      <button class="back" type="button" data-action="back" aria-label="Zurück"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
      <span class="path" id="path"></span>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false" aria-label="Suchen">
    </label>
  </div>
  <ul class="list" id="list" role="menu" tabindex="0" aria-labelledby="title"></ul>
  <dl class="details" id="details" hidden></dl>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <footer class="foot" id="foot"></footer>
</section>

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const Mock = {
  delay: 120,
  responses: {
    menu_select: (data) => {
      if (data.id === 'e:person_search' && data.player === undefined) return { ok: true, data: { choose: true } };
      if (data.id === 'e:vehicle_engine') return { ok: true, data: { close: false } };
      return { ok: true, data: { close: true } };
    },
  },
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    console.info(`[mock] ${event}`, data);
    const fn = this.responses[event];
    return fn ? fn(data) : { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  search: 'Suchen',
  searchHint: 'In dieser Kategorie suchen',
  back: 'Zurück',
  choose: 'Wen meinst du?',
  noResults: (query) => `Nichts gefunden für „${query}“`,
  noItems: 'Hier gibt es gerade nichts zu tun.',
  pathSeparator: ' › ',
  keys: { move: 'wählen', tabs: 'Kategorie', enter: 'ausführen', back: 'zurück', search: 'suchen', close: 'schließen' },
  errors: {
    not_found: 'Das geht gerade nicht mehr. Menü neu öffnen.',
    player_gone: 'Die Person ist nicht mehr in der Nähe.',
    not_open: 'Das Menü ist schon zu.',
    bridge_error: 'Keine Verbindung zum Spiel.',
    client_error: 'Das hat nicht geklappt.',
  },
  errorFallback: 'Das hat nicht geklappt.',
};

const MAX_HOTKEYS = 9;
const CLOSE_KEY = 'g';
const SEARCH_KEY = '/';
const PLAYER_PREFIX = 'p:';

const state = {
  open: false,
  mode: 'interact',
  title: '',
  subtitle: '',
  tabs: [],
  items: [],
  players: [],
  tabIndex: 0,
  stack: [],          // geoeffnete Unterkategorien (Knoten)
  choosing: null,     // { id, label } wenn "Wen meinst du?" gefragt wird
  query: '',
  cursor: 0,
  busy: false,
  error: '',
};

const el = {
  panel: document.getElementById('panel'),
  title: document.getElementById('title'),
  target: document.getElementById('target'),
  tabs: document.getElementById('tabs'),
  crumb: document.getElementById('crumb'),
  path: document.getElementById('path'),
  search: document.getElementById('search'),
  list: document.getElementById('list'),
  details: document.getElementById('details'),
  status: document.getElementById('status'),
  foot: document.getElementById('foot'),
};
el.search.placeholder = TEXT.searchHint;

function svgIcon(name, className) {
  if (!name || !document.getElementById(`i-${name}`)) return null;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  if (className) svg.setAttribute('class', className);
  const use = document.createElementNS(ns, 'use');
  use.setAttribute('href', `#i-${name}`);
  svg.appendChild(use);
  return svg;
}

function applyColors(colors) {
  if (!colors) return;
  const root = document.documentElement.style;
  ['base', 'ink', 'accent', 'signal'].forEach((key) => {
    if (typeof colors[key] === 'string') root.setProperty(`--rgb-${key}`, colors[key]);
  });
}

/* ---------- Was gerade angezeigt wird ---------- */

function rootItems() {
  if (state.mode === 'interact') return state.tabs[state.tabIndex]?.items || [];
  return state.items;
}

function currentItems() {
  if (state.choosing) {
    return state.players.map((player) => ({ id: PLAYER_PREFIX + player.serverId, label: player.label, icon: 'user', player: player.serverId }));
  }
  if (state.query) return searchResults();
  const top = state.stack[state.stack.length - 1];
  return top ? top.children || [] : rootItems();
}

// Alle ausfuehrbaren Eintraege unter der aktuellen Ebene, mit Pfad als Beschreibung
function searchResults() {
  const query = state.query.toLocaleLowerCase('de-DE');
  const base = state.stack[state.stack.length - 1];
  const start = base ? base.children || [] : rootItems();
  const results = [];
  const walk = (nodes, path) => {
    nodes.forEach((node) => {
      if (node.children) {
        walk(node.children, [...path, node.label]);
        return;
      }
      const haystack = `${node.label} ${node.description || ''} ${path.join(' ')}`.toLocaleLowerCase('de-DE');
      if (haystack.includes(query)) {
        results.push({ ...node, description: path.length ? path.join(TEXT.pathSeparator) : node.description });
      }
    });
  };
  walk(start, []);
  return results;
}

function isSelectable(node) {
  return node && !node.disabled && !node.readOnly;
}

/* ---------- Rendern ---------- */

function renderHead() {
  el.title.textContent = state.title;
  el.target.hidden = !state.subtitle;
  if (state.subtitle) {
    el.target.replaceChildren();
    const icon = svgIcon('user');
    if (icon) el.target.appendChild(icon);
    el.target.appendChild(document.createTextNode(state.subtitle));
  }
}

function renderTabs() {
  const show = state.mode === 'interact' && state.tabs.length > 0;
  el.tabs.hidden = !show;
  if (!show) return;
  const fragment = document.createDocumentFragment();
  state.tabs.forEach((tab, index) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'tab';
    button.setAttribute('role', 'tab');
    button.setAttribute('aria-selected', String(index === state.tabIndex));
    button.dataset.action = 'tab';
    button.dataset.index = String(index);
    const icon = svgIcon(tab.icon);
    if (icon) button.appendChild(icon);
    button.appendChild(document.createTextNode(tab.label));
    fragment.appendChild(button);
  });
  el.tabs.replaceChildren(fragment);
}

function renderCrumb() {
  const labels = state.stack.map((node) => node.title || node.label);
  if (state.choosing) labels.push(state.choosing.label);
  const show = labels.length > 0;
  el.crumb.hidden = !show;
  if (!show) return;
  const root = state.mode === 'interact' ? state.tabs[state.tabIndex]?.label : state.title;
  el.path.replaceChildren();
  el.path.appendChild(document.createTextNode([root, ...labels.slice(0, -1)].filter(Boolean).join(TEXT.pathSeparator) + TEXT.pathSeparator));
  const strong = document.createElement('strong');
  strong.textContent = state.choosing ? TEXT.choose : labels[labels.length - 1];
  el.path.appendChild(strong);
}

function rowFor(node, index) {
  const li = document.createElement('li');
  li.setAttribute('role', 'none');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'row';
  button.id = `row-${index}`;
  button.tabIndex = -1;
  button.setAttribute('role', 'menuitem');
  button.dataset.action = 'select';
  button.dataset.index = String(index);
  if (!isSelectable(node) && !node.children) button.setAttribute('aria-disabled', 'true');
  if (node.children) button.setAttribute('aria-haspopup', 'menu');

  const key = document.createElement('span');
  key.className = 'key';
  key.setAttribute('aria-hidden', 'true');
  if (index < MAX_HOTKEYS) key.textContent = String(index + 1);
  button.appendChild(key);

  const icon = svgIcon(node.icon, 'icon') || document.createElement('span');
  button.appendChild(icon);

  const text = document.createElement('span');
  text.className = 'text';
  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = node.label;
  text.appendChild(label);
  if (node.description) {
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = node.description;
    text.appendChild(desc);
  }
  if (typeof node.progress === 'number') {
    const meter = document.createElement('span');
    meter.className = 'meter';
    meter.setAttribute('role', 'progressbar');
    meter.setAttribute('aria-valuemin', '0');
    meter.setAttribute('aria-valuemax', '100');
    meter.setAttribute('aria-valuenow', String(Math.round(node.progress)));
    const fill = document.createElement('span');
    fill.style.width = `${Math.max(0, Math.min(100, node.progress))}%`;
    meter.appendChild(fill);
    text.appendChild(meter);
  }
  button.appendChild(text);

  const side = document.createElement('span');
  side.className = 'side';
  if (node.badge) side.appendChild(document.createTextNode(node.badge));
  if (node.children) {
    const chevron = svgIcon('chevron-right');
    if (chevron) side.appendChild(chevron);
  }
  button.appendChild(side);
  li.appendChild(button);
  return li;
}

function renderList() {
  const items = currentItems();
  if (state.cursor >= items.length) state.cursor = Math.max(0, items.length - 1);
  const fragment = document.createDocumentFragment();
  items.forEach((node, index) => fragment.appendChild(rowFor(node, index)));
  if (items.length === 0) {
    const li = document.createElement('li');
    li.className = 'empty';
    li.textContent = state.query ? TEXT.noResults(state.query) : TEXT.noItems;
    fragment.appendChild(li);
  }
  el.list.replaceChildren(fragment);
  renderCursor();
}

function renderCursor() {
  const items = currentItems();
  el.list.querySelectorAll('.row.is-active').forEach((row) => row.classList.remove('is-active'));
  const row = document.getElementById(`row-${state.cursor}`);
  if (row) {
    row.classList.add('is-active');
    el.list.setAttribute('aria-activedescendant', row.id);
    row.scrollIntoView({ block: 'nearest' });
  } else {
    el.list.removeAttribute('aria-activedescendant');
  }
  renderDetails(items[state.cursor]);
}

function renderDetails(node) {
  const list = node && Array.isArray(node.metadata) ? node.metadata : [];
  el.details.hidden = list.length === 0;
  if (list.length === 0) return;
  const fragment = document.createDocumentFragment();
  list.forEach((entry) => {
    const dt = document.createElement('dt');
    dt.textContent = entry.label;
    const dd = document.createElement('dd');
    dd.textContent = entry.value;
    fragment.append(dt, dd);
  });
  el.details.replaceChildren(fragment);
}

function renderFoot() {
  const parts = [
    ['↑↓', TEXT.keys.move],
    ...(state.mode === 'interact' && state.tabs.length > 1 ? [['←→', TEXT.keys.tabs]] : []),
    ['Enter', TEXT.keys.enter],
    ['Esc', TEXT.keys.back],
  ];
  if (state.mode === 'interact') parts.push([CLOSE_KEY.toUpperCase(), TEXT.keys.close]);
  const fragment = document.createDocumentFragment();
  parts.forEach(([key, label]) => {
    const span = document.createElement('span');
    const k = document.createElement('kbd');
    k.className = 'k';
    k.textContent = key;
    span.append(k, document.createTextNode(label));
    fragment.appendChild(span);
  });
  el.foot.replaceChildren(fragment);
}

function renderStatus() {
  if (el.status.textContent !== state.error) el.status.textContent = state.error;
  el.panel.setAttribute('aria-busy', String(state.busy));
}

function render() {
  renderHead();
  renderTabs();
  renderCrumb();
  renderList();
  renderFoot();
  renderStatus();
}

/* ---------- Aktionen ---------- */

function close(notify) {
  if (!state.open) return;
  state.open = false;
  el.panel.hidden = true;
  if (notify) Bridge.send('menu_close', {});
}

function setError(code) {
  state.error = code ? (TEXT.errors[code] || TEXT.errorFallback) : '';
  renderStatus();
}

function resetNavigation() {
  state.stack = [];
  state.choosing = null;
  state.query = '';
  el.search.value = '';
  state.cursor = 0;
}

function switchTab(index) {
  if (state.mode !== 'interact' || state.tabs.length === 0) return;
  state.tabIndex = (index + state.tabs.length) % state.tabs.length;
  resetNavigation();
  setError('');
  render();
}

function back() {
  setError('');
  if (state.choosing) {
    state.choosing = null;
  } else if (state.query) {
    state.query = '';
    el.search.value = '';
  } else if (state.stack.length > 0) {
    state.stack.pop();
  } else {
    close(true);
    return;
  }
  state.cursor = 0;
  render();
}

async function choose(index) {
  const items = currentItems();
  const node = items[index];
  if (!node || state.busy) return;
  state.cursor = index;
  if (node.children) {
    state.stack.push(node);
    state.query = '';
    el.search.value = '';
    state.cursor = 0;
    setError('');
    render();
    el.list.focus();
    return;
  }
  if (!isSelectable(node)) return;

  const payload = state.choosing ? { id: state.choosing.id, player: node.player } : { id: node.id };
  state.busy = true;
  setError('');
  renderStatus();
  const result = await Bridge.send('menu_select', payload);
  state.busy = false;
  if (!state.open) return;
  if (!result || !result.ok) {
    setError(result?.error || 'client_error');
    return;
  }
  if (result.data?.choose) {
    state.choosing = { id: node.id, label: node.label };
    state.cursor = 0;
    render();
    return;
  }
  if (result.data?.close) {
    close(false);
    return;
  }
  state.choosing = null;
  renderStatus();
}

function isTopLevel() {
  return state.mode === 'interact' && state.stack.length === 0 && !state.choosing && !state.query;
}

function moveCursor(step) {
  const count = currentItems().length;
  if (count === 0) return;
  state.cursor = (state.cursor + step + count) % count;
  renderCursor();
}

/* ---------- Daten aus Lua ---------- */

function readPayload(data) {
  state.mode = data.mode === 'context' ? 'context' : 'interact';
  state.title = typeof data.title === 'string' ? data.title : '';
  state.subtitle = typeof data.subtitle === 'string' ? data.subtitle : '';
  state.tabs = Array.isArray(data.tabs) ? data.tabs : [];
  state.items = Array.isArray(data.items) ? data.items : [];
  state.players = Array.isArray(data.players) ? data.players : [];
}

// Nach einem Neuaufbau dieselbe Stelle wiederfinden (gleiche IDs)
function restorePath(tabId, stackIds) {
  if (state.mode === 'interact') {
    const index = state.tabs.findIndex((tab) => tab.id === tabId);
    state.tabIndex = index >= 0 ? index : 0;
  }
  state.stack = [];
  let nodes = rootItems();
  for (const id of stackIds) {
    const node = nodes.find((entry) => entry.id === id && entry.children);
    if (!node) break;
    state.stack.push(node);
    nodes = node.children;
  }
}

Bridge.on('menu_open', (data) => {
  readPayload(data);
  state.tabIndex = 0;
  resetNavigation();
  state.busy = false;
  state.error = '';
  state.open = true;
  el.panel.hidden = false;
  render();
  el.list.focus();
});

Bridge.on('menu_update', (data) => {
  if (!state.open) return;
  const tabId = state.tabs[state.tabIndex]?.id;
  const stackIds = state.stack.map((node) => node.id);
  const cursor = state.cursor;
  readPayload(data);
  restorePath(tabId, stackIds);
  state.cursor = cursor;
  render();
});

Bridge.on('menu_close', () => close(false));

/* ---------- Eingabe ---------- */

el.panel.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target) return;
  const action = target.dataset.action;
  if (action === 'tab') switchTab(Number(target.dataset.index));
  if (action === 'back') back();
  if (action === 'select') choose(Number(target.dataset.index));
});

el.list.addEventListener('mousemove', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  const index = Number(row.dataset.index);
  if (index !== state.cursor) {
    state.cursor = index;
    renderCursor();
  }
});

el.search.addEventListener('input', () => {
  state.query = el.search.value.trim();
  state.choosing = null;
  state.cursor = 0;
  renderCrumb();
  renderList();
});

el.search.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    if (el.search.value) {
      el.search.value = '';
      state.query = '';
      renderList();
    }
    el.list.focus();
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    el.list.focus();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    choose(state.cursor);
  }
  e.stopPropagation();
});

document.addEventListener('keydown', (e) => {
  if (!state.open || e.target === el.search) return;
  const key = e.key;
  if (/^[1-9]$/.test(key)) {
    e.preventDefault();
    choose(Number(key) - 1);
    return;
  }
  switch (key) {
    case 'ArrowDown': e.preventDefault(); moveCursor(1); break;
    case 'ArrowUp': e.preventDefault(); moveCursor(-1); break;
    case 'Enter':
    case ' ':
      e.preventDefault(); choose(state.cursor); break;
    // Oberste Ebene: Pfeil links und rechts wechseln den Reiter. Darunter: rechts oeffnet, links geht zurueck.
    case 'ArrowRight': {
      e.preventDefault();
      if (isTopLevel()) { switchTab(state.tabIndex + 1); break; }
      const node = currentItems()[state.cursor];
      if (node && node.children) choose(state.cursor);
      break;
    }
    case 'ArrowLeft':
      e.preventDefault();
      if (isTopLevel()) switchTab(state.tabIndex - 1);
      else back();
      break;
    case 'Tab': e.preventDefault(); switchTab(state.tabIndex + (e.shiftKey ? -1 : 1)); break;
    case 'Escape':
    case 'Backspace':
      e.preventDefault(); back(); break;
    case SEARCH_KEY: e.preventDefault(); el.search.focus(); break;
    default:
      if (state.mode === 'interact' && key.toLowerCase() === CLOSE_KEY) {
        e.preventDefault();
        close(true);
      }
  }
});

/* ---------- Start ---------- */

(async () => {
  const result = await Bridge.send('ui_ready', { ui: 'menu', version: CONTRACT_VERSION });
  if (result?.ok) applyColors(result.data?.colors);

  if (Bridge.platform === 'mock') {
    Mock.push('menu_open', {
      mode: 'interact',
      title: 'Interaktion',
      subtitle: 'Nächste Person: ID 17 · 1,2 m',
      players: [
        { serverId: 4, label: 'ID 17 · 1,2 m' },
        { serverId: 9, label: 'ID 342 · 2,6 m' },
      ],
      tabs: [
        { id: 'g:Person', label: 'Person', icon: 'user', items: [
          { id: 'g:Person/Ausweis zeigen', label: 'Ausweis zeigen', title: 'Ausweis zeigen', icon: 'id-card', children: [
            { id: 'e:person_doc_id', label: 'Personalausweis', icon: 'id-card', target: 'player' },
            { id: 'e:person_doc_driver', label: 'Führerschein', icon: 'id-card', target: 'player' },
            { id: 'e:person_doc_weapon', label: 'Waffenschein', icon: 'id-card', target: 'player' },
          ] },
          { id: 'e:person_search', label: 'Durchsuchen', description: 'Geht nur, wenn die Person die Hände oben hat oder gefesselt ist.', icon: 'search', target: 'player' },
          { id: 'e:person_give_cash', label: 'Geld geben', description: 'Bargeld aus deinem Inventar übergeben.', icon: 'banknote', target: 'player' },
        ] },
        { id: 'g:Fahrzeug', label: 'Fahrzeug', icon: 'car', items: [
          { id: 'e:vehicle_engine', label: 'Motor', icon: 'power', badge: 'an' },
          { id: 'e:vehicle_lights', label: 'Licht', icon: 'light', badge: 'aus' },
          { id: 'g:Fahrzeug/Türen', label: 'Türen', title: 'Türen', icon: 'door', children: [
            { id: 'e:vehicle_door_front_left', label: 'Fahrertür', icon: 'door', badge: 'zu' },
            { id: 'e:vehicle_door_trunk', label: 'Kofferraum', icon: 'door', badge: 'offen' },
            { id: 'e:vehicle_doors_close', label: 'Alle schließen', icon: 'close' },
          ] },
          { id: 'g:Fahrzeug/Fenster', label: 'Fenster', title: 'Fenster', icon: 'window', children: [
            { id: 'e:vehicle_window_front_left', label: 'Fenster vorne links', icon: 'window', badge: 'oben' },
          ] },
        ] },
        { id: 'g:Organisation', label: 'Organisation', icon: 'building', items: [
          { id: 'g:Organisation/Leader', label: 'Leader', title: 'Leader', icon: 'crown', children: [
            { id: 'e:org_hire', label: 'Mitglied einstellen', icon: 'user-plus', target: 'player' },
            { id: 'e:org_promote', label: 'Befördern', icon: 'arrow-up', target: 'player' },
            { id: 'e:org_demote', label: 'Herabstufen', icon: 'arrow-down', target: 'player' },
            { id: 'e:org_fire', label: 'Entlassen', icon: 'user-minus', target: 'player' },
          ] },
          { id: 'e:org_duty', label: 'Dienst', icon: 'shield', badge: 'außer Dienst' },
        ] },
      ],
    });
  }
})();
</script>
