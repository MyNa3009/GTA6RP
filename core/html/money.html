<!DOCTYPE html>
<!--
  UI: Geldanzeige (HUD)
  CONTRACT_VERSION: 1
  Reine Anzeige oben rechts, ohne Maus- und Tastaturfokus.

  EINGEHEND (Server -> UI)
  money_open   {
    colors: { base: string, ink: string, accent: string, signal: string },  // RGB-Kanaele
    currency: string,        // ISO-Code, z. B. "USD"
    deltaVisibleMs: number,  // so lange bleibt "+500 $" stehen
    cash: number,
    bank: number
  }
  money_update { cash: number, bank: number, changed?: { account: "cash" | "bank", amount: number } }
  money_close  {}

  AUSGEHEND (UI -> Server)
  ui_ready     { ui: "money", version: 1 }
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geld</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Die 4 Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   14 15 18;
  --rgb-ink:    232 234 237;
  --rgb-accent: 214 164 72;
  --rgb-signal: 220 82 72;

  --c-bg:         rgb(var(--rgb-base) / 0.72);
  --c-border:     rgb(var(--rgb-ink) / 0.10);
  --c-text:       rgb(var(--rgb-ink) / 0.96);
  --c-text-muted: rgb(var(--rgb-ink) / 0.62);
  --c-accent:     rgb(var(--rgb-accent));
  --c-signal:     rgb(var(--rgb-signal));

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --radius-md: 10px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-md: clamp(15px, 0.85vw, 18px);

  --dur-fast: 120ms; --dur-base: 180ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-overlay: 10;

  --hud-top: clamp(16px, 3vh, 40px);
  --hud-right: clamp(16px, 2vw, 40px);
  --row-height: calc(var(--fs-md) * 1.35);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.hud {
  position: fixed;
  top: var(--hud-top);
  right: var(--hud-right);
  z-index: var(--z-overlay);
  display: flex;
  align-items: flex-start;
  gap: var(--space-2);
  pointer-events: none;
}
.hud[hidden] { display: none; }

/* Aenderungen stehen links neben der Box, damit die Box selbst kompakt bleibt */
.deltas, .panel {
  display: grid;
  row-gap: var(--space-1);
  padding-block: var(--space-2);
}

/* Gleicher Abstand wie die Box inklusive Rand, damit die Zeilen genau nebeneinander liegen */
.deltas { padding-block: calc(var(--space-2) + 1px); }

.panel {
  margin: 0;
  grid-template-columns: auto auto;
  align-items: center;
  column-gap: var(--space-3);
  padding-inline: var(--space-3);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
}

/* dl mit Zeilen als Gruppen: Bezeichnung | Betrag */
.line { display: contents; }

.label {
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--c-text-muted);
  text-align: right;
}

.value {
  margin: 0;
  height: var(--row-height);
  line-height: var(--row-height);
  font-size: var(--fs-md);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}

.delta {
  height: var(--row-height);
  line-height: var(--row-height);
  padding-inline: var(--space-2);
  border-radius: var(--radius-md);
  background: var(--c-bg);
  font-size: var(--fs-xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
  opacity: 0;
  transform: translateX(4px);
  transition: opacity var(--dur-base) var(--ease-out), transform var(--dur-base) var(--ease-out);
}
.delta[data-visible="true"] { opacity: 1; transform: translateX(0); }
.delta[data-tone="plus"]  { color: var(--c-accent); }
.delta[data-tone="minus"] { color: var(--c-signal); }

@media (prefers-reduced-motion: reduce) {
  .delta { transition: none; }
}
</style>
</head>
<body>

<div class="hud" id="hud" hidden>
  <div class="deltas" aria-live="polite">
    <span class="delta" id="delta-cash"></span>
    <span class="delta" id="delta-bank"></span>
  </div>
  <dl class="panel" aria-label="Kontostand">
    <div class="line">
      <dt class="label" id="label-cash"></dt>
      <dd class="value" id="value-cash"></dd>
    </div>
    <div class="line">
      <dt class="label" id="label-bank"></dt>
      <dd class="value" id="value-bank"></dd>
    </div>
  </dl>
</div>

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const Mock = {
  delay: 50,
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    console.info(`[mock] ${event}`, data);
    return { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  cash: 'Bargeld',
  bank: 'Bank',
};

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const ACCOUNTS = ['cash', 'bank'];
const DEFAULT_CURRENCY = 'USD';
const DEFAULT_DELTA_MS = 3000;

const state = {
  open: false,
  deltaVisibleMs: DEFAULT_DELTA_MS,
  balances: { cash: 0, bank: 0 },
};

const el = {
  hud: document.getElementById('hud'),
  value: { cash: document.getElementById('value-cash'), bank: document.getElementById('value-bank') },
  delta: { cash: document.getElementById('delta-cash'), bank: document.getElementById('delta-bank') },
};

const deltaTimers = { cash: null, bank: null };
let moneyFormat = createMoneyFormat(DEFAULT_CURRENCY);
let signedFormat = createMoneyFormat(DEFAULT_CURRENCY, true);

function createMoneyFormat(currency, signed = false) {
  const options = { style: 'currency', currency, maximumFractionDigits: 0 };
  if (signed) options.signDisplay = 'always';
  try {
    return new Intl.NumberFormat('de-DE', options);
  } catch (err) {
    console.warn(`[money] Unbekannte Waehrung ${currency}, nutze ${DEFAULT_CURRENCY}`);
    return new Intl.NumberFormat('de-DE', { ...options, currency: DEFAULT_CURRENCY });
  }
}

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function renderBalances() {
  ACCOUNTS.forEach((account) => {
    setText(el.value[account], moneyFormat.format(state.balances[account]));
  });
}

function hideDelta(account) {
  el.delta[account].dataset.visible = 'false';
}

function showDelta(account, amount) {
  const node = el.delta[account];
  if (!node || !Number.isFinite(amount) || amount === 0) return;
  node.dataset.tone = amount > 0 ? 'plus' : 'minus';
  setText(node, signedFormat.format(amount));
  node.dataset.visible = 'true';
  clearTimeout(deltaTimers[account]);
  deltaTimers[account] = setTimeout(() => hideDelta(account), state.deltaVisibleMs);
}

function readBalances(data) {
  ACCOUNTS.forEach((account) => {
    const value = Number(data[account]);
    if (Number.isFinite(value)) state.balances[account] = value;
  });
}

function stopTimers() {
  ACCOUNTS.forEach((account) => {
    clearTimeout(deltaTimers[account]);
    deltaTimers[account] = null;
    hideDelta(account);
  });
}

Bridge.on('money_open', (data) => {
  applyColors(data.colors);
  if (typeof data.currency === 'string') {
    moneyFormat = createMoneyFormat(data.currency);
    signedFormat = createMoneyFormat(data.currency, true);
  }
  state.deltaVisibleMs = Number(data.deltaVisibleMs) || DEFAULT_DELTA_MS;
  readBalances(data);
  state.open = true;
  el.hud.hidden = false;
  stopTimers();
  renderBalances();
});

Bridge.on('money_update', (data) => {
  if (!state.open) return;
  readBalances(data);
  renderBalances();
  if (data.changed && ACCOUNTS.includes(data.changed.account)) {
    showDelta(data.changed.account, Number(data.changed.amount));
  }
});

Bridge.on('money_close', () => {
  state.open = false;
  el.hud.hidden = true;
  stopTimers();
});

setText(document.getElementById('label-cash'), TEXT.cash);
setText(document.getElementById('label-bank'), TEXT.bank);
Bridge.send('ui_ready', { ui: 'money', version: CONTRACT_VERSION });

if (Bridge.platform === 'mock') {
  // Im Browser: Startwerte, danach eine Einnahme und eine Ausgabe
  Mock.push('money_open', {
    colors: { base: '14 15 18', ink: '232 234 237', accent: '214 164 72', signal: '220 82 72' },
    currency: 'USD', deltaVisibleMs: 3000, cash: 1240, bank: 18730,
  });
  setTimeout(() => Mock.push('money_update', { cash: 1740, bank: 18730, changed: { account: 'cash', amount: 500 } }), 800);
  setTimeout(() => Mock.push('money_update', { cash: 1740, bank: 16245, changed: { account: 'bank', amount: -2485 } }), 1400);
}
</script>
</body>
</html>
