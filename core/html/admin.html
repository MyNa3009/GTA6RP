  wrap.append(make('dt', null, label), dd);
  return wrap;
}

function renderOverview() {
  const { account, characters, identifiers } = state.profile;
  const online = onlineOf(state.profile);
  const deleted = characters.filter((c) => c.deletedAt).length;

  const focus = focusCharacter();
  const dl = make('dl', 'facts');
  if (focus) dl.append(factItem(TEXT.facts.id, String(focus.id), characterName(focus)));
  dl.append(
    factItem(TEXT.facts.login, String(account.id)),
    factItem(TEXT.facts.rank, account.rank),
    factItem(TEXT.facts.status, online ? TEXT.statusOnline(online) : TEXT.statusOffline),
    factItem(TEXT.facts.created, formatTime(account.createdAt)),
    factItem(TEXT.facts.lastLogin, formatTime(account.lastLogin)),
    factItem(TEXT.facts.characters, TEXT.charactersCount(characters.length - deleted, deleted)),
  );
  if (account.email) dl.append(factItem(TEXT.facts.email, account.email));
  const devices = state.profile.devices;
  if (devices && devices.known) dl.append(factItem(TEXT.facts.devices, String(devices.deviceCount)));
  ((devices && devices.ips) || []).forEach((entry) => {
    dl.append(factItem(TEXT.facts.ip, entry.ip, formatTime(entry.lastSeen)));
  });
  identifiers.forEach((identifier) => {
    dl.append(factItem(
      `${TEXT.facts.identifiers}: ${identifier.type}`,
      identifier.value || TEXT.identifierHidden,
      formatTime(identifier.lastSeen),
    ));
  });

  const keySection = renderAdminKey();
  const links = state.profile.links || [];
  if (links.length === 0 && !keySection) return dl;

  const wrap = make('div');
  wrap.append(dl);
  if (keySection) wrap.append(keySection);
  if (links.length === 0) return wrap;
  const section = make('section', 'links');
  section.append(make('h3', 'links__title', TEXT.linksTitle));
  links.forEach((link) => {
    const box = make('div', link.active ? 'warning' : 'warning warning--off');
    box.append(linkRow(link, true));
    section.append(box);
  });
  wrap.append(section);
  return wrap;
}

/* ---------- Akte: Admin-Key ---------- */

function adminKeyInfo() {
  const list = Array.isArray(state.profile && state.profile.adminKeys) ? state.profile.adminKeys : [];
  return list.find((info) => info.characterId === state.selectedCharacterId) || null;
}

function keyButton(text, action, className) {
  const button = make('button', className || 'btn', text);
  button.type = 'button';
  button.dataset.action = action;
  return button;
}

function renderAdminKey() {
  const info = adminKeyInfo();
  if (!info) return null;
  const t = TEXT.adminKey;
  const action = state.keyAction && state.keyAction.characterId === info.characterId ? state.keyAction : null;

  const section = make('section', 'links');
  section.setAttribute('aria-label', t.title);
  section.append(make('h3', 'links__title', t.title));

  if (action && action.key) {
    const reveal = make('div', 'key-reveal');
    reveal.append(make('span', 'key-reveal__value', action.key), keyButton(action.copied ? t.copied : t.copy, 'key-copy'));
    reveal.append(make('p', 'key-reveal__hint', t.reveal));
    const box = make('div');
    box.append(reveal);
    section.append(box);
    return section;
  }

  const box = make('div', info.exists ? 'warning warning--off' : 'warning');
  const row = make('div', 'warning__row');
  const text = make('div', 'warning__text');
  text.append(make('div', null, info.exists ? t.exists : t.missing));
  if (info.exists) text.append(make('div', 'warning__meta', t.meta(formatTime(info.createdAt), info.createdBy, formatTime(info.lastUsedAt))));
  if (info.locked) text.append(make('div', 'warning__meta', t.locked));
  if (!info.canManage && t.reasons[info.reason]) text.append(make('div', 'warning__meta', t.reasons[info.reason]));
  row.append(text);

  if (info.canManage) {
    const buttons = make('div', 'actions');
    if (action && action.confirm) {
      text.append(make('div', 'warning__meta', action.confirm === 'create' ? t.confirmCreate : t.confirmRemove));
      const confirm = keyButton(action.busy ? t.busy : t.confirm, 'key-confirm', action.confirm === 'delete' ? 'btn btn--danger' : 'btn btn--primary');
      confirm.disabled = action.busy;
      const cancel = keyButton(t.cancel, 'key-cancel');
      cancel.disabled = action.busy;
      buttons.append(cancel, confirm);
    } else if (info.exists) {
      buttons.append(keyButton(t.recreate, 'key-create'), keyButton(t.remove, 'key-delete', 'btn btn--danger'));
    } else {
      // Ohne Key gibt es nichts zu ersetzen, darum ohne Nachfrage
      const create = keyButton(action && action.busy ? t.busy : t.create, 'key-create', 'btn btn--primary');
      create.disabled = Boolean(action && action.busy);
      buttons.append(create);
    }
    row.append(buttons);
  }
  box.append(row);
  section.append(box);
  return section;
}

function updateKeyInfo(info) {
  if (!info || !state.profile) return;
  const list = Array.isArray(state.profile.adminKeys) ? state.profile.adminKeys : [];
  state.profile.adminKeys = list.map((entry) => (entry.characterId === info.characterId ? info : entry));
}

async function runKeyAction(kind) {
  const info = adminKeyInfo();
  if (!info || !info.canManage) return;
  const characterId = info.characterId;
  state.keyAction = { characterId, confirm: state.keyAction && state.keyAction.confirm, busy: true, copied: false };
  renderContent();
  const result = await Bridge.send(kind === 'create' ? 'admin_key_create' : 'admin_key_delete', { characterId });
  if (!state.keyAction || state.keyAction.characterId !== characterId) return;
  if (result && result.ok && result.data) {
    updateKeyInfo(result.data.info);
    state.keyAction = kind === 'create' ? { characterId, confirm: null, busy: false, key: result.data.key, copied: false } : null;
    state.message = { tone: 'success', text: kind === 'create' ? TEXT.adminKey.created : TEXT.adminKey.removed };
  } else {
    state.keyAction = null;
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  renderProfileHead();
  renderContent();
}

// In FiveM gibt es keine Zwischenablage-API, darum ueber ein unsichtbares Textfeld
function copyText(text) {
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly', '');
  area.style.position = 'fixed';
  area.style.opacity = '0';
  document.body.append(area);
  area.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  area.remove();
  return ok;
}

function table(headers, rows) {
  const tableNode = make('table', 'table');
  const thead = make('thead');
  const headRow = make('tr');
  headers.forEach(([label, className]) => {
    const th = make('th', className || null, label);
    th.scope = 'col';
    headRow.append(th);
  });
  thead.append(headRow);
  const tbody = make('tbody');
  tbody.append(...rows);
  tableNode.append(thead, tbody);
  return tableNode;
}

function cell(content, className) {
  const td = make('td', className || null);
  if (content instanceof Node) td.append(content);
  else td.textContent = content ?? '';
  return td;
}

function renderCharacters() {
  const { characters } = state.profile;
  if (characters.length === 0) return make('p', 'empty', TEXT.noCharacters);
  const online = onlineOf(state.profile);
  const c = TEXT.columns;

  const rows = characters.map((character) => {
    const tr = make('tr');
    const status = make('span');
    const ban = activeCharacterBans().find((b) => b.characterId === character.id);
    const jailed = activeJails().some((j) => j.characterId === character.id);
    if (character.deletedAt) status.append(make('span', 'tag tag--danger', TEXT.charDeleted(formatTime(character.deletedAt))));
    else if (ban) status.append(make('span', 'tag tag--danger', TEXT.charBanned(ban.expiresAt ? TEXT.punish.until(formatTime(ban.expiresAt)) : TEXT.punish.permanent.toLowerCase())));
    else if (online && online.characterId === character.id) status.append(make('span', 'tag tag--active', TEXT.charPlaying));
    else status.append(make('span', 'tag', TEXT.charActive));
    if (jailed) status.append(document.createTextNode(' '), make('span', 'tag tag--danger', TEXT.charJailed));

    let action;
    if (character.id === state.selectedCharacterId) action = make('span', 'muted', TEXT.focusCharacter);
    else {
      action = make('button', 'btn btn--small', TEXT.openCharacter);
      action.type = 'button';
      action.dataset.action = 'select';
      action.dataset.accountId = String(state.profile.account.id);
      action.dataset.characterId = String(character.id);
      action.disabled = state.busy !== null;
    }

    tr.append(
      cell(String(character.id), 'nowrap'),
      cell(`${character.firstname} ${character.lastname}`),
      cell(character.rank || ''),
      cell(formatDate(character.dateOfBirth), 'nowrap'),
      cell(TEXT.genders[character.gender] || character.gender),
      cell(TEXT.jobs[character.job] || character.job),
      cell(formatMoney(character.cash), 'num'),
      cell(formatMoney(character.bank), 'num'),
      cell(formatTime(character.lastPlayed), 'nowrap'),
      cell(status),
      cell(action, 'num'),
    );
    return tr;
  });
  return table([
    [c.id], [c.name], [c.rank], [c.dob], [c.gender], [c.job], [c.cash, 'num'], [c.bank, 'num'], [c.lastPlayed], [c.state], ['', 'num'],
  ], rows);
}

// Diese Felder werden oben als ganzer Satz angezeigt und nicht noch einmal einzeln
const HANDLED_KEYS = new Set([
  'victimName', 'killerAccountId', 'killerServerId', 'killerCharacterId', 'killerName', 'killerOnDuty',
  'weapon', 'weaponName', 'toCharacterId', 'toName', 'fromCharacterId', 'fromName',
  'interaction', 'label', 'relation', 'blocked',
]);

// Admins und andere Beteiligte sind im Log als Login gespeichert
function who(accountId, storedName) {
  const names = (state.logs && state.logs.names) || { accounts: {} };
  return TEXT.whoLogin(storedName || names.accounts[String(accountId)], accountId);
}

// Charaktere mit ihrer permanenten ID
function whoCharacter(characterId, storedName) {
  const names = (state.logs && state.logs.names) || { characters: {} };
  return TEXT.who(storedName || (names.characters || {})[String(characterId)], characterId);
}

function describeRole(entry) {
  const id = state.profile.account.id;
  if (entry.actorAccountId && entry.actorAccountId !== id && entry.accountId === id) return TEXT.byActor(who(entry.actorAccountId));
  if (entry.actorAccountId === id && entry.accountId && entry.accountId !== id) return TEXT.onTarget(who(entry.accountId));
  if (entry.targetAccountId && entry.targetAccountId !== id) return TEXT.withTarget(who(entry.targetAccountId));
  if (entry.targetAccountId === id && entry.accountId && entry.accountId !== id) return TEXT.withTarget(who(entry.accountId));
  return null;
}

// Feste Saetze fuer Tod und Geld: wer, von wem, an wen, womit
function specialDetails(entry, data) {
  const key = `${entry.category}.${entry.action}`;
  const id = state.profile.account.id;

  if (entry.category === 'twink') {
    const parts = [TEXT.twinkFromTo(whoCharacter(data.fromCharacterId, data.fromName), whoCharacter(data.toCharacterId, data.toName))];
    if (data.relation) parts.push(TEXT.twinkRelation[data.relation] || data.relation);
    if (data.blocked) parts.push(TEXT.twinkBlocked);
    return parts;
  }

  if (key === 'death.died') {
    const parts = [];
    const killer = data.killerAccountId || entry.actorAccountId;
    const killerText = data.killerCharacterId ? whoCharacter(data.killerCharacterId, data.killerName) : who(killer, data.killerName);
    if (entry.accountId === id) parts.push(killer ? TEXT.killedBy(killerText) : TEXT.noKiller);
    else parts.push(TEXT.victim(entry.characterId ? whoCharacter(entry.characterId, data.victimName) : who(entry.accountId, data.victimName)));
    if (data.killerOnDuty) parts.push(TEXT.killerOnDuty);
    if (data.weaponName) parts.push(TEXT.weapon(data.weaponName));
    else if (data.weapon) parts.push(TEXT.weapon(TEXT.unknownWeapon(data.weapon)));
    return parts;
  }
  if (key === 'money.transfer_in' && entry.targetAccountId) {
    return [TEXT.moneyFrom(data.fromCharacterId ? whoCharacter(data.fromCharacterId, data.fromName) : who(entry.targetAccountId, data.fromName))];
  }
  if (key === 'money.transfer_out' && entry.targetAccountId) {
    return [TEXT.moneyTo(data.toCharacterId ? whoCharacter(data.toCharacterId, data.toName) : who(entry.targetAccountId, data.toName))];
  }
  if ((key === 'money.add' || key === 'money.remove') && entry.actorAccountId && entry.actorAccountId !== entry.accountId) {
    return [TEXT.moneyByAdmin(who(entry.actorAccountId))];
  }
  return null;
}

function describeDetails(entry) {
  const parts = [];
  const data = parseData(entry.data) || {};
  // Eintraege anderer Charaktere derselben Person kennzeichnen
  if (entry.category !== 'twink' && entry.characterId && entry.accountId === state.profile.account.id && entry.characterId !== state.selectedCharacterId) {
    parts.push(TEXT.asCharacter(whoCharacter(entry.characterId)));
  }
  const special = specialDetails(entry, data);
  if (special) parts.push(...special);
  else {
    const role = describeRole(entry);
    if (role) parts.push(role);
  }
  if (entry.reason) parts.push(entry.reason);
  Object.entries(data).forEach(([key, value]) => {
    if (value === null || value === undefined || HANDLED_KEYS.has(key)) return;
    const label = TEXT.dataLabels[key] || key;
    parts.push(`${label}: ${formatValue(key, value)}`);
  });
  if (entry.resource && entry.resource !== 'core') parts.push(`Script: ${entry.resource}`);
  return parts.join(' · ');
}

function logRow(entry) {
  const key = `${entry.category}.${entry.action}`;
  const tr = make('tr');

  let amountText = '';
  let amountClass = 'num';
  if (Number.isFinite(entry.amount)) {
    const ownMoney = entry.accountId === state.profile.account.id;
    if (MINUS_ACTIONS.has(key) && ownMoney) { amountText = `-${formatMoney(entry.amount)}`; amountClass += ' minus'; }
    else if (PLUS_ACTIONS.has(key) && ownMoney) { amountText = `+${formatMoney(entry.amount)}`; amountClass += ' plus'; }
    else amountText = formatMoney(entry.amount);
  }
  const balance = Number.isFinite(entry.balanceAfter)
    ? `${formatMoney(entry.balanceBefore)} → ${formatMoney(entry.balanceAfter)}`
    : '';

  const isKiller = key === 'death.died' && entry.accountId !== state.profile.account.id;
  const actionText = isKiller ? TEXT.actorDied : (TEXT.actionNames[key] || `${entry.category} / ${entry.action}`);
  const action = make('span', isKiller ? 'action-name minus' : 'action-name', actionText);
  tr.append(
    cell(formatTime(entry.time), 'nowrap muted'),
    cell(action),
    cell(make('span', 'detail', describeDetails(entry))),
    cell(amountText, amountClass),
    cell(balance, 'num muted'),
  );
  return tr;
}

function skeletonRows() {
  const rows = [];
  for (let i = 0; i < SKELETON_ROWS; i += 1) {
    const tr = make('tr', 'skeleton-row');
    for (let col = 0; col < 5; col += 1) tr.append(cell(make('span', 'skeleton')));
    rows.push(tr);
  }
  return rows;
}

function renderLogs() {
  const logs = state.logs;
  const c = TEXT.columns;
  const headers = [[c.time], [c.action], [c.details], [c.amount, 'num'], [c.balance, 'num']];
  const wrap = make('div');

  if (!logs || (logs.loading && logs.entries.length === 0)) {
    wrap.append(table(headers, skeletonRows()));
    return wrap;
  }
  if (logs.error && logs.entries.length === 0) {
    wrap.append(make('p', 'empty', `${TEXT.logLoadError} ${errorText(logs.error)}`));
    return wrap;
  }
  if (logs.archive) wrap.append(archiveBar(logs));
  if (logs.entries.length === 0) {
    wrap.append(make('p', 'empty', logs.archive ? TEXT.archiveEmpty : TEXT.noLogs));
    if (!logs.archive) wrap.append(archiveLink());
    return wrap;
  }

  wrap.append(table(headers, logs.entries.map(logRow)));

  const more = make('div', 'more');
  more.hidden = !logs.hasMore;
  const button = make('button', 'btn', logs.loading ? TEXT.loadingMore : TEXT.loadMore);
  button.type = 'button';
  button.dataset.action = 'more';
  button.disabled = logs.loading;
  more.append(button);
  wrap.append(more);
  // Am Ende der aktuellen Eintraege: Weg ins Archiv
  if (!logs.hasMore && !logs.loading && !logs.archive) wrap.append(archiveLink());
  return wrap;
}

function archiveLink() {
  const box = make('div', 'more');
  const button = make('button', 'link', TEXT.archiveOpen);
  button.type = 'button';
  button.dataset.action = 'logs-archive';
  box.append(button);
  return box;
}

function archiveBar(logs) {
  const bar = make('div', 'archive-bar');
  bar.append(make('span', '', logs.archiveDays ? TEXT.archiveTitle(logs.archiveDays) : TEXT.archiveTitleShort));
  const back = make('button', 'link', TEXT.archiveBack);
  back.type = 'button';
  back.dataset.action = 'logs-current';
  bar.append(back);
  return bar;
}

/* ---------- Akte: Inventar ---------- */

const GRAMS_PER_KG = 1000;
const kgFormat = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 });
const formatKg = (grams) => `${kgFormat.format((Number(grams) || 0) / GRAMS_PER_KG)} kg`;

let inventoryRequest = 0;

async function loadInventory(characterId) {
  const request = ++inventoryRequest;
  state.inventory = { characterId, loading: true, data: null, error: null };
  renderContent();
  const result = await Bridge.send('admin_inventory', { characterId });
  if (request !== inventoryRequest) return;
  state.inventory = result && result.ok
    ? { characterId, loading: false, data: result.data, error: null }
    : { characterId, loading: false, data: null, error: (result && result.error) || 'default' };
  if (state.tab === 'inventory') renderContent();
}

function inventoryRows(list, items, withSlot) {
  return list.map((entry) => {
    const def = items[entry.name] || {};
    const tr = make('tr');
    if (withSlot) tr.append(make('td', 'num', entry.slot));
    tr.append(
      make('td', null, entry.meta && entry.meta.serial ? `${def.label || entry.name} · ${entry.meta.serial}${entry.meta.ammo !== undefined ? ` · ${entry.meta.ammo} Schuss` : ''}` : (def.label || entry.name)),
      make('td', 'num', String(entry.count)),
      make('td', 'num', formatKg((def.weight || 0) * entry.count + Number((entry.meta && entry.meta.contentWeight) || 0))),
    );
    return tr;
  });
}

function renderInventory() {
  const characterId = state.selectedCharacterId;
  const wrap = make('div', 'inventory');
  if (!characterId) {
    wrap.append(make('p', 'empty', TEXT.inventory.pick));
    return wrap;
  }
  if (!state.inventory || state.inventory.characterId !== characterId) {
    loadInventory(characterId);
    return wrap;
  }
  const inv = state.inventory;
  if (inv.loading) {
    wrap.append(table([[TEXT.inventory.item]], skeletonRows()));
    return wrap;
  }
  if (inv.error) {
    wrap.append(make('p', 'empty', TEXT.inventory.error));
    return wrap;
  }
  const { state: invState, items, layout } = inv.data;
  // Lua schickt leere Listen als {}
  const all = Array.isArray(invState.items) ? invState.items : [];
  const bagList = invState.bag == null ? null : (Array.isArray(invState.bag) ? invState.bag : []);
  const equipIds = new Set((layout.equip || []).map((slot) => slot.id));
  const pocket = all.filter((e) => !equipIds.has(e.slot)).sort((a, b) => Number(a.slot) - Number(b.slot));
  const worn = (layout.equip || []).map((slot) => ({ slot, entry: all.find((e) => e.slot === slot.id) })).filter((x) => x.entry);
  const c = TEXT.inventory;

  wrap.append(make('p', 'inventory__weight', c.weight(formatKg(invState.weight), formatKg(invState.maxWeight))));

  wrap.append(make('h3', 'inventory__title', c.worn));
  if (worn.length === 0) wrap.append(make('p', 'empty', c.nothingWorn));
  else {
    wrap.append(table([[c.slot], [c.item]], worn.map(({ slot, entry }) => {
      const tr = make('tr');
      tr.append(make('td', null, slot.label), make('td', null, (items[entry.name] || {}).label || entry.name));
      return tr;
    })));
  }

  wrap.append(make('h3', 'inventory__title', c.pockets));
  if (pocket.length === 0) wrap.append(make('p', 'empty', c.empty));
  else wrap.append(table([[c.slot, 'num'], [c.item], [c.count, 'num'], [c.weightCol, 'num']], inventoryRows(pocket, items, true)));

  if (bagList) {
    wrap.append(make('h3', 'inventory__title', c.bag(formatKg(invState.bagWeight), formatKg(invState.bagMaxWeight))));
    const bag = [...bagList].sort((a, b) => Number(a.slot) - Number(b.slot));
    if (bag.length === 0) wrap.append(make('p', 'empty', c.empty));
    else wrap.append(table([[c.slot, 'num'], [c.item], [c.count, 'num'], [c.weightCol, 'num']], inventoryRows(bag, items, true)));
  }
  return wrap;
}

function renderContent() {
  if (!state.profile) {
    el.content.replaceChildren();
    return;
  }
  let node;
  if (state.tab === 'overview') node = renderOverview();
  else if (state.tab === 'characters') node = renderCharacters();
  else if (state.tab === 'punishments') node = renderPunishments();
  else if (state.tab === 'inventory') node = renderInventory();
  else node = renderLogs();
  el.content.replaceChildren(node);
}

/* ---------- Befehlsliste ---------- */

function applyExtras(data) {
  state.commands = Array.isArray(data.commands) ? data.commands : [];
  state.ticketsOpen = Number.isFinite(Number(data.ticketsOpen)) && data.ticketsOpen !== null && data.ticketsOpen !== undefined ? Number(data.ticketsOpen) : null;
}

function commandRow(entry) {
  const tr = make('tr');
  tr.append(
    make('td', 'cmd-usage', entry.usage),
    make('td', 'cmd-text', entry.text),
    make('td', 'cmd-rank', entry.rank ? TEXT.commandsRank(entry.level) : TEXT.commandsEveryone),
  );
  if (entry.rank) tr.lastChild.title = entry.rank;
  return tr;
}

function renderCommands() {
  const query = el.commandsFilter.value.trim().toLowerCase();
  const tables = [];
  state.commands.forEach((group) => {
    const entries = (Array.isArray(group.entries) ? group.entries : []).filter((entry) => !query
      || entry.usage.toLowerCase().includes(query) || entry.text.toLowerCase().includes(query));
    if (entries.length === 0) return;
    const table = make('table', 'cmd-table');
    const caption = make('caption');
    caption.append(make('span', 'cmd-table__title', group.title));
    if (group.hint) caption.append(make('span', 'cmd-table__hint', group.hint));
    const body = make('tbody');
    body.append(...entries.map(commandRow));
    table.append(caption, body);
    tables.push(table);
  });
  el.commandsBody.replaceChildren(...tables);
  el.commandsEmpty.hidden = tables.length > 0;
}

/* ---------- Gesamt ---------- */

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;
  renderTopbar();
  renderList();
  const showCommands = state.view === 'commands';
  const showProfile = !showCommands && (state.selectedAccountId !== null || state.selectedCharacterId !== null);
  el.commands.hidden = !showCommands;
  el.placeholder.hidden = showProfile || showCommands;
  el.profile.hidden = !showProfile;
  if (showCommands) renderCommands();
  if (showProfile) {
    renderProfileHead();
    renderPunishForm();
    renderPunishStatus();
    renderDeviceWarning();
    renderWarning();
    renderTwinks();
    renderSide();
    renderTabs();
    renderContent();
  }
}

/* ---------- Laden ---------- */

let profileRequest = 0;
let logsRequest = 0;

// archive = true: aeltere Eintraege aus dem Log-Archiv. Beim Nachladen bleibt die gewaehlte Quelle.
async function loadLogs(append = false, archive = false) {
  if (!state.profile || !LOG_TABS.has(state.tab)) return;
  const category = state.tab;
  if (append && state.logs) archive = state.logs.archive === true;
  const page = append && state.logs ? state.logs.page + 1 : 0;
  const previous = append && state.logs ? state.logs.entries : [];
  const request = ++logsRequest;

  state.logs = {
    category, archive, entries: previous, page: append ? state.logs.page : 0, hasMore: false, loading: true, error: null,
    names: (append && state.logs && state.logs.names) || { accounts: {}, characters: {} },
  };
  renderContent();

  const result = await Bridge.send('admin_logs', { accountId: state.profile.account.id, category, page, archive });
  if (request !== logsRequest) return;

  if (result && result.ok && result.data) {
    const oldNames = (append && state.logs && state.logs.names) || { accounts: {}, characters: {} };
    const newNames = result.data.names || {};
    state.logs = {
      category,
      archive,
      archiveDays: result.data.archiveDays,
      names: {
        accounts: { ...oldNames.accounts, ...(newNames.accounts || {}) },
        characters: { ...oldNames.characters, ...(newNames.characters || {}) },
      },
      entries: previous.concat(result.data.entries || []),
      page: result.data.page ?? page,
      hasMore: Boolean(result.data.hasMore),
      loading: false,
      error: null,
    };
  } else {
    state.logs = { ...state.logs, loading: false, error: (result && result.error) || 'default' };
  }
  renderContent();
}

async function openProfile(accountId, characterId) {
  if (!accountId && !characterId) return;
  state.view = 'profile';
  // Andere Charaktere derselben Person: Akte bleibt, nur der Mittelpunkt wechselt
  if (accountId && state.profile && state.profile.account.id === accountId && characterId
      && state.profile.characters.some((c) => c.id === characterId)) {
    state.selectedCharacterId = characterId;
    state.punish = null;
    state.keyAction = null;
    render();
    return;
  }
  const request = ++profileRequest;
  state.keyAction = null;
  state.selectedAccountId = accountId || null;
  state.selectedCharacterId = characterId || null;
  state.profile = null;
  state.profileLoading = true;
  state.logs = null;
  state.message = null;
  state.punish = null;
  state.tab = 'overview';
  render();

  const result = await Bridge.send('admin_profile', { accountId: accountId || undefined, characterId: characterId || undefined });
  if (request !== profileRequest) return;
  state.profileLoading = false;

  if (result && result.ok && result.data) {
    state.profile = result.data;
    state.selectedAccountId = result.data.account.id;
    state.selectedCharacterId = result.data.focusCharacterId || null;
  } else {
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  render();
}

async function loadAccounts(append = false) {
  const previous = append && state.accounts ? state.accounts.list : [];
  const page = append && state.accounts ? state.accounts.page + 1 : 0;
  state.accounts = { list: previous, page: append ? state.accounts.page : 0, hasMore: false, loading: true };
  renderList();
  const result = await Bridge.send('admin_accounts', { page });
  if (result && result.ok && result.data) {
    state.accounts = {
      list: previous.concat(result.data.accounts || []),
      page: result.data.page ?? page,
      hasMore: Boolean(result.data.hasMore),
      loading: false,
    };
  } else {
    state.accounts = { ...state.accounts, loading: false };
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  render();
}

async function loadWarnings() {
  state.warningsLoading = true;
  renderList();
  const result = await Bridge.send('admin_warnings', {});
  state.warningsLoading = false;
  if (result && result.ok && result.data) {
    state.warnings = result.data.warnings || [];
    state.deviceAlerts = result.data.devices || [];
    state.warningCount = state.warnings.length + state.deviceAlerts.length;
  } else {
    state.warnings = [];
    state.deviceAlerts = [];
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  render();
}

async function refresh() {
  if (state.busy) return;
  state.busy = 'refresh';
  renderTopbar();
  const result = await Bridge.send('admin_refresh', {});
  state.busy = null;
  if (result && result.ok && result.data) {
    state.self = result.data.self;
    state.players = result.data.players || [];
    state.warningCount = Number(result.data.warningCount) || 0;
    applyExtras(result.data);
  }
  render();
  if (state.mode === 'warnings') loadWarnings();
  if (state.mode === 'all') loadAccounts(false);
}

async function toggleDuty() {
  if (state.busy) return;
  state.busy = 'duty';
  renderTopbar();
  const result = await Bridge.send('admin_duty', {});
  state.busy = null;
  if (result && result.ok && result.data) {
    state.self = result.data.self;
    state.message = { tone: 'success', text: state.self.duty ? TEXT.dutyOn : TEXT.dutyOff };
    await refresh();
    return;
  }
  state.message = { tone: 'error', text: errorText(result && result.error) };
  render();
}

async function playerAction(action) {
  const online = onlineOf(state.profile);
  if (!online || state.busy) return;
  state.busy = action;
  state.message = null;
  renderProfileHead();

  const result = await Bridge.send('admin_action', { action, serverId: online.serverId });
  state.busy = null;
  state.message = result && result.ok
    ? { tone: 'success', text: TEXT.actionsDone[action] }
    : { tone: 'error', text: errorText(result && result.error) };
  renderProfileHead();
}

async function search(query) {
  const trimmed = query.trim();
  if (!trimmed) {
    state.results = null;
    render();
    return;
  }
  state.results = [];
  state.searching = true;
  renderList();
  const result = await Bridge.send('admin_search', { query: trimmed });
  state.searching = false;
  if (result && result.ok && result.data) {
    state.results = result.data.results || [];
  } else {
    state.results = [];
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  render();
}

function close() {
  Bridge.send('admin_close', {});
}

/* ---------- Ereignisse ---------- */

const ACTIONS = {
  select(target) { openProfile(Number(target.dataset.accountId) || null, Number(target.dataset.characterId) || null); },
  tab(target) {
    state.tab = target.dataset.tab;
    renderTabs();
    if (LOG_TABS.has(state.tab)) loadLogs(false);
    else renderContent();
    el.tabs.querySelector(`[data-tab="${state.tab}"]`).focus();
  },
  more() { loadLogs(true); },
  'logs-archive'() { loadLogs(false, true); },
  'logs-current'() { loadLogs(false, false); },
  duty() { toggleDuty(); },
  refresh() { refresh(); },
  close() { close(); },
  commands() {
    state.view = state.view === 'commands' ? 'profile' : 'commands';
    render();
    if (state.view === 'commands') el.commandsFilter.focus();
  },
  tickets() { Bridge.send('admin_open_tickets', {}); },
  'clear-search'() {
    el.search.value = '';
    state.results = null;
    render();
    el.search.focus();
  },
  'player-action'(target) { playerAction(target.dataset.playerAction); },
  'key-create'() {
    const info = adminKeyInfo();
    if (!info) return;
    if (!info.exists) {
      runKeyAction('create');
      return;
    }
    state.keyAction = { characterId: info.characterId, confirm: 'create', busy: false, copied: false };
    renderContent();
  },
  'key-delete'() {
    const info = adminKeyInfo();
    if (!info) return;
    state.keyAction = { characterId: info.characterId, confirm: 'delete', busy: false, copied: false };
    renderContent();
  },
  'key-confirm'() {
    if (state.keyAction && state.keyAction.confirm) runKeyAction(state.keyAction.confirm);
  },
  'key-cancel'() {
    state.keyAction = null;
    renderContent();
  },
  'key-copy'() {
    if (!state.keyAction || !state.keyAction.key) return;
    state.keyAction.copied = copyText(state.keyAction.key);
    renderContent();
  },
  link(target) { setLink(Number(target.dataset.other), target.dataset.dismiss === 'true'); },
  'device-alert'(target) { setDeviceAlert(Number(target.dataset.alertId), target.dataset.dismiss === 'true'); },
  mode(target) {
    state.mode = target.dataset.mode;
    state.results = null;
    el.search.value = '';
    if (state.mode === 'warnings') loadWarnings();
    else if (state.mode === 'all') loadAccounts(false);
    else render();
  },
  'more-accounts'() { loadAccounts(true); },
  'punish-open'(target) {
    openPunish(target.dataset.type, Number(target.dataset.banId) || null, Number(target.dataset.characterId) || null, Number(target.dataset.warnId) || null);
  },
  'punish-cancel'() { closePunish(); },
  'punish-scope'(target) {
    if (!state.punish) return;
    state.punish.scope = target.dataset.value === 'login' ? 'login' : 'character';
    renderPunishForm();
  },
  'punish-duration-preset'(target) {
    el.punishDuration.value = target.dataset.value;
    if (state.punish) state.punish.error = '';
    renderPunishForm();
    el.punishReason.focus();
  },
  'punish-minutes-preset'(target) {
    el.punishMinutes.value = target.dataset.value;
    if (state.punish) state.punish.error = '';
    renderPunishForm();
    el.punishReason.focus();
  },
};

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target || target.disabled) return;
  const action = ACTIONS[target.dataset.action];
  if (action) action(target);
});

el.searchForm.addEventListener('submit', (e) => {
  e.preventDefault();
  search(el.search.value);
});

el.punish.addEventListener('submit', (e) => {
  e.preventDefault();
  submitPunish();
});

// Fehler verschwindet beim Tippen, Vorauswahl folgt dem eingegebenen Wert
el.punish.addEventListener('input', () => {
  if (!state.punish) return;
  state.punish.error = '';
  renderPunishForm();
});

document.addEventListener('keydown', (e) => {
  if (!state.open) return;
  if (e.key === 'Escape') {
    e.preventDefault();
    // Erst das Strafen-Formular schliessen, dann das Menue
    if (state.punish && state.busy !== 'punish') closePunish();
    else if (!state.punish) close();
    return;
  }
  // Pfeiltasten in der Spielerliste und in den Tabs
  const vertical = e.key === 'ArrowDown' || e.key === 'ArrowUp';
  const horizontal = e.key === 'ArrowLeft' || e.key === 'ArrowRight';
  if (vertical && e.target.closest('#players')) {
    e.preventDefault();
    const buttons = Array.from(el.players.querySelectorAll('.player:not(:disabled)'));
    const index = buttons.indexOf(e.target.closest('.player'));
    const next = buttons[(index + (e.key === 'ArrowDown' ? 1 : -1) + buttons.length) % buttons.length];
    if (next) next.focus();
  }
  if (horizontal && e.target.closest('#tabs')) {
    e.preventDefault();
    const keys = visibleTabs();
    const index = keys.indexOf(state.tab);
    const next = keys[(index + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length];
    ACTIONS.tab({ dataset: { tab: next } });
  }
});

/* ---------- Bridge-Events ---------- */

Bridge.on('admin_open', (data) => {
  applyColors(data.colors);
  if (typeof data.currency === 'string') moneyFormat = createMoneyFormat(data.currency);
  state.open = true;
  state.serverName = typeof data.serverName === 'string' ? data.serverName : '';
  state.self = data.self || null;
  state.players = Array.isArray(data.players) ? data.players : [];
  state.warningCount = Number(data.warningCount) || 0;
  applyExtras(data);
  state.view = 'profile';
  state.warnings = null;
  state.accounts = null;
  state.mode = 'online';
  state.busy = null;
  state.message = null;
  state.punish = null;
  render();
  el.search.focus();
});

Bridge.on('admin_close', () => {
  state.open = false;
  state.busy = null;
  render();
});

el.commandsFilter.placeholder = TEXT.commandsFilter;

el.commandsFilter.addEventListener('input', renderCommands);

el.refreshBtn.setAttribute('aria-label', TEXT.refresh);
el.closeBtn.setAttribute('aria-label', TEXT.close);
