<!DOCTYPE html>
<!--
  UI: Admin-Menü
  CONTRACT_VERSION: 1
  Jede Anfrage prüft der Server mit dem passenden Recht. Die UI blendet nur aus, was man sowieso nicht darf.

  EINGEHEND (Server -> UI)
  admin_open  {
    colors: { base: string, ink: string, accent: string, signal: string },  // RGB-Kanaele
    currency: string, serverName: string,
    self: Self, players: OnlinePlayer[]
  }
  admin_close {}

  Self         { accountId: number, rank: { id, label, level }, duty: boolean, dutyRequired: boolean, permissions: string[],
                 limits: { jailMaxMinutes, banMaxDays, reasonMin, reasonMax } }
  OnlinePlayer { serverId: number, accountId?: number, characterId?: number, characterName?: string,
                 playerName: string, rank?: string, loggedIn: boolean, duty: boolean, jailed: boolean, warning: boolean,
                 frozen?: boolean, dimension?: number }   // dimension fehlt in der normalen Welt (0)

  AUSGEHEND (UI -> Server), Antwort immer { ok: boolean, data?: any, error?: string }
  ui_ready      { ui: "admin", version: 1 }
  admin_refresh {}                                   -> data: { self, players }
  admin_duty    {}                                   -> data: { self }
  admin_search  { query: string }                    -> data: { results: SearchResult[] }
  admin_profile { accountId?: number, characterId?: number } -> data: Profile   // characterId = permanente ID
  admin_logs    { accountId, category, page, archive?: boolean } -> data: { entries: LogEntry[], page, hasMore, archive, archiveDays, names: Names }
  admin_link    { accountId, otherAccountId, dismissed: boolean } -> data: { links: Link[] }
  admin_warnings {}                                  -> data: { warnings: Warning[], devices: DeviceAlert[] }
  admin_device_alert { accountId, alertId, dismissed: boolean } -> data: { devices: Devices }
  admin_accounts { page: number }                    -> data: { accounts: AccountRow[], page, hasMore }
  (admin_open und admin_refresh liefern zusaetzlich warningCount: number)
  admin_action  { action: "revive"|"goto"|"bring", serverId: number } -> data: {}
  admin_punish  { type: "jail", accountId, characterId, minutes, reason }
                { type: "unjail", accountId, characterId, reason? }
                { type: "ban", accountId, scope: "character"|"login", characterId?, duration: "30m"|"12h"|"7d"|"2w"|"perm", reason }
                { type: "unban", accountId, banId, reason? }
                { type: "warn", accountId, characterId, reason }
                { type: "unwarn", accountId, warnId, reason? }
                { type: "kick", accountId, characterId?, reason }  // ohne characterId: wer mit dem Login verbunden ist
                -> data: { punishments: Punishments }
  admin_close   {}
  admin_open_tickets {}                              // schliesst das Menue und oeffnet die Ticket-UI
  (admin_open und admin_refresh liefern zusaetzlich commands: CommandGroup[] und ticketsOpen?: number, nur mit tickets.manage)

  admin_key_create { characterId }                  -> data: { key: string, info: AdminKey }   // key nur dieses eine Mal
  admin_key_delete { characterId }                  -> data: { info: AdminKey }

  CommandGroup { title, hint?, entries: { usage, text, rank?: string, level: number }[] }   // nur Befehle, die man darf
  AdminKey     { characterId, exists: boolean, createdBy?: number, createdAt?, lastUsedAt?, canManage: boolean,
                 reason?: "own_key"|"target_too_high"|"character_deleted", locked?: boolean }
  SearchResult { accountId, characterId?, characterName?, deleted: boolean, rank: string, serverId? }
  Profile      { account: { id, rank, email?, createdAt, lastLogin? }, online?: OnlinePlayer,
                 characters: Character[], identifiers: { type, value?, lastSeen }[], counts: { [category]: number },
                 links: Link[], punishments: Punishments, focusCharacterId?: number,
                 devices: Devices, twinks: { total, recent: { action, amount?, time, data? }[] },
                 adminKeys?: AdminKey[] }   // nur mit Recht admin.keys, ein Eintrag pro Charakter mit Teamrang
  Devices      { known: boolean, deviceCount: number, alerts: DeviceAlert[], ips?: { ip, firstSeen, lastSeen }[], ipRetentionDays }
  DeviceAlert  { id, accountId, createdAt, ip?, ipKnown: boolean, active: boolean, dismissedBy?, dismissedAt?, name?, serverId? }
  Punishments  { bans: Ban[], jails: JailEntry[], activeBan?: Ban, activeJails: JailEntry[],
                 warns: Warn[], activeWarns: number, warnExpireDays: number }
  Warn         { id, characterId, characterName?, reason, createdAt, seenAt?, active: boolean,
                 warnedBy?, warnedByName?, revokedAt?, revokedBy?, revokedByName?, revokeReason? }
  Ban          { id, characterId?, characterName?, reason, createdAt, expiresAt?, active: boolean,
                 bannedBy?, bannedByName?, liftedAt?, liftedBy?, liftedByName?, liftReason? }   // ohne characterId = ganzer Login
  JailEntry    { id, characterId?, characterName?, reason, minutes, remaining, active: boolean, createdAt,
                 jailedBy?, jailedByName?, releasedAt?, releasedBy?, releasedByName?, releaseReason? }
  Link         { otherAccountId, otherName?, types: string[], timesSeen, firstSeen, lastSeen, active: boolean,
                 dismissedBy?, dismissedByName?, dismissedAt? }
  Names        { accounts: { [id: string]: string }, characters: { [id: string]: string } }
  Warning      { a: Side, b: Side, types: string[], timesSeen, firstSeen, lastSeen }
  Side         { accountId, name?, serverId? }   // serverId nur, wenn online
  AccountRow   { accountId, characterId?, name?, rank, lastSeen?, serverId?, warning, banned, jailed }   // eine Zeile pro Charakter
  IDs: characterId ist die permanente ID (ueber dem Kopf, in Befehlen). accountId ist der Login (E-Mail), dem mehrere Charaktere gehoeren.
  Character    { id, rank, firstname, lastname, dateOfBirth, gender, job, jobGrade, cash, bank, createdAt, lastPlayed?, deletedAt? }   // rank gilt nur fuer diesen Charakter
  LogEntry     { id, time, actorAccountId?, accountId?, characterId?, targetAccountId?, category, action,
                 amount?, balanceBefore?, balanceAfter?, resource?, reason?, data?: string (JSON) }

  FEHLERCODES
  no_permission, duty_required, target_offline, self, no_position, not_found, invalid_query,
  invalid_category, unknown_action, no_character, db_error, server_error, timeout, bridge_error, client_error,
  target_jailed, jailed, invalid_reason, invalid_duration, invalid_minutes, already_banned, not_banned,
  already_jailed, not_jailed, account_not_found, character_not_found, target_too_high, not_ready,
  own_key, no_team_rank, character_deleted, no_key
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin-Menü</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Die 4 Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   16 17 20;
  --rgb-ink:    255 245 236;
  --rgb-accent: 231 62 192;
  --rgb-signal: 244 67 54;

  --c-bg:          rgb(var(--rgb-base) / 0.97);
  --c-scrim:       rgb(var(--rgb-base) / 0.45);
  --c-sunken:      rgb(var(--rgb-base) / 0.5);
  --c-surface:     rgb(var(--rgb-ink) / 0.04);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.08);
  --c-border:      rgb(var(--rgb-ink) / 0.10);
  --c-border-hi:   rgb(var(--rgb-ink) / 0.22);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-2:      rgb(var(--rgb-ink) / 0.72);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.14);
  --c-accent-line: rgb(var(--rgb-accent) / 0.5);
  --c-on-accent:   rgb(var(--rgb-base));
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-soft: rgb(var(--rgb-signal) / 0.14);
  --c-signal-line: rgb(var(--rgb-signal) / 0.45);

  --shadow-panel: 0 20px 60px rgb(var(--rgb-base) / 0.6);

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;

  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 999px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-sm: clamp(12px, 0.65vw, 14px);
  --fs-md: clamp(14px, 0.75vw, 16px);
  --fs-lg: clamp(17px, 0.95vw, 20px);
  --fs-xl: clamp(21px, 1.25vw, 26px);

  --dur-fast: 120ms; --dur-panel: 200ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-overlay: 10; --z-sticky: 2;

  --panel-width: min(96vw, 2200px);
  --panel-height: min(94vh, 1300px);
  --side-width: clamp(320px, 22vw, 460px);
  --sidebar-width: clamp(280px, 22vw, 360px);
  --control-height: clamp(36px, 2vw, 44px);
  --icon-size: 20px;
  --dot-size: 8px;
  --label-width: clamp(90px, 7vw, 130px);
  --short-input: clamp(110px, 8vw, 150px);
  --stripe-gap: 12px;
  --notices-max: 52%;
  --cmd-usage-width: clamp(170px, 14vw, 260px);
  --cmd-rank-width: clamp(80px, 6vw, 110px);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input { font: inherit; color: inherit; }

.icon { width: var(--icon-size); height: var(--icon-size); flex: none; }

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: grid;
  place-items: center;
  background: var(--c-scrim);
}
.screen[hidden] { display: none; }

.panel {
  width: var(--panel-width);
  height: var(--panel-height);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-panel);
  overflow: hidden;
  animation: panel-in var(--dur-panel) var(--ease-out);
}

@keyframes panel-in {
  from { opacity: 0; transform: scale(0.98); }
  to   { opacity: 1; transform: scale(1); }
}

/* ---------- Kopfzeile ---------- */

.topbar {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-5);
  border-bottom: 1px solid var(--c-border);
}

.topbar__title { margin: 0; font-size: var(--fs-lg); font-weight: 700; }
.topbar__server { font-size: var(--fs-sm); font-weight: 500; color: var(--c-text-2); }
.topbar__spacer { flex: 1; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-1) var(--space-3);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-full);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-2);
  white-space: nowrap;
}
.chip[hidden] { display: none; }
.chip--duty { border-color: var(--c-signal-line); color: var(--c-text); background: var(--c-signal-soft); }

.dot {
  width: var(--dot-size);
  height: var(--dot-size);
  border-radius: 50%;
  background: var(--c-signal);
  flex: none;
}

/* ---------- Buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--control-height);
  padding: 0 var(--space-4);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-surface);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--c-surface-hi); border-color: var(--c-border-hi); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn[hidden] { display: none; }

.btn[aria-pressed="true"] { border-color: var(--c-accent-line); background: var(--c-accent-soft); }
.btn--primary { background: var(--c-accent); border-color: transparent; color: var(--c-on-accent); }
.btn--primary:hover:not(:disabled) { background: var(--c-accent); border-color: transparent; opacity: 0.9; }
.btn--danger { border-color: var(--c-signal-line); color: var(--c-text); background: var(--c-signal-soft); }
.btn--danger:hover:not(:disabled) { border-color: var(--c-signal); background: var(--c-signal-soft); }

.icon-btn {
  display: grid;
  place-items: center;
  width: var(--control-height);
  height: var(--control-height);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--c-text-2);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.icon-btn:hover:not(:disabled) { background: var(--c-surface-hi); color: var(--c-text); }
.icon-btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.icon-btn:disabled { opacity: 0.45; cursor: default; }

/* ---------- Koerper ---------- */

.body {
  display: grid;
  grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
  min-height: 0;
}

/* ---------- Seitenleiste ---------- */

.sidebar {
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--c-border);
  background: var(--c-surface);
}

.search {
  display: flex;
  gap: var(--space-2);
  padding: var(--space-4);
  border-bottom: 1px solid var(--c-border);
}

.input {
  flex: 1;
  min-width: 0;
  height: var(--control-height);
  padding: 0 var(--space-3);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-sunken);
  font-size: var(--fs-sm);
  font-weight: 500;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.input::placeholder { color: var(--c-text-muted); }
.input:hover { border-color: var(--c-border-hi); }
.input:focus-visible { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }

.modes {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-1);
  margin: var(--space-3) var(--space-4) 0;
  padding: var(--space-1);
  background: var(--c-sunken);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
}
.mode {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-2);
  border: 0;
  border-radius: calc(var(--radius-md) - var(--space-1));
  background: transparent;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-2);
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.mode:hover { color: var(--c-text); }
.mode:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 1px; }
.mode[aria-selected="true"] { background: var(--c-surface-hi); color: var(--c-text); }
.mode__count {
  min-width: 2ch;
  padding: 0 var(--space-1);
  border-radius: var(--radius-full);
  background: var(--c-surface-hi);
  font-variant-numeric: tabular-nums;
}
.mode__count[data-alert="true"] { background: var(--c-signal); color: var(--c-on-accent); }

.list-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-4) var(--space-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-2);
}

.link {
  border: 0;
  background: transparent;
  padding: 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-2);
  cursor: pointer;
}
.link:hover { color: var(--c-text); }
.link:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; border-radius: var(--radius-sm); }
.link[hidden] { display: none; }

.players {
  list-style: none;
  margin: 0;
  padding: 0 var(--space-2) var(--space-3);
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

.player {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
.player:hover:not(:disabled) { background: var(--c-surface-hi); }
.player:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; }
.player:disabled { cursor: default; opacity: 0.55; }
.player[aria-pressed="true"] { background: var(--c-surface-hi); border-color: var(--c-accent-line); }

.player__text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.player__name, .player__meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.player__name { font-size: var(--fs-sm); font-weight: 600; }
.player__meta { font-size: var(--fs-xs); color: var(--c-text-2); font-variant-numeric: tabular-nums; }
.player__duty { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--fs-xs); font-weight: 600; color: var(--c-signal); }

.player__badges { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.player__warning { font-size: var(--fs-xs); font-weight: 700; color: var(--c-signal); }

.warning {
  margin: 0 var(--space-6) var(--space-3);
  padding: var(--space-3) var(--space-4);
  display: grid;
  gap: var(--space-2);
  border: 1px solid var(--c-signal-line);
  border-radius: var(--radius-md);
  background: var(--c-signal-soft);
}
.warning[hidden] { display: none; }
.warning__title { margin: 0; font-size: var(--fs-sm); font-weight: 700; }
.warning__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  flex-wrap: wrap;
  font-size: var(--fs-sm);
}
.warning__text { min-width: 0; overflow-wrap: anywhere; }
.warning__rows { display: grid; gap: var(--space-3); }

/* Hinweise, Formular und Warnungen ueber den Tabs. Bei wenig Hoehe scrollen sie selbst, die Tabs bleiben sichtbar. */
.notices { flex: 0 1 auto; min-height: 0; max-height: var(--notices-max); overflow-y: auto; }
.warning__meta { color: var(--c-text-2); font-size: var(--fs-xs); }

.links { margin-top: var(--space-6); }
.links__title { margin: 0 0 var(--space-3); font-size: var(--fs-md); font-weight: 700; }
.links .warning { margin: 0 0 var(--space-2); }
/* In der Uebersicht neutral: die Warnung selbst steht schon rechts unter Hinweise */
.links .warning:not(.warning--off) { border-color: var(--c-border); background: var(--c-surface); }

.key-reveal {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  flex-wrap: wrap;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--c-accent-line);
  border-radius: var(--radius-md);
  background: var(--c-accent-soft);
}
.key-reveal__value {
  flex: 1;
  min-width: 0;
  font-size: var(--fs-lg);
  font-weight: 700;
  letter-spacing: 0.08em;
  font-variant-numeric: tabular-nums;
  user-select: all;
  overflow-wrap: anywhere;
}
.key-reveal__hint { flex-basis: 100%; margin: 0; font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-2); }
.warning--off { border-color: var(--c-border); background: var(--c-surface); }
.player__twink { font-size: var(--fs-xs); font-weight: 700; color: var(--c-text-2); }

.empty {
  margin: 0;
  padding: var(--space-5) var(--space-4);
  font-size: var(--fs-sm);
  color: var(--c-text-2);
  line-height: 1.5;
}
.empty[hidden] { display: none; }

/* ---------- Hauptbereich ---------- */

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}

.placeholder {
  margin: auto;
  max-width: 40ch;
  text-align: center;
  font-size: var(--fs-md);
  color: var(--c-text-2);
  line-height: 1.55;
}
.placeholder[hidden] { display: none; }

.inventory__weight { margin: 0 0 var(--space-4); font-size: var(--fs-sm); font-weight: 600; font-variant-numeric: tabular-nums; }
.inventory__title { margin: var(--space-5) 0 var(--space-2); font-size: var(--fs-sm); font-weight: 700; }

.archive-bar {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-4);
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-2);
  border-bottom: 1px solid var(--c-border);
  font-size: var(--fs-sm);
  font-weight: 600;
}

/* ---------- Befehlsliste ---------- */

.commands { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.commands[hidden] { display: none; }
.commands__head {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--c-border);
}
.commands__title { margin: 0; font-size: var(--fs-lg); font-weight: 700; }
.commands__filter { max-width: clamp(220px, 18vw, 320px); margin-left: auto; }
.commands__body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 var(--space-5) var(--space-5); }
.commands__empty { margin: var(--space-5) 0; font-size: var(--fs-sm); color: var(--c-text-2); }
.commands__empty[hidden] { display: none; }
.cmd-table { width: 100%; margin-top: var(--space-5); border-collapse: collapse; table-layout: fixed; }
.cmd-table caption { text-align: left; padding-bottom: var(--space-2); }
.cmd-table__title { display: block; font-size: var(--fs-sm); font-weight: 700; }
.cmd-table__hint { display: block; margin-top: var(--space-1); font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-2); }
.cmd-table td { padding: var(--space-2) var(--space-4) var(--space-2) 0; border-top: 1px solid var(--c-border); vertical-align: baseline; font-size: var(--fs-sm); line-height: 1.45; overflow-wrap: anywhere; }
.cmd-usage { width: var(--cmd-usage-width); font-weight: 600; font-variant-numeric: tabular-nums; }
.cmd-text { color: var(--c-text-2); }

.profile {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto auto auto minmax(0, 1fr);
  grid-template-areas: "head" "notices" "side" "tabs" "content";
}
.profile[hidden] { display: none; }
.profile__head { grid-area: head; }
.notices { grid-area: notices; }
.tabs { grid-area: tabs; }
.content { grid-area: content; }

/* Hinweise zur Person: schmal ueber den Reitern, auf breiten Bildschirmen als eigene Spalte rechts.
   Ohne Hinweise gibt es die Spalte nicht, die Akte nutzt dann die ganze Breite. */
.profile__side {
  grid-area: side;
  min-height: 0;
  max-height: var(--notices-max);
  overflow-y: auto;
  padding: 0 var(--space-6) var(--space-3);
}
.profile__side[hidden] { display: none; }
.side__title { margin: 0 0 var(--space-3); font-size: var(--fs-md); font-weight: 700; display: flex; gap: var(--space-2); align-items: baseline; }
.side__count { font-size: var(--fs-sm); font-weight: 600; color: var(--c-text-muted); font-variant-numeric: tabular-nums; }
.profile__side .warning { margin: 0 0 var(--space-3); border-color: var(--c-border); background: var(--c-surface); }
.profile__side .warning__title { display: flex; align-items: center; gap: var(--space-2); color: var(--c-signal); }
.profile__side .warning__title::before { content: ''; width: var(--space-2); height: var(--space-2); flex: none; border-radius: 50%; background: currentColor; }
.profile__side .warning--note .warning__title { color: var(--c-text); }
.profile__side .warning--note .warning__title::before { background: var(--c-text-muted); }

@media (min-width: 1600px) {
  .profile[data-side] {
    grid-template-columns: minmax(0, 1fr) var(--side-width);
    grid-template-rows: auto auto auto minmax(0, 1fr);
    grid-template-areas: "head side" "notices side" "tabs side" "content side";
  }
  .profile[data-side] .profile__side {
    max-height: none;
    padding: var(--space-5);
    border-left: 1px solid var(--c-border);
  }
}

.profile__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-5);
  flex-wrap: wrap;
  padding: var(--space-5) var(--space-6) var(--space-4);
}

.profile__title { margin: 0 0 var(--space-1); font-size: var(--fs-xl); font-weight: 700; overflow-wrap: anywhere; }
.profile__meta { margin: 0; font-size: var(--fs-sm); color: var(--c-text-2); font-variant-numeric: tabular-nums; display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
.status-online { color: var(--c-text); font-weight: 600; }

.actions { display: flex; gap: var(--space-2); flex-wrap: wrap; align-items: center; }
.actions__hint { font-size: var(--fs-xs); color: var(--c-text-2); }
.actions__hint[hidden] { display: none; }

.message {
  margin: 0 var(--space-6) var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  font-size: var(--fs-sm);
  font-weight: 500;
}
.message:empty { display: none; }
.message[data-tone="error"]   { background: var(--c-signal-soft); border: 1px solid var(--c-signal-line); }
.message[data-tone="success"] { background: var(--c-accent-soft); border: 1px solid var(--c-accent-line); }

.tabs {
  display: flex;
  gap: var(--space-1);
  padding: 0 var(--space-6);
  border-bottom: 1px solid var(--c-border);
  overflow-x: auto;
}

.tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-3);
  border: 0;
  background: transparent;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text-2);
  cursor: pointer;
  white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out);
}
.tab:hover { color: var(--c-text); }
.tab:focus-visible { outline: 2px solid var(--c-accent); outline-offset: -2px; border-radius: var(--radius-sm); }
.tab[aria-selected="true"] { color: var(--c-text); }
.tab[aria-selected="true"]::after {
  content: '';
  position: absolute;
  left: var(--space-3);
  right: var(--space-3);
  bottom: -1px;
  height: 2px;
  background: var(--c-accent);
}
.tab__count {
  min-width: 2ch;
  padding: 0 var(--space-1);
  border-radius: var(--radius-full);
  background: var(--c-surface-hi);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.content {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: var(--space-5) var(--space-6) var(--space-6);
}

/* ---------- Uebersicht ---------- */

.facts {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: var(--space-5);
}
.fact { min-width: 0; }

.fact__sub { display: block; font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-2); }

/* ---------- Tabellen ---------- */

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--fs-sm);
  font-variant-numeric: tabular-nums;
}
.table th {
  position: sticky;
  top: calc(-1 * var(--space-5));
  z-index: var(--z-sticky);
  padding: var(--space-2) var(--space-3);
  background: var(--c-bg);
  border-bottom: 1px solid var(--c-border);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-2);
  text-align: left;

.table td {

}

.nowrap { white-space: nowrap; }

.minus { color: var(--c-signal); font-weight: 600; }
.plus { font-weight: 600; }
.tag {

  padding: 0 var(--space-2);

  font-weight: 600;

.tag--danger { background: var(--c-signal-soft); color: var(--c-text); }
.tag--active { background: var(--c-accent-soft); color: var(--c-text); }

.detail { color: var(--c-text-2); font-size: var(--fs-xs); line-height: 1.5; }

.skeleton-row td { height: calc(var(--space-6) + var(--space-1)); }
.skeleton {
  display: block;
  height: var(--space-3);
  border-radius: var(--radius-sm);
  background: var(--c-surface-hi);

.more { display: flex; justify-content: center; padding-top: var(--space-4); }
.more[hidden] { display: none; }

.punish {

@media (prefers-reduced-motion: reduce) {

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

  punishMinutesPresets: $('punish-minutes-presets'), punishMinutes: $('punish-minutes'),
  punishReasonLabel: $('punish-reason-label'), punishReason: $('punish-reason'),
  punishError: $('punish-error'), punishSubmit: $('punish-submit'), punishCancel: $('punish-cancel'),
  deviceWarning: $('device-warning'), deviceWarningTitle: $('device-warning-title'), deviceWarningRows: $('device-warning-rows'),
  twinks: $('twinks'), twinksTitle: $('twinks-title'), twinksRows: $('twinks-rows'),
  punishStatus: $('punish-status'), punishStatusTitle: $('punish-status-title'), punishStatusRows: $('punish-status-rows'),
  profileSide: $('profile-side'), sideTitle: $('side-title-text'), sideCount: $('side-count'),
};

/* ---------- Hilfen ---------- */

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  return node;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function errorText(code) {
  return TEXT.errors[code] || TEXT.errors.default;
}

function can(permission) {
  return Boolean(state.self && state.self.permissions.includes(permission));
}

const dateFormat = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
const dateTimeFormat = new Intl.DateTimeFormat('de-DE', { dateStyle: 'short', timeStyle: 'medium' });
const numberFormat = new Intl.NumberFormat('de-DE', { maximumFractionDigits: POSITION_DECIMALS });
let moneyFormat = createMoneyFormat(DEFAULT_CURRENCY);

function createMoneyFormat(currency) {
  try {
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency, maximumFractionDigits: 0 });
  } catch (err) {
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: DEFAULT_CURRENCY, maximumFractionDigits: 0 });
  }
}

function formatTime(ms) {
  return Number.isFinite(ms) ? dateTimeFormat.format(new Date(ms)) : TEXT.never;
}

function formatDate(iso) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
  if (!match) return iso || '';
  return dateFormat.format(new Date(Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3]))));
}

function formatMoney(value) {
  return moneyFormat.format(Number(value) || 0);
}

function formatMinutes(seconds) {
  const minutes = Math.max(0, Math.ceil((Number(seconds) || 0) / SECONDS_PER_MINUTE));
  const hours = Math.floor(minutes / SECONDS_PER_MINUTE);
  const rest = minutes % SECONDS_PER_MINUTE;
  if (hours === 0) return `${minutes} Min.`;
  return rest === 0 ? `${hours} Std.` : `${hours} Std. ${rest} Min.`;
}

function limits() {
  return { ...DEFAULT_LIMITS, ...((state.self && state.self.limits) || {}) };
}

function punishments() {
  return (state.profile && state.profile.punishments) || { bans: [], jails: [] };
}

function activeCharacterBans() {
  return punishments().bans.filter((ban) => ban.active && ban.characterId);
}

function activeJails() {
  return punishments().activeJails || [];
}

// Charakter, der in der Akte im Mittelpunkt steht
function focusCharacter() {
  if (!state.profile) return null;
  return state.profile.characters.find((c) => c.id === state.selectedCharacterId) || null;
}

function characterName(c) {
  return c ? `${c.firstname} ${c.lastname}` : '';
}

function parseData(raw) {
  if (!raw) return null;
  if (typeof raw === 'object') return raw;
  try { return JSON.parse(raw); } catch (err) { return null; }
}

function formatValue(key, value) {
  if (value === true) return TEXT.yes;
  if (value === false) return TEXT.no;
  if (key === 'account' && TEXT.accounts[value]) return TEXT.accounts[value];
  if (key === 'position' && value && typeof value === 'object') {
    return ['x', 'y', 'z'].map((axis) => numberFormat.format(Number(value[axis]) || 0)).join(', ');
  }
  if (Array.isArray(value)) return value.join(' ');
  if (value && typeof value === 'object') return JSON.stringify(value);
  return String(value);
}

/* ---------- Seitenleiste ---------- */

function renderTopbar() {
  setText(el.serverName, state.serverName);
  const self = state.self;
  setText(el.ownRank, self ? self.rank.label : '');
  const duty = Boolean(self && self.duty);
  el.dutyChip.hidden = !duty;
  el.dutyBtn.hidden = !can('admin.duty');
  setText(el.dutyBtn, duty ? TEXT.dutyStop : TEXT.dutyStart);
  el.dutyBtn.className = duty ? 'btn btn--danger' : 'btn btn--primary';
  el.dutyBtn.disabled = state.busy !== null;
  el.refreshBtn.disabled = state.busy !== null;
  el.ticketsBtn.hidden = state.ticketsOpen === null;
  el.ticketsCount.hidden = !(state.ticketsOpen > 0);
  setText(el.ticketsCount, state.ticketsOpen > 0 ? String(state.ticketsOpen) : '');
  el.commandsBtn.setAttribute('aria-pressed', String(state.view === 'commands'));
}

function playerButton({ key, accountId, characterId, name, meta, duty, warning, warningLabel, jailed, banned, frozen, dimension, disabled, title }) {
  const li = make('li');
  const button = make('button', 'player');
  button.type = 'button';
  button.dataset.action = 'select';
  if (accountId) button.dataset.accountId = String(accountId);
  if (characterId) button.dataset.characterId = String(characterId);
  button.dataset.key = key;
  button.disabled = disabled;
  if (title) button.title = title;
  const pressed = characterId
    ? characterId === state.selectedCharacterId
    : Boolean(accountId) && accountId === state.selectedAccountId && !state.selectedCharacterId;
  button.setAttribute('aria-pressed', String(pressed));

  const text = make('span', 'player__text');
  text.append(make('span', 'player__name', name), make('span', 'player__meta', meta));
  button.append(text);

  if (duty || warning || jailed || banned || frozen || dimension) {
    const badges = make('span', 'player__badges');
    if (duty) {
      const badge = make('span', 'player__duty');
      badge.append(make('span', 'dot'), document.createTextNode(TEXT.dutyActive));
      badges.append(badge);
    }
    if (banned) badges.append(make('span', 'player__warning', TEXT.bannedBadge));
    if (jailed) badges.append(make('span', 'player__jail', TEXT.jailBadge));
    if (frozen) badges.append(make('span', 'player__jail', TEXT.frozenBadge));
    if (dimension) badges.append(make('span', 'player__dim', TEXT.dimensionBadge(dimension)));
    if (warning) badges.append(make('span', 'player__warning', warningLabel || TEXT.warningBadge));
    button.append(badges);
  }
  li.append(button);
  return li;
}

function renderModes() {
  const searchMode = Array.isArray(state.results);
  el.modeOnline.setAttribute('aria-selected', String(!searchMode && state.mode === 'online'));
  el.modeWarnings.setAttribute('aria-selected', String(!searchMode && state.mode === 'warnings'));
  el.modeAll.setAttribute('aria-selected', String(!searchMode && state.mode === 'all'));
  setText(el.modeAllLabel, TEXT.modeAll);
  setText(el.modeOnlineLabel, TEXT.modeOnline);
  setText(el.modeWarningsLabel, TEXT.modeWarnings);
  setText(el.modeOnlineCount, String(state.players.length));
  setText(el.modeWarningsCount, String(state.warningCount));
  el.modeWarningsCount.dataset.alert = String(state.warningCount > 0);
}

function warningButton(warning, index) {
  const a = TEXT.whoLogin(warning.a.name, warning.a.accountId);
  const b = TEXT.whoLogin(warning.b.name, warning.b.accountId);
  const types = warning.types.map((type) => TEXT.identifierTypes[type] || type).join(', ');
  return playerButton({
    key: `w${index}`,
    accountId: warning.a.accountId,
    name: TEXT.warningPair(warning.a.name || TEXT.accountTitle(warning.a.accountId), warning.b.name || TEXT.accountTitle(warning.b.accountId)),
    meta: [TEXT.sideState(warning.a), TEXT.sideState(warning.b), types].join(' · '),
    duty: false,
    warning: true,
    warningLabel: TEXT.multiBadge,
    disabled: false,
    title: `${a} / ${b}`,
  });
}

function deviceButton(alert, index) {
  return playerButton({
    key: `d${index}`,
    accountId: alert.accountId,
    name: TEXT.deviceListName(alert.name || TEXT.accountTitle(alert.accountId)),
    meta: TEXT.deviceListMeta(alert, formatTime(alert.createdAt)),
    duty: false,
    warning: true,
    warningLabel: TEXT.deviceBadge,
    disabled: false,
  });
}

function renderList() {
  renderModes();
  const searchMode = Array.isArray(state.results);
  el.clearSearch.hidden = !searchMode;

  let items = [];
  if (!searchMode && state.mode === 'all') {
    const accounts = state.accounts || { list: [], hasMore: false, loading: true };
    setText(el.listTitle, accounts.loading && accounts.list.length === 0 ? TEXT.allLoading : TEXT.allTitle);
    items = accounts.list.map((a, i) => playerButton({
      key: `a${i}`,
      accountId: a.accountId,
      characterId: a.characterId,
      name: a.name || TEXT.accountNoCharacter(a.accountId),
      meta: TEXT.accountMeta(a, a.lastSeen ? formatTime(a.lastSeen) : TEXT.neverLoggedIn),
      duty: false,
      warning: a.warning,
      banned: a.banned,
      jailed: a.jailed,
      disabled: false,
    }));
    if (accounts.hasMore) {
      const li = make('li', 'more');
      const button = make('button', 'btn', accounts.loading ? TEXT.loadingMore : TEXT.moreAccounts);
      button.type = 'button';
      button.dataset.action = 'more-accounts';
      button.disabled = accounts.loading;
      li.append(button);
      items.push(li);
    }
    setText(el.listEmpty, TEXT.noAccounts);
    el.listEmpty.hidden = accounts.loading || accounts.list.length > 0;
    el.players.replaceChildren(...items);
    return;
  }
  if (!searchMode && state.mode === 'warnings') {
    setText(el.listTitle, state.warningsLoading ? TEXT.warningsLoading : TEXT.warningsTitle);
    const warnings = state.warnings || [];
    items = state.deviceAlerts.map(deviceButton).concat(warnings.map(warningButton));
    setText(el.listEmpty, TEXT.noWarnings);
    el.listEmpty.hidden = state.warningsLoading || warnings.length + state.deviceAlerts.length > 0;
    el.players.replaceChildren(...items);
    return;
  }
  if (searchMode) {
    setText(el.listTitle, state.searching ? TEXT.searching : TEXT.results(state.results.length));
    items = state.results.map((r, i) => playerButton({
      key: `r${i}`,
      accountId: r.accountId,
      characterId: r.characterId,
      name: r.characterName ? `${r.characterName}${r.deleted ? ` (${TEXT.deletedCharacter})` : ''}` : TEXT.accountTitle(r.accountId),
      meta: TEXT.resultMeta(r),
      duty: false,
      warning: false,
      disabled: false,
    }));
    setText(el.listEmpty, TEXT.noResults);
    el.listEmpty.hidden = state.searching || state.results.length > 0;
  } else {
    setText(el.listTitle, TEXT.online(state.players.length));
    items = state.players.map((p) => playerButton({
      key: `s${p.serverId}`,
      accountId: p.accountId,
      characterId: p.characterId,
      name: p.loggedIn ? (p.characterName || TEXT.noCharacter) : `${p.playerName} (${TEXT.notLoggedIn})`,
      meta: TEXT.playerMeta(p),
      duty: p.duty,
      warning: p.warning,
      jailed: p.jailed,
      frozen: p.frozen,
      dimension: p.dimension,
      disabled: !p.accountId,
    }));
    setText(el.listEmpty, TEXT.noPlayers);
    el.listEmpty.hidden = state.players.length > 0;
  }
  el.players.replaceChildren(...items);
}

/* ---------- Akte: Kopf und Aktionen ---------- */

function onlineOf(profile) {
  if (!profile) return null;
  return state.players.find((p) => p.accountId === profile.account.id) || profile.online || null;
}

function renderProfileHead() {
  const profile = state.profile;
  const online = onlineOf(profile);

  if (state.profileLoading && !profile) {
    setText(el.profileTitle, TEXT.loadingProfile);
    el.profileMeta.replaceChildren();
  } else if (profile) {
    const focus = focusCharacter();
    const playingFocus = Boolean(online && focus && online.characterId === focus.id);
    setText(el.profileTitle, focus ? characterName(focus) : TEXT.accountTitle(profile.account.id));
    const parts = [];
    if (focus) parts.push(make('span', null, TEXT.metaId(focus.id)));
    parts.push(make('span', null, TEXT.metaLogin(profile.account.id)));
    if (online) parts.push(make('span', null, TEXT.metaServer(online.serverId)));
    let status = TEXT.metaOffline;
    if (online) status = playingFocus || !online.characterName ? TEXT.metaOnline : TEXT.metaPlayingOther(online.characterName);
    parts.push(make('span', online ? 'status-online' : null, status));
    parts.push(make('span', 'chip', profile.account.rank));
    if (online && online.duty) {
      const chip = make('span', 'chip chip--duty');
      chip.append(make('span', 'dot'), document.createTextNode(TEXT.dutyActive));
      parts.push(chip);
    }
    el.profileMeta.replaceChildren(...parts);
  }

  const dutyMissing = Boolean(state.self && state.self.dutyRequired && !state.self.duty);
  // Wiederbeleben und Teleport nur, wenn genau der angezeigte Charakter gerade spielt
  const shown = focusCharacter();
  const hasCharacter = Boolean(online && online.characterId && (!shown || shown.id === online.characterId));
  const playsOther = Boolean(online && online.characterId && shown && shown.id !== online.characterId);
  const isSelf = Boolean(online && state.self && online.accountId === state.self.accountId);

  const buttons = [
    [el.actRevive, 'revive', 'player.revive', false],
    [el.actGoto, 'goto', 'player.teleport', isSelf],
    [el.actBring, 'bring', 'player.teleport', isSelf],
  ];
  buttons.forEach(([button, action, permission, blocked]) => {
    button.hidden = !can(permission) || blocked;
    setText(button, state.busy === action ? TEXT.loadingMore : TEXT.actions[action]);
    button.disabled = state.busy !== null || !profile || !hasCharacter || dutyMissing;
  });

  // Strafen gehen auch offline. A-Jail immer fuer den Charakter im Mittelpunkt.
  const punishLocked = state.busy !== null || !profile || dutyMissing || state.punish !== null;
  const focus = focusCharacter();
  const focusJailed = Boolean(focus && activeJails().some((j) => j.characterId === focus.id));
  el.actJail.hidden = !can('player.ajail') || !focus || Boolean(focus.deletedAt) || focusJailed;
  el.actBan.hidden = !can('player.ban');
  el.actWarn.hidden = !can('player.warn') || !focus || Boolean(focus.deletedAt);
  el.actKick.hidden = !can('player.kick') || !online;
  setText(el.actJail, TEXT.punish.open.jail);
  setText(el.actBan, TEXT.punish.open.ban);
  setText(el.actWarn, TEXT.punish.open.warn);
  setText(el.actKick, TEXT.punish.open.kick);
  [el.actJail, el.actBan, el.actWarn, el.actKick].forEach((button) => { button.disabled = punishLocked; });

  let hint = '';
  if (profile && !online) hint = TEXT.hintOffline;
  else if (profile && playsOther) hint = TEXT.hintOtherCharacter;
  else if (profile && !hasCharacter) hint = TEXT.hintNoCharacter;
  else if (dutyMissing) hint = TEXT.hintDuty;
  const anyAction = buttons.some(([button]) => !button.hidden) || [el.actJail, el.actBan, el.actWarn, el.actKick].some((b) => !b.hidden);
  el.actionsHint.hidden = !hint || !anyAction;
  setText(el.actionsHint, hint);

  if (state.message) {
    el.message.dataset.tone = state.message.tone;
    setText(el.message, state.message.text);
  } else {
    el.message.removeAttribute('data-tone');
    el.message.replaceChildren();
  }
}

/* ---------- Akte: Multi-Account-Warnung ---------- */

function linkRow(link, withButton) {
  const row = make('div', 'warning__row');
  const text = make('div', 'warning__text');
  const types = link.types.map((type) => TEXT.identifierTypes[type] || type).join(', ');
  text.append(make('div', null, TEXT.multiRow(TEXT.whoLogin(link.otherName, link.otherAccountId), types)));
  const meta = link.active
    ? TEXT.multiMeta(formatTime(link.firstSeen), link.timesSeen)
    : TEXT.multiDismissed(link.dismissedBy ? TEXT.whoLogin(link.dismissedByName, link.dismissedBy) : null, formatTime(link.dismissedAt));
  text.append(make('div', 'warning__meta', meta));
  row.append(text);

  const buttons = make('div', 'actions');
  const openButton = make('button', 'btn', TEXT.openProfile);
  openButton.type = 'button';
  openButton.dataset.action = 'select';
  openButton.dataset.accountId = String(link.otherAccountId);
  buttons.append(openButton);
  row.append(buttons);

  if (withButton && can('accounts.links')) {
    const button = make('button', 'btn', link.active ? TEXT.multiDismiss : TEXT.multiRestore);
    button.type = 'button';
    button.dataset.action = 'link';
    button.dataset.other = String(link.otherAccountId);
    button.dataset.dismiss = String(link.active);
    button.disabled = state.busy !== null;
    buttons.append(button);
  }
  return row;
}

function renderWarning() {
  const links = (state.profile && state.profile.links) || [];
  const active = links.filter((link) => link.active);
  el.warning.hidden = active.length === 0;
  setText(el.warningTitle, TEXT.multiTitle);
  el.warningRows.replaceChildren(...active.map((link) => linkRow(link, true)));
}

function deviceRow(alert) {
  const row = make('div', 'warning__row');
  const text = make('div', 'warning__text');
  text.append(make('div', null, TEXT.deviceRow(formatTime(alert.createdAt))));
  const meta = [alert.ipKnown ? TEXT.deviceIpKnown : TEXT.deviceIpNew];
  if (alert.ip) meta.push(TEXT.deviceIp(alert.ip));
  text.append(make('div', 'warning__meta', meta.join(' · ')));
  row.append(text);
  if (can('accounts.links')) {
    const button = make('button', 'btn', alert.active ? TEXT.deviceDismiss : TEXT.deviceRestore);
    button.type = 'button';
    button.dataset.action = 'device-alert';
    button.dataset.alertId = String(alert.id);
    button.dataset.dismiss = String(alert.active);
    button.disabled = state.busy !== null;
    row.append(button);
  }
  return row;
}

function renderDeviceWarning() {
  const devices = (state.profile && state.profile.devices) || { alerts: [] };
  const active = devices.alerts.filter((alert) => alert.active);
  el.deviceWarning.hidden = active.length === 0;
  setText(el.deviceWarningTitle, TEXT.deviceTitle);
  el.deviceWarningRows.replaceChildren(...active.map(deviceRow));
}

function twinkLine(entry) {
  const data = parseData(entry.data) || {};
  const label = TEXT.actionNames[`twink.${entry.action}`] || data.label || entry.action;
  const parts = [TEXT.twinkLine(label, TEXT.who(data.fromName, data.fromCharacterId), TEXT.who(data.toName, data.toCharacterId))];
  if (Number.isFinite(entry.amount)) parts.push(formatMoney(entry.amount));
  if (data.relation) parts.push(TEXT.twinkRelation[data.relation] || data.relation);
  if (data.blocked) parts.push(TEXT.twinkBlocked);
  const row = make('div', 'warning__row');
  const text = make('div', 'warning__text');
  text.append(make('div', null, parts.join(' · ')), make('div', 'warning__meta', formatTime(entry.time)));
  row.append(text);
  return row;
}

// Spalte Hinweise nur, wenn es etwas zu sagen gibt
function renderSide() {
  const boxes = [el.punishStatus, el.deviceWarning, el.warning, el.twinks];
  const visible = boxes.filter((box) => !box.hidden).length;
  el.profileSide.hidden = visible === 0;
  if (visible > 0) el.profile.dataset.side = ''; else delete el.profile.dataset.side;
  setText(el.sideTitle, TEXT.sideTitle);
  setText(el.sideCount, String(visible));
}

function renderTwinks() {
  const twinks = (state.profile && state.profile.twinks) || { total: 0, recent: [] };
  el.twinks.hidden = twinks.total === 0;
  setText(el.twinksTitle, TEXT.twinkTitle(twinks.total));
  const rows = twinks.recent.map(twinkLine);
  const more = twinks.total - twinks.recent.length;
  if (more > 0) rows.push(make('div', 'warning__meta', TEXT.twinkMore(more)));
  el.twinksRows.replaceChildren(...rows);
}

async function setDeviceAlert(alertId, dismissed) {
  if (!state.profile || state.busy) return;
  state.busy = 'device';
  renderDeviceWarning();
  renderSide();
  const result = await Bridge.send('admin_device_alert', { accountId: state.profile.account.id, alertId, dismissed });
  state.busy = null;
  if (result && result.ok && result.data) {
    state.profile.devices = result.data.devices;
    state.message = { tone: 'success', text: dismissed ? TEXT.deviceDismissedOk : TEXT.deviceRestoredOk };
    state.warningCount = Math.max(0, state.warningCount + (dismissed ? -1 : 1));
    if (state.mode === 'warnings') loadWarnings();
  } else {
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  render();
}

async function setLink(otherAccountId, dismissed) {
  if (!state.profile || state.busy) return;
  state.busy = 'link';
  renderWarning();
  renderSide();
  const result = await Bridge.send('admin_link', { accountId: state.profile.account.id, otherAccountId, dismissed });
  state.busy = null;
  if (result && result.ok && result.data) {
    state.profile.links = result.data.links || [];
    state.message = { tone: 'success', text: dismissed ? TEXT.linkDismissedOk : TEXT.linkRestoredOk };
    const online = state.players.find((p) => p.accountId === state.profile.account.id);
    if (online) online.warning = state.profile.links.some((link) => link.active);
    state.warningCount = Math.max(0, state.warningCount + (dismissed ? -1 : 1));
    if (state.mode === 'warnings') loadWarnings();
  } else {
    state.message = { tone: 'error', text: errorText(result && result.error) };
  }
  render();
}

/* ---------- Akte: Strafen ---------- */

function presetButton(action, value, label) {
  const button = make('button', 'choice', label);
  button.type = 'button';
  button.dataset.action = action;
  button.dataset.value = String(value);
  return button;
}

// Einmal beim Start, die Werte stehen fest in TEXT
function buildPresets() {
  el.punishDurationPresets.replaceChildren(...TEXT.punish.durationPresets.map(([value, label]) => presetButton('punish-duration-preset', value, label)));
  el.punishMinutesPresets.replaceChildren(...TEXT.punish.minutesPresets.map((n) => presetButton('punish-minutes-preset', n, TEXT.punish.minutesPreset(n))));
}

function buildScope() {
  const focus = focusCharacter();
  const buttons = [];
  if (focus && !focus.deletedAt) buttons.push(presetButton('punish-scope', 'character', TEXT.punish.scopeCharacter(TEXT.who(characterName(focus), focus.id))));
  buttons.push(presetButton('punish-scope', 'login', TEXT.punish.scopeLogin));
  el.punishScope.replaceChildren(...buttons);
}

function renderPunishForm() {
  const form = state.punish;
  el.punish.hidden = !form;
  if (!form) return;

  const t = TEXT.punish;
  const lim = limits();
  setText(el.punishTitle, t.titles[form.type]);
  let sub = '';
  const focus = focusCharacter();
  if (form.type === 'jail' && focus) sub = t.jailSub(TEXT.who(characterName(focus), focus.id));
  if (form.type === 'ban') sub = t.banSub;
  if (form.type === 'unjail') {
    const jail = activeJails().find((j) => j.characterId === form.characterId);
    if (jail) sub = t.unjailSub(jail);
  }
  if (form.type === 'unban') {
    const ban = punishments().bans.find((b) => b.id === form.banId);
    if (ban) sub = t.unbanSub(ban);
  }
  if (form.type === 'warn' && focus) {
    const p = punishments();
    sub = t.warnSub(TEXT.who(characterName(focus), focus.id), (p.activeWarns || {})[String(focus.id)] || 0, p.warnBanAt || 3, p.warnBanDays || 7);
  }
  if (form.type === 'unwarn') {
    const warn = (punishments().warns || []).find((w) => w.id === form.warnId);
    if (warn) sub = t.unwarnSub(warn);
  }
  if (form.type === 'kick') {
    const online = onlineOf(state.profile);
    if (online) sub = t.kickSub(online.characterName ? TEXT.who(online.characterName, online.characterId) : TEXT.accountTitle(state.profile.account.id));
  }
  setText(el.punishSub, sub);

  el.punishScopeRow.hidden = form.type !== 'ban';
  el.punishDurationRow.hidden = form.type !== 'ban';
  el.punishMinutesRow.hidden = form.type !== 'jail' && form.type !== 'warn';
  setText(el.punishScopeLabel, t.scope);
  setText(el.punishDurationLabel, t.duration);
  setText(el.punishMinutesLabel, form.type === 'warn' ? t.warnMinutes : t.minutes);
  setText(el.punishReasonLabel, REASON_REQUIRED.has(form.type) ? t.reason : t.reasonOptional);
  el.punishMinutes.max = String(lim.jailMaxMinutes);
  el.punishReason.maxLength = lim.reasonMax;

  el.punishScope.querySelectorAll('.choice').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.value === String(form.scope)));
  });
  const duration = el.punishDuration.value.trim().toLowerCase();
  el.punishDurationPresets.querySelectorAll('.choice').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.value === duration));
  });
  const minutes = el.punishMinutes.value.trim();
  el.punishMinutesPresets.querySelectorAll('.choice').forEach((button) => {
    button.setAttribute('aria-pressed', String(button.dataset.value === minutes));
  });

  const busy = state.busy === 'punish';
  setText(el.punishSubmit, busy ? t.busy : t.submit[form.type]);
  setText(el.punishCancel, t.cancel);
  el.punishSubmit.disabled = state.busy !== null;
  el.punishCancel.disabled = busy;
  [el.punishDuration, el.punishMinutes, el.punishReason].forEach((input) => { input.readOnly = busy; });
  setText(el.punishError, form.error || '');
}

function renderPunishStatus() {

    const who = TEXT.who(latest && latest.characterName, characterId);

function openPunish(type, banId, characterId, warnId) {
  if (!state.profile || state.busy) return;
  const focus = focusCharacter();
  const scope = focus && !focus.deletedAt ? 'character' : 'login';
  let target = characterId || (focus ? focus.id : null);
  // Kicken trifft den Charakter, der gerade gespielt wird, sonst den Login (z. B. im Login-Screen)
  if (type === 'kick') {
    const online = onlineOf(state.profile);
    target = online && online.characterId ? online.characterId : null;
  }
  state.punish = { type, banId: banId || null, warnId: warnId || null, characterId: target, scope, error: '' };
  state.message = null;
  el.punishReason.value = '';
  el.punishDuration.value = '';
  el.punishMinutes.value = '';
  el.punishDuration.placeholder = TEXT.punish.durationPlaceholder;
  el.punishMinutes.placeholder = type === 'warn' ? TEXT.punish.warnMinutesPlaceholder : TEXT.punish.minutesPlaceholder;
  el.punishReason.placeholder = TEXT.punish.reasonPlaceholder;
  if (type === 'ban') buildScope();
  render();
  const first = { jail: el.punishMinutes, ban: el.punishScope.querySelector('.choice') }[type] || el.punishReason;
  if (first) first.focus();
}

function closePunish() {
  state.punish = null;
  render();
}

function validatePunish() {
  const form = state.punish;
  const t = TEXT.punish;
  const lim = limits();
  const reason = el.punishReason.value.trim();
  const payload = { type: form.type, accountId: state.profile.account.id, reason: reason || undefined };
  if (form.characterId) payload.characterId = form.characterId;
  const minutesText = el.punishMinutes.value.trim();
  if (form.type === 'jail' || (form.type === 'warn' && minutesText !== '')) {
    const minutes = Number(minutesText);
    if (!Number.isInteger(minutes) || minutes < 1 || minutes > lim.jailMaxMinutes) {
      return { error: t.errors.minutes(lim.jailMaxMinutes), focus: el.punishMinutes };
    }
    payload.minutes = minutes;
  }
  if (form.type === 'ban') {
    const duration = el.punishDuration.value.trim().toLowerCase();
    const match = /^(\d+)([mhdw])$/.exec(duration);
    const tooLong = match && Number(match[1]) * DURATION_UNITS[match[2]] > lim.banMaxDays;
    if (!DURATION_PATTERN.test(duration) || tooLong || (match && Number(match[1]) === 0)) {
      return { error: t.errors.duration(lim.banMaxDays), focus: el.punishDuration };
    }
    payload.duration = duration === 'permanent' ? 'perm' : duration;
    payload.scope = form.scope;
  }
  if (form.type === 'unban') payload.banId = form.banId;
  if (form.type === 'unwarn') payload.warnId = form.warnId;

  const required = REASON_REQUIRED.has(form.type);
  const length = Array.from(reason).length;
  if ((required || length > 0) && (length < lim.reasonMin || length > lim.reasonMax)) {
    return { error: t.errors.reason(lim.reasonMin, lim.reasonMax), focus: el.punishReason };
  }
  return { payload };
}

async function submitPunish() {
  if (!state.punish || state.busy) return;
  const { error, focus, payload } = validatePunish();
  if (error) {
    state.punish.error = error;
    renderPunishForm();
    focus.focus();
    return;
  }

  const type = state.punish.type;
  state.busy = 'punish';
  state.punish.error = '';
  render();

  const result = await Bridge.send('admin_punish', payload);
  state.busy = null;
  if (result && result.ok && result.data) {
    state.profile.punishments = result.data.punishments;
    state.punish = null;
    const doneKey = type === 'ban' && payload.scope === 'character' ? 'charBan' : type;
    state.message = { tone: 'success', text: TEXT.punish.done[doneKey] };
    await refresh();
    return;
  }
  if (state.punish) state.punish.error = errorText(result && result.error);
  render();
}

function banStatus(ban) {

  if (ban.liftedAt) {
    wrap.append(make('span', 'tag', t.statusLifted));
    wrap.append(make('div', 'detail', t.liftedBy(ban.liftedBy ? TEXT.whoLogin(ban.liftedByName, ban.liftedBy) : TEXT.dataLabels.console, formatTime(ban.liftedAt), ban.liftReason)));
  } else {
    wrap.append(make('span', 'tag', t.statusExpired));
  }

}

function jailStatus(jail) {
  const t = TEXT.punish;
  const online = onlineOf(state.profile);
  if (jail.active) return make('span', 'tag tag--danger', online && online.characterId === jail.characterId ? t.jailRunning : t.jailWaiting);

  wrap.append(make('span', 'tag', t.jailReleased));

function byWho(name, id) {

}

function renderPunishments() {

  const c = t.columns;
  const data = punishments();
  const wrap = make('div');

    const rows = data.bans.map((ban) => {

      tr.append(
        cell(formatTime(ban.createdAt), 'nowrap muted'),
        cell(ban.characterId ? t.character(ban.characterName, ban.characterId) : t.wholeAccount),

        cell(banStatus(ban)),

    });

  }

  const jails = make('section', 'section');
  jails.append(make('h3', 'section-title', t.jailsTitle));
  if (data.jails.length === 0) jails.append(make('p', 'empty', t.noJails));
  else {
    const rows = data.jails.map((jail) => {
      const tr = make('tr');
      tr.append(
        cell(formatTime(jail.createdAt), 'nowrap muted'),
        cell(jail.characterId ? t.character(jail.characterName, jail.characterId) : ''),
        cell(t.minutesValue(jail.minutes), 'nowrap'),

    });

      if (action) action.dataset.warnId = String(warn.id);
      tr.append(
        cell(formatTime(warn.createdAt), 'nowrap muted'),

        cell(byWho(warn.warnedByName, warn.warnedBy)),
        cell(status),
        cell(action, 'num'),
      );
      return tr;
    });
    warns.append(table([[c.time], [TEXT.dataLabels.warnId], [c.character], [c.reason], [c.by], [c.state], [c.action, 'num']], rows));

  wrap.append(warns, bans, jails);
  return wrap;

/* ---------- Akte: Tabs ---------- */

function tabCount(key) {
  const counts = (state.profile && state.profile.counts) || {};
  if (key === 'all') return Object.values(counts).reduce((sum, n) => sum + Number(n || 0), 0);
  if (key === 'characters') return state.profile ? state.profile.characters.length : 0;
  if (key === 'punishments') return punishments().bans.length + punishments().jails.length + (punishments().warns || []).length;
  if (key === 'overview' || key === 'inventory') return null;
  return counts[key] || 0;
}

function renderTabs() {
  const tabs = visibleTabs().map((key) => {
    const button = make('button', 'tab');
    button.type = 'button';
    button.setAttribute('role', 'tab');
    button.dataset.action = 'tab';
    button.dataset.tab = key;
    button.setAttribute('aria-selected', String(state.tab === key));
    button.tabIndex = state.tab === key ? 0 : -1;
    button.append(document.createTextNode(TEXT.tabs[key]));
    const count = tabCount(key);
    if (count !== null) button.append(make('span', 'tab__count', String(count)));
    return button;
  });
  el.tabs.replaceChildren(...tabs);
}
