<!DOCTYPE html>
<!--
  UI: A-Jail-Anzeige
  CONTRACT_VERSION: 1
  Reine Anzeige oben in der Mitte ohne Kasten, ohne Maus- und Tastaturfokus.

  EINGEHEND (Server -> UI)
  jail_open   {
    colors: { base: string, ink: string, accent: string, signal: string },  // RGB-Kanaele
    remaining: number,   // Restzeit in Sekunden
    total: number,       // Gesamtzeit in Sekunden
    reason?: string,
    by?: string          // Name des Admins
  }
  jail_update { remaining: number }
  jail_close  {}

  AUSGEHEND (UI -> Server)
  ui_ready    { ui: "jail", version: 1 }
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A-Jail</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Monitor. Dichte 8, Bewegung 2, Varianz 3.
  Kein Kasten: Text direkt auf dem Spielbild oben in der Mitte, lesbar durch einen dunklen Textschatten.
*/
:root {
  /* Die Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   16 17 20;
  --rgb-ink:    255 245 236;
  --rgb-accent: 231 62 192;
  --rgb-signal: 244 67 54;

  --c-text:       rgb(var(--rgb-ink) / 0.96);
  --c-text-muted: rgb(var(--rgb-ink) / 0.86);
  --c-signal:     rgb(var(--rgb-signal));
  --c-track:      rgb(var(--rgb-ink) / 0.22);

  /* Lesbarkeit auf hellem Himmel, kein Leuchten */
  --text-shadow: 0 1px 1px rgb(var(--rgb-base) / 0.95), 0 0 4px rgb(var(--rgb-base) / 0.75), 0 0 10px rgb(var(--rgb-base) / 0.35);

  --space-1: 4px; --space-2: 8px; --space-3: 12px;

  --fs-xs: clamp(11px, 0.6vw, 13px);
  --fs-sm: clamp(12px, 0.7vw, 15px);
  --fs-time: clamp(30px, 2.3vw, 46px);

  --dur-panel: 240ms;
  --dur-bar: 1000ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-overlay: 10;

  --top: clamp(16px, 3vh, 40px);
  --line-width: clamp(140px, 10vw, 200px);
  --line-height: 2px;
  --text-max: clamp(320px, 30vw, 560px);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  pointer-events: none;
}
.screen[hidden] { display: none; }

.jail {
  position: absolute;
  top: var(--top);
  left: 50%;
  width: var(--text-max);
  margin: 0;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  text-shadow: var(--text-shadow);
  animation: jail-in var(--dur-panel) var(--ease-out);
}

@keyframes jail-in {
  from { opacity: 0; transform: translate(-50%, -6px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

.jail__label {
  margin: 0;
  font-size: var(--fs-sm);
  font-weight: 600;
}
.jail__label strong { color: var(--c-signal); font-weight: 700; }

.jail__time {
  margin: 0;
  font-size: var(--fs-time);
  font-weight: 700;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}

/* Wie viel schon abgesessen ist */
.jail__line {
  width: var(--line-width);
  height: var(--line-height);
  margin: var(--space-2) 0 var(--space-3);
  background: var(--c-track);
  box-shadow: 0 0 3px rgb(var(--rgb-base) / 0.6);
  overflow: hidden;
}
.jail__line-fill {
  height: 100%;
  background: var(--c-signal);
  transform-origin: left center;
  transition: transform var(--dur-bar) linear;
}

.jail__reason {
  margin: 0;
  font-size: var(--fs-sm);
  font-weight: 600;
  overflow-wrap: anywhere;
}
.jail__reason[hidden] { display: none; }

.jail__note {
  margin: var(--space-1) 0 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-muted);
}

@media (prefers-reduced-motion: reduce) {
  .jail { animation: none; }
  .jail__line-fill { transition: none; }
}
</style>
</head>
<body>

<div class="screen" id="screen" hidden>
  <section class="jail" role="status" aria-live="polite" aria-labelledby="label">
    <p class="jail__label" id="label"></p>
    <p class="jail__time" id="timer"></p>
    <div class="jail__line" aria-hidden="true"><div class="jail__line-fill" id="bar-fill"></div></div>
    <p class="jail__reason" id="reason" hidden></p>
    <p class="jail__note" id="note"></p>
  </section>
</div>

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const Mock = {
  delay: 50,
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    console.info(`[mock] ${event}`, data);
    return { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  labelStrong: 'A-Jail',
  labelRest: ', noch',
  reason: (reason, by) => `Grund: ${reason}${by ? ` · von ${by}` : ''}`,
  note: 'Du kommst hier nicht raus. Die Zeit läuft nur, solange du online bist.',
};

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const TICK_MS = 1000;
const MS_PER_SECOND = 1000;
const SECONDS_PER_MINUTE = 60;
const SECONDS_PER_HOUR = 3600;

const state = {
  open: false,
  endsAt: 0,   // Date.now() in ms
  total: 0,    // Sekunden
  reason: '',
  by: '',
};

const el = {
  screen: document.getElementById('screen'),
  label: document.getElementById('label'),
  timer: document.getElementById('timer'),
  barFill: document.getElementById('bar-fill'),
  reason: document.getElementById('reason'),
  note: document.getElementById('note'),
};

let tickTimer = null;

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function secondsLeft() {
  return Math.max(0, Math.ceil((state.endsAt - Date.now()) / MS_PER_SECOND));
}

function formatTime(total) {
  const hours = Math.floor(total / SECONDS_PER_HOUR);
  const minutes = Math.floor((total % SECONDS_PER_HOUR) / SECONDS_PER_MINUTE);
  const seconds = total % SECONDS_PER_MINUTE;
  const mm = String(minutes).padStart(2, '0');
  const ss = String(seconds).padStart(2, '0');
  return hours > 0 ? `${hours}:${mm}:${ss}` : `${mm}:${ss}`;
}

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;
  const left = secondsLeft();
  setText(el.timer, formatTime(left));
  // Balken zeigt, wie viel schon abgesessen ist
  const served = state.total > 0 ? Math.min(1, Math.max(0, 1 - left / state.total)) : 0;
  el.barFill.style.transform = `scaleX(${served})`;
}

function stopTick() {
  if (tickTimer) {
    clearInterval(tickTimer);
    tickTimer = null;
  }
}

function startTick() {
  stopTick();
  tickTimer = setInterval(render, TICK_MS);
}

function setRemaining(seconds) {
  state.endsAt = Date.now() + (Number(seconds) || 0) * MS_PER_SECOND;
}

Bridge.on('jail_open', (data) => {
  applyColors(data.colors);
  state.open = true;
  setRemaining(data.remaining);
  state.total = Number(data.total) || 0;
  state.reason = typeof data.reason === 'string' ? data.reason : '';
  state.by = typeof data.by === 'string' ? data.by : '';
  el.reason.hidden = !state.reason;
  setText(el.reason, state.reason ? TEXT.reason(state.reason, state.by) : '');
  render();
  startTick();
});

Bridge.on('jail_update', (data) => {
  if (!state.open || typeof data.remaining !== 'number') return;
  setRemaining(data.remaining);
  render();
});

Bridge.on('jail_close', () => {
  state.open = false;
  stopTick();
  render();
});

{
  const strong = document.createElement('strong');
  strong.textContent = TEXT.labelStrong;
  el.label.replaceChildren(strong, TEXT.labelRest);
}
setText(el.note, TEXT.note);
Bridge.send('ui_ready', { ui: 'jail', version: CONTRACT_VERSION });

if (Bridge.platform === 'mock') {
  // Im Browser: 30 Minuten A-Jail, 12 davon abgesessen
  Mock.push('jail_open', {
    colors: { base: '16 17 20', ink: '255 245 236', accent: '231 62 192', signal: '244 67 54' },
    remaining: 18 * 60 + 24,
    total: 30 * 60,
    reason: 'Metagaming im Funk',
    by: 'Kemal Arslan',
  });
}
</script>
</body>
</html>
