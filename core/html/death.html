<!DOCTYPE html>
<!--
  UI: Bewusstlos-Anzeige
  CONTRACT_VERSION: 1
  Reine Anzeige ohne Maus- und Tastaturfokus. Die Taste liest Lua direkt aus dem Spiel.

  EINGEHEND (Server -> UI)
  death_open   {
    colors: { base: string, ink: string, accent: string, signal: string },  // RGB-Kanaele
    secondsLeft: number,   // bis das Krankenhaus erlaubt ist
    holdMs: number,        // so lange muss die Taste gehalten werden
    keyLabel: string       // z. B. "E"
  }
  death_update { secondsLeft?: number, holding?: boolean, error?: string }
  death_close  {}

  AUSGEHEND (UI -> Server)
  ui_ready     { ui: "death", version: 1 }

  FEHLERCODES (in death_update.error)
  not_dead, too_early, no_character, server_error, timeout
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bewusstlos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  /* Die 4 Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   14 15 18;
  --rgb-ink:    232 234 237;
  --rgb-accent: 214 164 72;
  --rgb-signal: 220 82 72;

  --c-bg:          rgb(var(--rgb-base) / 0.92);
  --c-vignette:    rgb(var(--rgb-base) / 0.55);
  --c-border:      rgb(var(--rgb-ink) / 0.12);
  --c-track:       rgb(var(--rgb-ink) / 0.10);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.62);
  --c-accent:      rgb(var(--rgb-accent));
  --c-signal:      rgb(var(--rgb-signal));
  --c-key-bg:      rgb(var(--rgb-ink) / 0.10);

  --shadow-panel: 0 12px 36px rgb(var(--rgb-base) / 0.5);

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px;

  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-sm: clamp(12px, 0.65vw, 14px);
  --fs-md: clamp(14px, 0.75vw, 16px);
  --fs-xl: clamp(21px, 1.25vw, 26px);

  --dur-fast: 120ms; --dur-panel: 240ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-overlay: 10;

  --panel-width: clamp(320px, 24vw, 460px);
  --panel-bottom: clamp(48px, 9vh, 120px);
  --bar-height: 6px;
  --key-size: clamp(26px, 1.5vw, 32px);
  --hold-ms: 1500ms;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  /* Ränder abdunkeln, Mitte bleibt sichtbar */
  background: radial-gradient(ellipse at center, transparent 45%, var(--c-vignette) 100%);
  pointer-events: none;
}
.screen[hidden] { display: none; }

.panel {
  position: absolute;
  left: 50%;
  bottom: var(--panel-bottom);
  width: var(--panel-width);
  transform: translateX(-50%);
  padding: var(--space-5);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-panel);
  animation: panel-in var(--dur-panel) var(--ease-out);
}

@keyframes panel-in {
  from { opacity: 0; transform: translate(-50%, 8px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}

.title {
  margin: 0 0 var(--space-1);
  font-size: var(--fs-xl);
  font-weight: 700;
  line-height: 1.2;
}

.text {
  margin: 0 0 var(--space-4);
  font-size: var(--fs-sm);
  color: var(--c-text-muted);
  line-height: 1.5;
}

.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  min-height: var(--key-size);
  font-size: var(--fs-sm);
  font-weight: 500;
}

.row[hidden] { display: none; }

.timer {
  font-size: var(--fs-md);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.key {
  display: inline-grid;
  place-items: center;
  min-width: var(--key-size);
  height: var(--key-size);
  padding: 0 var(--space-2);
  margin: 0 var(--space-1);
  border: 1px solid var(--c-border);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  background: var(--c-key-bg);
  font-family: inherit;
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--c-text);
}

.bar {
  height: var(--bar-height);
  margin-top: var(--space-3);
  border-radius: var(--bar-height);
  background: var(--c-track);
  overflow: hidden;
}
.bar[hidden] { display: none; }
.bar__fill {
  height: 100%;
  background: var(--c-accent);
  transform: scaleX(0);
  transform-origin: left center;
}
.bar[data-holding="true"] .bar__fill {
  transform: scaleX(1);
  transition: transform var(--hold-ms) linear;
}

.error {
  margin: var(--space-3) 0 0;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--c-signal);
}
.error:empty { display: none; }

@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
}
</style>
</head>
<body>

<div class="screen" id="screen" hidden>
  <section class="panel" role="status" aria-live="polite" aria-labelledby="title">
    <h1 class="title" id="title"></h1>
    <p class="text" id="text"></p>

    <div class="row" id="row-wait">
      <span id="wait-label"></span>
      <span class="timer" id="timer"></span>
    </div>

    <div class="row" id="row-ready" hidden>
      <span id="ready-label"></span>
    </div>

    <div class="bar" id="bar" hidden><div class="bar__fill"></div></div>
    <p class="error" id="error"></p>
  </section>
</div>

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const Mock = {
  delay: 50,
  responses: {},
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    console.info(`[mock] ${event}`, data);
    return { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  title: 'Du bist bewusstlos',
  text: 'Warte auf den Rettungsdienst oder lass dich ins Krankenhaus bringen.',
  waitLabel: 'Krankenhaus möglich in',
  readyBefore: 'Halte',
  readyAfter: 'gedrückt, um im Krankenhaus aufzuwachen.',
  errors: {
    too_early: 'Noch zu früh. Die Zeit wurde neu gesetzt.',
    not_dead: 'Du bist nicht mehr bewusstlos.',
    no_character: 'Kein Charakter geladen.',
    timeout: 'Der Server antwortet nicht. Halte die Taste erneut.',
    default: 'Das hat nicht geklappt. Halte die Taste erneut.',
  },
};

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const TICK_MS = 250;
const MS_PER_SECOND = 1000;
const SECONDS_PER_MINUTE = 60;
const DEFAULT_HOLD_MS = 1500;
const DEFAULT_KEY = 'E';

const state = {
  open: false,
  readyAt: 0,       // Date.now() in ms
  holding: false,
  keyLabel: DEFAULT_KEY,
  error: '',
};

const el = {
  screen: document.getElementById('screen'),
  title: document.getElementById('title'),
  text: document.getElementById('text'),
  rowWait: document.getElementById('row-wait'),
  waitLabel: document.getElementById('wait-label'),
  timer: document.getElementById('timer'),
  rowReady: document.getElementById('row-ready'),
  readyLabel: document.getElementById('ready-label'),
  bar: document.getElementById('bar'),
  error: document.getElementById('error'),
};

let tickTimer = null;

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function secondsLeft() {
  return Math.max(0, Math.ceil((state.readyAt - Date.now()) / MS_PER_SECOND));
}

function formatTime(total) {
  const minutes = Math.floor(total / SECONDS_PER_MINUTE);
  const seconds = total % SECONDS_PER_MINUTE;
  return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
}

function renderReadyLabel() {
  const key = document.createElement('kbd');
  key.className = 'key';
  key.textContent = state.keyLabel;
  el.readyLabel.replaceChildren(TEXT.readyBefore, key, TEXT.readyAfter);
}

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;

  const left = secondsLeft();
  const ready = left === 0;

  el.rowWait.hidden = ready;
  el.rowReady.hidden = !ready;
  el.bar.hidden = !ready;
  setText(el.timer, formatTime(left));

  const holding = String(ready && state.holding);
  if (el.bar.dataset.holding !== holding) el.bar.dataset.holding = holding;
  setText(el.error, state.error);
}

function stopTick() {
  if (tickTimer) {
    clearInterval(tickTimer);
    tickTimer = null;
  }
}

function startTick() {
  stopTick();
  tickTimer = setInterval(render, TICK_MS);
}

Bridge.on('death_open', (data) => {
  applyColors(data.colors);
  state.open = true;
  state.readyAt = Date.now() + (Number(data.secondsLeft) || 0) * MS_PER_SECOND;
  state.holding = false;
  state.error = '';
  state.keyLabel = typeof data.keyLabel === 'string' && data.keyLabel ? data.keyLabel : DEFAULT_KEY;
  const holdMs = Number(data.holdMs) || DEFAULT_HOLD_MS;
  document.documentElement.style.setProperty('--hold-ms', `${holdMs}ms`);
  renderReadyLabel();
  render();
  startTick();
});

Bridge.on('death_update', (data) => {
  if (!state.open) return;
  if (typeof data.secondsLeft === 'number') {
    state.readyAt = Date.now() + data.secondsLeft * MS_PER_SECOND;
  }
  if (typeof data.holding === 'boolean') {
    state.holding = data.holding;
    if (data.holding) state.error = '';
  }
  if (typeof data.error === 'string') {
    state.error = TEXT.errors[data.error] || TEXT.errors.default;
  }
  render();
});

Bridge.on('death_close', () => {
  state.open = false;
  state.holding = false;
  stopTick();
  render();
});

setText(el.title, TEXT.title);
setText(el.text, TEXT.text);
setText(el.waitLabel, TEXT.waitLabel);
Bridge.send('ui_ready', { ui: 'death', version: CONTRACT_VERSION });

if (Bridge.platform === 'mock') {
  // Im Browser: 5 Sekunden warten, danach zeigt die Anzeige die Taste
  Mock.push('death_open', {
    colors: { base: '14 15 18', ink: '232 234 237', accent: '214 164 72', signal: '220 82 72' },
    secondsLeft: 5,
    holdMs: 1500,
    keyLabel: 'E',
  });
}
</script>
</body>
</html>
