<!DOCTYPE html>
<!--
  UI: Bewusstlos-Anzeige
  CONTRACT_VERSION: 3
  Reine Anzeige ohne Maus- und Tastaturfokus. Die Taste liest Lua direkt aus dem Spiel.

  EINGEHEND (Server -> UI)
  death_open   {
    colors: { base: string, ink: string, accent: string, signal: string },  // RGB-Kanaele
    secondsLeft: number,    // bis das Krankenhaus erlaubt ist
    totalSeconds?: number,  // ganze Wartezeit, fuer die Leiste unten
    holdMs: number,         // so lange muss die Taste gehalten werden
    keyLabel: string,       // z. B. "E"
    cause?: string,         // Todesursache aus data/weapons_gta5.lua, z. B. "Pistole" oder "Sturz"
    killerId?: number       // permanente ID des Spielers, der getoetet hat. Fehlt ohne Spieler (Sturz, eigene Schuld)
  }
  death_update { secondsLeft?: number, holding?: boolean, error?: string }
  death_close  {}

  AUSGEHEND (UI -> Server)
  ui_ready     { ui: "death", version: 3 }

  FEHLERCODES (in death_update.error)
  not_dead, too_early, no_character, server_error, timeout
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bewusstlos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">

<style>
:root {
  /* Die 4 Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   14 15 18;
  --rgb-ink:    232 234 237;
  --rgb-accent: 214 164 72;
  --rgb-signal: 220 82 72;

  --c-shade-top:   rgb(var(--rgb-base) / 0.35);
  --c-shade-edge:  rgb(var(--rgb-base) / 0.82);
  --c-shade-floor: rgb(var(--rgb-base) / 0.92);
  --c-glow:        rgb(var(--rgb-signal) / 0.26);
  --c-surface:     rgb(var(--rgb-ink) / 0.06);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.10);
  --c-border:      rgb(var(--rgb-ink) / 0.12);
  --c-track:       rgb(var(--rgb-ink) / 0.08);
  --c-text:        rgb(var(--rgb-ink) / 0.96);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.62);
  --c-text-faint:  rgb(var(--rgb-ink) / 0.40);
  --c-title-low:   rgb(var(--rgb-ink) / 0.68);
  --c-line:        rgb(var(--rgb-ink) / 0.32);
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-line: rgb(var(--rgb-signal) / 0.7);
  --c-on-signal:   rgb(var(--rgb-ink));

  --shadow-text: 0 2px 10px rgb(var(--rgb-base) / 0.55);
  --shadow-btn:  0 8px 24px rgb(var(--rgb-signal) / 0.28);

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;

  --radius-sm: 6px; --radius-md: 8px;

  --fs-xs: clamp(11px, 0.6vw, 13px);
  --fs-sm: clamp(12px, 0.7vw, 14px);
  --fs-md: clamp(14px, 0.85vw, 17px);
  --fs-lg: clamp(16px, 1.05vw, 21px);
  --fs-title: clamp(52px, 5.6vw, 112px);
  --fs-lead: clamp(24px, 2.3vw, 44px);

  --dur-fast: 120ms; --dur-panel: 320ms; --dur-pulse: 1600ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-overlay: 10;

  --edge: clamp(24px, 3vw, 64px);
  --bottom-gap: clamp(32px, 6vh, 72px);
  --text-width: min(560px, 40vw);
  --ecg-width: clamp(60px, 7vw, 170px);
  --ecg-height: clamp(28px, 3vw, 52px);
  --icon-box: clamp(28px, 1.8vw, 36px);
  --btn-height: clamp(42px, 2.6vw, 50px);
  --btn-width: clamp(220px, 15vw, 300px);
  --key-size: clamp(24px, 1.5vw, 30px);
  --bar-height: 3px;
  --grid-size: clamp(40px, 3.4vw, 72px);
  --grid-height: 52vh;
  --c-grid: rgb(var(--rgb-ink) / 0.07);
  --skull-size: clamp(40px, 3vw, 58px);
  --beam-height: clamp(28px, 5vh, 64px);
  --hold-ms: 1500ms;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

.icon { display: block; flex: none; }
.icon--line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  pointer-events: none;
  /* Spielbild abdunkeln: Raender und Boden stark, Mitte oben leicht */
  background:
    linear-gradient(to top, var(--c-glow) 0%, transparent 24%),
    linear-gradient(to top, var(--c-shade-floor) 0%, transparent 58%),
    radial-gradient(ellipse 80% 70% at 50% 32%, var(--c-shade-top) 0%, var(--c-shade-edge) 100%);
  animation: fade-in var(--dur-panel) var(--ease-out);
}
.screen[hidden] { display: none; }

@keyframes fade-in {
  from { opacity: 0; }
  to   { opacity: 1; }
}

/* ---------- Oben: Symbol ---------- */

.mark {
  position: absolute;
  top: 0;
  left: 50%;
  display: grid;
  justify-items: center;
  transform: translateX(-50%);
}
.mark__beam {
  width: 2px;
  height: var(--beam-height);
  background: linear-gradient(to bottom, transparent, var(--c-line));
}
.mark__skull {
  width: var(--skull-size);
  height: var(--skull-size);
  margin-top: var(--space-1);
  color: var(--c-text);
  filter: drop-shadow(0 4px 18px rgb(var(--rgb-base) / 0.7));
}
.mark__skull .hole { fill: rgb(var(--rgb-base)); }

/* ---------- Unten: drei Spalten ---------- */

.stage {
  position: absolute;
  left: var(--edge);
  right: var(--edge);
  bottom: var(--bottom-gap);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: end;
  gap: var(--space-6);
}

/* Mitte */

.center {
  display: grid;
  justify-items: center;
  gap: var(--space-4);
  text-align: center;
}

.headline {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.ecg {
  width: var(--ecg-width);
  height: var(--ecg-height);
  flex: none;
  overflow: visible;
  animation: pulse var(--dur-pulse) var(--ease-out) infinite;
}
.ecg path { fill: none; stroke: var(--c-signal-line); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }

/* Der Puls ist ein echter Zustand: Man lebt noch */
@keyframes pulse {
  0%, 100% { opacity: 0.55; }
  18%      { opacity: 1; }
}

.title-wrap { position: relative; }

.lead {
  position: absolute;
  left: 0;
  top: 0;
  margin: 0;
  font-size: var(--fs-lead);
  font-weight: 600;
  font-style: italic;
  color: var(--c-signal);
  transform: translate(-12%, -62%) rotate(-6deg);
  transform-origin: left bottom;
  white-space: nowrap;
  text-shadow: var(--shadow-text);
}

.title {
  margin: 0;
  font-size: var(--fs-title);
  font-weight: 800;
  line-height: 0.92;
  letter-spacing: -0.02em;
  text-transform: uppercase;
  background: linear-gradient(to bottom, var(--c-text) 35%, var(--c-title-low) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.text {
  max-width: var(--text-width);
  margin: 0;
  font-size: var(--fs-sm);
  font-weight: 500;
  line-height: 1.55;
  color: var(--c-text-muted);
  text-wrap: balance;
}

.action {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: var(--btn-width);
  height: var(--btn-height);
  margin-top: var(--space-2);
  padding: 0 var(--space-5);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-surface);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text-muted);
  overflow: hidden;
  isolation: isolate;
}
.action[data-ready="true"] {
  border-color: transparent;
  background: var(--c-signal);
  color: var(--c-on-signal);
  box-shadow: var(--shadow-btn);
}
.action__timer { color: var(--c-text); font-weight: 700; font-variant-numeric: tabular-nums; }

/* Fuellt sich, solange die Taste gehalten wird */
.action__fill {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: rgb(var(--rgb-ink) / 0.22);
  transform: scaleX(0);
  transform-origin: left center;
}
.action[data-holding="true"] .action__fill {
  transform: scaleX(1);
  transition: transform var(--hold-ms) linear;
}

.key {
  display: inline-grid;
  place-items: center;
  min-width: var(--key-size);
  height: var(--key-size);
  padding: 0 var(--space-2);
  border: 1px solid rgb(var(--rgb-ink) / 0.5);
  border-bottom-width: 2px;
  border-radius: var(--radius-sm);
  font-family: inherit;
  font-size: var(--fs-xs);
  font-weight: 700;
}

.error {
  min-height: 1.3em;
  margin: 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-signal);
}

/* Rechts: Ursache und Zeit */

.facts {
  justify-self: end;
  display: grid;
  gap: var(--space-5);
  margin: 0;
  text-align: right;
}
.fact { display: grid; gap: var(--space-2); justify-items: end; }
.fact[hidden] { display: none; }
.fact dt { font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-muted); }
.fact dd {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin: 0;
  font-size: var(--fs-lg);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  text-shadow: var(--shadow-text);
}
.fact__value { max-width: clamp(140px, 14vw, 260px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fact__icon {
  display: grid;
  place-items: center;
  width: var(--icon-box);
  height: var(--icon-box);
  flex: none;
  border: 1px solid var(--c-border);
  border-radius: var(--radius-sm);
  background: var(--c-surface-hi);
  color: var(--c-text);
}
.fact__icon svg { width: 58%; height: 58%; }

/* Karo-Raster im roten Schein unten, laeuft nach oben und zu den Seiten aus */

.grid {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--grid-height);
  background-image:
    linear-gradient(var(--c-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--c-grid) 1px, transparent 1px);
  background-size: var(--grid-size) var(--grid-size);
  background-position: center bottom;
  -webkit-mask-image: radial-gradient(ellipse 55% 100% at 50% 100%, #000 0%, #000 35%, transparent 100%);
  mask-image: radial-gradient(ellipse 55% 100% at 50% 100%, #000 0%, #000 35%, transparent 100%);
}

/* Ganz unten: Wartezeit bis zum Krankenhaus */

.progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: var(--bar-height);
  background: var(--c-track);
}
.progress__fill {
  height: 100%;
  background: var(--c-signal);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 250ms linear;
}

@media (prefers-reduced-motion: reduce) {
  .screen, .ecg { animation: none; }
  .progress__fill { transition: none; }
}
</style>
</head>
<body>

<div class="screen" id="screen" hidden>
  <div class="grid" aria-hidden="true"></div>

  <div class="mark" aria-hidden="true">
    <span class="mark__beam"></span>
    <svg class="icon mark__skull" viewBox="0 0 24 24">
      <path fill="currentColor" d="M12 2.5c-4.7 0-8 3.3-8 7.9 0 2.5 1.1 4.5 2.9 5.7v2.6c0 .9.7 1.6 1.6 1.6h7c.9 0 1.6-.7 1.6-1.6v-2.6c1.8-1.2 2.9-3.2 2.9-5.7 0-4.6-3.3-7.9-8-7.9Z"/>
      <circle class="hole" cx="8.8" cy="11.2" r="2.1"/>

<script id="bridge">
const CONTRACT_VERSION = 3;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const Mock = {
  delay: 50,
  responses: {},
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    console.info(`[mock] ${event}`, data);
    return { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  lead: 'Du bist',
  title: 'Bewusstlos',
  text: 'Bleib liegen und warte auf den Rettungsdienst. Kommt niemand, kannst du dich nach Ablauf der Zeit ins Krankenhaus bringen lassen.',
  waitLabel: 'Krankenhaus möglich in',
  readyAfter: 'halten: ins Krankenhaus',
  holding: 'Halten…',
  causeLabel: 'Ursache',
  causeUnknown: 'Unbekannt',
  killerLabel: 'Getötet von',
  killerValue: (id) => `ID ${id}`,
  timeLabel: 'Zeitpunkt',
  sinceLabel: 'Bewusstlos seit',
  errors: {
    too_early: 'Noch zu früh. Die Zeit wurde neu gesetzt.',
    not_dead: 'Du bist nicht mehr bewusstlos.',
    no_character: 'Kein Charakter geladen.',
    timeout: 'Der Server antwortet nicht. Halte die Taste erneut.',
    default: 'Das hat nicht geklappt. Halte die Taste erneut.',
  },
};

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const TICK_MS = 250;
const MS_PER_SECOND = 1000;
const SECONDS_PER_MINUTE = 60;
const DEFAULT_HOLD_MS = 1500;
const DEFAULT_KEY = 'E';

const state = {
  open: false,
  readyAt: 0,       // Date.now() in ms
  startedAt: 0,
  totalSeconds: 0,
  holding: false,
  keyLabel: DEFAULT_KEY,
  error: '',
  rendered: { ready: null, holding: null },
};

const el = {
  screen: document.getElementById('screen'),
  lead: document.getElementById('lead'),
  title: document.getElementById('title'),
  text: document.getElementById('text'),
  action: document.getElementById('action'),
  actionLabel: document.getElementById('action-label'),
  error: document.getElementById('error'),
  cause: document.getElementById('cause'),
  killerRow: document.getElementById('killer-row'),
  killer: document.getElementById('killer'),
  time: document.getElementById('time'),
  since: document.getElementById('since'),
  progress: document.getElementById('progress'),
};

const clockFormat = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' });

let tickTimer = null;

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function secondsLeft() {
  return Math.max(0, Math.ceil((state.readyAt - Date.now()) / MS_PER_SECOND));
}

function formatDuration(total) {
  const minutes = Math.floor(total / SECONDS_PER_MINUTE);
  const seconds = total % SECONDS_PER_MINUTE;
  return `${minutes}:${String(seconds).padStart(2, '0')}`;
}

/* ---------- Anzeige ---------- */

function renderAction(ready) {
  const holding = ready && state.holding;
  if (state.rendered.ready === ready && state.rendered.holding === holding) {
    if (!ready) setText(el.actionLabel.querySelector('.action__timer'), formatDuration(secondsLeft()));
    return;
  }
  state.rendered = { ready, holding };
  el.action.dataset.ready = String(ready);
  el.action.dataset.holding = String(holding);
  if (!ready) {
    const timer = document.createElement('span');
    timer.className = 'action__timer';
    timer.textContent = formatDuration(secondsLeft());
    el.actionLabel.replaceChildren(`${TEXT.waitLabel} `, timer);
  } else if (holding) {
    el.actionLabel.replaceChildren(TEXT.holding);
  } else {
    const key = document.createElement('kbd');
    key.className = 'key';
    key.textContent = state.keyLabel;
    el.actionLabel.replaceChildren(key, ` ${TEXT.readyAfter}`);
  }
}

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;

  const left = secondsLeft();
  renderAction(left === 0);
  setText(el.since, formatDuration(Math.max(0, Math.floor((Date.now() - state.startedAt) / MS_PER_SECOND))));
  setText(el.error, state.error);

  const progress = state.totalSeconds > 0 ? Math.min(1, Math.max(0, 1 - left / state.totalSeconds)) : (left === 0 ? 1 : 0);
  const transform = `scaleX(${progress.toFixed(4)})`;
  if (el.progress.style.transform !== transform) el.progress.style.transform = transform;
}

function stopTick() {
  if (tickTimer) {
    clearInterval(tickTimer);
    tickTimer = null;
  }
}

function startTick() {
  stopTick();
  tickTimer = setInterval(render, TICK_MS);
}

Bridge.on('death_open', (data) => {
  applyColors(data.colors);
  const now = Date.now();
  const seconds = Math.max(0, Number(data.secondsLeft) || 0);
  state.open = true;
  state.startedAt = now;
  state.readyAt = now + seconds * MS_PER_SECOND;
  state.totalSeconds = Math.max(seconds, Number(data.totalSeconds) || 0);
  state.holding = false;
  state.error = '';
  state.rendered = { ready: null, holding: null };
  state.keyLabel = typeof data.keyLabel === 'string' && data.keyLabel ? data.keyLabel : DEFAULT_KEY;
  document.documentElement.style.setProperty('--hold-ms', `${Number(data.holdMs) || DEFAULT_HOLD_MS}ms`);
  setText(el.cause, typeof data.cause === 'string' && data.cause ? data.cause : TEXT.causeUnknown);
  el.cause.title = el.cause.textContent;
  setText(el.time, clockFormat.format(new Date(now)));
  const killerId = Number(data.killerId);
  el.killerRow.hidden = !(Number.isInteger(killerId) && killerId > 0);
  setText(el.killer, el.killerRow.hidden ? '' : TEXT.killerValue(killerId));
  render();
  startTick();
});

Bridge.on('death_update', (data) => {
  if (!state.open) return;
  if (typeof data.secondsLeft === 'number') {
    state.readyAt = Date.now() + data.secondsLeft * MS_PER_SECOND;
  }
  if (typeof data.holding === 'boolean') {
    state.holding = data.holding;
    if (data.holding) state.error = '';
  }
  if (typeof data.error === 'string') {
    state.error = TEXT.errors[data.error] || TEXT.errors.default;
  }
  render();
});

Bridge.on('death_close', () => {
  state.open = false;
  state.holding = false;
  stopTick();
  render();
});

// Feste Texte einmal setzen
setText(el.lead, TEXT.lead);
setText(el.title, TEXT.title);
setText(el.text, TEXT.text);
setText(document.getElementById('killer-label'), TEXT.killerLabel);
setText(document.getElementById('cause-label'), TEXT.causeLabel);
setText(document.getElementById('time-label'), TEXT.timeLabel);
setText(document.getElementById('since-label'), TEXT.sinceLabel);
Bridge.send('ui_ready', { ui: 'death', version: CONTRACT_VERSION });

if (Bridge.platform === 'mock') {
  // Im Browser: #bereit zeigt gleich die Taste, #halten den Haltevorgang, sonst 45 Sekunden Wartezeit
  const ready = location.hash === '#bereit' || location.hash === '#halten';
  Mock.push('death_open', {
    colors: { base: '14 15 18', ink: '232 234 237', accent: '214 164 72', signal: '220 82 72' },
    secondsLeft: ready ? 0 : 45,
    totalSeconds: 60,
    holdMs: 1500,
    keyLabel: 'E',
    cause: 'Pistole',
    killerId: 17,
  });
  if (location.hash === '#halten') Mock.push('death_update', { holding: true });
}
</script>
</body>
</html>
