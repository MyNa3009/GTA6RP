<!DOCTYPE html>
<!--
  UI: Charakterauswahl
  CONTRACT_VERSION: 1

  EINGEHEND (Server -> UI)
  char_open {
    serverName: string,
    colors: { base: string, ink: string, accent: string, signal: string },  // RGB-Kanaele, z. B. "231 62 192"
    currency: string,                // ISO-Code, z. B. "USD"
    maxCharacters: number,
    rules: { nameMinLength: number, nameMaxLength: number, minAge: number, maxAge: number },
    characters: Character[],
    error?: string,                  // Fehlercode, wenn die Liste nicht geladen werden konnte
    notice?: string                  // Hinweis oben, z. B. "character_banned" nach einem Kick
  }
  char_close {}

  Character {
    id: number, firstname: string, lastname: string,
    dateOfBirth: string,             // "YYYY-MM-DD"
    gender: "male" | "female",
    job: string, jobGrade: number,
    cash: number, bank: number,
    lastPlayed?: number,             // Unix-Zeit in Millisekunden
    ban?: { id: number, reason: string, expiresAt?: number }   // gesperrt, ohne expiresAt = permanent
  }

  AUSGEHEND (UI -> Server), Antwort immer { ok: boolean, data?: any, error?: string }
  ui_ready     { ui: "char", version: 1 }
  char_create  { firstname: string, lastname: string, dateOfBirth: string, gender: string }
               -> data: { characterId: number, characters: Character[] }
  char_delete  { id: number }  -> data: { characters: Character[] }
  char_play    { id: number }  -> danach schliesst Lua die UI mit char_close
                               Fehler character_banned liefert data.ban
  char_logout  {}              -> danach oeffnet Lua den Login
  char_reload  {}              -> Lua schickt char_open erneut

  FEHLERCODES
  invalid_firstname, invalid_lastname, invalid_date_of_birth, too_young, too_old, invalid_gender,
  name_taken, max_characters, not_found, already_playing, not_logged_in, character_banned,
  db_error, server_error, timeout, bridge_error, client_error

  HINWEIS ESCAPE
  Escape schliesst die Auswahl bewusst nicht, weil ohne Charakter nicht gespielt werden kann.
  Escape bricht das Loeschen ab bzw. verlaesst das Formular "Neuer Charakter".
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charakterauswahl</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Die 4 Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   16 17 20;
  --rgb-ink:    255 245 236;
  --rgb-accent: 231 62 192;
  --rgb-signal: 244 67 54;

  /* Abgeleitete Stufen, nur ueber Alpha */
  --c-bg:          rgb(var(--rgb-base) / 0.96);
  --c-scrim:       rgb(var(--rgb-base) / 0.45);
  --c-sunken:      rgb(var(--rgb-base) / 0.35);
  --c-surface:     rgb(var(--rgb-ink) / 0.05);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.09);
  --c-border:      rgb(var(--rgb-ink) / 0.10);
  --c-border-hi:   rgb(var(--rgb-ink) / 0.20);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-2:      rgb(var(--rgb-ink) / 0.72);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.16);
  --c-accent-line: rgb(var(--rgb-accent) / 0.55);
  --c-on-accent:   rgb(var(--rgb-base));
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-soft: rgb(var(--rgb-signal) / 0.12);
  --c-signal-line: rgb(var(--rgb-signal) / 0.35);

  --shadow-panel: 0 16px 48px rgb(var(--rgb-base) / 0.55);

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px; --space-8: 64px;

  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 999px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-sm: clamp(12px, 0.65vw, 14px);
  --fs-md: clamp(14px, 0.75vw, 16px);
  --fs-lg: clamp(17px, 0.95vw, 20px);
  --fs-xl: clamp(21px, 1.25vw, 26px);
  --fs-2xl: clamp(26px, 1.8vw, 38px);

  --dur-fast: 120ms; --dur-base: 180ms; --dur-panel: 240ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-base: 1; --z-overlay: 10;

  --sheet-width: clamp(760px, 60vw, 1160px);
  --sheet-min-height: clamp(480px, 56vh, 680px);
  --sheet-pad: clamp(var(--space-6), 3vw, var(--space-8));
  --field-height: clamp(44px, 2.4vw, 48px);
  --icon-size: 20px;
  --text-max: 52ch;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input { font: inherit; color: inherit; }

/* ---------- Bildschirm und Karte ---------- */

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: grid;
  place-items: center;
  padding: var(--space-5);
  background: var(--c-scrim);
}
.screen[hidden] { display: none; }

.sheet {
  width: min(var(--sheet-width), 100%);
  min-height: var(--sheet-min-height);
  max-height: calc(100vh - 2 * var(--space-5));
  display: grid;
  grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-panel);
  overflow: hidden;
  animation: sheet-in var(--dur-panel) var(--ease-out);
}

@keyframes sheet-in {
  from { opacity: 0; transform: translateY(8px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ---------- Linke Seite: Liste ---------- */

.sheet__aside {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  min-height: 0;
  padding: var(--sheet-pad);
  background-color: var(--c-surface);
  border-right: 1px solid var(--c-border);
}

.aside__top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
}

.brand {
  margin: 0;
  font-size: var(--fs-lg);
  font-weight: 700;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Belegte Plaetze: schlichter Text, kein Abzeichen */
.pill {
  margin: 0;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.aside__title {
  margin: var(--space-2) 0 0;
  font-size: var(--fs-lg);
  font-weight: 700;
  text-wrap: balance;
}

.chars {
  list-style: none;
  margin: 0;
  padding: 0;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

/* Zeilen statt Karten: Auswahl ueber Hintergrund und Schriftgewicht */
.char {
  width: 100%;
  display: flex;
  align-items: center;
  padding: var(--space-3) var(--space-4);
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.char:hover:not(:disabled) { background: var(--c-surface); }
.char:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.char:disabled { cursor: default; opacity: 0.6; }
.char[aria-pressed="true"] { background: var(--c-surface-hi); }

.char__text {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.char__name, .char__meta {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.char__name { font-size: var(--fs-md); font-weight: 600; }
.char__meta { font-size: var(--fs-xs); color: var(--c-text-2); font-variant-numeric: tabular-nums; }

.char--banned .char__meta { color: var(--c-signal); font-weight: 600; }

.char--new { color: var(--c-text-2); }
.char--new:hover:not(:disabled) { color: var(--c-text); }

.aside__foot {
  padding-top: var(--space-4);
  border-top: 1px solid var(--c-border);
}

/* ---------- Rechte Seite: Ansichten ---------- */

.sheet__main {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 0;
  overflow-y: auto;
  padding: var(--sheet-pad);
}

.view[hidden] { display: none; }

.eyebrow {
  margin: 0 0 var(--space-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-text-muted);
  font-variant-numeric: tabular-nums;
}

.title {
  margin: 0 0 var(--space-3);
  font-size: var(--fs-2xl);
  font-weight: 700;
  line-height: 1.15;
  text-wrap: balance;
  overflow-wrap: anywhere;
}

.intro {
  margin: 0 0 var(--space-6);
  max-width: var(--text-max);
  font-size: var(--fs-md);
  line-height: 1.55;
  color: var(--c-text-2);
}

.facts {
  margin: var(--space-5) 0 var(--space-6);
  padding: var(--space-5) 0;
  border-top: 1px solid var(--c-border);
  border-bottom: 1px solid var(--c-border);
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-5) var(--space-5);
}
.fact { min-width: 0; }
.fact dt {
  margin-bottom: var(--space-1);
  font-size: var(--fs-xs);
  font-weight: 500;
  color: var(--c-text-2);
}
.fact dd {
  margin: 0;
  font-size: var(--fs-md);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.actions {
  display: flex;
  align-items: center;
  gap: var(--space-5);
  flex-wrap: wrap;
}

.danger-zone {
  display: flex;
  align-items: center;
  min-height: var(--field-height);
  margin-top: var(--space-4);
}

/* ---------- Formular ---------- */

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-5) var(--space-4);
}
.grid-span { grid-column: 1 / -1; }

.field { display: flex; flex-direction: column; gap: var(--space-2); min-width: 0; margin: 0; padding: 0; border: 0; }

.field__label {
  padding: 0;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text);
}

.input {
  width: 100%;
  height: var(--field-height);
  padding: 0 var(--space-4);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  font-size: var(--fs-md);
  font-weight: 500;
  color-scheme: dark;
  transition: border-color var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.input::placeholder { color: var(--c-text-muted); }
.input:hover { border-color: var(--c-border-hi); }
.input:focus-visible {
  outline: none;
  border-color: var(--c-accent);
  background: var(--c-surface-hi);
  box-shadow: 0 0 0 3px var(--c-accent-soft);
}
.input[aria-invalid="true"] { border-color: var(--c-signal); }
.input[aria-invalid="true"]:focus-visible { box-shadow: 0 0 0 3px var(--c-signal-soft); }

legend.field__label { margin-bottom: var(--space-2); }

.segmented {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-1);
  height: var(--field-height);
  padding: var(--space-1);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
}
.field[aria-invalid="true"] .segmented { border-color: var(--c-signal); }

.seg { position: relative; display: grid; cursor: pointer; }
.seg input {
  position: absolute;
  inset: 0;
  opacity: 0;
  margin: 0;
  cursor: pointer;
}
.seg span {
  display: grid;
  place-items: center;
  border-radius: calc(var(--radius-md) - var(--space-1));
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text-2);
  transition: background-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.seg:hover span { color: var(--c-text); }
.seg input:checked + span { background: var(--c-surface-hi); color: var(--c-text); }
.seg input:focus-visible + span { outline: 2px solid var(--c-accent); outline-offset: 1px; }

.field__hint, .field__error {
  margin: 0;
  font-size: var(--fs-xs);
  line-height: 1.45;
}
.field__hint { color: var(--c-text-muted); }
.field__error { color: var(--c-signal); font-weight: 500; }
.field__error:empty { display: none; }

.form__footer {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-top: var(--space-6);
}

/* ---------- Meldungen und Buttons ---------- */

.message {
  margin: 0 0 var(--space-5);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  font-size: var(--fs-sm);
  font-weight: 500;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.message:empty { display: none; }
.form__footer .message { margin: 0; }
.message[data-tone="error"]   { background: var(--c-signal-soft); border: 1px solid var(--c-signal-line); }
.message[data-tone="success"] { background: var(--c-accent-soft); border: 1px solid var(--c-accent-line); }

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-width: min(100%, 240px);
  height: var(--field-height);
  padding: 0 var(--space-6);
  border: 0;
  border-radius: var(--radius-md);
  background: var(--c-accent);
  color: var(--c-on-accent);
  font-size: var(--fs-md);
  font-weight: 700;
  cursor: pointer;
  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:focus-visible { outline: 2px solid var(--c-text); outline-offset: 3px; }
.btn-primary:disabled { opacity: 0.5; cursor: default; transform: none; }
.btn-primary[aria-busy="true"] { cursor: progress; }

.link {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  border: 0;
  background: transparent;
  padding: var(--space-2) 0;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-text-2);
  cursor: pointer;
  transition: color var(--dur-fast) var(--ease-out);
}
.link:hover:not(:disabled) { color: var(--c-text); }
.link:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; border-radius: var(--radius-sm); }
.link:disabled { opacity: 0.5; cursor: default; }
.link[hidden] { display: none; }
.link--danger { color: var(--c-signal); }
.link--danger:hover:not(:disabled) { color: var(--c-signal); text-decoration: underline; }

.confirm { display: flex; align-items: center; gap: var(--space-4); flex-wrap: wrap; }
.confirm[hidden] { display: none; }
.confirm__text { font-size: var(--fs-sm); font-weight: 500; overflow-wrap: anywhere; }
.confirm__actions { display: inline-flex; gap: var(--space-4); }

/* Schmale Fenster: Spalten untereinander */
@media (max-width: 820px) {
  .sheet { grid-template-columns: 1fr; overflow-y: auto; }
  .sheet__aside { border-right: 0; border-bottom: 1px solid var(--c-border); }
  .chars { flex: none; overflow: visible; }
  .grid-2, .facts { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  .sheet { animation: none; }
  * { transition-duration: 0ms !important; }
}
</style>
</head>
<body>

<div class="screen" id="screen" hidden>
  <main class="sheet" role="dialog" aria-modal="true" aria-labelledby="aside-title">

    <aside class="sheet__aside">
      <div class="aside__top">
        <p class="brand" id="server-name"></p>
        <p class="pill" id="slots"></p>
      </div>

      <h1 class="aside__title" id="aside-title"></h1>

      <ul class="chars" id="chars" aria-labelledby="aside-title"></ul>

      <footer class="aside__foot">
        <button class="link" type="button" data-action="logout" id="logout">
          <span id="logout-label"></span>
        </button>
      </footer>
    </aside>

    <section class="sheet__main">

      <!-- Ansicht: Details -->
      <div class="view" id="view-detail" hidden>
        <p class="eyebrow" id="detail-id"></p>
        <h2 class="title" id="detail-name"></h2>

        <dl class="facts">
          <div class="fact"><dt id="label-dob"></dt><dd id="detail-dob"></dd></div>
          <div class="fact"><dt id="label-gender"></dt><dd id="detail-gender"></dd></div>
          <div class="fact"><dt id="label-job"></dt><dd id="detail-job"></dd></div>
          <div class="fact"><dt id="label-last"></dt><dd id="detail-last"></dd></div>
          <div class="fact"><dt id="label-cash"></dt><dd id="detail-cash"></dd></div>
          <div class="fact"><dt id="label-bank"></dt><dd id="detail-bank"></dd></div>
        </dl>

        <p class="message" id="detail-message" role="status" aria-live="polite"></p>
        <p class="message" id="detail-ban" data-tone="error"></p>

        <div class="actions">
          <button class="btn-primary" type="button" data-action="play" id="play">
            <span id="play-label"></span>
          </button>
        </div>

        <div class="danger-zone">
          <button class="link link--danger" type="button" data-action="delete" id="delete"></button>
          <div class="confirm" id="confirm" hidden>
            <span class="confirm__text" id="confirm-text"></span>
            <span class="confirm__actions">
              <button class="link link--danger" type="button" data-action="delete-yes" id="delete-yes"></button>
              <button class="link" type="button" data-action="delete-no" id="delete-no"></button>
            </span>
          </div>
        </div>
      </div>

      <!-- Ansicht: Neuer Charakter -->
      <form class="view" id="view-create" novalidate hidden>
        <h2 class="title" id="create-title"></h2>
        <p class="intro" id="create-intro"></p>

        <div class="grid-2">
          <div class="field">
            <label class="field__label" for="firstname" id="label-firstname"></label>
            <input class="input" id="firstname" name="firstname" type="text" autocomplete="off"
                   spellcheck="false" aria-describedby="name-hint firstname-error">
            <p class="field__error" id="firstname-error"></p>
          </div>

          <div class="field">
            <label class="field__label" for="lastname" id="label-lastname"></label>
            <input class="input" id="lastname" name="lastname" type="text" autocomplete="off"
                   spellcheck="false" aria-describedby="name-hint lastname-error">
            <p class="field__error" id="lastname-error"></p>
          </div>

          <p class="field__hint grid-span" id="name-hint"></p>

          <div class="field">
            <label class="field__label" for="dob" id="label-dob-input"></label>
            <input class="input" id="dob" name="dob" type="date" aria-describedby="dob-hint dob-error">
            <p class="field__hint" id="dob-hint"></p>
            <p class="field__error" id="dob-error"></p>
          </div>

          <fieldset class="field" id="gender-field" aria-describedby="gender-error">
            <legend class="field__label" id="label-gender-input"></legend>
            <div class="segmented">
              <label class="seg">
                <input type="radio" name="gender" value="male">
                <span id="gender-male"></span>
              </label>
              <label class="seg">
                <input type="radio" name="gender" value="female">
                <span id="gender-female"></span>
              </label>
            </div>
            <p class="field__error" id="gender-error"></p>
          </fieldset>
        </div>

        <div class="form__footer">
          <p class="message" id="create-message" role="status" aria-live="polite"></p>
          <div class="actions">
            <button class="btn-primary" type="submit" id="create-submit">
              <span id="create-label"></span>
            </button>
            <button class="link" type="button" data-action="cancel-create" id="create-cancel"></button>
          </div>
        </div>
      </form>

      <!-- Ansicht: Liste konnte nicht geladen werden -->
      <div class="view" id="view-error" hidden>
        <h2 class="title" id="error-title"></h2>
        <p class="intro" id="error-text"></p>
        <div class="actions">
          <button class="btn-primary" type="button" data-action="reload" id="reload"></button>
        </div>
      </div>

    </section>
  </main>
</div>

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

const MOCK_HOUR_MS = 3600000;

const Mock = {
  delay: 450,
  nextId: 31,
  characters: [
    { id: 12, firstname: 'Anna', lastname: 'Krüger', dateOfBirth: '1999-03-14', gender: 'female',
      job: 'unemployed', jobGrade: 0, cash: 1240, bank: 18730, lastPlayed: Date.now() - 53 * MOCK_HOUR_MS },
    { id: 27, firstname: 'Marco', lastname: 'Hesse', dateOfBirth: '1988-11-02', gender: 'male',
      job: 'police', jobGrade: 3, cash: 85, bank: 42315, lastPlayed: Date.now() - 19 * MOCK_HOUR_MS,
      ban: { id: 14, reason: 'Powergaming bei einer Verfolgung', expiresAt: Date.now() + 70 * MOCK_HOUR_MS } },
  ],
  responses: {
    char_create(data) {
      const exists = Mock.characters.some((c) => c.firstname === data.firstname && c.lastname === data.lastname);
      if (exists) return { ok: false, error: 'name_taken' };
      const character = {
        id: Mock.nextId++, firstname: data.firstname, lastname: data.lastname, dateOfBirth: data.dateOfBirth,
        gender: data.gender, job: 'unemployed', jobGrade: 0, cash: 500, bank: 2500,
      };
      Mock.characters = [...Mock.characters, character];
      return { ok: true, data: { characterId: character.id, characters: Mock.characters } };
    },
    char_play(data) {
      const character = Mock.characters.find((c) => c.id === data.id);
      if (character && character.ban) return { ok: false, error: 'character_banned', data: { ban: character.ban } };
      return { ok: true };
    },
    char_delete(data) {
      Mock.characters = Mock.characters.filter((c) => c.id !== data.id);
      return { ok: true, data: { characters: Mock.characters } };
    },
  },
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    const fn = this.responses[event];
    console.info(`[mock] ${event}`, data);
    return fn ? fn(data) : { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const NAME_PATTERN = /^[A-Za-zÀ-ÖØ-öø-ɏ]+(?:['-][A-Za-zÀ-ÖØ-öø-ɏ]+)*$/;
const DATE_PATTERN = /^(\d{4})-(\d{2})-(\d{2})$/;
const DEFAULT_CURRENCY = 'USD';
const DEFAULT_RULES = { nameMinLength: 2, nameMaxLength: 20, minAge: 18, maxAge: 90 };
const DEFAULT_MAX_CHARACTERS = 3;

// Fehlercodes, die zu einem bestimmten Feld gehoeren
const FIELD_FOR_ERROR = {
  invalid_firstname: 'firstname',
  invalid_lastname: 'lastname',
  name_taken: 'lastname',
  invalid_date_of_birth: 'dob',
  too_young: 'dob',
  too_old: 'dob',
  invalid_gender: 'gender',
};

const emptyErrors = () => ({ firstname: '', lastname: '', dob: '', gender: '' });

const state = {
  open: false,
  serverName: '',
  currency: DEFAULT_CURRENCY,
  maxCharacters: DEFAULT_MAX_CHARACTERS,
  rules: { ...DEFAULT_RULES },
  characters: [],
  selectedId: null,
  view: 'detail',         // 'detail' | 'create' | 'error'
  busy: null,             // null | 'play' | 'create' | 'delete' | 'logout' | 'reload'
  confirmDelete: false,
  message: null,          // { view, tone: 'error' | 'success', text }
  errors: emptyErrors(),
};

const $ = (id) => document.getElementById(id);

const el = {
  screen: $('screen'),
  serverName: $('server-name'),
  slots: $('slots'),
  asideTitle: $('aside-title'),
  chars: $('chars'),
  logout: $('logout'),
  logoutLabel: $('logout-label'),
  viewDetail: $('view-detail'),
  viewCreate: $('view-create'),
  viewError: $('view-error'),
  detailId: $('detail-id'),
  detailName: $('detail-name'),
  detailDob: $('detail-dob'),
  detailGender: $('detail-gender'),
  detailJob: $('detail-job'),
  detailLast: $('detail-last'),
  detailCash: $('detail-cash'),
  detailBank: $('detail-bank'),
  detailMessage: $('detail-message'),
  detailBan: $('detail-ban'),
  play: $('play'),
  playLabel: $('play-label'),
  delete: $('delete'),
  confirm: $('confirm'),
  confirmText: $('confirm-text'),
  deleteYes: $('delete-yes'),
  deleteNo: $('delete-no'),
  createTitle: $('create-title'),
  createIntro: $('create-intro'),
  firstname: $('firstname'),
  lastname: $('lastname'),
  dob: $('dob'),
  genderField: $('gender-field'),
  nameHint: $('name-hint'),
  dobHint: $('dob-hint'),
  firstnameError: $('firstname-error'),
  lastnameError: $('lastname-error'),
  dobError: $('dob-error'),
  genderError: $('gender-error'),
  createMessage: $('create-message'),
  createSubmit: $('create-submit'),
  createLabel: $('create-label'),
  createCancel: $('create-cancel'),
  errorTitle: $('error-title'),
  errorText: $('error-text'),
  reload: $('reload'),
};

/* ---------- Hilfen ---------- */

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function errorText(code) {
  return TEXT.errors[code] || TEXT.errors.default;
}

function fullName(character) {
  return `${character.firstname} ${character.lastname}`;
}

function parseDate(value) {
  const match = DATE_PATTERN.exec(value || '');
  if (!match) return null;
  return { y: Number(match[1]), m: Number(match[2]), d: Number(match[3]) };
}

function ageFrom(value) {
  const date = parseDate(value);
  if (!date) return null;
  const now = new Date();
  const month = now.getMonth() + 1;
  let age = now.getFullYear() - date.y;
  if (month < date.m || (month === date.m && now.getDate() < date.d)) age -= 1;
  return age;
}

function isoDate(y, m, d) {
  return `${String(y).padStart(4, '0')}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}

const dateFormat = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', timeZone: 'UTC' });
const dateTimeFormat = new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
let moneyFormat = createMoneyFormat(DEFAULT_CURRENCY);

function createMoneyFormat(currency) {
  try {
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency, maximumFractionDigits: 0 });
  } catch (err) {
    console.warn(`[char] Unbekannte Waehrung ${currency}, nutze ${DEFAULT_CURRENCY}`);
    return new Intl.NumberFormat('de-DE', { style: 'currency', currency: DEFAULT_CURRENCY, maximumFractionDigits: 0 });
  }
}

function formatBirthDate(value) {
  const date = parseDate(value);
  if (!date) return value || '';
  return dateFormat.format(new Date(Date.UTC(date.y, date.m - 1, date.d)));
}

function jobLabel(job) {
  return TEXT.jobs[job] || job || TEXT.jobs.unemployed;
}

function selectedCharacter() {
  return state.characters.find((c) => c.id === state.selectedId) || null;
}

function defaultSelection(characters) {
  if (characters.length === 0) return null;
  const sorted = [...characters].sort((a, b) => (b.lastPlayed || 0) - (a.lastPlayed || 0));
  return sorted[0].id;
}

/* ---------- Rendern ---------- */

function renderStatic() {
  setText(el.asideTitle, TEXT.asideTitle);
  setText(el.logoutLabel, TEXT.logout);
  setText($('label-dob'), TEXT.labels.dob);
  setText($('label-gender'), TEXT.labels.gender);
  setText($('label-job'), TEXT.labels.job);
  setText($('label-last'), TEXT.labels.lastPlayed);
  setText($('label-cash'), TEXT.labels.cash);
  setText($('label-bank'), TEXT.labels.bank);
  setText(el.delete, TEXT.delete);
  setText(el.deleteYes, TEXT.deleteYes);
  setText(el.deleteNo, TEXT.deleteNo);
  setText($('label-firstname'), TEXT.firstname);
  setText($('label-lastname'), TEXT.lastname);
  setText($('label-dob-input'), TEXT.dob);
  setText($('label-gender-input'), TEXT.gender);
  setText($('gender-male'), TEXT.genders.male);
  setText($('gender-female'), TEXT.genders.female);
  setText(el.createCancel, TEXT.cancel);
  setText(el.errorTitle, TEXT.errorTitle);
}

function buildCharItem(character) {
  const li = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = character.ban ? 'char char--banned' : 'char';
  button.dataset.action = 'select';
  button.dataset.id = String(character.id);

  const text = document.createElement('span');
  text.className = 'char__text';
  const name = document.createElement('span');
  name.className = 'char__name';
  name.textContent = fullName(character);
  const meta = document.createElement('span');
  meta.className = 'char__meta';
  meta.textContent = character.ban ? TEXT.bannedMeta : TEXT.meta(ageFrom(character.dateOfBirth), jobLabel(character.job));
  text.append(name, meta);

  button.append(text);
  li.append(button);
  return li;
}

function buildNewItem() {
  const li = document.createElement('li');
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'char char--new';
  button.dataset.action = 'new';

  const text = document.createElement('span');
  text.className = 'char__text';
  const name = document.createElement('span');
  name.className = 'char__name';
  name.textContent = TEXT.newCharacter;
  const meta = document.createElement('span');
  meta.className = 'char__meta';
  meta.textContent = TEXT.newCharacterMeta;
  text.append(name, meta);

  button.append(text);
  li.append(button);
  return li;
}

let renderedList = null;

function renderList() {
  if (renderedList !== state.characters) {
    const items = state.characters.map(buildCharItem);
    if (state.characters.length < state.maxCharacters) items.push(buildNewItem());
    el.chars.replaceChildren(...items);
    renderedList = state.characters;
  }

  const locked = state.busy !== null;
  el.chars.querySelectorAll('.char').forEach((button) => {
    const isNew = button.dataset.action === 'new';
    const pressed = isNew
      ? state.view === 'create'
      : state.view !== 'create' && Number(button.dataset.id) === state.selectedId;
    button.setAttribute('aria-pressed', String(pressed));
    button.disabled = locked;
  });

  setText(el.slots, TEXT.slots(state.characters.length, state.maxCharacters));
}

function renderMessage(node, view) {
  const msg = state.message && state.message.view === view ? state.message : null;
  if (!msg) {
    node.replaceChildren();
    node.removeAttribute('data-tone');
    return;
  }
  node.dataset.tone = msg.tone;
  setText(node, msg.text);
}

function renderDetail() {
  const character = selectedCharacter();
  if (!character) return;

  setText(el.detailId, TEXT.characterId(character.id));
  setText(el.detailName, fullName(character));
  setText(el.detailDob, TEXT.dobValue(formatBirthDate(character.dateOfBirth), ageFrom(character.dateOfBirth)));
  setText(el.detailGender, TEXT.genders[character.gender] || character.gender);
  setText(el.detailJob, jobLabel(character.job));
  setText(el.detailLast, character.lastPlayed ? dateTimeFormat.format(new Date(character.lastPlayed)) : TEXT.never);
  setText(el.detailCash, moneyFormat.format(Number(character.cash) || 0));
  setText(el.detailBank, moneyFormat.format(Number(character.bank) || 0));

  renderMessage(el.detailMessage, 'detail');
  setText(el.detailBan, character.ban ? TEXT.ban(character.ban) : '');

  const playing = state.busy === 'play';
  setText(el.playLabel, playing ? TEXT.busyPlay : TEXT.play);
  el.play.disabled = state.busy !== null || Boolean(character.ban);
  el.play.setAttribute('aria-busy', String(playing));

  // Gesperrte Charaktere lassen sich nicht loeschen, sonst waere der Ban mit einem neuen Charakter umgangen
  el.delete.hidden = state.confirmDelete || Boolean(character.ban);
  el.delete.disabled = state.busy !== null;
  el.confirm.hidden = !state.confirmDelete;
  setText(el.confirmText, TEXT.deleteConfirm(fullName(character)));
  setText(el.deleteYes, state.busy === 'delete' ? TEXT.busyDelete : TEXT.deleteYes);
  el.deleteYes.disabled = state.busy !== null;
  el.deleteNo.disabled = state.busy !== null;
}

function renderCreate() {
  const first = state.characters.length === 0;
  setText(el.createTitle, first ? TEXT.createTitleFirst : TEXT.createTitle);
  setText(el.createIntro, first ? TEXT.createIntroFirst : TEXT.createIntro);
  setText(el.nameHint, TEXT.nameHint(state.rules.nameMinLength, state.rules.nameMaxLength));
  setText(el.dobHint, TEXT.dobHint(state.rules.minAge, state.rules.maxAge));
  el.firstname.maxLength = state.rules.nameMaxLength;
  el.lastname.maxLength = state.rules.nameMaxLength;

  const pairs = [
    [el.firstname, el.firstnameError, state.errors.firstname],
    [el.lastname, el.lastnameError, state.errors.lastname],
    [el.dob, el.dobError, state.errors.dob],
    [el.genderField, el.genderError, state.errors.gender],
  ];
  pairs.forEach(([input, out, text]) => {
    setText(out, text);
    input.setAttribute('aria-invalid', String(Boolean(text)));
  });

  renderMessage(el.createMessage, 'create');

  const creating = state.busy === 'create';
  setText(el.createLabel, creating ? TEXT.busyCreate : TEXT.createSubmit);
  el.createSubmit.disabled = state.busy !== null;
  el.createSubmit.setAttribute('aria-busy', String(creating));
  el.createCancel.hidden = first;
  el.createCancel.disabled = state.busy !== null;

  const readOnly = state.busy !== null;
  [el.firstname, el.lastname, el.dob].forEach((input) => { input.readOnly = readOnly; });
  el.viewCreate.querySelectorAll('input[name="gender"]').forEach((radio) => { radio.disabled = readOnly; });
}

function renderError() {
  renderMessage(el.errorText, 'error');
  setText(el.reload, state.busy === 'reload' ? TEXT.busyRetry : TEXT.retry);
  el.reload.disabled = state.busy !== null;
}

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;

  setText(el.serverName, state.serverName);
  el.logout.disabled = state.busy !== null;
  renderList();

  el.viewDetail.hidden = state.view !== 'detail' || !selectedCharacter();
  el.viewCreate.hidden = state.view !== 'create';
  el.viewError.hidden = state.view !== 'error';

  if (state.view === 'detail') renderDetail();
  if (state.view === 'create') renderCreate();
  if (state.view === 'error') renderError();
}

/* ---------- Ansichten wechseln ---------- */

function resetCreateForm() {
  el.viewCreate.reset();
  state.errors = emptyErrors();
}

function updateDateLimits() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  el.dob.max = isoDate(y - state.rules.minAge, m, d);
  el.dob.min = isoDate(y - state.rules.maxAge - 1, m, d);
}

function showDetail(id, message = null) {
  state.view = 'detail';
  state.selectedId = id;
  state.confirmDelete = false;
  state.message = message;
  render();
}

function showCreate(message = null) {
  state.view = 'create';
  state.confirmDelete = false;
  state.message = message;
  resetCreateForm();
  render();
  el.firstname.focus();
}

function applyList(characters, selectId, message) {
  state.characters = Array.isArray(characters) ? characters : [];
  if (state.characters.length === 0) {
    showCreate(message ? { ...message, view: 'create' } : null);
    return;
  }
  const exists = state.characters.some((c) => c.id === selectId);
  showDetail(exists ? selectId : defaultSelection(state.characters), message ? { ...message, view: 'detail' } : null);
}

/* ---------- Pruefen und Absenden ---------- */

function validateName(value, emptyText) {
  const name = value.trim();
  const length = Array.from(name).length;
  if (!name) return emptyText;
  if (length < state.rules.nameMinLength || length > state.rules.nameMaxLength) {
    return TEXT.validation.nameLength(state.rules.nameMinLength, state.rules.nameMaxLength);
  }
  if (!NAME_PATTERN.test(name)) return TEXT.validation.nameChars;
  return '';
}

function selectedGender() {
  const checked = el.viewCreate.querySelector('input[name="gender"]:checked');
  return checked ? checked.value : '';
}

function validateCreate() {
  const errors = emptyErrors();
  errors.firstname = validateName(el.firstname.value, TEXT.validation.firstnameEmpty);
  errors.lastname = validateName(el.lastname.value, TEXT.validation.lastnameEmpty);

  const age = ageFrom(el.dob.value);
  if (age === null) errors.dob = TEXT.validation.dobEmpty;
  else if (age < state.rules.minAge) errors.dob = TEXT.validation.tooYoung(state.rules.minAge);
  else if (age > state.rules.maxAge) errors.dob = TEXT.validation.tooOld(state.rules.maxAge);

  if (!selectedGender()) errors.gender = TEXT.validation.genderEmpty;

  state.errors = errors;
  return !Object.values(errors).some(Boolean);
}

function focusFirstError() {
  if (state.errors.firstname) el.firstname.focus();
  else if (state.errors.lastname) el.lastname.focus();
  else if (state.errors.dob) el.dob.focus();
  else if (state.errors.gender) el.viewCreate.querySelector('input[name="gender"]').focus();
}

async function submitCreate() {
  if (state.busy) return;
  state.message = null;

  if (!validateCreate()) {
    render();
    focusFirstError();
    return;
  }

  state.busy = 'create';
  render();

  const result = await Bridge.send('char_create', {
    firstname: el.firstname.value.trim(),
    lastname: el.lastname.value.trim(),
    dateOfBirth: el.dob.value,
    gender: selectedGender(),
  });

  state.busy = null;

  if (result && result.ok && result.data) {
    applyList(result.data.characters, result.data.characterId, { tone: 'success', text: TEXT.created });
    el.play.focus();
    return;
  }

  const code = (result && result.error) || 'default';
  if (FIELD_FOR_ERROR[code]) {
    state.errors[FIELD_FOR_ERROR[code]] = errorText(code);
    render();
    focusFirstError();
    return;
  }
  state.message = { view: 'create', tone: 'error', text: errorText(code) };
  render();
}

async function play() {
  const character = selectedCharacter();
  if (!character || state.busy) return;

  state.busy = 'play';
  state.message = null;
  render();

  const result = await Bridge.send('char_play', { id: character.id });
  if (result && result.ok) return; // Lua schliesst die UI

  state.busy = null;
  const code = (result && result.error) || 'default';
  if (code === 'character_banned' && result.data && result.data.ban) {
    character.ban = result.data.ban;
    renderedList = null;
  }
  state.message = { view: 'detail', tone: 'error', text: errorText(code) };
  render();
}

async function deleteSelected() {
  const character = selectedCharacter();
  if (!character || state.busy) return;

  state.busy = 'delete';
  render();

  const result = await Bridge.send('char_delete', { id: character.id });
  state.busy = null;
  state.confirmDelete = false;

  if (result && result.ok && result.data) {
    applyList(result.data.characters, null, { tone: 'success', text: TEXT.deleted(fullName(character)) });
    return;
  }

  const code = (result && result.error) || 'default';
  state.message = { view: 'detail', tone: 'error', text: errorText(code) };
  render();
  el.delete.focus();
}

async function logout() {
  if (state.busy) return;
  state.busy = 'logout';
  render();

  const result = await Bridge.send('char_logout', {});
  if (result && result.ok) return; // Lua oeffnet den Login

  state.busy = null;
  state.message = { view: state.view, tone: 'error', text: errorText((result && result.error) || 'default') };
  render();
}

async function reload() {
  if (state.busy) return;
  state.busy = 'reload';
  render();

  const result = await Bridge.send('char_reload', {});
  if (result && result.ok) return; // Lua schickt char_open neu

  state.busy = null;
  state.message = { view: 'error', tone: 'error', text: errorText((result && result.error) || 'default') };
  render();
}

/* ---------- Aktionen ---------- */

const ACTIONS = {
  select(target) {
    showDetail(Number(target.dataset.id));
  },
  new() {
    showCreate();
  },
  'cancel-create'() {
    showDetail(state.selectedId ?? defaultSelection(state.characters));
    el.play.focus();
  },
  play() {
    play();
  },
  delete() {
    state.confirmDelete = true;
    state.message = null;
    render();
    el.deleteNo.focus();
  },
  'delete-no'() {
    state.confirmDelete = false;
    render();
    el.delete.focus();
  },
  'delete-yes'() {
    deleteSelected();
  },
  logout() {
    logout();
  },
  reload() {
    reload();
  },
};

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target || target.disabled) return;
  const action = ACTIONS[target.dataset.action];
  if (action) action(target);
});

el.viewCreate.addEventListener('submit', (e) => {
  e.preventDefault();
  submitCreate();
});

// Fehler am Feld verschwinden, sobald man es aendert
el.viewCreate.addEventListener('input', (e) => {
  const key = { firstname: 'firstname', lastname: 'lastname', dob: 'dob', gender: 'gender' }[e.target.name];
  if (key && state.errors[key]) {
    state.errors[key] = '';
    renderCreate();
  }
});

document.addEventListener('keydown', (e) => {
  if (!state.open) return;

  if (e.key === 'Escape') {
    e.preventDefault();
    if (state.busy) return;
    if (state.confirmDelete) ACTIONS['delete-no']();
    else if (state.view === 'create' && state.characters.length > 0) ACTIONS['cancel-create']();
    return;
  }

  // Pfeiltasten in der Charakterliste
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && e.target.closest('#chars')) {
    e.preventDefault();
    const buttons = Array.from(el.chars.querySelectorAll('.char:not(:disabled)'));
    const index = buttons.indexOf(e.target.closest('.char'));
    const step = e.key === 'ArrowDown' ? 1 : -1;
    const next = buttons[(index + step + buttons.length) % buttons.length];
    if (next) {
      next.click();
      next.focus();
    }
  }
});

/* ---------- Bridge-Events ---------- */

Bridge.on('char_open', (data) => {
  applyColors(data.colors);
  state.open = true;
  state.busy = null;
  state.serverName = typeof data.serverName === 'string' ? data.serverName : '';
  state.maxCharacters = Number(data.maxCharacters) || DEFAULT_MAX_CHARACTERS;
  state.rules = { ...DEFAULT_RULES, ...(data.rules || {}) };
  if (typeof data.currency === 'string' && data.currency !== state.currency) {
    state.currency = data.currency;
    moneyFormat = createMoneyFormat(data.currency);
  }
  updateDateLimits();
  renderedList = null;

  if (data.error) {
    state.characters = [];
    state.view = 'error';
    state.message = { view: 'error', tone: 'error', text: errorText(data.error) };
    render();
    el.reload.focus();
    return;
  }

  const notice = TEXT.notices[data.notice];
  applyList(data.characters, defaultSelection(data.characters || []), notice ? { tone: 'error', text: notice } : null);
  if (state.view === 'detail' && !el.play.disabled) el.play.focus();
});

Bridge.on('char_close', () => {
  state.open = false;
  state.busy = null;
  state.confirmDelete = false;
  resetCreateForm();
  render();
});

/* ---------- Start ---------- */

renderStatic();
Bridge.send('ui_ready', { ui: 'char', version: CONTRACT_VERSION });

if (Bridge.platform === 'mock') {
  // Im Browser: zwei Beispiel-Charaktere, "Anna Krüger" ist als Name schon vergeben
  Mock.push('char_open', {
    serverName: 'Testserver',
    colors: { base: '16 17 20', ink: '255 245 236', accent: '231 62 192', signal: '244 67 54' },
    currency: 'USD',
    maxCharacters: 3,
    rules: { nameMinLength: 2, nameMaxLength: 20, minAge: 18, maxAge: 90 },
    characters: Mock.characters,
  });
}
</script>
