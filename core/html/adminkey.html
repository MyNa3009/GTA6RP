<!DOCTYPE html>
<!--
  UI: Admin-Key
  CONTRACT_VERSION: 1
  Fragt den persoenlichen Admin-Key ab. Ob er stimmt, prueft nur der Server.

  EINGEHEND (Server -> UI)
  adminkey_open  { colors: { base: string, ink: string, accent: string, signal: string }, maxAttempts: number }
  adminkey_close {}

  AUSGEHEND (UI -> Server), Antwort immer { ok: boolean, data?: any, error?: string }
  ui_ready         { ui: "adminkey", version: 1 }
  adminkey_submit  { key: string }   -> ok: data { duty: boolean }   (die Lua-Seite schliesst dann das Fenster)
                                     -> wrong_key: data { left: number }, locked: data { minutes: number }
  adminkey_close   {}

  FEHLERCODES
  wrong_key, locked, no_key, no_character, no_team_rank, closed, timeout, bridge_error
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin-Key</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Die 4 Grundfarben, werden aus der Config ueberschrieben */
  --rgb-base:   16 17 20;
  --rgb-ink:    255 245 236;
  --rgb-accent: 231 62 192;
  --rgb-signal: 244 67 54;

  --c-bg:          rgb(var(--rgb-base) / 0.97);
  --c-scrim:       rgb(var(--rgb-base) / 0.45);
  --c-sunken:      rgb(var(--rgb-base) / 0.5);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.08);
  --c-border:      rgb(var(--rgb-ink) / 0.10);
  --c-border-hi:   rgb(var(--rgb-ink) / 0.22);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-2:      rgb(var(--rgb-ink) / 0.72);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.14);
  --c-on-accent:   rgb(var(--rgb-base));
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-soft: rgb(var(--rgb-signal) / 0.14);
  --c-signal-line: rgb(var(--rgb-signal) / 0.45);

  --shadow-panel: 0 20px 60px rgb(var(--rgb-base) / 0.6);

  --space-1: 4px;  --space-2: 8px;  --space-3: 12px;
  --space-4: 16px; --space-5: 24px; --space-6: 32px;

  --radius-md: 10px; --radius-lg: 14px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-sm: clamp(12px, 0.65vw, 14px);
  --fs-md: clamp(14px, 0.75vw, 16px);
  --fs-lg: clamp(17px, 0.95vw, 20px);

  --dur-fast: 120ms; --dur-panel: 180ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-overlay: 10;

  --panel-width: min(440px, 92vw);
  --control-height: clamp(40px, 2.2vw, 48px);
  --key-spacing: 0.12em;
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

button, input { font: inherit; color: inherit; }

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-overlay);
  display: grid;
  place-items: center;
  background: var(--c-scrim);
}
.screen[hidden] { display: none; }

.panel {
  width: var(--panel-width);
  display: grid;
  gap: var(--space-4);
  padding: var(--space-5);
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-panel);
  animation: panel-in var(--dur-panel) var(--ease-out);
}

@keyframes panel-in {
  from { opacity: 0; transform: scale(0.98); }
  to   { opacity: 1; transform: scale(1); }
}

.title { margin: 0; font-size: var(--fs-lg); font-weight: 700; text-wrap: balance; }
.sub { margin: var(--space-1) 0 0; font-size: var(--fs-sm); font-weight: 500; color: var(--c-text-2); line-height: 1.45; }

.field { display: grid; gap: var(--space-2); }
.label { font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-2); }

.input-row { display: flex; gap: var(--space-2); }

.input {
  flex: 1;
  min-width: 0;
  height: var(--control-height);
  padding: 0 var(--space-3);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-sunken);
  font-size: var(--fs-md);
  font-weight: 600;
  letter-spacing: var(--key-spacing);
  font-variant-numeric: tabular-nums;
  text-transform: uppercase;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.input::placeholder { color: var(--c-text-muted); letter-spacing: normal; text-transform: none; font-weight: 500; }
.input:hover:not(:disabled) { border-color: var(--c-border-hi); }
.input:focus-visible { outline: none; border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-soft); }
.input[aria-invalid="true"] { border-color: var(--c-signal-line); }
.input:disabled { opacity: 0.5; }

.error { margin: 0; min-height: 1.4em; font-size: var(--fs-sm); font-weight: 500; color: var(--c-signal); }
.error:empty { min-height: 0; }

.actions { display: flex; gap: var(--space-2); justify-content: flex-end; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: var(--control-height);
  padding: 0 var(--space-4);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: transparent;
  font-size: var(--fs-sm);
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--c-surface-hi); border-color: var(--c-border-hi); }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn--primary { background: var(--c-accent); border-color: transparent; color: var(--c-on-accent); }
.btn--primary:hover:not(:disabled) { background: var(--c-accent); border-color: transparent; opacity: 0.9; }

.hint { margin: 0; padding-top: var(--space-3); border-top: 1px solid var(--c-border); font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-muted); line-height: 1.45; }

@media (prefers-reduced-motion: reduce) {
  .panel { animation: none; }
  .btn, .input { transition: none; }
}
</style>
</head>
<body>

<div class="screen" id="screen" hidden>
  <form class="panel" id="form" role="dialog" aria-modal="true" aria-labelledby="title" aria-describedby="sub" novalidate>
    <div>
      <h1 class="title" id="title"></h1>
      <p class="sub" id="sub"></p>
    </div>

    <div class="field">
      <label class="label" for="key" id="key-label"></label>
      <div class="input-row">
        <input class="input" id="key" name="key" type="password" autocomplete="off" spellcheck="false" maxlength="32" aria-describedby="error">
        <button class="btn" type="button" data-action="toggle" id="toggle" aria-controls="key" aria-pressed="false"></button>
      </div>
      <p class="error" id="error" role="alert" aria-live="polite"></p>
    </div>

    <div class="actions">
      <button class="btn" type="button" data-action="cancel" id="cancel"></button>
      <button class="btn btn--primary" type="submit" id="submit"></button>
    </div>

    <p class="hint" id="hint"></p>
  </form>
</div>

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  // Die UI laeuft in einem iframe der Shell (index.html), darum auch im Elternfenster suchen
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    try { if (window.parent !== window && typeof window.parent.GetParentResourceName === 'function') return window.parent.GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

// Im Browser: richtiger Key ist ABCD-EFGH-JKLM-NPQR. #gesperrt zeigt die Sperre.
const Mock = {
  delay: 300,
  key: 'ABCDEFGHJKLMNPQR',
  left: 5,
  responses: {
    adminkey_submit(data) {
      if (location.hash === '#gesperrt') return { ok: false, error: 'locked', data: { minutes: 14 } };
      const clean = String(data.key || '').toUpperCase().replace(/[\s-]/g, '');
      if (clean === Mock.key) {
        Mock.push('adminkey_close', {});
        return { ok: true, data: { duty: true } };
      }
      Mock.left -= 1;
      if (Mock.left <= 0) return { ok: false, error: 'locked', data: { minutes: 15 } };
      return { ok: false, error: 'wrong_key', data: { left: Mock.left } };
    },
    adminkey_close() {
      Mock.push('adminkey_close', {});
      return { ok: true };
    },
  },
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    const fn = this.responses[event];
    console.info(`[mock] ${event}`, data);
    return fn ? fn(data) : { ok: true };
  },
  push(event, data) {
    Bridge.emit(event, data);
  },
};
</script>

<script id="app">
const TEXT = {
  title: 'Admin-Key',
  sub: 'Gib deinen persönlichen Admin-Key ein. Bis dahin hast du keine Admin-Rechte.',
  label: 'Persönlicher Key',
  placeholder: 'z. B. K7QM-2XPA-9RTD-H4NW',
  show: 'Anzeigen',
  hide: 'Verbergen',
  submit: 'Freischalten',
  busy: 'Prüft…',
  cancel: 'Abbrechen',
  hint: 'Den Key bekommst du von einem Senior Administrator. Er gilt bis zum nächsten Einloggen. Gib ihn niemandem weiter.',
  empty: 'Gib deinen Key ein.',
  errors: {
    wrong_key: (data) => {
      const left = Number(data && data.left);
      if (left === 1) return 'Falscher Key. Noch 1 Versuch, dann wirst du gesperrt.';
      return Number.isFinite(left) ? `Falscher Key. Noch ${left} Versuche.` : 'Falscher Key.';
    },
    locked: (data) => {
      const minutes = Number(data && data.minutes);
      return Number.isFinite(minutes)
        ? `Zu viele falsche Versuche. Wieder möglich in ${minutes} ${minutes === 1 ? 'Minute' : 'Minuten'}. Das Team wurde informiert.`
        : 'Zu viele falsche Versuche. Versuch es später noch einmal.';
    },
    no_key: () => 'Für dich gibt es noch keinen Admin-Key. Ein Senior Administrator erstellt ihn im Admin-Menü.',
    no_character: () => 'Das geht nur mit einem Charakter.',
    no_team_rank: () => 'Du hast keinen Teamrang mehr.',
    timeout: () => 'Der Server antwortet nicht. Versuch es noch einmal.',
    default: () => 'Das hat nicht geklappt. Versuch es noch einmal.',
  },
};

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];

const el = {
  screen: document.getElementById('screen'),
  form: document.getElementById('form'),
  title: document.getElementById('title'),
  sub: document.getElementById('sub'),
  label: document.getElementById('key-label'),
  key: document.getElementById('key'),
  toggle: document.getElementById('toggle'),
  error: document.getElementById('error'),
  cancel: document.getElementById('cancel'),
  submit: document.getElementById('submit'),
  hint: document.getElementById('hint'),
};

const state = {
  open: false,
  busy: false,
  visible: false,
  locked: false,
  error: '',
};

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;
  el.key.type = state.visible ? 'text' : 'password';
  el.key.disabled = state.locked;
  el.key.setAttribute('aria-invalid', String(state.error !== ''));
  el.toggle.textContent = state.visible ? TEXT.hide : TEXT.show;
  el.toggle.setAttribute('aria-pressed', String(state.visible));
  el.toggle.disabled = state.locked;
  el.submit.disabled = state.busy || state.locked;
  el.submit.textContent = state.busy ? TEXT.busy : TEXT.submit;
  if (el.error.textContent !== state.error) el.error.textContent = state.error;
}

function errorText(result) {
  const code = result && result.error;
  const fn = TEXT.errors[code] || TEXT.errors.default;
  return fn(result && result.data);
}

async function submit() {
  if (state.busy || state.locked) return;
  const key = el.key.value.trim();
  if (!key) {
    state.error = TEXT.empty;
    render();
    el.key.focus();
    return;
  }
  state.busy = true;
  state.error = '';
  render();
  const result = await Bridge.send('adminkey_submit', { key });
  state.busy = false;
  if (result && result.ok) {
    // Die Lua-Seite schliesst das Fenster
    render();
    return;
  }
  state.locked = Boolean(result && result.error === 'locked');
  state.error = errorText(result);
  if (!state.locked) el.key.select();
  render();
}

function cancel() {
  Bridge.send('adminkey_close', {});
}

function open(data) {
  applyColors(data.colors);
  state.open = true;
  state.busy = false;
  state.visible = false;
  state.locked = false;
  state.error = '';
  el.key.value = '';
  render();
  el.key.focus();
}

function close() {
  state.open = false;
  el.key.value = '';
  render();
}

const ACTIONS = {
  toggle() {
    state.visible = !state.visible;
    render();
    el.key.focus();
  },
  cancel() { cancel(); },
};

document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-action]');
  if (!target || target.disabled) return;
  const action = ACTIONS[target.dataset.action];
  if (action) action(target);
});

el.form.addEventListener('submit', (e) => {
  e.preventDefault();
  submit();
});

el.key.addEventListener('input', () => {
  if (state.error && !state.locked) {
    state.error = '';
    render();
  }
});

document.addEventListener('keydown', (e) => {
  if (state.open && e.key === 'Escape') {
    e.preventDefault();
    cancel();
  }
});

// Feste Texte einmal setzen
el.title.textContent = TEXT.title;
el.sub.textContent = TEXT.sub;
el.label.textContent = TEXT.label;
el.key.placeholder = TEXT.placeholder;
el.cancel.textContent = TEXT.cancel;
el.hint.textContent = TEXT.hint;

Bridge.on('adminkey_open', open);
Bridge.on('adminkey_close', close);

Bridge.send('ui_ready', { ui: 'adminkey', version: CONTRACT_VERSION });

if (Bridge.platform === 'mock') {
  Mock.push('adminkey_open', { maxAttempts: 5 });
}
</script>
</body>
</html>
