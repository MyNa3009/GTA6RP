<!DOCTYPE html>
<!--
  UI: Inventar
  CONTRACT_VERSION: 1
  Fenster (mit Maus und Tastatur) und Schnellzugriff-Leiste (ohne Fokus, kurz eingeblendet).
  Was erlaubt ist, prueft der Server. Jede Antwort bringt den neuen Stand mit.

  EINGEHEND (Lua -> UI)
  inv_open   { colors, items: { [name]: ItemDef }, state: State, drop?: Drop, other?: Other, layout: Layout, players: Player[] }
  inv_state  { state: State, drop?: Drop, other?: Other | false }   // Aenderung von aussen, other fehlt oder false: zweites Fenster zu
  inv_close  {}
  inv_hotbar { colors, items, state: State, slot: number, error?: string }   // Taste 1 bis 5 gedrueckt

  ItemDef { label, weight, stack, equip?, description? }        // Gewicht in Gramm
  State   { items: Entry[], bag?: Entry[], weight, maxWeight, bagWeight?, bagMaxWeight?, bagSlots?, bagLevel? }  // bagSlots: freie Rucksack-Plaetze nach Level
  Entry   { slot: string, name: string, count: number, meta?: object }   // slot "1" bis "30" oder "jacket" usw.
  Drop    { id: number, items: Entry[] }                  // Haufen am Boden in Reichweite
  Layout  { slots, hotbar, bagSlots, dropSlots, equip: { id, label, clothing? }[], giveDistance }
  Player  { serverId, characterId, distance }
  Other   { kind: "search" | "trunk" | "stash" | "admin", title, canPut, weight, maxWeight, slots, items: Entry[], weaponSlot?,
            bag?: { items: Entry[], slots, weight, maxWeight }, equip?: { id, label }[], documents?: { id, label }[] }
          // Zweites Fenster: Durchsuchen (nur nehmen), Kofferraum, /invsee (Admin, alles)

  AUSGEHEND (UI -> Lua), Antwort { ok, data?: { state, drop?, other? }, error? }
  ui_ready    { ui: "inventory", version: 1 }
  inv_move    { from: Ref, to: Ref, count? }              // Ref { inv: "self" | "bag" | "drop" | "other" | "otherbag", slot?, id? }
  inv_use     { inv, slot }
  inv_give    { from: Ref, count, target: serverId }
  inv_players {}                                          -> data: { players: Player[] }
  inv_close   {}

  FEHLERCODES
  too_heavy, no_space, wrong_slot, bag_in_bag, no_bag, stack_full, invalid_count, invalid_slot, empty_slot,
  not_usable, not_enough, too_far, target_offline, target_full, target_too_heavy, twink_blocked, drop_gone,
  no_weapon, wrong_ammo, weapon_full, wrong_gender,
  no_position, no_character, rate_limited, timeout,
  bound, not_allowed, search_ended, trunk_closed, stash_closed, view_closed
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Explore (Inventar). Vollbild, dunkel, graue Kacheln, Aktionen per Rechtsklick.
  Dichte 7, Bewegung 2 (per Taste geoeffnet, sehr oft), Varianz 3.
  Farbe nur fuer Auswahl, Ziel beim Ziehen und Fehler. Alles andere sind Graustufen aus --rgb-ink.
*/
:root {
  /* Grundfarben, werden aus der Config der Core ueberschrieben */
  --rgb-base:   14 15 18;
  --rgb-ink:    232 234 237;
  --rgb-accent: 214 164 72;
  --rgb-signal: 220 82 72;

  --c-screen:      rgb(var(--rgb-base) / 0.9);
  --c-strip:       rgb(var(--rgb-ink) / 0.05);
  --c-slot:        rgb(var(--rgb-ink) / 0.06);
  --c-slot-hover:  rgb(var(--rgb-ink) / 0.1);
  --c-slot-line:   rgb(var(--rgb-ink) / 0.07);
  --c-text:        rgb(var(--rgb-ink) / 0.94);
  --c-text-2:      rgb(var(--rgb-ink) / 0.72);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-ghost-icon:  rgb(var(--rgb-ink) / 0.16);
  --c-badge:       rgb(var(--rgb-ink) / 0.92);
  --c-on-badge:    rgb(var(--rgb-base));
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-soft: rgb(var(--rgb-accent) / 0.16);
  --c-signal:      rgb(var(--rgb-signal));
  --c-menu:        rgb(var(--rgb-base) / 0.98);
  --c-menu-line:   rgb(var(--rgb-ink) / 0.12);

  --shadow-float: 0 12px 32px rgb(var(--rgb-base) / 0.7);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px;
  --radius-sm: 4px; --radius-md: 8px;

  --fs-xs: clamp(10px, 0.55vw, 12px);
  --fs-sm: clamp(11px, 0.62vw, 13px);
  --fs-md: clamp(13px, 0.72vw, 15px);

  --dur-fast: 100ms; --dur-hud: 180ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --z-screen: 10; --z-float: 20; --z-ghost: 30;

  /* Kachelgroesse richtet sich nach Breite und Hoehe, damit 9 Reihen auch bei 720p passen */
  --slot: clamp(60px, min(5.8vw, 9.6vh), 150px);
  --gap: max(4px, calc(var(--slot) * 0.08));
  --slot-font: max(9px, calc(var(--slot) * 0.115));
  --strip: max(24px, calc(var(--slot) * 0.32));
  --column-gap: clamp(24px, 9vw, 260px);
  --badge: max(16px, calc(var(--slot) * 0.24));
  --hud-slot: clamp(48px, 3.4vw, 76px);
  --hud-bottom: clamp(20px, 3.5vh, 44px);
}

*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  font-family: 'Montserrat', sans-serif;
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

button, input { font: inherit; color: inherit; }
h1, h2, p { margin: 0; }
svg { display: block; }

/* ---------- Vollbild ---------- */

.screen {
  position: fixed;
  inset: 0;
  z-index: var(--z-screen);
  display: grid;
  grid-template-rows: 1fr auto;
  background: var(--c-screen);
  outline: none;
}
.screen[hidden] { display: none; }

.layout {
  display: grid;
  grid-auto-flow: column;
  place-content: center;
  align-items: start;
  gap: var(--column-gap);
  min-height: 0;
  padding: var(--space-5) var(--space-5) 0;
}

.left { display: flex; gap: calc(var(--gap) * 2.5); align-items: flex-start; }
.middle { display: flex; flex-direction: column; gap: calc(var(--gap) * 2.5); }
.right { display: flex; flex-direction: column; gap: calc(var(--gap) * 2.5); max-height: 100%; min-height: 0; }
.right__own { display: flex; flex-direction: column; gap: calc(var(--gap) * 2.5); }
.right__own[hidden], .other[hidden], .other section[hidden] { display: none; }

/* Zweites Fenster: fremdes Inventar statt Ausruestung und Boden. Lange Kofferraeume scrollen. */
.other {
  display: flex;
  flex-direction: column;
  gap: calc(var(--gap) * 2.5);
  min-height: 0;
  overflow-y: auto;
  padding-right: var(--space-2);
  scrollbar-width: thin;
  scrollbar-color: rgb(var(--rgb-ink) / 0.16) transparent;
}
.other::-webkit-scrollbar { width: 6px; }
.other::-webkit-scrollbar-thumb { border-radius: var(--radius-sm); background: rgb(var(--rgb-ink) / 0.16); }
.other__note { font-size: var(--fs-xs); color: var(--c-text-muted); }
.other__note:empty { display: none; }

/* Kopfleiste ueber jedem Raster */
.strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  height: var(--strip);
  padding: 0 var(--space-3);
  margin-bottom: var(--gap);
  border-radius: var(--radius-sm);
  background: var(--c-strip);
}
.strip__title {
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--c-text-2);
}
.strip__meta {
  font-size: var(--fs-sm);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.strip__meta[data-full] { color: var(--c-signal); }
.strip__meta--quiet { font-weight: 600; text-transform: none; color: var(--c-text-muted); font-size: var(--fs-xs); }

/* Schnellzugriff: eigene Spalte links */
.quick { display: flex; flex-direction: column; align-items: center; }
.quick__title {
  height: calc(var(--strip) + var(--gap));
  display: grid;
  place-items: center;
  font-size: var(--fs-xs);
  font-weight: 700;
  line-height: 1.15;
  text-align: center;
  white-space: pre-line;
}
.quick__list { display: flex; flex-direction: column; gap: var(--gap); padding-left: calc(var(--badge) * 0.6); }
.quick__row { position: relative; }
.quick__key {
  position: absolute;
  left: calc(var(--badge) * -0.6);
  top: 50%;
  z-index: 1;
  display: grid;
  place-items: center;
  width: calc(var(--badge) * 0.8);
  height: var(--badge);
  border-radius: var(--radius-sm);
  background: var(--c-badge);
  color: var(--c-on-badge);
  font-size: var(--fs-xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  transform: translateY(-50%);
  pointer-events: none;
}

.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols, 5), var(--slot));
  gap: var(--gap);
}

/* ---------- Kachel ---------- */

.slot {
  position: relative;
  width: var(--slot);
  height: var(--slot);
  padding: 0;
  border: 1px solid var(--c-slot-line);
  border-radius: var(--radius-md);
  background: var(--c-slot);
  overflow: hidden;
  cursor: default;
  touch-action: none;
  transition: background-color var(--dur-fast) var(--ease-out);
}
.slot[data-filled] { cursor: grab; }
.slot:hover { background: var(--c-slot-hover); }
.slot:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 2px; }
.slot[aria-pressed="true"] { border-color: var(--c-accent); }
.slot[data-target] { border-color: var(--c-accent); background: var(--c-accent-soft); }
.slot[data-dragging] { opacity: 0.3; }
.slot[data-locked] { cursor: not-allowed; }
.slot[data-locked]:hover { background: var(--c-slot); }

.slot__img {
  position: absolute;
  inset: 16% 12% 20%;
  width: 76%;
  height: 64%;
  object-fit: contain;
  pointer-events: none;
}
.slot__count {
  position: absolute;
  left: calc(var(--slot) * 0.08);
  top: calc(var(--slot) * 0.06);
  font-size: var(--slot-font);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.slot__name {
  position: absolute;
  left: calc(var(--slot) * 0.08);
  right: calc(var(--slot) * 0.06);
  bottom: calc(var(--slot) * 0.06);
  font-size: var(--slot-font);
  font-weight: 700;
  text-align: left;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
/* Kein Bild vorhanden: Anfangsbuchstabe gross in die Mitte, der Name steht unten */
.slot__fallback {
  position: absolute;
  inset: 22% 8% 24%;
  display: grid;
  place-items: center;
  font-size: calc(var(--slot) * 0.3);
  font-weight: 700;
  color: var(--c-ghost-icon);
  pointer-events: none;
}
/* Leere Ausruestung: Umriss und Name, sehr blass */
.slot__ghost {
  position: absolute;
  inset: 20% 26% 32%;
  background-color: var(--c-ghost-icon);
  -webkit-mask: var(--icon) center / contain no-repeat;
  mask: var(--icon) center / contain no-repeat;
  pointer-events: none;
}
.slot__label {
  position: absolute;
  left: var(--space-1);
  right: var(--space-1);
  bottom: calc(var(--slot) * 0.07);
  font-size: var(--slot-font);
  font-weight: 600;
  text-align: center;
  color: var(--c-text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  pointer-events: none;
}
.slot__label--middle { top: 50%; bottom: auto; transform: translateY(-50%); }
.slot[data-bound] { cursor: pointer; }
.slot__lock {
  position: absolute;
  inset: 34%;
  color: var(--c-ghost-icon);
  pointer-events: none;
}
.slot__lock svg { width: 100%; height: 100%; }

/* Gezogenes Item am Mauszeiger */
.ghost {
  position: fixed;
  z-index: var(--z-ghost);
  border-color: var(--c-accent);
  background: rgb(var(--rgb-base) / 0.95);
  box-shadow: var(--shadow-float);
  pointer-events: none;
  transform: translate(-50%, -50%);
}
.ghost[hidden] { display: none; }

/* ---------- Fusszeile ---------- */

.foot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-5);
  padding: var(--space-4) var(--space-5) var(--space-5);
  font-size: var(--fs-xs);
  color: var(--c-text-2);
}
.foot__item { display: inline-flex; align-items: center; gap: var(--space-2); white-space: nowrap; }
.key {
  padding: 2px var(--space-2);
  border: 1px solid var(--c-menu-line);
  border-radius: var(--radius-sm);
  font-weight: 700;
  color: var(--c-text);
}
.close {
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  font-size: var(--fs-xs);
  color: var(--c-text-2);
}
.close:hover { color: var(--c-text); }
.close:focus-visible { outline: 2px solid var(--c-accent); outline-offset: 4px; border-radius: var(--radius-sm); }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--space-6) * 2);
  z-index: var(--z-float);
  padding: var(--space-2) var(--space-4);
  border: 1px solid rgb(var(--rgb-signal) / 0.4);
  border-radius: var(--radius-md);
  background: var(--c-menu);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--c-signal);
  transform: translateX(-50%);
  pointer-events: none;
}
.toast:empty { display: none; }

/* ---------- Info beim Drueberfahren ---------- */

.tip {
  position: fixed;
  z-index: var(--z-float);
  max-width: 280px;
  padding: var(--space-3);
  border: 1px solid var(--c-menu-line);
  border-radius: var(--radius-md);
  background: var(--c-menu);
  box-shadow: var(--shadow-float);
  pointer-events: none;
}
.tip[hidden] { display: none; }
.tip__name { font-size: var(--fs-md); font-weight: 700; }
.tip__meta { margin-top: 2px; font-size: var(--fs-xs); color: var(--c-text-2); font-variant-numeric: tabular-nums; }
.tip__text { margin-top: var(--space-2); font-size: var(--fs-xs); line-height: 1.45; color: var(--c-text-2); }
.tip__text:empty { display: none; }
.tip__serial { margin-top: var(--space-2); font-size: var(--fs-xs); font-weight: 700; font-variant-numeric: tabular-nums; }
.tip__serial:empty { display: none; }

/* ---------- Rechtsklick-Menue ---------- */

.menu {
  position: fixed;
  z-index: var(--z-float);
  min-width: 200px;
  padding: var(--space-1);
  border: 1px solid var(--c-menu-line);
  border-radius: var(--radius-md);
  background: var(--c-menu);
  box-shadow: var(--shadow-float);
  transform-origin: top left;
  animation: menu-in var(--dur-fast) var(--ease-out);
}
.menu[hidden] { display: none; }
@keyframes menu-in {
  from { opacity: 0; transform: scale(0.97); }
  to   { opacity: 1; transform: scale(1); }
}
.menu__head { padding: var(--space-2) var(--space-3) var(--space-1); font-size: var(--fs-sm); font-weight: 700; }
.menu__amount {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--space-1) var(--space-3) var(--space-2);
  font-size: var(--fs-xs);
  color: var(--c-text-2);
}
.amount {
  width: 7ch;
  padding: var(--space-1) var(--space-2);
  border: 1px solid var(--c-menu-line);
  border-radius: var(--radius-sm);
  background: var(--c-strip);
  font-size: var(--fs-sm);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
  user-select: text;
}
.amount:focus-visible { outline: none; border-color: var(--c-text-2); }
.menu__line { height: 1px; margin: var(--space-1) 0; background: var(--c-menu-line); }
.menu__btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  width: 100%;
  padding: var(--space-2) var(--space-3);
  border: 0;
  border-radius: var(--radius-sm);
  background: none;
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: left;
  cursor: pointer;
}
.menu__btn:hover:not(:disabled), .menu__btn:focus-visible { background: var(--c-slot-hover); outline: none; }
.menu__btn:disabled { opacity: 0.4; cursor: default; }
.menu__btn--main { color: var(--c-accent); }
.menu__hint { font-size: var(--fs-xs); font-weight: 500; color: var(--c-text-muted); font-variant-numeric: tabular-nums; }
.menu__empty { padding: var(--space-2) var(--space-3); font-size: var(--fs-xs); color: var(--c-text-2); }

/* ---------- Schnellzugriff-Leiste ohne Fenster ---------- */

.hud {
  --slot: var(--hud-slot);
  --slot-font: max(9px, calc(var(--hud-slot) * 0.13));
  position: fixed;
  left: 50%;
  bottom: var(--hud-bottom);
  display: flex;
  gap: var(--space-1);
  transform: translateX(-50%);
  pointer-events: none;
  animation: hud-in var(--dur-hud) var(--ease-out);
}
.hud[hidden] { display: none; }
.hud[data-leaving] { opacity: 0; transition: opacity var(--dur-hud) var(--ease-out); }
@keyframes hud-in {
  from { opacity: 0; transform: translate(-50%, 6px); }
  to   { opacity: 1; transform: translate(-50%, 0); }
}
.hud .slot { background: rgb(var(--rgb-base) / 0.82); border-color: rgb(var(--rgb-ink) / 0.10); }
.hud .slot[aria-current="true"] { border-color: var(--c-accent); }
.hud .slot__name { display: none; }
.hud__key {
  position: absolute;
  right: calc(var(--slot) * 0.08);
  top: calc(var(--slot) * 0.06);
  font-size: var(--slot-font);
  font-weight: 700;
  color: var(--c-text-muted);
}
.hud__error {
  position: fixed;
  left: 50%;
  bottom: calc(var(--hud-bottom) + var(--hud-slot) + var(--space-2));
  transform: translateX(-50%);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-sm);
  background: rgb(var(--rgb-base) / 0.82);
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--c-signal);
  pointer-events: none;
}
.hud__error:empty, .hud__error[hidden] { display: none; }

/* ---------- Gezeigtes Dokument (ohne Fokus, rechts am Rand) ----------
   Eine echte Karte im Scheckkartenformat: helles Papier (--rgb-ink), Druck in --rgb-base,
   Siegel und Aussteller in --rgb-accent, Stempel in --rgb-signal. Fiktiver Staat, keine echten Hoheitszeichen. */

.doc {
  --card-w: clamp(340px, 23vw, 480px);
  --c-paper:     rgb(var(--rgb-ink));
  --c-print:     rgb(var(--rgb-base) / 0.92);
  --c-print-2:   rgb(var(--rgb-base) / 0.62);
  --c-print-line: rgb(var(--rgb-base) / 0.12);
  --c-guilloche: rgb(var(--rgb-base) / 0.035);
  --c-seal:      rgb(var(--rgb-accent) / 0.34);
  --c-band:      rgb(var(--rgb-base) / 0.94);
  --doc-pad:     calc(var(--card-w) * 0.045);
  --doc-label:   clamp(10px, calc(var(--card-w) * 0.026), 13px);
  --doc-value:   clamp(12px, calc(var(--card-w) * 0.036), 17px);
  --doc-head:    clamp(12px, calc(var(--card-w) * 0.034), 16px);
  position: fixed;
  right: clamp(16px, 3vw, 56px);
  top: 50%;
  z-index: var(--z-float);
  width: var(--card-w);
  display: grid;
  gap: var(--space-2);
  transform: translateY(-50%);
  animation: card-in var(--dur-hud) var(--ease-out);
  pointer-events: none;
}
.doc[hidden] { display: none; }
@keyframes card-in {
  from { opacity: 0; transform: translate(12px, -50%); }
  to   { opacity: 1; transform: translate(0, -50%); }
}

.doc__card {
  position: relative;
  aspect-ratio: 1.586;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  border-radius: calc(var(--card-w) * 0.035);
  background:
    repeating-linear-gradient(135deg, var(--c-guilloche) 0 1px, transparent 1px 6px),
    var(--c-paper);
  color: var(--c-print);
  box-shadow: var(--shadow-float);
  overflow: hidden;
}

.doc__seal {
  position: absolute;
  right: 6%;
  top: 30%;
  width: 38%;
  aspect-ratio: 1;
  color: var(--c-seal);
  opacity: 0.55;
}
.doc__seal * { fill: none; stroke: currentColor; }
.doc__badge { display: none; width: 1.2em; height: 1.2em; flex: none; color: rgb(var(--rgb-accent)); }
.doc[data-type="service"] .doc__badge { display: block; }
.doc__org { display: flex; align-items: center; gap: var(--space-2); min-width: 0; }

.doc__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-3);
  padding: var(--doc-pad) var(--doc-pad) calc(var(--doc-pad) * 0.6);
  border-bottom: 1px solid var(--c-print-line);
}

<script id="bridge">
const CONTRACT_VERSION = 1;

const Bridge = (() => {
  const handlers = {};
  const resourceName = (() => {
    try { if (typeof GetParentResourceName === 'function') return GetParentResourceName(); } catch (err) { /* weiter */ }
    return null;
  })();
  // Spaeter: weiteren Adapter ergaenzen, z. B. 'gta6', wenn die Plattform bekannt ist
  const platform = resourceName !== null ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${resourceName}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();
</script>

<script id="mock">
/* Nur im Browser: Beispieldaten, damit man das Fenster ohne FiveM ansehen kann */
const Mock = {
  delay: 40,
  async handle(event, data) {
    await new Promise((r) => setTimeout(r, this.delay));
    if (event === 'inv_players') return { ok: true, data: { players: [{ serverId: 4, characterId: 17, distance: 1.4 }, { serverId: 9, characterId: 230, distance: 2.6 }] } };
    if (event === 'inv_give') return { ok: false, error: 'target_too_heavy' };
    console.info(`[mock] ${event}`, data);
    return { ok: true };
  },
};
</script>

};

const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const GRAMS_PER_KG = 1000;
const DRAG_THRESHOLD_PX = 5;

const kgFormat = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 });
const moneyFormat = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
const dateFormat = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const formatKg = (grams) => `${kgFormat.format((Number(grams) || 0) / GRAMS_PER_KG)} kg`;

const state = {
  open: false,
  items: {},
  layout: DEFAULT_LAYOUT,
  inv: { items: [], weight: 0, maxWeight: 0 },
  drop: null,
  other: null,         // zweites Fenster, siehe Other

  screen: $('screen'), foot: $('foot'),
  quick: $('quick'), quickTitle: $('quick-title'),
  pocket: $('pocket'), pocketTitle: $('pocket-title'), pocketWeight: $('pocket-weight'),
  bag: $('bag'), bagTitle: $('bag-title'), bagWeight: $('bag-weight'),
  equip: $('equip'), equipTitle: $('equip-title'), docs: $('docs'), docsTitle: $('docs-title'),
  drop: $('drop'), dropTitle: $('drop-title'), dropMeta: $('drop-meta'),
  ghost: $('ghost'), tip: $('tip'), tipName: $('tip-name'), tipMeta: $('tip-meta'), tipText: $('tip-text'), tipSerial: $('tip-serial'),
  menu: $('menu'), toast: $('toast'), hud: $('hud'), hudError: $('hud-error'),
  ownSide: $('own-side'), other: $('other'), otherTitle: $('other-title'), otherWeight: $('other-weight'), otherGrid: $('other-grid'),
  otherBagSection: $('other-bag-section'), otherBagTitle: $('other-bag-title'), otherBagWeight: $('other-bag-weight'), otherBag: $('other-bag'),
  otherEquipSection: $('other-equip-section'), otherEquipTitle: $('other-equip-title'), otherEquip: $('other-equip'),
  otherDocsSection: $('other-docs-section'), otherDocsTitle: $('other-docs-title'), otherDocs: $('other-docs'), otherNote: $('other-note'),
};

/* ---------- Hilfen ---------- */

function setText(node, text) {
  if (node.textContent !== text) node.textContent = text;
}

function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function applyColors(colors) {
  if (!colors || typeof colors !== 'object') return;
  COLOR_KEYS.forEach((key) => {
    const value = colors[key];
    if (typeof value === 'string' && COLOR_PATTERN.test(value.trim())) {
      document.documentElement.style.setProperty(`--rgb-${key}`, value.trim());
    }
  });
}

// Lua schickt leere Tabellen manchmal als {} statt []
const asArray = (value) => (Array.isArray(value) ? value : []);
const hasBag = () => state.inv.bag != null;

function bySlot(list) {
  const map = {};
  asArray(list).forEach((entry) => { map[entry.slot] = entry; });
  return map;
}

const isOther = (inv) => inv === 'other' || inv === 'otherbag';

function containerOf(inv) {
  if (inv === 'bag') return bySlot(state.inv.bag);
  if (inv === 'other') return bySlot(state.other && state.other.items);
  if (inv === 'otherbag') return bySlot(state.other && state.other.bag && state.other.bag.items);
  if (inv === 'drop') return bySlot(state.drop && state.drop.items);
  return bySlot(state.inv.items);
}

function entryAt(ref) {
  return ref ? containerOf(ref.inv)[ref.slot] || null : null;
}

// Eigener Name aus den Metadaten (z. B. Kleidung "Lederjacke schwarz"), sonst der Item-Name
function labelOf(entry) {
  const own = entry && entry.meta && entry.meta.label;
  return typeof own === 'string' && own !== '' ? own : def(entry.name).label;
}

function def(name) {
  return state.items[name] || { label: name, weight: 0, stack: 1 };
}

const isEquipSlot = (ref) => ref.inv === 'self' && !/^\d+$/.test(ref.slot);

function errorText(code) {
  return TEXT.errors[code] || TEXT.errors.fallback;
}

let toastTimer = null;
function showError(code) {
  setText(el.toast, errorText(code));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => setText(el.toast, ''), TOAST_MS);
}

/* ---------- Kacheln bauen ---------- */

// Dokumente zeigen oben Klassen oder den Stand statt einer Anzahl
function docBadge(meta) {
  if (meta.status === 'revoked') return TEXT.docRevoked;
  if (meta.status === 'expired') return TEXT.docExpired;
  if (meta.org) return meta.org;
  return meta.classes ? meta.classes.split(',').join(' ') : '';
}

function itemContent(node, entry) {
  const item = def(entry.name);
  const ammo = entry.meta && entry.meta.ammo;
  let countText = TEXT.count(entry.count);
  if (item.document) countText = docBadge(entry.meta || {});
  else if (item.money) countText = TEXT.money(entry.count);
  else if (ammo !== undefined && ammo !== null) countText = TEXT.rounds(ammo);
  node.append(make('span', 'slot__count', countText));
  const fallback = () => make('span', 'slot__fallback', (labelOf(entry) || '?').charAt(0).toUpperCase());
  if (missingImages.has(entry.name)) {
    node.append(fallback());
  } else {
    const img = make('img', 'slot__img');
    img.alt = '';
    img.draggable = false;
    img.src = `${IMAGE_BASE}${entry.name}.png`;
    img.addEventListener('error', () => {
      missingImages.add(entry.name);
      img.replaceWith(fallback());
    }, { once: true });
    node.append(img);
  }
  node.append(make('span', 'slot__name', labelOf(entry)));
}

function slotNode(inv, slot, entry, options = {}) {
  const node = make('button', 'slot');
  node.type = 'button';
  node.dataset.inv = inv;
  node.dataset.slot = slot;
  if (options.locked) {
    node.dataset.locked = '';
    node.tabIndex = -1;
    node.setAttribute('aria-label', TEXT.bagLocked);
    const lock = make('span', 'slot__lock');
    lock.innerHTML = icon('lock');
    node.append(lock);
    return node;
  }
  if (entry) {
    node.dataset.filled = '';
    if (def(entry.name).document) node.dataset.bound = '';
    node.setAttribute('aria-label', `${labelOf(entry)}, ${TEXT.count(entry.count)}`);
    itemContent(node, entry);
  } else if (options.docLabel) {
    node.append(make('span', 'slot__label slot__label--middle', options.docLabel));
    node.setAttribute('aria-label', TEXT.emptyEquip(options.docLabel));
  } else if (options.ghost) {
    // Umriss aus html/icons/<platz>.png, eingefaerbt ueber --c-ghost-icon
    const ghost = make('span', 'slot__ghost');
    ghost.style.setProperty('--icon', `url("icons/${options.ghost}.png")`);
    node.append(ghost, make('span', 'slot__label', options.label));
    node.setAttribute('aria-label', TEXT.emptyEquip(options.label));
  } else {
    node.setAttribute('aria-label', TEXT.emptySlot);
  }
  const selected = state.selected && state.selected.inv === inv && state.selected.slot === slot;
  node.setAttribute('aria-pressed', String(Boolean(selected)));
  return node;
}

function renderQuick() {
  const items = containerOf('self');
  const rows = [];
  for (let i = 1; i <= state.layout.hotbar; i += 1) {
    const row = make('div', 'quick__row');
    row.append(make('span', 'quick__key', String(i)), slotNode('self', String(i), items[String(i)]));
    rows.push(row);
  }
  el.quick.replaceChildren(...rows);
}

function renderGrid(node, inv, from, to, cols, options = {}) {
  const items = containerOf(inv);
  const slots = [];
  for (let i = from; i <= to; i += 1) {
    const key = String(i);
    const locked = options.locked || (options.openUpTo !== undefined && i > options.openUpTo);
    slots.push(slotNode(inv, key, items[key], { ...options, locked }));
  }
  node.style.setProperty('--cols', String(cols));
  node.replaceChildren(...slots);
}

function renderWeight(meta, now, max) {
  setText(meta, TEXT.weight(formatKg(now), formatKg(max)));
  meta.toggleAttribute('data-full', max > 0 && now >= max);
}

function renderEquip() {
  const items = containerOf('self');
  el.equip.style.setProperty('--cols', String(SIDE_COLS));
  el.equip.replaceChildren(...state.layout.equip.map((slot) => slotNode('self', slot.id, items[slot.id], { ghost: slot.id, label: slot.label })));
}

function renderDocs() {
  const items = containerOf('self');
  el.docs.style.setProperty('--cols', String(SIDE_COLS));
  el.docs.replaceChildren(...asArray(state.layout.documents).map((slot) => slotNode('self', slot.id, items[slot.id], { docLabel: slot.label })));
}

function equipLabel(id, fallback) {
  const slot = state.layout.equip.find((e) => e.id === id);
  return slot ? slot.label : fallback;
}

function renderOther() {
  const other = state.other;
  el.ownSide.hidden = Boolean(other);
  el.other.hidden = !other;
  if (!other) return;

  setText(el.otherTitle, other.title || '');
  renderWeight(el.otherWeight, other.weight, other.maxWeight);
  renderGrid(el.otherGrid, 'other', 1, Number(other.slots) || 0, POCKET_COLS);
  // Beim Durchsuchen steht die Waffe in der Hand mit im Raster, beim Admin bei der Kleidung
  if (other.weaponSlot && !other.equip) {
    el.otherGrid.append(slotNode('other', 'weapon', containerOf('other').weapon, { ghost: 'weapon', label: equipLabel('weapon', TEXT.weaponSlot) }));
  }

  const bag = other.bag;
  el.otherBagSection.hidden = !bag;
  if (bag) {
    renderGrid(el.otherBag, 'otherbag', 1, Number(bag.slots) || 0, POCKET_COLS);
    renderWeight(el.otherBagWeight, bag.weight, bag.maxWeight);
  }

  const items = containerOf('other');
  const equip = asArray(other.equip);
  el.otherEquipSection.hidden = equip.length === 0;
  el.otherEquip.style.setProperty('--cols', String(SIDE_COLS));
  el.otherEquip.replaceChildren(...equip.map((slot) => slotNode('other', slot.id, items[slot.id], { ghost: slot.id, label: slot.label })));

  const docs = asArray(other.documents);
  el.otherDocsSection.hidden = docs.length === 0;
  el.otherDocs.style.setProperty('--cols', String(SIDE_COLS));
  el.otherDocs.replaceChildren(...docs.map((slot) => slotNode('other', slot.id, items[slot.id], { docLabel: slot.label })));

  setText(el.otherNote, TEXT.otherNote[other.kind] || '');
}

function render() {
  el.screen.hidden = !state.open;
  if (!state.open) return;

  renderQuick();
  renderGrid(el.pocket, 'self', state.layout.hotbar + 1, state.layout.slots, POCKET_COLS);
  renderWeight(el.pocketWeight, state.inv.weight, state.inv.maxWeight);

  if (hasBag()) {
    // Jedes Rucksack-Level gibt eine Reihe frei, der Rest bleibt mit Schloss sichtbar
    const open = Number(state.inv.bagSlots) || state.layout.bagSlots;
    renderGrid(el.bag, 'bag', 1, state.layout.bagSlots, POCKET_COLS, { openUpTo: open });
    setText(el.bagWeight, TEXT.bagMeta(state.inv.bagLevel, formatKg(state.inv.bagWeight), formatKg(state.inv.bagMaxWeight)));
    el.bagWeight.toggleAttribute('data-full', state.inv.bagMaxWeight > 0 && state.inv.bagWeight >= state.inv.bagMaxWeight);
  } else {
    renderGrid(el.bag, 'bag', 1, state.layout.bagSlots, POCKET_COLS, { locked: true });
    setText(el.bagWeight, TEXT.bagLocked);
    el.bagWeight.removeAttribute('data-full');
  }

  renderEquip();
  renderDocs();

  // Boden: der Beutel in Reichweite, sonst eine Reihe freier Plaetze zum Ablegen
  const used = asArray(state.drop && state.drop.items).reduce((max, e) => Math.max(max, Number(e.slot) || 0), 0);
  const count = Math.min(state.layout.dropSlots, Math.max(SIDE_COLS, Math.ceil((used + 1) / SIDE_COLS) * SIDE_COLS));
  renderGrid(el.drop, 'drop', 1, count, SIDE_COLS);
  setText(el.dropMeta, state.drop ? TEXT.dropHere : TEXT.dropEmpty);

  renderOther();
}

/* ---------- Server ---------- */

async function request(event, payload) {
  if (state.busy) return null;
  state.busy = true;
  const result = await Bridge.send(event, payload);
  state.busy = false;
  if (result && result.data && result.data.state) {
    state.inv = result.data.state;
    state.drop = result.data.drop || null;
    state.other = result.data.other || null;
  }
  if (!result || !result.ok) showError(result && result.error);
  if (state.selected && !entryAt(state.selected)) state.selected = null;
  render();
  return result;
}

function refOf(node) {
  const ref = { inv: node.dataset.inv, slot: node.dataset.slot };
  if (ref.inv === 'drop' && state.drop) ref.id = state.drop.id;
  return ref;
}

const dropTarget = () => (state.drop ? { inv: 'drop', id: state.drop.id } : { inv: 'drop' });

function freePocket() {
  const items = containerOf('self');
  for (let i = state.layout.hotbar + 1; i <= state.layout.slots; i += 1) {
    if (!items[String(i)]) return String(i);
  }
  for (let i = 1; i <= state.layout.hotbar; i += 1) {
    if (!items[String(i)]) return String(i);
  }
  return null;
}

function freeOther() {
  const other = state.other;
  if (!other) return null;
  const items = containerOf('other');
  for (let i = 1; i <= (Number(other.slots) || 0); i += 1) {
    if (!items[String(i)]) return String(i);
  }
  return null;
}

function take(ref, count) {
  const free = freePocket();
  if (!free) {
    showError('no_space');
    return;
  }
  const payload = { from: ref, to: { inv: 'self', slot: free } };
  if (count) payload.count = count;
  request('inv_move', payload);
}

function move(from, to, count) {
  if (from.inv === to.inv && from.slot === to.slot) return;
  const payload = { from, to };
  if (count) payload.count = count;
  request('inv_move', payload);
}

function use(ref) {
  if (isOther(ref.inv)) {
    take(ref);
    return;
  }
  if (ref.inv === 'drop') {
    // Aus dem Beutel aufheben: in den ersten freien Taschenplatz
    const free = freePocket();
    if (!free) {
      showError('no_space');
      return;
    }
    request('inv_move', { from: ref, to: { inv: 'self', slot: free } });
    return;
  }
  request('inv_use', { inv: ref.inv, slot: ref.slot });
}

function close() {
  closeMenu();
  hideTip();
  Bridge.send('inv_close', {});
}

/* ---------- Info beim Drueberfahren ---------- */

let tipTimer = null;
let tipFor = null;

function placeFloating(node, x, y) {
  const w = node.offsetWidth;
  const h = node.offsetHeight;
  const left = Math.min(Math.max(FLOAT_MARGIN, x), window.innerWidth - w - FLOAT_MARGIN);
  const top = Math.min(Math.max(FLOAT_MARGIN, y), window.innerHeight - h - FLOAT_MARGIN);
  node.style.left = `${left}px`;
  node.style.top = `${top}px`;
}

function showTip(slot) {
  if (!slot.isConnected) return;
  const entry = entryAt(refOf(slot));
  if (!entry) return;
  const item = def(entry.name);
  setText(el.tipName, labelOf(entry));
  const meta = entry.meta || {};
  const weight = formatKg(item.weight * entry.count + Number(meta.contentWeight || 0));
  if (item.document) {
    const parts = [];
    if (meta.org) parts.push(meta.rank ? `${meta.org}, ${meta.rank}` : meta.org);
    if (meta.classes) parts.push(TEXT.docClasses(meta.classes.split(',').join(', ')));
    if (meta.status === 'expired') parts.push(TEXT.docExpired);
    else if (meta.status === 'revoked') parts.push(TEXT.docRevoked);
    else if (meta.expires) parts.push(TEXT.docValid(dateFormat.format(new Date(meta.expires * 1000))));
    setText(el.tipMeta, parts.join(' · '));
  } else if (item.money) setText(el.tipMeta, TEXT.money(entry.count));
  else setText(el.tipMeta, item.weapon ? TEXT.tipWeapon(meta.ammo, weight) : TEXT.tipMeta(entry.count, weight));
  setText(el.tipSerial, item.weapon ? TEXT.serial(meta.serial) : '');
  setText(el.tipText, item.description || '');
  el.tip.hidden = false;
  const rect = slot.getBoundingClientRect();
  const right = rect.right + FLOAT_MARGIN;
  const fitsRight = right + el.tip.offsetWidth < window.innerWidth - FLOAT_MARGIN;
  placeFloating(el.tip, fitsRight ? right : rect.left - el.tip.offsetWidth - FLOAT_MARGIN, rect.top);
}

function hideTip() {
  clearTimeout(tipTimer);
  tipFor = null;
  el.tip.hidden = true;
}

document.addEventListener('pointerover', (e) => {
  if (!state.open || drag.active || state.menu) return;
  const slot = e.target.closest('.slot[data-filled]');
  if (slot === tipFor) return;
  hideTip();
  if (!slot || !el.screen.contains(slot)) return;
  tipFor = slot;
  tipTimer = setTimeout(() => showTip(slot), TIP_DELAY_MS);
});

/* ---------- Rechtsklick-Menue ---------- */

function menuButton(label, action, options = {}) {
  const button = make('button', `menu__btn${options.main ? ' menu__btn--main' : ''}`);
  button.type = 'button';
  button.setAttribute('role', 'menuitem');
  button.dataset.action = action;
  button.append(make('span', null, label));
  if (options.hint) button.append(make('span', 'menu__hint', options.hint));
  if (options.target !== undefined) button.dataset.target = String(options.target);
  return button;
}

function amountRow(value, max) {
  const row = make('label', 'menu__amount');
  const input = make('input', 'amount');
  input.id = 'amount';
  input.name = 'amount';
  input.type = 'number';
  input.inputMode = 'numeric';
  input.min = '1';
  input.max = String(max);
  input.step = '1';
  input.value = value;
  row.append(make('span', null, TEXT.amount), input);
  return row;
}

function renderMenu() {
  const menu = state.menu;
  const entry = menu && entryAt(menu.ref);
  if (!entry) {
    closeMenu();
    return;
  }
  const item = def(entry.name);
  const previous = el.menu.querySelector('#amount');
  const amountValue = previous ? previous.value : String(entry.count);
  const nodes = [make('p', 'menu__head', labelOf(entry))];

  const fromDrop = menu.ref.inv === 'drop';
  const equipped = isEquipSlot(menu.ref);

  // Fremdes Inventar: nur nehmen, Dokumente bleiben
  if (isOther(menu.ref.inv)) {
    if (item.document) {
      nodes.push(make('p', 'menu__empty', TEXT.docStays));
    } else {
      if (entry.count > 1) nodes.push(amountRow(amountValue, entry.count));
      nodes.push(menuButton(TEXT.take, 'take', { main: true }));
    }
    el.menu.replaceChildren(...nodes);
    el.menu.querySelectorAll('.menu__btn').forEach((b) => { b.disabled = state.busy; });
    return;
  }

  if (item.document) {
    if (menu.mode) {
      nodes.push(make('div', 'menu__line'));
      if (!menu.players) nodes.push(make('p', 'menu__empty', TEXT.loading));
      else if (menu.players.length === 0) nodes.push(make('p', 'menu__empty', TEXT.nobody(state.layout.giveDistance)));
      else menu.players.forEach((p) => nodes.push(menuButton(TEXT.player(p), 'show-to', { hint: TEXT.distance(p), target: p.serverId })));
    } else {
      nodes.push(menuButton(TEXT.show, 'show', { main: true }));
    }
    el.menu.replaceChildren(...nodes);
    return;
  }

  if (entry.count > 1 && !equipped) nodes.push(amountRow(amountValue, entry.count));

  if (menu.mode) {
    nodes.push(make('div', 'menu__line'));
    if (!menu.players) nodes.push(make('p', 'menu__empty', TEXT.loading));
    else if (menu.players.length === 0) nodes.push(make('p', 'menu__empty', TEXT.nobody(state.layout.giveDistance)));
    else menu.players.forEach((p) => nodes.push(menuButton(TEXT.player(p), 'give-to', { hint: TEXT.distance(p), target: p.serverId })));
  } else {
    let useLabel = TEXT.use;
    if (fromDrop) useLabel = TEXT.pickUp;
    else if (equipped) useLabel = TEXT.unequip;
    else if (item.equip && item.equip !== 'weapon') useLabel = TEXT.equipIt;
    nodes.push(menuButton(useLabel, 'use', { main: true }));
    const putLabel = state.other && state.other.canPut && TEXT.put[state.other.kind];
    if (putLabel && !fromDrop) nodes.push(menuButton(putLabel, 'put'));
    if (!fromDrop && !equipped) {
      nodes.push(menuButton(TEXT.give, 'give'));
      nodes.push(menuButton(TEXT.dropIt, 'drop'));
      if (entry.count > 1) nodes.push(menuButton(TEXT.split, 'split'));
    }
  }
  el.menu.replaceChildren(...nodes);
  el.menu.querySelectorAll('.menu__btn').forEach((b) => { b.disabled = state.busy; });
}

function openMenu(slot, x, y) {
  hideTip();
  const ref = refOf(slot);
  state.selected = ref;
  state.menu = { ref, mode: null, players: null };
  el.menu.replaceChildren();
  renderMenu();
  el.menu.hidden = false;
  placeFloating(el.menu, x, y);
  render();
  const first = el.menu.querySelector('.menu__btn');
  if (first) first.focus();
}

function closeMenu() {
  if (!state.menu) return;
  state.menu = null;
  el.menu.hidden = true;
  el.menu.replaceChildren();
}

function menuCount(entry) {
  const input = el.menu.querySelector('#amount');
  const value = input ? Math.floor(Number(input.value)) : entry.count;
  return Number.isInteger(value) && value >= 1 ? Math.min(value, entry.count) : entry.count;
}

async function menuAction(name, button) {
  const menu = state.menu;
  const entry = menu && entryAt(menu.ref);
  if (!entry) return;
  const ref = menu.ref;
  const count = menuCount(entry);
  if (name === 'use') {
    closeMenu();
    use(ref);
  } else if (name === 'take') {
    closeMenu();
    take(ref, count);
  } else if (name === 'put') {
    closeMenu();
    const free = freeOther();
    if (!free) {
      showError('no_space');
      return;
    }
    request('inv_move', { from: ref, to: { inv: 'other', slot: free }, count });
  } else if (name === 'drop') {
    closeMenu();
    request('inv_move', { from: ref, to: dropTarget(), count });
  } else if (name === 'split') {
    closeMenu();
    const free = freePocket();
    if (!free) {
      showError('no_space');
      return;
    }
    request('inv_move', { from: ref, to: { inv: 'self', slot: free }, count: Math.floor(entry.count / 2) });
  } else if (name === 'give' || name === 'show') {
    menu.mode = name;
    renderMenu();
    const result = await Bridge.send('inv_players', {});
    if (state.menu !== menu) return;
    menu.players = result && result.ok ? asArray(result.data && result.data.players) : [];
    renderMenu();
    const first = el.menu.querySelector('[data-action="give-to"], [data-action="show-to"]');
    if (first) first.focus();
  } else if (name === 'give-to') {
    closeMenu();
    request('inv_give', { from: ref, count, target: Number(button.dataset.target) });
  } else if (name === 'show-to') {
    closeMenu();
    render();
    Bridge.send('inv_show', { type: def(entry.name).document, target: Number(button.dataset.target) });
  }
}

el.menu.addEventListener('click', (e) => {
  const button = e.target.closest('.menu__btn');
  if (button && !button.disabled) menuAction(button.dataset.action, button);
});

/* ---------- Ziehen und Ablegen ---------- */

const drag = { start: null, from: null, node: null, active: false, target: null, half: false };

function clearTarget() {
  if (drag.target) drag.target.removeAttribute('data-target');
  drag.target = null;
}

document.addEventListener('pointerdown', (e) => {
  if (!state.open) return;
  if (state.menu && !el.menu.contains(e.target)) {
    closeMenu();
    render();
  }
  if (e.button !== 0) return;
  const node = e.target.closest('.slot[data-filled]');
  if (!node || !el.screen.contains(node) || node.hasAttribute('data-bound')) return;
  drag.start = { x: e.clientX, y: e.clientY };
  drag.from = refOf(node);
  drag.node = node;
  drag.half = e.shiftKey;
});

document.addEventListener('pointermove', (e) => {
  if (!drag.start) return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.start.x, e.clientY - drag.start.y) < DRAG_THRESHOLD_PX) return;
    drag.active = true;
    hideTip();
    drag.node.setAttribute('data-dragging', '');
    el.ghost.replaceChildren(...Array.from(drag.node.children).map((child) => child.cloneNode(true)));
    el.ghost.hidden = false;
  }
  el.ghost.style.left = `${e.clientX}px`;
  el.ghost.style.top = `${e.clientY}px`;
  const over = document.elementFromPoint(e.clientX, e.clientY);
  const slot = over && over.closest('.slot');
  if (slot !== drag.target) {
    clearTarget();
    const blocked = slot && isOther(slot.dataset.inv) && !isOther(drag.from.inv) && !(state.other && state.other.canPut);
    if (slot && slot !== drag.node && el.screen.contains(slot) && !slot.hasAttribute('data-locked') && !blocked) {
      drag.target = slot;
      slot.setAttribute('data-target', '');
    }
  }
});

document.addEventListener('pointerup', (e) => {
  if (!drag.start) return;
  const wasDrag = drag.active;
  const { from, node } = drag;
  const target = drag.target;
  const half = drag.half || e.shiftKey;
  clearTarget();
  el.ghost.hidden = true;
  if (node) node.removeAttribute('data-dragging');
  drag.start = null;
  drag.active = false;
  drag.node = null;
  if (!wasDrag || !target) return;
  const entry = entryAt(from);
  const count = entry && half && entry.count > 1 ? Math.floor(entry.count / 2) : null;
  move(from, refOf(target), count);
});

/* ---------- Klicks und Tasten ---------- */

document.addEventListener('click', (e) => {
  if (!state.open) return;
  if (e.target.closest('[data-action="close"]')) {
    close();
    return;
  }
  const slot = e.target.closest('.slot[data-filled]');
  if (!slot || !el.screen.contains(slot)) return;
  const ref = refOf(slot);
  const same = state.selected && state.selected.inv === ref.inv && state.selected.slot === ref.slot;
  state.selected = same ? null : ref;
  render();
});

document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (!state.open) return;
  const slot = e.target.closest('.slot[data-filled]');
  if (!slot || !el.screen.contains(slot)) {
    closeMenu();
    render();
    return;
  }
  openMenu(slot, e.clientX, e.clientY);
});

document.addEventListener('dblclick', (e) => {
  const slot = e.target.closest('.slot[data-filled]');
  if (!slot || !el.screen.contains(slot)) return;
  if (slot.hasAttribute('data-bound')) {
    openMenu(slot, e.clientX, e.clientY);
    return;
  }
  closeMenu();
  state.selected = refOf(slot);
  use(state.selected);
});

document.addEventListener('keydown', (e) => {
  if (!state.open) return;
  if (e.key === 'Escape' || e.key === 'F2') {
    e.preventDefault();
    if (state.menu && e.key === 'Escape') {
      closeMenu();
      render();
    } else {
      close();
    }
    return;
  }
  const focused = document.activeElement;
  if (e.key === 'Enter' && !state.menu && state.selected && !(focused && focused.matches('button'))) {
    e.preventDefault();
    use(state.selected);
  }
  // Menue auch per Tastatur (Menue-Taste oder Shift+F10)
  if ((e.key === 'ContextMenu' || (e.shiftKey && e.key === 'F10')) && focused && focused.matches('.slot[data-filled]')) {
    e.preventDefault();
    const rect = focused.getBoundingClientRect();
    openMenu(focused, rect.right, rect.top);
  }
});

/* ---------- Schnellzugriff-Leiste ---------- */

let hudTimer = null;
let hudFade = null;

function showHud(data) {
  applyColors(data.colors);
  if (data.items) state.items = data.items;
  if (data.state) state.inv = data.state;
  const items = containerOf('self');
  const slots = [];
  for (let i = 1; i <= (state.layout.hotbar || DEFAULT_LAYOUT.hotbar); i += 1) {
    const node = slotNode('hud', String(i), items[String(i)]);
    node.tabIndex = -1;
    node.setAttribute('aria-current', String(i === Number(data.slot)));
    node.append(make('span', 'hud__key', String(i)));
    slots.push(node);
  }
  el.hud.replaceChildren(...slots);
  el.hud.removeAttribute('data-leaving');
  el.hud.hidden = false;
  el.hudError.hidden = !data.error;
  setText(el.hudError, data.error ? errorText(data.error) : '');
  clearTimeout(hudTimer);
  clearTimeout(hudFade);
  hudTimer = setTimeout(() => {
    el.hud.setAttribute('data-leaving', '');
    el.hudError.hidden = true;
    hudFade = setTimeout(() => { el.hud.hidden = true; }, HUD_FADE_MS);
  }, HUD_VISIBLE_MS);
}

/* ---------- Bridge ---------- */

Bridge.on('inv_open', (data) => {
  applyColors(data.colors);
  state.open = true;
  state.items = data.items || {};
  state.layout = { ...DEFAULT_LAYOUT, ...(data.layout || {}), equip: asArray(data.layout && data.layout.equip) };
  state.inv = data.state || state.inv;
  state.drop = data.drop || null;
  state.other = data.other || null;
  state.selected = null;
  state.busy = false;
  closeMenu();
  hideTip();
  setText(el.toast, '');
  el.hud.hidden = true;
  render();
  el.screen.focus();
});

Bridge.on('inv_state', (data) => {
  if (data.state) state.inv = data.state;

  state.other = data.other || null;
  if (state.selected && !entryAt(state.selected)) state.selected = null;
  render();
  if (state.menu) renderMenu();
});

function formatBirth(value) {
  const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(value || '');
  return match ? `${match[3]}.${match[2]}.${match[1]}` : (value || '');
}

function formatStamp(seconds) {
  return Number.isFinite(Number(seconds)) && seconds ? dateFormat.format(new Date(Number(seconds) * 1000)) : '';
}

function docField(label, value, wide) {
  const wrap = make('div', wide ? 'doc__field doc__field--wide' : 'doc__field');
  const dd = make('dd', null, value || '');
  dd.title = value || '';
  wrap.append(make('dt', null, label), dd);
  return wrap;
}

// Felder je Dokument: Ausweis mit Personendaten, Lizenzen mit Klassen und Ablauf, Dienstausweis mit Dienstgrad
function docFields(card) {
  const fields = [docField(CARD_TEXT.surname, card.lastname), docField(CARD_TEXT.firstname, card.firstname)];
  if (card.type === 'id') {
    fields.push(docField(CARD_TEXT.born, formatBirth(card.dateOfBirth)), docField(CARD_TEXT.gender, CARD_TEXT.genders[card.gender] || card.gender));
    return fields;
  }
  if (card.type === 'service') {
    fields.push(docField(CARD_TEXT.rank, card.rank, true), docField(CARD_TEXT.serviceNumber, card.serviceNumber), docField(CARD_TEXT.issued, formatStamp(card.issuedAt)));
    return fields;
  }
  if (asArray(card.classes).length) {
    const classes = docField(CARD_TEXT.classes, card.classes.map(CARD_TEXT.classItem).join(' '), true);
    classes.querySelector('dd').title = card.classes.map((c) => `${c.id}: ${c.label}`).join(', ');
    fields.push(classes);
  }
  fields.push(docField(CARD_TEXT.issued, formatStamp(card.issuedAt)), docField(CARD_TEXT.valid, card.expiresAt ? formatStamp(card.expiresAt) : CARD_TEXT.validForever));
  return fields;
}

Bridge.on('inv_document', (data) => {
  const card = data.card || {};
  applyColors(data.colors);
  const isService = card.type === 'service';
  cardEl.root.dataset.type = card.type || 'id';
  setText(cardEl.issuer, isService ? (card.orgLabel || card.org || '') : (card.issuer || CARD_TEXT.issuer));
  setText(cardEl.title, card.title || '');

  const photo = typeof data.photo === 'string' && data.photo ? `url("${data.photo}")` : '';
  cardEl.photo.style.backgroundImage = photo;
  setText(cardEl.photo, photo ? '' : `${(card.firstname || '?').charAt(0)}${(card.lastname || '').charAt(0)}`);
  cardEl.ghost.style.backgroundImage = photo;
  cardEl.ghost.hidden = !photo;

  cardEl.fields.replaceChildren(...docFields(card));
  setText(cardEl.sign, `${card.firstname || ''} ${card.lastname || ''}`.trim());
  setText(cardEl.no, CARD_TEXT.number(card.number ?? ''));

  const stamp = CARD_TEXT.stamps[card.status];
  cardEl.stamp.hidden = !stamp;
  setText(cardEl.stamp, stamp || '');

  const seconds = Math.max(1, Number(data.seconds) || 10);
  cardEl.timer.style.transition = 'none';
  cardEl.timer.style.transform = 'scaleX(1)';
  cardEl.root.hidden = false;
  requestAnimationFrame(() => {
    cardEl.timer.style.transition = `transform ${seconds}s linear`;
    cardEl.timer.style.transform = 'scaleX(0)';
  });
  clearTimeout(cardTimer);
  cardTimer = setTimeout(() => { cardEl.root.hidden = true; }, seconds * 1000);
});
