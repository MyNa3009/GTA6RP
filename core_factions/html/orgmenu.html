<!DOCTYPE html>
<!--
  UI: Organisationsmenue (core_factions)
  CONTRACT_VERSION: 2
  Tabs: Uebersicht, Divisionen, Erklaerungen, Anpassung, Fahrzeuge, Leitstelle, Archiv.
  Tabs ohne Zugriff fehlen ganz. Die UI zeigt nur an, jede Aenderung prueft der Server.
  Farben und Logo kommen pro Organisation (overview.org.theme, overview.org.logo).

  EINGEHEND (Lua -> UI)
  orgmenu_open  { colors: { base, ink, accent, signal }, overview: Overview }
  orgmenu_close {}

  Overview {
    org: { id, label, short, ranks, leaderRank, viceRank, logo?, theme?: { base, ink, accent, mark } },
    me: { name, rank?, rankName?, dn?, hiredAt?, lastPromotedAt?, salary?, admin?, readOnly? },
    salaryInterval: number,                 // Minuten im Dienst pro Gehalt
    leader?: string,
    message?: { text, by, at },
    balance?: number,                       // nur mit Recht cash.view
    onDuty: [{ name, dn, rank, rankName }], // gerade im Dienst
    counts: { members, onDuty },
    divisions: [{ id, name, minRank, maxRank, minRankName, maxRankName, count, onDuty }],
    access: { structure, leitstelle, archive, message, cash, divisions, info }
  }

  AUSGEHEND (UI -> Lua), Antwort immer { ok, data?, error? }
  ui_ready      { ui: "orgmenu", version: 2 }                -> data.colors
  orgmenu_close {}
  orgmenu_call  { name, data }                               // name aus der Liste unten, geht unveraendert an den Server
    faction_menu_open {}                                     -> Overview
    faction_message_save { text }                            -> Overview
    faction_cash { action: "deposit" | "withdraw", amount }  -> Overview
    faction_divisions {}                                     -> Divisions
    faction_division_save { id?, name, minRank, maxRank }    -> Divisions
    faction_division_delete { id }                           -> Divisions
    faction_info {}                                          -> Info
    faction_info_save { id?, category, title, body, sort? }  -> Info
    faction_info_delete { id }                               -> Info
    faction_ranks {}                                         -> Ranks
    faction_rank_save { rank, name, permissions: string[], salary?, tasks? } -> Ranks
    faction_department_save { id?, name, ranks: string[] }   -> Ranks
    faction_department_delete { id }                         -> Ranks
    faction_exam_save { id?, name, description? }            -> Ranks
    faction_exam_delete { id }                               -> Ranks
    faction_vehicles {}                                      -> { vehicles: [{ model, label, minRank, rankName }], canEdit }
    faction_vehicle_save { model, minRank }                  -> wie faction_vehicles
    faction_members {}                                       -> Members
    faction_member_update { characterId, field: "dn"|"strikes"|"vacation"|"departments"|"exams", value, examId? } -> Members
    faction_member_rank { characterId, rank }                -> Members
    faction_member_fire { characterId, reason }              -> Members
    faction_member_bonus { characterId, amount, reason? }    -> Members (Leader und Vice, einmal pro Tag je Person)
    faction_hire { characterId }                             -> Members (Person muss online sein und zustimmen)
    faction_archive { page, search? }                        -> { entries: Archived[], page, hasMore }

  Divisions { divisions: [{ id, name, minRank, maxRank, minRankName, maxRankName,
              members: [{ characterId, name, dn, rank, rankName, online?, onDuty? }] }],  // id 0 = Ohne Division
              ranks: [{ rank, name }], canEdit, limits: { divisions, name } }
  Info    { categories: [{ key, label }], sections: [{ id, category, title, body, sort, updatedBy, updatedAt }],
            exams: [{ id, name, description? }], ranks: [{ rank, name, tasks?, salary, newPermissions: string[] }],
            divisions: [{ id, name, minRank, maxRank }], salaryInterval, canEdit,
            limits: { sections, title, body, examDescription, rankTasks } }
  Ranks   { ranks: [{ rank, name, permissions: string[], salary, tasks?, editable, fixedPermissions? }],
            permissions: [{ key, group, label, grantable }], departments: [{ id, name, ranks: string[] }],
            exams: [{ id, name, description? }], canEdit,
            limits: { departments, departmentRanks, exams, rankName, department, exam, examDescription, rankTasks, salary, salaryInterval } }
  Members { members: [{ characterId, name, dn, rank, rankName, strikes, vacationDays, departments: [{ id, name, rank, rankName }],
            exams: [{ id, name, at, by }], hiredAt, lastPromotedAt?, division?, bonusToday?, online?, onDuty?, above?, self? }],
            edit: { hire?, fire?, rank?, dn?, strikes?, vacation?, departments?, exams?, bonus? },
            departments: [{ id, name, ranks }], exams: [{ id, name }], leads: number[], ranks: [{ rank, name, assignable? }],
            limits: { strikes, vacation, dn, reason, bonus } }
  Archived { id, characterId, name, dn, lastRank, ranks: [{ rank, name, at, leader }], exams: [{ name, at, by }],
             hiredAt, leftAt, reason, by, kind: "fire" | "leave" | "admin" }

  FEHLERCODES: not_member, no_permission, invalid_input, invalid_rank, invalid_name, invalid_ranks, invalid_amount,
  invalid_salary, not_enough_money, limit_reached, not_found, dn_taken, already_member, target_offline, consent_declined,
  consent_timeout, target_busy, division_overlap, bonus_today, db_error, server_error, timeout
-->
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organisation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/*
  Oberflaechentyp: Operate (Leitstelle) mit Inspect (Mitarbeiter, Archiv) und Present (Erklaerungen).
  Dichte 7, Bewegung 3, Varianz 4. Fabian will es ausdruecklich "mehr" als clean: Farben der Organisation,
  Logo, Leuchten und kraeftige Kennzahlen sind gewollt.
  Richtung
    Zweck: Leitung und Mitarbeiter einer Organisation verwalten Leute, Raenge, Divisionen und Regeln.
    Charakter: dienstlich, stolz, kraeftig.
    Welt: Wache der Organisation, Wappen an der Wand, Dienstplan, Funk.
    Highlight: Kopf mit Logo und Farbverlauf der Organisation, Kennzahlen und Divisionen in der Uebersicht.
    Signatur: Funkpunkt vor jedem Namen (Akzent = im Dienst, gedaempft = online, leer = offline).
  Farben: base, ink, accent, mark kommen pro Organisation aus der Config (theme). mark ist auch die Warnfarbe.
  Flaeche: grosses Panel fast im Vollbild, Seitenleiste links, Inhalt fuellt den Rest.
*/
:root {
  --rgb-base:   9 14 28;
  --rgb-ink:    240 244 250;
  --rgb-accent: 37 94 190;
  --rgb-signal: 237 28 36;
  --rgb-on-accent: 255 255 255;

  --c-bg:          rgb(var(--rgb-base) / 0.97);
  --c-side:        rgb(var(--rgb-base) / 0.72);
  --c-surface:     rgb(var(--rgb-ink) / 0.05);
  --c-surface-hi:  rgb(var(--rgb-ink) / 0.09);
  --c-border:      rgb(var(--rgb-ink) / 0.09);
  --c-border-hi:   rgb(var(--rgb-ink) / 0.16);
  --c-text:        rgb(var(--rgb-ink) / 0.95);
  --c-text-2:      rgb(var(--rgb-ink) / 0.74);
  --c-text-muted:  rgb(var(--rgb-ink) / 0.56);
  --c-accent:      rgb(var(--rgb-accent));
  --c-accent-hi:   rgb(var(--rgb-accent) / 0.85);
  --c-accent-soft: rgb(var(--rgb-accent) / 0.18);
  --c-accent-line: rgb(var(--rgb-accent) / 0.55);
  --c-signal:      rgb(var(--rgb-signal));
  --c-signal-soft: rgb(var(--rgb-signal) / 0.16);
  --c-on-accent:   rgb(var(--rgb-on-accent));
  --brand-band:    linear-gradient(90deg, rgb(var(--rgb-accent)), rgb(var(--rgb-signal)));
  --glow-accent:   0 0 0 1px rgb(var(--rgb-accent) / 0.5), 0 8px 28px rgb(var(--rgb-accent) / 0.35);
  --edge-light:    inset 0 1px 0 rgb(var(--rgb-ink) / 0.08);
  --shadow:        0 24px 64px rgb(0 0 0 / 0.55);

  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-xs: 4px; --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;

  --fs-xs: clamp(11px, 0.55vw, 13px);
  --fs-sm: clamp(12px, 0.65vw, 14px);
  --fs-md: clamp(14px, 0.75vw, 16px);
  --fs-lg: clamp(17px, 0.95vw, 20px);
  --fs-xl: clamp(21px, 1.25vw, 26px);
  --fs-xxl: clamp(28px, 1.9vw, 40px);
  --fs-hero: clamp(34px, 2.4vw, 52px);

  --dur-fast: 120ms; --dur-base: 200ms;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);

  --panel-w: min(96vw, 1800px);
  --panel-h: min(92dvh, 1060px);
  --side-w: 272px;
  --head-h: 76px;
  --row-h: 48px;
  --nav-h: 44px;
  --field-h: 38px;
  --detail-w: clamp(320px, 21vw, 400px);
  --logo: 64px;
  --mark-size: min(44vw, 640px);
  --dot: 8px;
  --icon: 18px;

  --z-panel: 10;
  --z-modal: 20;
  --z-toast: 30;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Montserrat', sans-serif;
  font-size: var(--fs-md);
  color: var(--c-text);
  -webkit-font-smoothing: antialiased;
}

[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: var(--icon); height: var(--icon); flex: none; }

/* ---------- Panel mit Farben der Organisation ---------- */
.panel {
  position: fixed;
  left: 50%;
  top: 50%;
  z-index: var(--z-panel);
  width: var(--panel-w);
  height: var(--panel-h);
  transform: translate(-50%, -50%);
  display: grid;
  grid-template-columns: var(--side-w) 1fr;
  background:
    radial-gradient(1100px 620px at 0% 0%, rgb(var(--rgb-accent) / 0.24), transparent 62%),
    radial-gradient(900px 520px at 100% 100%, rgb(var(--rgb-signal) / 0.12), transparent 60%),
    repeating-linear-gradient(135deg, rgb(var(--rgb-ink) / 0.02) 0 2px, transparent 2px 14px),
    var(--c-bg);
  border: 1px solid var(--c-border-hi);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow), 0 0 0 1px rgb(var(--rgb-accent) / 0.18);
  overflow: hidden;
  isolation: isolate;
}
.panel::before {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 0;
  height: 4px;
  background: var(--brand-band);
  z-index: 2;
}
/* Wasserzeichen: Logo gross und blass rechts unten */
.watermark {
  position: absolute;
  right: calc(var(--mark-size) * -0.18);
  bottom: calc(var(--mark-size) * -0.2);
  width: var(--mark-size);
  height: var(--mark-size);
  opacity: 0.05;
  transform: rotate(-12deg);
  pointer-events: none;
  z-index: -1;
  object-fit: contain;
}

/* ---------- Seitenleiste ---------- */
.side {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: var(--space-6) var(--space-4) var(--space-4);
  background: var(--c-side);
  border-right: 1px solid var(--c-border);
}
.brand { display: grid; grid-template-columns: var(--logo) 1fr; gap: var(--space-3); align-items: center; padding: 0 var(--space-1) var(--space-5); }
.brand__logo {
  width: var(--logo);
  height: var(--logo);
  border-radius: 50%;
  object-fit: contain;
  background: rgb(var(--rgb-ink) / 0.96);
  box-shadow: 0 0 0 3px rgb(var(--rgb-accent) / 0.6), 0 0 32px rgb(var(--rgb-accent) / 0.55);
}
.brand__logo--none { display: grid; place-items: center; background: var(--brand-band); color: var(--c-on-accent); font-weight: 700; font-size: var(--fs-lg); }
.brand__short { font-size: var(--fs-xxl); font-weight: 700; letter-spacing: 0.04em; line-height: 1; }
.brand__label { margin-top: var(--space-1); font-size: var(--fs-xs); color: var(--c-text-muted); text-transform: uppercase; letter-spacing: 0.08em; line-height: 1.35; }

.nav { display: grid; gap: var(--space-1); }
.nav__item {
  position: relative;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  height: var(--nav-h);
  padding: 0 var(--space-3) 0 var(--space-2);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--c-text-2);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.nav__tile { display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-sm); background: var(--c-surface); }
.nav__item:hover { background: var(--c-surface); color: var(--c-text); }
.nav__item[aria-current="page"] {
  background: linear-gradient(90deg, rgb(var(--rgb-accent) / 0.32), rgb(var(--rgb-accent) / 0.04));
  color: var(--c-text);
}
.nav__item[aria-current="page"]::before {
  content: '';
  position: absolute;
  left: calc(var(--space-4) * -1);
  top: 8px; bottom: 8px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--c-accent);
  box-shadow: 0 0 12px rgb(var(--rgb-accent));
}
.nav__item[aria-current="page"] .nav__tile { background: var(--c-accent); color: var(--c-on-accent); box-shadow: 0 4px 14px rgb(var(--rgb-accent) / 0.55); }
.nav__count {
  margin-left: auto;
  min-width: 24px;
  padding: 2px var(--space-2);
  border-radius: 999px;
  background: var(--c-surface-hi);
  color: var(--c-text-2);
  font-size: var(--fs-xs);
  text-align: center;
}

.side__me {
  margin-top: auto;
  display: grid;
  grid-template-columns: 44px 1fr;
  gap: var(--space-3);
  align-items: center;
  padding: var(--space-3);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
  background: var(--c-surface);
}
.avatar {
  display: grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--brand-band);
  color: var(--c-on-accent);
  font-weight: 700;
  font-size: var(--fs-sm);
  letter-spacing: 0.04em;
}
.side__name { font-size: var(--fs-sm); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side__rank { margin-top: 2px; font-size: var(--fs-xs); color: var(--c-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge-admin {
  grid-column: 1 / -1;
  justify-self: start;
  padding: 2px var(--space-2);
  border: 1px solid var(--c-accent-line);
  border-radius: var(--radius-xs);
  color: var(--c-text);
  background: var(--c-accent-soft);
  font-size: var(--fs-xs);
  font-weight: 600;
}

/* ---------- Inhalt ---------- */
.main { display: grid; grid-template-rows: var(--head-h) 1fr; min-width: 0; min-height: 0; }
.head {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-2) var(--space-6) 0;
  border-bottom: 1px solid var(--c-border);
}
.head__eyebrow { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-accent-hi); }
.head__title { margin: 2px 0 0; font-size: var(--fs-xl); font-weight: 700; }
.head__meta { align-self: flex-end; margin-bottom: var(--space-4); color: var(--c-text-muted); font-size: var(--fs-sm); }
.head__actions { margin-left: auto; display: flex; align-items: center; gap: var(--space-2); }

.view { min-height: 0; overflow: auto; padding: var(--space-6); }
.view--split { display: grid; grid-template-columns: 1fr var(--detail-w); gap: 0; padding: 0; overflow: hidden; }
.view--split > .scroll { min-height: 0; overflow: auto; padding: var(--space-5) var(--space-6); }
.view--split > .detail { min-height: 0; overflow: auto; padding: var(--space-5); border-left: 1px solid var(--c-border); background: rgb(var(--rgb-base) / 0.5); }

/* ---------- Bedienelemente ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--field-h);
  padding: 0 var(--space-4);
  border: 1px solid var(--c-border-hi);
  border-radius: var(--radius-sm);
  background: var(--c-surface);
  color: var(--c-text);
  font-size: var(--fs-sm);
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.btn:hover:not(:disabled) { background: var(--c-surface-hi); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn--primary { background: var(--c-accent); border-color: transparent; color: var(--c-on-accent); box-shadow: 0 6px 18px rgb(var(--rgb-accent) / 0.35); }
.btn--primary:hover:not(:disabled) { background: var(--c-accent); box-shadow: var(--glow-accent); }
.btn--danger { border-color: rgb(var(--rgb-signal) / 0.5); color: var(--c-signal); background: transparent; }
.btn--danger:hover:not(:disabled) { background: var(--c-signal-soft); }
.btn--ghost { border-color: transparent; background: transparent; color: var(--c-text-2); }
.btn--icon { width: var(--field-h); padding: 0; }
.btn--sm { height: 30px; padding: 0 var(--space-3); font-size: var(--fs-xs); }

.field { display: grid; gap: var(--space-2); }
.field__label { font-size: var(--fs-xs); font-weight: 600; color: var(--c-text-muted); letter-spacing: 0.02em; }
.input, .select, .textarea {
  width: 100%;
  height: var(--field-h);
  padding: 0 var(--space-3);
  border: 1px solid var(--c-border-hi);
  border-radius: var(--radius-sm);
  background: rgb(var(--rgb-base) / 0.7);
  font-size: var(--fs-sm);
  outline: none;
}
.textarea { height: auto; min-height: 120px; padding: var(--space-3); resize: vertical; line-height: 1.55; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--c-accent-line); box-shadow: 0 0 0 3px rgb(var(--rgb-accent) / 0.18); }
.input:disabled, .select:disabled, .textarea:disabled { opacity: 0.6; }
.select option { background: rgb(var(--rgb-base)); }

:focus-visible { outline: 2px solid var(--c-accent-line); outline-offset: 2px; }

.check {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 32px;
  padding: 0 var(--space-2);
  border-radius: var(--radius-xs);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.check:hover { background: var(--c-surface); }
.check input { width: 16px; height: 16px; margin: 0; accent-color: rgb(var(--rgb-accent)); }
.check--locked { cursor: default; color: var(--c-text-muted); }
.check--locked:hover { background: transparent; }

.section-title { margin: 0 0 var(--space-3); font-size: var(--fs-xs); font-weight: 700; color: var(--c-text-muted); letter-spacing: 0.1em; text-transform: uppercase; }
.muted { color: var(--c-text-muted); }
.empty { padding: var(--space-6) 0; color: var(--c-text-muted); font-size: var(--fs-sm); }
.note { margin-top: var(--space-3); font-size: var(--fs-xs); color: var(--c-text-muted); line-height: 1.5; }

.box {
  padding: var(--space-5);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, rgb(var(--rgb-ink) / 0.06), rgb(var(--rgb-ink) / 0.025));
  box-shadow: var(--edge-light);
}
.box__head { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-4); }
.box__head .section-title { margin: 0; }
.box__head > :last-child:not(:first-child) { margin-left: auto; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 3px var(--space-3);
  border-radius: 999px;
  background: var(--c-accent-soft);
  border: 1px solid var(--c-accent-line);
  color: var(--c-text);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}
.pill--mark { background: var(--c-signal-soft); border-color: rgb(var(--rgb-signal) / 0.5); }
.pill--plain { background: var(--c-surface); border-color: var(--c-border); color: var(--c-text-2); }

/* ---------- Uebersicht ---------- */
.overview { display: grid; gap: var(--space-5); }
.hero {
  position: relative;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: var(--space-5);
  align-items: center;
  padding: var(--space-5) var(--space-6);
  border-radius: var(--radius-xl);
  border: 1px solid rgb(var(--rgb-accent) / 0.45);
  background:
    linear-gradient(110deg, rgb(var(--rgb-accent) / 0.42), rgb(var(--rgb-accent) / 0.08) 55%, rgb(var(--rgb-signal) / 0.18)),
    rgb(var(--rgb-base) / 0.6);
  box-shadow: 0 16px 40px rgb(var(--rgb-accent) / 0.22), var(--edge-light);
  overflow: hidden;
}
.hero__logo { width: 96px; height: 96px; border-radius: 50%; object-fit: contain; background: rgb(var(--rgb-ink) / 0.96); box-shadow: 0 0 0 4px rgb(var(--rgb-ink) / 0.18), 0 10px 30px rgb(0 0 0 / 0.4); }
.hero__org { font-size: var(--fs-xs); font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: rgb(var(--rgb-ink) / 0.8); }
.hero__name { margin-top: var(--space-1); font-size: var(--fs-hero); font-weight: 700; line-height: 1.05; }
.hero__rank { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.hero__facts { display: grid; grid-template-columns: repeat(2, auto); gap: var(--space-3) var(--space-6); margin: 0; }
.hero__facts dt { font-size: var(--fs-xs); color: rgb(var(--rgb-ink) / 0.66); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.hero__facts dd { margin: 2px 0 0; font-size: var(--fs-md); font-weight: 700; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
.stat {

const CONTRACT_VERSION = 2;

const Bridge = (() => {
  const handlers = {};
  const isFiveM = typeof GetParentResourceName === 'function';
  const platform = isFiveM ? 'fivem' : 'mock';

  function on(event, fn) {
    (handlers[event] ||= []).push(fn);
  }

  function emit(event, data) {
    (handlers[event] || []).forEach((fn) => {
      try { fn(data ?? {}); } catch (err) { console.error(`[bridge] ${event}`, err); }
    });
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg || typeof msg.action !== 'string') return;
    emit(msg.action, msg.data);
  });

  async function send(event, data = {}) {
    if (platform === 'mock') return Mock.handle(event, data);
    try {
      const res = await fetch(`https://${GetParentResourceName()}/${event}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(data),
      });
      return await res.json();
    } catch (err) {
      console.error(`[bridge] send ${event}`, err);
      return { ok: false, error: 'bridge_error' };
    }
  }

  return { on, send, emit, platform };
})();

    faction_vehicle_save: (d) => { db.vehicles.find((v) => v.model === d.model).minRank = d.minRank; return calls.faction_vehicles(); },
    faction_members: () => ({ ok: true, data: membersPayload() }),
    faction_member_update: (d) => {
      const m = db.members.find((x) => x.characterId === d.characterId);
      if (d.field === 'dn') m.dn = d.value; if (d.field === 'strikes') m.strikes = d.value; if (d.field === 'vacation') m.vacationDays = d.value;
      if (d.field === 'departments') m.departments = d.value;
      if (d.field === 'exams') { m.exams = m.exams.filter((e) => e.id !== d.examId); if (d.value === 'add') m.exams.push({ id: d.examId, at: '2026-11-07', by: 'Lena Hoffmann' }); }
      return { ok: true, data: membersPayload() };
    },
    faction_member_rank: (d) => { db.members.find((x) => x.characterId === d.characterId).rank = d.rank; return { ok: true, data: membersPayload() }; },
    faction_member_fire: (d) => { db.members = db.members.filter((x) => x.characterId !== d.characterId); return { ok: true, data: membersPayload() }; },
    faction_hire: (d) => d.characterId === 999 ? { ok: false, error: 'consent_declined' } : (db.members.push({ characterId: d.characterId, name: 'Neue Person', dn: 'EMS-012', rank: 1, strikes: 0, vacationDays: 0, departments: [], exams: [], hiredAt: '2026-11-07', online: true }), { ok: true, data: membersPayload() }),
    faction_archive: (d) => ({ ok: true, data: { entries: db.archive.filter((a) => !d.search || a.name.toLowerCase().includes(d.search.toLowerCase()) || String(a.characterId) === d.search), page: 1, hasMore: false } }),
  };
  return {
    delay: 120,
    async handle(event, data) {
      await new Promise((r) => setTimeout(r, this.delay));
      console.info(`[mock] ${event}`, data);
      if (event === 'orgmenu_call') {
        const fn = calls[data.name];
        return fn ? fn(data.data || {}) : { ok: false, error: 'invalid_input' };
      }
      return { ok: true };
    },
    push(event, data) { Bridge.emit(event, data); },
    overview,
  };
})();
</script>

const DIVISION_ALPHA = [1, 1, 0.7, 0.7, 0.5];
const TOAST_MS = 2600;
const COLOR_PATTERN = /^\d{1,3} \d{1,3} \d{1,3}$/;
const COLOR_KEYS = ['base', 'ink', 'accent', 'signal'];
const THEME_KEYS = { base: 'base', ink: 'ink', accent: 'accent', mark: 'signal' };
const MONEY = new Intl.NumberFormat('de-DE');

};

  modalConfirm: document.getElementById('modal-confirm'),
  toast: document.getElementById('toast'),
};

/* ---------- Hilfen ---------- */
function make(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function icon(id) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'icon');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('aria-hidden', 'true');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', `#${id}`);
  svg.append(use);
  return svg;
}
function button(label, action, variant = '', attrs = {}) {
  const node = make('button', `btn ${variant}`.trim(), label);
  node.type = 'button';
  node.dataset.action = action;
  Object.entries(attrs).forEach(([k, v]) => { if (v !== undefined) node.dataset[k] = v; });
  return node;
}
function input(value, attrs = {}) {
  const node = make('input', 'input');
  node.value = value ?? '';
  Object.entries(attrs).forEach(([k, v]) => { if (v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v); });
  return node;
}
function select(options, value, attrs = {}) {
  const node = make('select', 'select');
  options.forEach((o) => {
    const opt = make('option', '', o.label);
    opt.value = String(o.value);
    if (o.disabled) opt.disabled = true;
    node.append(opt);
  });
  node.value = String(value);
  Object.entries(attrs).forEach(([k, v]) => { if (v !== undefined && v !== false) node.setAttribute(k, v === true ? '' : v); });
  return node;
}
function field(label, control) {
  const wrap = make('label', 'field');
  wrap.append(make('span', 'field__label', label), control);
  return wrap;
}
function applyColors(colors) {
  if (!colors) return;
  COLOR_KEYS.forEach((key) => {
    if (typeof colors[key] === 'string' && COLOR_PATTERN.test(colors[key])) {
      document.documentElement.style.setProperty(`--rgb-${key}`, colors[key]);
    }
  });
}
// Farben der Organisation (theme) ueberschreiben die allgemeinen. mark ist die zweite Farbe und die Warnfarbe.
function applyTheme(theme) {
  if (!theme) return;
  Object.entries(THEME_KEYS).forEach(([from, to]) => {
    if (typeof theme[from] === 'string' && COLOR_PATTERN.test(theme[from])) {
      document.documentElement.style.setProperty(`--rgb-${to}`, theme[from]);
    }
  });
}
function initials(name) {
  return String(name || '').split(/\s+/).filter(Boolean).slice(0, 2).map((p) => p[0].toUpperCase()).join('');
}
function applyLogo(org) {
  const src = typeof org.logo === 'string' && /^[\w/.-]+\.(png|webp|jpg|jpeg|svg)$/i.test(org.logo) ? org.logo : null;
  [el.brandLogo, el.watermark].forEach((img) => {
    img.hidden = !src;
    if (src && img.getAttribute('src') !== src) img.src = src;
  });
  el.brandLogoNone.hidden = !!src;
  el.brandLogoNone.textContent = src ? '' : (org.short || '').slice(0, 3);
}
function money(n) {
  return `${MONEY.format(n || 0)} $`;
}
function datesTile(pairs) {
  const dl = make('dl', 'detail__dates');
  pairs.forEach(([k, v]) => { const d = make('div', 'date-tile'); d.append(make('dt', '', k), make('dd', 'num', v)); dl.append(d); });
  return dl;
}

let toastTimer = null;
function toast(text, error = false) {
  el.toast.textContent = text;
  el.toast.classList.toggle('toast--error', error);
  el.toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.toast.hidden = true; }, TOAST_MS);
}
function errorText(code) {
  return TEXT.errors[code] || TEXT.errors.default;
}
function readOnly() {
  return state.overview?.me?.readOnly === true;
}

// Anfrage an den Server, waehrend sie laeuft sind Aktionen gesperrt
async function call(name, data = {}) {
  if (state.busy) return null;
  state.busy = true;
  el.panel.setAttribute('aria-busy', 'true');
  const res = await Bridge.send('orgmenu_call', { name, data });
  state.busy = false;
  el.panel.removeAttribute('aria-busy');
  if (!res || !res.ok) {
    toast(errorText(res && res.error), true);
    return null;
  }
  return res.data ?? {};
}

/* ---------- Grundgeruest ---------- */
function renderFrame() {
  const ov = state.overview;
  el.brandShort.textContent = ov.org.short;
  el.brandLabel.textContent = ov.org.label;
  applyLogo(ov.org);
  el.meAvatar.textContent = initials(ov.me.name);
  el.meName.textContent = ov.me.name;
  el.meRank.textContent = ov.me.rankName ? `${ov.me.rankName} · ${ov.me.dn || ''}`.replace(/ · $/, '') : '';
  el.meAdmin.hidden = !ov.me.admin;
  el.meAdmin.textContent = ov.me.admin ? TEXT.admin(ov.me.readOnly) : '';
  el.nav.replaceChildren(...TABS.filter((t) => t.access(ov.access)).map((t) => {
    const item = make('button', 'nav__item');
    item.type = 'button';
    item.dataset.action = 'tab';
    item.dataset.tab = t.id;
    if (state.tab === t.id) item.setAttribute('aria-current', 'page');
    const tile = make('span', 'nav__tile');
    tile.append(icon(t.icon));
    item.append(tile, make('span', '', TEXT.tabs[t.id]));
    if (t.id === 'leitstelle' && ov.counts) item.append(make('span', 'nav__count num', ov.counts.members));
    if (t.id === 'divisions' && ov.divisions) item.append(make('span', 'nav__count num', ov.divisions.length));
    return item;
  }));
}

function setHead(title, meta = '', actions = []) {
  const ov = state.overview;
  el.headEyebrow.textContent = ov ? `${ov.org.short} · ${ov.org.label}` : '';
  el.headTitle.textContent = title;
  el.headMeta.textContent = meta;
  el.headActions.replaceChildren(...actions);
}

async function openTab(tab) {
  state.tab = tab;
  if (tab === 'structure' && !state.ranks) state.ranks = await call('faction_ranks');
  if (tab === 'vehicles' && !state.vehicles) state.vehicles = await call('faction_vehicles');
  if (tab === 'leitstelle' && !state.members) state.members = await call('faction_members');
  if (tab === 'archive' && !state.archive) state.archive = await call('faction_archive', { page: 1 });
  if (tab === 'divisions' && !state.divisions) state.divisions = await call('faction_divisions');
  if (tab === 'info' && !state.info) state.info = await call('faction_info');
  render();
}

function render() {
  if (!state.open || !state.overview) return;
  renderFrame();
  el.view.className = 'view';
  ({ overview: renderOverview, divisions: renderDivisions, info: renderInfo, structure: renderStructure, vehicles: renderVehicles,
    leitstelle: renderLeitstelle, archive: renderArchive })[state.tab]();
}

/* ---------- Uebersicht ---------- */
function statTile(iconId, label, value, sub, mark = false) {
  const tile = make('div', `stat${mark ? ' stat--mark' : ''}`);
  const head = make('div', 'stat__label');
  head.append(icon(iconId), make('span', '', label));
  tile.append(head, make('div', 'stat__value num', value));
  if (sub) tile.append(make('div', 'stat__sub', sub));
  return tile;
}

function divisionColor(index) {
  return `rgb(${DIVISION_TINTS[index % DIVISION_TINTS.length]} / ${DIVISION_ALPHA[index % DIVISION_ALPHA.length]})`;
}

function renderOverview() {
  const ov = state.overview;
  setHead(TEXT.tabs.overview);
  const wrap = make('div', 'overview');

  // Kopf: Logo, Name, Rang, Daten
  const hero = make('section', 'hero');
  if (ov.org.logo) {
    const logo = make('img', 'hero__logo');
    logo.src = ov.org.logo;
    logo.alt = '';
    hero.append(logo);
  } else hero.append(make('div', 'avatar', initials(ov.me.name)));
  const who = make('div');
  who.append(make('div', 'hero__org', ov.org.label), make('div', 'hero__name', ov.me.name));
  const pills = make('div', 'hero__rank');
  pills.append(make('span', 'pill', ov.me.rankName || TEXT.hero.noRank));
  if (ov.me.rank) pills.append(make('span', 'pill pill--plain num', TEXT.hero.rank(ov.me.rank, ov.org.ranks)));
  if (ov.me.dn) pills.append(make('span', 'pill pill--mark num', ov.me.dn));
  who.append(pills);
  const facts = make('dl', 'hero__facts');
  [[TEXT.hero.leader, ov.leader || TEXT.hero.none], [TEXT.hero.hired, ov.me.hiredAt || '-'],
    [TEXT.hero.promoted, ov.me.lastPromotedAt || TEXT.hero.never], [TEXT.hero.salary, ov.me.salary !== undefined && ov.me.salary !== null ? `${money(ov.me.salary)} / ${ov.salaryInterval || 60} Min` : '-']]
    .forEach(([k, v]) => { const d = make('div'); d.append(make('dt', '', k), make('dd', 'num', v)); facts.append(d); });
  hero.append(who, facts);
  wrap.append(hero);

  // Kennzahlen
  const counts = ov.counts || { members: 0, onDuty: 0 };
  const stats = make('div', 'stats');
  stats.append(
    statTile('i-users', TEXT.stats.members, counts.members, `${(ov.divisions || []).length} ${TEXT.tabs.divisions}`),
    statTile('i-pulse', TEXT.stats.duty, counts.onDuty, TEXT.stats.ofMembers(counts.members), true),
    statTile('i-layers', TEXT.stats.divisions, (ov.divisions || []).length, TEXT.stats.max(5)),
    statTile('i-cash', TEXT.stats.cash, typeof ov.balance === 'number' ? money(ov.balance) : '-', typeof ov.balance === 'number' ? '' : TEXT.stats.hidden, true));
  wrap.append(stats);

  const grid = make('div', 'overview__grid');
  const left = make('div', 'stack');
  const right = make('div', 'stack');

  // Divisionen im Ueberblick
  const divBox = make('section', 'box');
  const divHead = make('div', 'box__head');
  divHead.append(make('h2', 'section-title', TEXT.divisions.summary));
  if (ov.access.divisions) divHead.append(button(TEXT.tabs.divisions, 'tab', 'btn--sm', { tab: 'divisions' }));
  divBox.append(divHead);
  const divisions = ov.divisions || [];
  if (!divisions.length) divBox.append(make('div', 'muted', TEXT.divisions.none));
  else {
    const grid2 = make('div', 'div-grid');
    divisions.forEach((d, i) => {
      const card = make('article', 'div-card');
      card.style.setProperty('--div-color', divisionColor(i));
      const count = make('div', 'div-card__count');
      count.append(make('strong', 'num', d.count), make('span', 'muted', TEXT.divisions.duty(d.onDuty)));
      const bar = make('div', 'bar');
      const fill = make('span');
      fill.style.width = `${counts.members ? Math.round((d.count / counts.members) * 100) : 0}%`;
      bar.append(fill);
      card.append(make('div', 'div-card__name', d.name), make('div', 'div-card__ranks', TEXT.divisions.ranks(d.minRank, d.maxRank)), count, bar);
      grid2.append(card);
    });
    divBox.append(grid2);
  }
  left.append(divBox);

  // Nachricht vom Leader
  const memo = make('section', 'box memo');
  memo.append(make('h2', 'section-title', TEXT.memo.title));
  if (state.memoEdit) {
    const area = make('textarea', 'textarea');
    area.id = 'memo-text';
    area.maxLength = 600;
    area.value = ov.message?.text || '';
    const actions = make('div', 'memo__actions');
    actions.append(button(TEXT.memo.cancel, 'memo-cancel', 'btn--ghost'), button(TEXT.memo.save, 'memo-save', 'btn--primary'));
    memo.append(area, actions);
    requestAnimationFrame(() => area.focus());
  } else {
    memo.append(ov.message ? make('p', 'memo__text', ov.message.text) : make('p', 'memo__text muted', TEXT.memo.empty));
    if (ov.message) memo.append(make('div', 'memo__by', TEXT.memo.by(ov.message.by, ov.message.at)));
    if (ov.access.message && !readOnly()) {
      const actions = make('div', 'memo__actions');
      actions.append(button(TEXT.memo.edit, 'memo-edit'));
      memo.append(actions);
    }
  }
  left.append(memo);

  // Im Dienst
  const duty = make('section', 'box');
  const list = ov.onDuty || [];
  duty.append(make('h2', 'section-title', `${TEXT.duty.title} · ${list.length}`));
  if (!list.length) duty.append(make('div', 'muted', TEXT.duty.none));
  else {
    const ul = make('ul', 'duty-list');
    list.forEach((p) => {
      const li = make('li');
      const w = make('div', 'who');
      w.append(make('span', 'dot dot--duty'), make('span', 'who__name', p.name));
      li.append(w, make('span', 'muted num', p.dn || ''), make('span', 'muted', `${p.rank} · ${p.rankName}`));
      ul.append(li);
    });
    duty.append(ul);
  }
  right.append(duty);

  // Kasse: der Stand steht oben bei den Kennzahlen, hier nur Ein- und Auszahlen
  if (typeof ov.balance === 'number' && ov.access.cash && !readOnly()) {
    const cash = make('section', 'box');
    cash.append(make('h2', 'section-title', TEXT.cash.title));
    const row = make('div', 'cash__row');
    const amount = input('', { type: 'number', min: 1, step: 1, placeholder: TEXT.cash.amount, id: 'cash-amount', 'aria-label': TEXT.cash.amount });
    row.append(amount, button(TEXT.cash.deposit, 'cash', '', { kind: 'deposit' }), button(TEXT.cash.withdraw, 'cash', '', { kind: 'withdraw' }));
    cash.append(row, make('div', 'note', TEXT.cash.hint));
    right.append(cash);
  }
  grid.append(left, right);
  wrap.append(grid);
  el.view.replaceChildren(wrap);
}

/* ---------- Divisionen ---------- */
function rankSelect(value, role, extra = {}) {
  const ranks = state.divisions?.ranks || [];
  return select([...ranks].sort((a, b) => a.rank - b.rank).map((r) => ({ value: r.rank, label: `${r.rank} · ${r.name}` })), value, { 'data-role': role, ...extra });
}

function renderDivisions() {
  const data = state.divisions;
  if (!data) { setHead(TEXT.tabs.divisions); el.view.replaceChildren(make('div', 'empty', TEXT.errors.default)); return; }
  const real = data.divisions.filter((d) => d.id);
  setHead(TEXT.tabs.divisions, TEXT.divisions.count(real.length, data.limits.divisions));
  const wrap = make('div');
  if (data.canEdit) {
    if (real.length < data.limits.divisions) {
      const form = make('div', 'division-new');
      form.append(field(TEXT.divisions.name, input('', { id: 'div-new-name', maxlength: data.limits.name })),
        field(TEXT.divisions.from, rankSelect(1, 'div-new-from', { id: 'div-new-from' })),
        field(TEXT.divisions.to, rankSelect(1, 'div-new-to', { id: 'div-new-to' })),
        button(TEXT.divisions.add, 'division-add', 'btn--primary'));
      wrap.append(form);
    } else wrap.append(make('div', 'note', TEXT.divisions.limit));
  }
  wrap.append(make('p', 'info__intro', TEXT.divisions.hint));
  const grid = make('div', 'divisions');
  data.divisions.forEach((d, i) => {
    const card = make('section', 'division');
    if (d.id) card.style.setProperty('--div-tint', divisionColor(i).replace(/\/ [\d.]+\)$/, '/ 0.45)'));
    else card.style.setProperty('--div-tint', 'rgb(var(--rgb-ink) / 0.08)');
    const head = make('header', 'division__head');
    const top = make('div', 'division__top');
    top.append(make('h2', 'division__name', d.name), make('span', 'division__count num', d.members.length));
    head.append(top, make('div', 'division__ranks', d.id ? `${TEXT.divisions.ranks(d.minRank, d.maxRank)} · ${d.minRankName} bis ${d.maxRankName}` : TEXT.divisions.members(d.members.length)));
    card.append(head);
    const ul = make('ul', 'division__list');
    d.members.forEach((m) => {
      const li = make('li');
      const w = make('div', 'who');
      const st = statusOf(m);
      const dot = make('span', st.cls);
      dot.title = st.label;
      w.append(dot, make('span', 'who__name', m.name));
      li.append(w, make('span', 'muted num', `${m.rank} · ${m.rankName}`));
      ul.append(li);
    });
    if (!d.members.length) ul.append(make('li', 'muted', TEXT.divisions.empty));
    card.append(ul);
    if (data.canEdit && d.id) {
      const edit = make('div', 'division__edit');
      edit.dataset.id = d.id;
      const buttons = make('div', 'division__buttons');
      buttons.append(button(TEXT.divisions.del, 'division-delete', 'btn--danger btn--sm', { id: d.id }), button(TEXT.divisions.save, 'division-save', 'btn--sm', { id: d.id }));
      edit.append(field(TEXT.divisions.nameShort, input(d.name, { 'data-role': 'div-name', maxlength: data.limits.name })),
        field(TEXT.divisions.from, rankSelect(d.minRank, 'div-from')), field(TEXT.divisions.to, rankSelect(d.maxRank, 'div-to')), buttons);
      card.append(edit);
    }
    grid.append(card);
  });
  if (!data.divisions.length) grid.append(make('div', 'empty', TEXT.divisions.none));
  wrap.append(grid);
  el.view.replaceChildren(wrap);
}

/* ---------- Erklaerungen ---------- */
function renderInfo() {
  const data = state.info;
  setHead(TEXT.tabs.info, data && !data.canEdit ? TEXT.info.onlyLeaders : '');
  if (!data) { el.view.replaceChildren(make('div', 'empty', TEXT.errors.default)); return; }
  const wrap = make('div', 'info');
  const nav = make('nav', 'info__nav');
  nav.setAttribute('aria-label', TEXT.tabs.info);
  const subs = [{ key: 'exams', label: TEXT.info.exams, count: data.exams.length }, { key: 'ranks', label: TEXT.info.ranks, count: data.ranks.length },
    ...data.categories.map((c) => ({ key: c.key, label: c.label, count: data.sections.filter((x) => x.category === c.key).length }))];
  if (!subs.some((x) => x.key === state.infoSub)) state.infoSub = 'exams';
  subs.forEach((sub) => {
    const b = make('button');
    b.type = 'button';
    b.dataset.action = 'info-sub';
    b.dataset.sub = sub.key;
    b.setAttribute('aria-pressed', String(state.infoSub === sub.key));
    b.append(make('span', '', sub.label), make('span', 'nav__count num', sub.count));
    nav.append(b);
  });
  const content = make('div', 'info__content');
  if (state.infoSub === 'exams') renderInfoExams(content, data);
  else if (state.infoSub === 'ranks') renderInfoRanks(content, data);
  else renderInfoSections(content, data, state.infoSub);
  wrap.append(nav, content);
  el.view.replaceChildren(wrap);
}

function renderInfoExams(box, data) {
  box.append(make('p', 'info__intro', TEXT.info.examsIntro));
  if (!data.exams.length) { box.append(make('div', 'empty', TEXT.info.noExams)); return; }
  data.exams.forEach((e) => {
    const art = make('article', 'article');
    art.dataset.id = e.id;
    art.append(make('h3', 'article__title', e.name));
    if (data.canEdit) {
      const area = make('textarea', 'textarea');
      area.value = e.description || '';
      area.maxLength = data.limits.examDescription;
      area.dataset.role = 'exam-desc';
      area.setAttribute('aria-label', `${TEXT.info.description}: ${e.name}`);
      area.placeholder = TEXT.info.noDescription;
      const actions = make('div', 'article__actions');
      actions.append(button(TEXT.info.saveDescription, 'exam-desc-save', 'btn--primary btn--sm', { id: e.id }));
      art.append(field(TEXT.info.description, area), actions);
    } else {
      art.append(make('p', `article__body${e.description ? '' : ' muted'}`, e.description || TEXT.info.noDescription));
    }
    box.append(art);
  });
}

function renderInfoRanks(box, data) {
  box.append(make('p', 'info__intro', TEXT.info.ranksIntro));
  if (data.canEdit) box.append(make('div', 'note', TEXT.info.tasksHint));
  const ol = make('ol', 'ladder');
  [...data.ranks].reverse().forEach((r) => {
    const li = make('li');
    const body = make('div');
    body.append(make('div', 'ladder__name', r.name), make('div', `ladder__tasks${r.tasks ? '' : ' muted'}`, r.tasks || TEXT.info.noTasks));
    if (r.newPermissions.length) {
      const chips = make('div', 'chips');
      r.newPermissions.forEach((p) => chips.append(make('span', 'chip chip--division', p)));
      body.append(chips);
    }
    li.append(make('span', 'ladder__no num', r.rank), body, make('span', 'ladder__salary num', r.salary ? TEXT.info.salary(money(r.salary), data.salaryInterval) : ''));
    ol.append(li);
  });
  box.append(ol);
}

function sectionForm(data, category, entry) {
  const form = make('div', 'article article-form');
  form.dataset.id = entry?.id || '';
  const row = make('div', 'article-form__row');
  row.append(field(TEXT.info.titleLabel, input(entry?.title || '', { 'data-role': 'info-title', maxlength: data.limits.title })),
    field(TEXT.info.categoryLabel, select(data.categories.map((c) => ({ value: c.key, label: c.label })), entry?.category || category, { 'data-role': 'info-category' })),
    field(TEXT.info.sortLabel, input(entry?.sort ?? 0, { type: 'number', min: -999, max: 999, 'data-role': 'info-sort' })));
  const area = make('textarea', 'textarea');
  area.value = entry?.body || '';
  area.maxLength = data.limits.body;
  area.dataset.role = 'info-body';
  area.rows = 8;
  const actions = make('div', 'article__actions');
  actions.append(button(TEXT.info.save, 'info-save', 'btn--primary btn--sm'), button(TEXT.info.cancel, 'info-cancel', 'btn--ghost btn--sm'));
  form.append(row, field(TEXT.info.bodyLabel, area), actions);
  return form;
}

function renderInfoSections(box, data, category) {
  const list = data.sections.filter((x) => x.category === category);
  if (data.canEdit && state.infoEdit === 'new') box.append(sectionForm(data, category, null));
  else if (data.canEdit && list.length + 0 < data.limits.sections) {
    const add = make('div');
    add.append(button(TEXT.info.add, 'info-new', 'btn--primary'));
    box.append(add);
  }
  if (!list.length && state.infoEdit !== 'new') box.append(make('div', 'empty', TEXT.info.empty));
  list.forEach((x) => {
    if (data.canEdit && state.infoEdit === x.id) { box.append(sectionForm(data, category, x)); return; }
    const art = make('article', 'article');
    art.append(make('h3', 'article__title', x.title), make('p', 'article__body', x.body), make('div', 'article__meta', TEXT.info.meta(x.updatedBy, x.updatedAt)));
    if (data.canEdit) {
      const actions = make('div', 'article__actions');
      actions.append(button(TEXT.info.edit, 'info-edit', 'btn--sm', { id: x.id }), button(TEXT.info.del, 'info-delete', 'btn--danger btn--sm', { id: x.id }));
      art.append(actions);
    }
    box.append(art);
  });
}

/* ---------- Tab 2: Anpassung ---------- */
function renderStructure() {
  const data = state.ranks;
  const seg = make('div', 'seg');
  seg.setAttribute('role', 'group');
  Object.entries(TEXT.structure.sub).forEach(([id, label]) => {
    const b = make('button', '', label);
    b.type = 'button';
    b.dataset.action = 'sub';
    b.dataset.sub = id;
    b.setAttribute('aria-pressed', String(state.sub === id));
    seg.append(b);
  });
  setHead(TEXT.tabs.structure, '', [seg]);
  if (!data) { el.view.replaceChildren(make('div', 'empty', TEXT.errors.default)); return; }
  if (state.sub === 'ranks') renderRanks(data);
  if (state.sub === 'departments') renderDepartments(data);
  if (state.sub === 'exams') renderExams(data);
}

function renderRanks(data) {
  if (state.rankSel === null) state.rankSel = data.ranks[0].rank;
  const wrap = make('div', 'ranks');
  const list = make('div', 'rank-list');
  list.setAttribute('role', 'listbox');
  list.setAttribute('aria-label', TEXT.structure.sub.ranks);
  data.ranks.forEach((r) => {
    const item = make('button', 'rank-item');
    item.type = 'button';
    item.dataset.action = 'rank-pick';
    item.dataset.rank = r.rank;
    item.setAttribute('role', 'option');
    item.setAttribute('aria-selected', String(r.rank === state.rankSel));
    item.append(make('span', 'rank-item__no num', r.rank), make('span', '', r.name), make('span', 'rank-item__count num', TEXT.structure.perms(r.permissions.length)));
    list.append(item);
  });

  const rank = data.ranks.find((r) => r.rank === state.rankSel);
  const editor = make('div');
  const head = make('div', 'editor-head');
  const name = input(rank.name, { id: 'rank-name', maxlength: data.limits.rankName, disabled: !rank.editable });
  head.append(field(TEXT.structure.rankName, name));
  const salary = input(rank.salary || 0, { id: 'rank-salary', type: 'number', min: 0, max: data.limits.salary, step: 1, disabled: !rank.editable });
  const salaryField = field(TEXT.structure.salary(MONEY.format(data.limits.salary), data.limits.salaryInterval), salary);
  salaryField.classList.add('field--small');
  head.append(salaryField);
  if (rank.editable) head.append(button(TEXT.structure.save, 'rank-save', 'btn--primary'));
  editor.append(head);
  const tasks = make('textarea', 'textarea');
  tasks.id = 'rank-tasks';
  tasks.rows = 3;
  tasks.maxLength = data.limits.rankTasks;
  tasks.value = rank.tasks || '';
  tasks.disabled = !rank.editable;
  const tasksField = field(TEXT.structure.tasks, tasks);
  tasksField.classList.add('editor-tasks');
  editor.append(tasksField);
  if (rank.fixedPermissions) editor.append(make('div', 'note', TEXT.structure.fixed));
  else if (!rank.editable) editor.append(make('div', 'note', TEXT.structure.readonly));
  else if (data.permissions.some((p) => !p.grantable)) editor.append(make('div', 'note', TEXT.structure.notGrantable));

  const groups = make('div', 'perm-groups');
  const byGroup = new Map();
  data.permissions.forEach((p) => { if (!byGroup.has(p.group)) byGroup.set(p.group, []); byGroup.get(p.group).push(p); });
  byGroup.forEach((perms, group) => {
    const box = make('section', 'perm-group');
    box.append(make('h4', '', group));
    perms.forEach((p) => {
      const locked = !rank.editable || rank.fixedPermissions || !p.grantable;
      const row = make('label', `check${locked ? ' check--locked' : ''}`);
      const cb = make('input');
      cb.type = 'checkbox';
      cb.name = 'perm';
      cb.value = p.key;
      cb.checked = rank.fixedPermissions || rank.permissions.includes(p.key);
      cb.disabled = locked;
      row.append(cb, make('span', '', p.label));
      box.append(row);
    });
    groups.append(box);
  });
  editor.append(groups);
  wrap.append(list, editor);
  el.view.replaceChildren(wrap);
}

function renderDepartments(data) {
  const wrap = make('div', 'dept-list');
  const canEdit = data.canEdit;
  const leads = new Set(state.members?.leads || []);
  data.departments.forEach((d) => {
    const lead = !canEdit && leads.has(d.id);
    const row = make('div', 'dept');
    row.dataset.id = d.id;
    row.append(field(TEXT.structure.deptName, input(d.name, { 'data-role': 'dept-name', maxlength: data.limits.department, disabled: !canEdit })));
    const ranks = make('div', 'dept__ranks');
    for (let i = 0; i < data.limits.departmentRanks; i += 1) {
      ranks.append(input(d.ranks[i] || '', { 'data-role': 'dept-rank', placeholder: TEXT.structure.deptRankPlaceholder(i + 1), maxlength: data.limits.rankName,
        disabled: !(canEdit || (lead && i < d.ranks.length)), 'aria-label': TEXT.structure.deptRankPlaceholder(i + 1) }));
    }
    row.append(field(TEXT.structure.deptRanks, ranks));
    const actions = make('div', 'dept__actions');
    if (canEdit || lead) actions.append(button(TEXT.structure.saveDept, 'dept-save', '', { id: d.id }));
    if (canEdit) actions.append(button(TEXT.structure.deleteDept, 'dept-delete', 'btn--danger', { id: d.id }));
    row.append(actions);
    wrap.append(row);
  });
  if (!data.departments.length) wrap.append(make('div', 'empty', TEXT.structure.noDepts));
  if (canEdit && data.departments.length < data.limits.departments) {
    const row = make('div', 'dept');
    row.dataset.id = '';
    row.append(field(TEXT.structure.deptName, input('', { 'data-role': 'dept-name', maxlength: data.limits.department })));
    const ranks = make('div', 'dept__ranks');
    for (let i = 0; i < data.limits.departmentRanks; i += 1) {
      ranks.append(input('', { 'data-role': 'dept-rank', placeholder: TEXT.structure.deptRankPlaceholder(i + 1), maxlength: data.limits.rankName, 'aria-label': TEXT.structure.deptRankPlaceholder(i + 1) }));
    }
    row.append(field(TEXT.structure.deptRanks, ranks));
    const actions = make('div', 'dept__actions');
    actions.append(button(TEXT.structure.addDept, 'dept-save', 'btn--primary', { id: '' }));
    row.append(actions);
    wrap.append(row);
  }
  el.view.replaceChildren(wrap);
}

function renderExams(data) {
  const wrap = make('div', 'exam-list');
  data.exams.forEach((e) => {
    const row = make('div', 'exam-row');
    row.dataset.id = e.id;
    row.append(input(e.name, { 'data-role': 'exam-name', maxlength: data.limits.exam, disabled: !data.canEdit, 'aria-label': TEXT.structure.examName }));
    if (data.canEdit) row.append(button(TEXT.structure.save, 'exam-save', '', { id: e.id }), button(TEXT.structure.deleteDept, 'exam-delete', 'btn--danger', { id: e.id }));
    wrap.append(row);
  });
  if (!data.exams.length) wrap.append(make('div', 'empty', TEXT.structure.noExams));
  wrap.append(make('div', 'note', TEXT.structure.examHint));
  if (data.canEdit && data.exams.length < data.limits.exams) {
    const row = make('div', 'exam-row');
    row.dataset.id = '';
    row.append(input('', { 'data-role': 'exam-name', maxlength: data.limits.exam, placeholder: TEXT.structure.examName, 'aria-label': TEXT.structure.examName }),
      button(TEXT.structure.addExam, 'exam-save', 'btn--primary', { id: '' }));
    wrap.append(row);
  }
  el.view.replaceChildren(wrap);
}

/* ---------- Tab 3: Fahrzeuge ---------- */
function rankOptions(count, upTo = count) {
  const names = state.ranks?.ranks || state.members?.ranks;
  const nameOf = (r) => (names ? (names.find((x) => x.rank === r) || {}).name : '') || '';
  return Array.from({ length: count }, (_, i) => ({ value: i + 1, label: `${i + 1} · ${nameOf(i + 1)}`.replace(/ · $/, ''), disabled: i + 1 > upTo }));
}

function renderVehicles() {
  const data = state.vehicles;
  setHead(TEXT.tabs.vehicles, TEXT.vehicles.info);
  if (!data) { el.view.replaceChildren(make('div', 'empty', TEXT.errors.default)); return; }
  const table = make('table', 'table table--static vehicles');
  const head = make('thead');
  const hr = make('tr');
  [TEXT.vehicles.vehicle, TEXT.vehicles.model, TEXT.vehicles.from].forEach((t) => hr.append(make('th', '', t)));
  head.append(hr);
  const body = make('tbody');
  data.vehicles.forEach((v) => {
    const tr = make('tr');
    const td = make('td');
    const sel = select(rankOptions(state.overview.org.ranks), v.minRank, { 'data-role': 'vehicle-rank', 'data-model': v.model, disabled: !data.canEdit, 'aria-label': `${TEXT.vehicles.from}: ${v.label}` });
    td.append(sel);
    tr.append(make('td', '', v.label), make('td', 'muted', v.model), td);
    body.append(tr);
  });
  table.append(head, body);
  el.view.replaceChildren(table);
}

/* ---------- Tab 4: Leitstelle ---------- */
function statusOf(m) {
  if (m.onDuty) return { cls: 'dot dot--duty', label: TEXT.lst.status.duty };
  if (m.online) return { cls: 'dot dot--online', label: TEXT.lst.status.online };
  return { cls: 'dot', label: TEXT.lst.status.offline };
}

function filteredMembers() {
  const q = state.search.trim().toLowerCase();
  let list = state.members.members;
  if (state.filter === 'duty') list = list.filter((m) => m.onDuty);
  else if (state.filter === 'online') list = list.filter((m) => m.online);
  else if (state.filter.startsWith('div:')) list = list.filter((m) => m.division === state.filter.slice(4));
  if (!q) return list;
  return list.filter((m) => m.name.toLowerCase().includes(q) || String(m.characterId) === q || (m.dn || '').toLowerCase().includes(q));
}

function renderLeitstelle() {
  const data = state.members;
  if (!data) { setHead(TEXT.tabs.leitstelle); el.view.replaceChildren(make('div', 'empty', TEXT.errors.default)); return; }
  const list = filteredMembers();
  setHead(TEXT.tabs.leitstelle, list.length === data.members.length ? TEXT.lst.count(data.members.length) : TEXT.lst.shown(list.length, data.members.length));
  el.view.className = 'view view--split';

  const scroll = make('div', 'scroll');
  const bar = make('div', 'toolbar');
  const search = make('div', 'search');
  search.append(icon('i-search'), input(state.search, { type: 'search', placeholder: TEXT.lst.search, id: 'lst-search', 'aria-label': TEXT.lst.search }));
  bar.append(search);
  if (data.edit.hire) {
    const hire = make('div', 'toolbar__right hire');
    hire.append(input('', { type: 'number', min: 1, step: 1, placeholder: TEXT.lst.hireId, id: 'hire-id', 'aria-label': TEXT.lst.hireId, title: TEXT.lst.hireHint }),
      button(TEXT.lst.hire, 'hire', 'btn--primary'));
    bar.append(hire);
  }
  const filters = make('div', 'filters');
  filters.setAttribute('role', 'group');
  const divisionNames = [...new Set(data.members.map((m) => m.division).filter(Boolean))];
  [['all', TEXT.lst.filters.all], ['duty', TEXT.lst.filters.duty], ['online', TEXT.lst.filters.online], ...divisionNames.map((n) => [`div:${n}`, n])]
    .forEach(([key, label]) => {
      const b = make('button', 'filter', label);
      b.type = 'button';
      b.dataset.action = 'filter';
      b.dataset.filter = key;
      b.setAttribute('aria-pressed', String(state.filter === key));
      filters.append(b);
    });

  const table = make('table', 'table table--lst');
  const head = make('thead');
  const hr = make('tr');
  const c = TEXT.lst.cols;
  [[c.name, ''], [c.id, 'r'], [c.dn, ''], [c.rank, ''], [c.division, ''], [c.strikes, 'r'], [c.vacation, 'r'], [c.hired, ''], [c.promoted, ''], [c.departments, ''], [c.exams, '']]
    .forEach(([t, cls]) => hr.append(make('th', cls, t)));
  head.append(hr);
  const body = make('tbody');
  list.forEach((m) => {
    const tr = make('tr');
    tr.dataset.action = 'member-pick';
    tr.dataset.id = m.characterId;
    tr.setAttribute('aria-selected', String(m.characterId === state.memberSel));
    tr.tabIndex = 0;
    const who = make('div', 'who');
    const st = statusOf(m);
    const dot = make('span', st.cls);
    dot.title = st.label;
    dot.setAttribute('aria-label', st.label);
    who.append(dot, make('span', 'who__name', m.name));
    const tdWho = make('td');
    tdWho.append(who);
    const tdDiv = make('td');
    tdDiv.append(m.division ? make('span', 'chip chip--division', m.division) : make('span', 'muted', '-'));
    const deps = make('div', 'chips');
    m.departments.forEach((d) => deps.append(make('span', 'chip', d.rankName ? `${d.name} · ${d.rankName}` : d.name)));
    const exams = make('div', 'chips');
    m.exams.forEach((e) => exams.append(make('span', 'chip', e.name)));
    const tdDeps = make('td', 'wrap');
    tdDeps.append(m.departments.length ? deps : make('span', 'muted', '-'));
    const tdExams = make('td', 'wrap');
    tdExams.append(m.exams.length ? exams : make('span', 'muted', '-'));
    tr.append(tdWho, make('td', 'r num muted', m.characterId), make('td', 'num', m.dn || '-'), make('td', '', `${m.rank} · ${m.rankName}`), tdDiv,
      make('td', `r num${m.strikes >= 3 ? ' strikes--hot' : ''}`, m.strikes), make('td', 'r num', m.vacationDays),
      make('td', 'num muted', m.hiredAt || '-'), make('td', 'num muted', m.lastPromotedAt || '-'), tdDeps, tdExams);
    body.append(tr);
  });
  table.append(head, body);
  scroll.append(bar, filters, table);
  if (!list.length) scroll.append(make('div', 'empty', TEXT.lst.empty));

  const detail = make('aside', 'detail');
  detail.setAttribute('aria-label', 'Mitarbeiter');
  renderMemberDetail(detail);
  el.view.replaceChildren(scroll, detail);
}

function renderMemberDetail(box) {
  const data = state.members;
  const m = data.members.find((x) => x.characterId === state.memberSel);
  if (!m) { box.append(make('div', 'empty', TEXT.lst.pick)); return; }
  const edit = data.edit;
  const can = (key) => edit[key] && m.above;
  const st = statusOf(m);
  const head = make('div', 'detail__head');
  const who = make('div');
  who.append(make('h2', 'detail__name', m.name), make('div', 'detail__meta num', `ID ${m.characterId} · ${m.dn || '-'} · ${st.label}`));
  head.append(make('div', 'avatar', initials(m.name)), who);
  box.append(head, datesTile([[TEXT.lst.dates.hired, m.hiredAt || '-'], [TEXT.lst.dates.promoted, m.lastPromotedAt || TEXT.lst.never]]));
  if (!m.above && !readOnly() && Object.keys(edit).length) box.append(make('div', 'note', TEXT.lst.above));

  const general = make('div', 'detail__block');
  const rankSel = select(data.ranks.map((r) => ({ value: r.rank, label: `${r.rank} · ${r.name}`, disabled: !r.assignable && r.rank !== m.rank })), m.rank,
    { 'data-role': 'member-rank', disabled: !can('rank') });
  general.append(field(TEXT.lst.fields.rank, rankSel));
  const pair = make('div', 'pair');
  const dn = input(m.dn || '', { 'data-role': 'member-dn', maxlength: data.limits.dn, disabled: !can('dn') });
  pair.append(field(TEXT.lst.fields.dn, dn));
  const vac = input(m.vacationDays, { type: 'number', min: 0, max: data.limits.vacation, 'data-role': 'member-vacation', disabled: !can('vacation') });
  pair.append(field(TEXT.lst.fields.vacation, vac));
  general.append(pair);
  const stepper = make('div', 'stepper');
  const minus = button('', 'strike', 'btn--icon', { delta: '-1' });
  minus.append(icon('i-minus'));
  minus.setAttribute('aria-label', 'Strike abziehen');
  const plus = button('', 'strike', 'btn--icon', { delta: '1' });
  plus.append(icon('i-plus'));
  plus.setAttribute('aria-label', 'Strike vergeben');
  minus.disabled = plus.disabled = !can('strikes');
  stepper.append(minus, input(m.strikes, { readonly: true, class: 'input num', 'aria-label': TEXT.lst.fields.strikes }), plus);
  general.append(field(TEXT.lst.fields.strikes, stepper));
  if (can('dn') || can('vacation')) {
    const row = make('div');
    row.append(button(TEXT.lst.save, 'member-save'));
    general.append(row);
  }
  box.append(general);

  // Bonus: Leader und Vice, einmal pro Tag je Person
  if (edit.bonus && !m.self) {
    const bonus = make('div', 'detail__block');
    const inner = make('div', 'bonus');
    inner.append(make('h3', 'section-title', TEXT.lst.bonus.title));
    if (m.bonusToday) inner.append(make('div', 'muted', TEXT.lst.bonus.today));
    else {
      const row = make('div', 'bonus__row');
      row.append(input('', { type: 'number', min: 1, max: data.limits.bonus, step: 1, id: 'bonus-amount', placeholder: '500', 'aria-label': TEXT.lst.bonus.amount(data.limits.bonus) }),
        input('', { id: 'bonus-reason', maxlength: data.limits.reason, placeholder: TEXT.lst.bonus.reason, 'aria-label': TEXT.lst.bonus.reason }));
      inner.append(row, button(TEXT.lst.bonus.pay, 'bonus', 'btn--primary'), make('div', 'note', TEXT.lst.bonus.hint));
    }
    bonus.append(inner);
    box.append(bonus);
  }

  const deps = make('div', 'detail__block');
  deps.append(make('h3', 'section-title', TEXT.lst.fields.departments));
  const leads = new Set(data.leads);
  if (!data.departments.length) deps.append(make('div', 'muted', TEXT.lst.none));
  data.departments.forEach((d) => {
    const current = m.departments.find((x) => x.id === d.id);
    const allowed = (can('departments')) || (leads.has(d.id) && !m.self && !readOnly());
    const row = make('div', 'dept-pick');
    row.append(make('span', '', d.name));
    const options = [{ value: 0, label: TEXT.lst.noDept }, ...d.ranks.map((name, i) => ({ value: i + 1, label: name }))];
    row.append(select(options, current ? current.rank : 0, { 'data-role': 'member-dept', 'data-dept': d.id, disabled: !allowed, 'aria-label': d.name }));
    deps.append(row);
  });
  box.append(deps);

  const exams = make('div', 'detail__block');
  exams.append(make('h3', 'section-title', TEXT.lst.fields.exams));
  if (!data.exams.length) exams.append(make('div', 'muted', TEXT.lst.none));
  data.exams.forEach((e) => {
    const passed = m.exams.find((x) => x.id === e.id);
    const row = make('label', `check${can('exams') ? '' : ' check--locked'}`);
    const cb = make('input');
    cb.type = 'checkbox';
    cb.checked = !!passed;
    cb.disabled = !can('exams');
    cb.dataset.role = 'member-exam';
    cb.dataset.exam = e.id;
    row.append(cb, make('span', '', passed ? `${e.name} · ${passed.at}` : e.name));
    exams.append(row);
  });
  box.append(exams);

  if (can('fire') && !m.self) {
    const fire = make('div', 'detail__block');
    fire.append(button(TEXT.lst.fire, 'member-fire', 'btn--danger'));
    box.append(fire);
  }
}

/* ---------- Tab 5: Archiv ---------- */

  const scroll = make('div', 'scroll');

  scroll.append(bar);
  const entries = data ? data.entries : [];
  if (!entries.length) scroll.append(make('div', 'empty', TEXT.archive.empty));
  else {
    const table = make('table', 'table');
    const head = make('thead');
    const hr = make('tr');
    const c = TEXT.archive.cols;
    [[c.name, ''], [c.id, 'r'], [c.last, ''], [c.hired, ''], [c.left, ''], [c.kind, '']].forEach(([t, cls]) => hr.append(make('th', cls, t)));

    const body = make('tbody');
    entries.forEach((a) => {
      const tr = make('tr');
      tr.dataset.action = 'archive-pick';

      body.append(tr);
    });
    table.append(head, body);
    scroll.append(table);
    if (data.hasMore) {
